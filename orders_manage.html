<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>團員登記管理與一鍵發圖</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 15px; margin: 0; background: #fff; color: #333; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; background: #fff; }
    th, td { padding: 10px 8px; border-bottom: 1px solid #e4e7ed; text-align: left; font-size: 13px; vertical-align: middle; }
    th { background: #f8f9fa; color: #606266; font-weight: bold; white-space: nowrap; }
    input[type="text"], input[type="number"], input[type="date"], select { padding: 6px 8px; border: 1px solid #dcdfe6; border-radius: 4px; font-size: 13px; outline: none; }
    input:focus, select:focus { border-color: #409eff; }
    .btn-edit { background-color: #e6a23c; color: white; padding: 4px 8px; font-size: 12px; border-radius: 4px; border: none; cursor: pointer; }
    .btn-danger { background-color: #f56c6c; color: white; padding: 4px 8px; font-size: 12px; border-radius: 4px; border: none; cursor: pointer; }
    .btn-save { background-color: #67c23a; color: white; padding: 4px 8px; font-size: 12px; border-radius: 4px; border: none; cursor: pointer; }
    .btn-photo { background-color: #409eff; color: white; padding: 4px 8px; font-size: 12px; border-radius: 4px; border: none; cursor: pointer; font-weight: bold; }
    
    .filter-card { background: #f8f9fa; border: 1px solid #ebeef5; border-radius: 10px; padding: 12px 15px; margin-bottom: 15px; display: flex; flex-direction: column; gap: 8px; }
    .filter-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .filter-label { font-size: 12px; font-weight: bold; color: #606266; min-width: 80px; }

    .capsule-group { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
    .capsule-filter-btn { background: #fff; color: #606266; border: 1px solid #dcdfe6; padding: 4px 12px; border-radius: 16px; font-size: 12px; font-weight: bold; cursor: pointer; transition: all 0.2s; outline: none; }
    .capsule-filter-btn:hover { background: #ecf5ff; color: #409eff; border-color: #c6e2ff; }
    .capsule-filter-btn.active { background: #409eff; color: #fff; border-color: #409eff; box-shadow: 0 2px 6px rgba(64,158,255,0.25); }
    .capsule-filter-btn.sub-active { background: #67c23a; color: #fff; border-color: #67c23a; box-shadow: 0 2px 6px rgba(103,194,58,0.25); }
    .capsule-filter-btn.user-active { background: #e6a23c; color: #fff; border-color: #e6a23c; box-shadow: 0 2px 6px rgba(230,162,60,0.25); }
  </style>
</head>
<body>

  <div class="filter-card">
    <div class="filter-row">
      <span class="filter-label">1. 團體：</span>
      <div id="groupCapsules" class="capsule-group"></div>
    </div>

    <div class="filter-row">
      <span class="filter-label">2. 檢視模式：</span>
      <div id="modeCapsules" class="capsule-group">
        <button class="capsule-filter-btn active" onclick="setModeFilter('member', this)">👥 依成員</button>
        <button class="capsule-filter-btn" onclick="setModeFilter('event', this)">🗓️ 依活動</button>
      </div>
    </div>

    <div class="filter-row">
      <span class="filter-label">3. 細項篩選：</span>
      <div id="detailCapsules" class="capsule-group"></div>
    </div>

    <div class="filter-row" style="border-top:1px dashed #dcdfe6; padding-top:8px; margin-top:2px;">
      <span class="filter-label">👤 買家暱稱：</span>
      <div id="userCapsules" class="capsule-group"></div>
    </div>
  </div>

  <table>
    <thead>
      <tr>
        <th style="width: 15%;">買家暱稱</th>
        <th style="width: 25%;">活動與成員 (數量)</th>
        <th style="width: 15%;">金額 / 狀態</th>
        <th style="width: 20%;">發圖與下載期限狀態</th>
        <th style="width: 25%;">操作</th>
      </tr>
    </thead>
    <tbody id="ordersTableBody">
      <tr><td colspan="5" style="text-align:center; color:#909399; padding:20px;">載入中...</td></tr>
    </tbody>
  </table>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, doc, deleteDoc, updateDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDF7QySG1Jj4gdZvXwMRaKjRmI-lFKpj7k",
      authDomain: "forsure0922.firebaseapp.com",
      databaseURL: "https://forsure0922-default-rtdb.firebaseio.com",
      projectId: "forsure0922",
      storageBucket: "forsure0922.firebasestorage.app",
      messagingSenderId: "817449290174",
      appId: "1:817449290174:web:6b4ec1d36c171ff97011ef"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let ordersMap = {};
    let editingRows = new Set();
    
    let activeGroup = 'Stray Kids';
    let activeMode = 'member';
    let activeDetail = 'ALL';
    let activeUser = 'ALL';

    let groupList = [];
    let memberMap = {};

    document.addEventListener('DOMContentLoaded', async () => {
      try {
        const gRes = await fetch('json/group.json');
        groupList = await gRes.json();

        for (const g of groupList) {
          const file = (g === 'Stray Kids') ? 'members_skz.json' : (g === 'ATEEZ' ? 'members_atz.json' : '');
          if (file) {
            const mRes = await fetch(`json/${file}`);
            memberMap[g] = await mRes.json();
          }
        }
      } catch(e) {}

      renderGroupCapsules();

      onSnapshot(collection(db, "orders"), snap => {
        ordersMap = {};
        snap.forEach(d => {
          const data = d.data();
          ordersMap[d.id] = { id: d.id, ...data, group: data.group || "Stray Kids" };
        });
        updateDetailCapsules();
        updateUserCapsules();
        renderOrdersTable();
      });
    });

    function renderGroupCapsules() {
      const container = document.getElementById('groupCapsules');
      container.innerHTML = '';
      groupList.forEach(g => {
        const btn = document.createElement('button');
        btn.className = `capsule-filter-btn ${activeGroup === g ? 'active' : ''}`;
        btn.textContent = g;
        btn.onclick = () => {
          activeGroup = g;
          document.querySelectorAll('#groupCapsules .capsule-filter-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          activeDetail = 'ALL';
          updateDetailCapsules();
          updateUserCapsules();
          renderOrdersTable();
        };
        container.appendChild(btn);
      });
    }

    window.setModeFilter = (mode, btn) => {
      activeMode = mode;
      document.querySelectorAll('#modeCapsules .capsule-filter-btn').forEach(b => b.classList.remove('active'));
      if(btn) btn.classList.add('active');
      activeDetail = 'ALL';
      updateDetailCapsules();
      renderOrdersTable();
    };

    function updateDetailCapsules() {
      const container = document.getElementById('detailCapsules');
      container.innerHTML = '';

      const allBtn = document.createElement('button');
      allBtn.className = `capsule-filter-btn ${activeDetail === 'ALL' ? 'sub-active' : ''}`;
      allBtn.textContent = '全部顯示';
      allBtn.onclick = () => {
        activeDetail = 'ALL';
        document.querySelectorAll('#detailCapsules .capsule-filter-btn').forEach(b => b.classList.remove('sub-active'));
        allBtn.classList.add('sub-active');
        renderOrdersTable();
      };
      container.appendChild(allBtn);

      const filteredOrders = Object.values(ordersMap).filter(o => o.group === activeGroup);

      if (activeMode === 'member') {
        const members = memberMap[activeGroup] || [];
        members.forEach(m => {
          const btn = document.createElement('button');
          btn.className = `capsule-filter-btn ${activeDetail === m ? 'sub-active' : ''}`;
          btn.textContent = m;
          btn.onclick = () => {
            activeDetail = m;
            document.querySelectorAll('#detailCapsules .capsule-filter-btn').forEach(b => b.classList.remove('sub-active'));
            btn.classList.add('sub-active');
            renderOrdersTable();
          };
          container.appendChild(btn);
        });
      } else if (activeMode === 'event') {
        const eventsSet = new Set();
        filteredOrders.forEach(o => {
          if (o.event || o.eventName) eventsSet.add(o.event || o.eventName);
        });
        Array.from(eventsSet).sort().forEach(ev => {
          const btn = document.createElement('button');
          btn.className = `capsule-filter-btn ${activeDetail === ev ? 'sub-active' : ''}`;
          btn.textContent = ev;
          btn.onclick = () => {
            activeDetail = ev;
            document.querySelectorAll('#detailCapsules .capsule-filter-btn').forEach(b => b.classList.remove('sub-active'));
            btn.classList.add('sub-active');
            renderOrdersTable();
          };
          container.appendChild(btn);
        });
      }
    }

    function updateUserCapsules() {
      const container = document.getElementById('userCapsules');
      container.innerHTML = '';

      const allBtn = document.createElement('button');
      allBtn.className = `capsule-filter-btn ${activeUser === 'ALL' ? 'user-active' : ''}`;
      allBtn.textContent = '全部買家';
      allBtn.onclick = () => {
        activeUser = 'ALL';
        document.querySelectorAll('#userCapsules .capsule-filter-btn').forEach(b => b.classList.remove('user-active'));
        allBtn.classList.add('user-active');
        renderOrdersTable();
      };
      container.appendChild(allBtn);

      const filteredOrders = Object.values(ordersMap).filter(o => o.group === activeGroup);
      const usersSet = new Set();
      filteredOrders.forEach(o => {
        if (o.user || o.buyerName) usersSet.add(o.user || o.buyerName);
      });

      Array.from(usersSet).sort((a,b)=>a.localeCompare(b,'zh-TW')).forEach(u => {
        const btn = document.createElement('button');
        btn.className = `capsule-filter-btn ${activeUser === u ? 'user-active' : ''}`;
        btn.textContent = u;
        btn.onclick = () => {
          activeUser = u;
          document.querySelectorAll('#userCapsules .capsule-filter-btn').forEach(b => b.classList.remove('user-active'));
          btn.classList.add('user-active');
          renderOrdersTable();
        };
        container.appendChild(btn);
      });
    }

    window.renderOrdersTable = () => {
      const tb = document.getElementById('ordersTableBody');
      tb.innerHTML = '';

      let list = Object.values(ordersMap).filter(o => o.group === activeGroup);

      if (activeDetail !== 'ALL') {
        if (activeMode === 'member') list = list.filter(o => o.member === activeDetail);
        else if (activeMode === 'event') list = list.filter(o => (o.event || o.eventName) === activeDetail);
      }

      if (activeUser !== 'ALL') {
        list = list.filter(o => (o.user || o.buyerName) === activeUser);
      }

      if (list.length === 0) {
        tb.innerHTML = '<tr><td colspan="5" style="text-align:center; color:#909399; padding:30px;">目前尚無符合的訂單紀錄</td></tr>';
        notifyHeight();
        return;
      }

      list.sort((a, b) => new Date(b.createdAt || 0).getTime() - new Date(a.createdAt || 0).getTime());

      list.forEach(o => {
        const docId = o.id;
        const isEditing = editingRows.has(docId);
        const uName = o.user || o.buyerName || '-';
        const ev = o.event || o.eventName || '-';
        const mem = o.member || '-';
        const qty = o.qty !== undefined ? o.qty : (o.quantity || 1);
        const amt = o.total !== undefined ? o.total : (o.amount || 0);
        const payStatus = o.paymentStatus || o.status || '待匯款';
        const isPhotoSent = o.isPhotoSent === true;
        const todayStr = new Date().toISOString().slice(0,10);
        const sentAt = o.photoSentAt || todayStr;
        const expireAt = o.photoExpireAt || '';

        const tr = document.createElement('tr');

        if (!isEditing) {
          tr.innerHTML = `
            <td><b>${uName}</b></td>
            <td><b>${ev}</b><br><small style="color:#606266;">成員: ${mem} (數量: ${qty}張)</small></td>
            <td>$${amt}<br><span style="font-size:11px; color:#e6a23c; font-weight:bold;">${payStatus}</span></td>
            <td>
              ${isPhotoSent ? `
                <div style="background:#f0f9eb; border:1px solid #e1f3d8; border-radius:6px; padding:6px; font-size:12px;">
                  <b style="color:#409eff;">🟢 已發圖</b><br>
                  發圖日: <input type="date" id="date-${docId}" value="${sentAt}" onchange="updateExpireDate('${docId}')" style="font-size:11px; width:110px; margin:2px 0;"><br>
                  刪除日: <span id="expire-${docId}" style="color:#f56c6c; font-weight:bold;">${expireAt}</span>
                </div>
              ` : `<span style="color:#909399;">尚未發圖</span>`}
            </td>
            <td>
              ${isPhotoSent 
                ? `<button class="btn-save" onclick="savePhotoDate('${docId}')" style="margin-bottom:4px;">💾 更新日期</button><br>
                   <button class="btn-danger" onclick="toggleOrderPhoto('${docId}', false)" style="margin-bottom:4px;">取消發圖狀態</button>`
                : `<button class="btn-photo" onclick="toggleOrderPhoto('${docId}', true)" style="margin-bottom:4px;">📷 設為已發圖</button>`
              }<br>
              <button class="btn-edit" onclick="toggleEdit('${docId}', true)">✏️ 編輯</button>
              <button class="btn-danger" onclick="deleteOrder('${docId}')">🗑️ 刪除</button>
            </td>
          `;
        } else {
          tr.innerHTML = `
            <td><input type="text" id="edit-user-${docId}" value="${uName}" style="width:100%;"></td>
            <td>
              活動: <input type="text" id="edit-ev-${docId}" value="${ev}" style="width:100%; margin-bottom:4px;"><br>
              成員: <input type="text" id="edit-mem-${docId}" value="${mem}" style="width:45%;" placeholder="成員"> 
              數量: <input type="number" id="edit-qty-${docId}" value="${qty}" style="width:45%;" placeholder="數量">
            </td>
            <td>金額: <input type="number" id="edit-amt-${docId}" value="${amt}" style="width:80px;"></td>
            <td>編輯中</td>
            <td>
              <button class="btn-save" onclick="saveOrderEdit('${docId}')">💾 儲存</button>
              <button class="btn-danger" onclick="toggleEdit('${docId}', false)">❌ 取消</button>
            </td>
          `;
        }
        tb.appendChild(tr);
      });

      notifyHeight();
    };

    window.updateExpireDate = (docId) => {
      const dateVal = document.getElementById(`date-${docId}`).value;
      if (!dateVal) return;
      const d = new Date(dateVal);
      d.setDate(d.getDate() + 8);
      document.getElementById(`expire-${docId}`).textContent = d.toISOString().slice(0,10);
    };

    window.savePhotoDate = async (docId) => {
      const sentAt = document.getElementById(`date-${docId}`).value;
      const expireAt = document.getElementById(`expire-${docId}`).textContent;
      try {
        await updateDoc(doc(db, "orders", docId), { photoSentAt: sentAt, photoExpireAt: expireAt });
        alert('✅ 發圖日期與刪除期限已更新！');
      } catch (err) { alert('更新失敗: ' + err.message); }
    };

    window.toggleEdit = (docId, isEdit) => {
      if (isEdit) editingRows.add(docId);
      else editingRows.delete(docId);
      renderOrdersTable();
    };

    window.saveOrderEdit = async (docId) => {
      const user = document.getElementById(`edit-user-${docId}`).value.trim();
      const event = document.getElementById(`edit-ev-${docId}`).value.trim();
      const member = document.getElementById(`edit-mem-${docId}`).value.trim();
      const qty = parseInt(document.getElementById(`edit-qty-${docId}`).value) || 1;
      const total = parseFloat(document.getElementById(`edit-amt-${docId}`).value) || 0;

      try {
        await updateDoc(doc(db, "orders", docId), { user, buyerName: user, event, eventName: event, member, qty, quantity: qty, total, amount: total });
        editingRows.delete(docId);
        alert('✅ 訂單修改成功！');
      } catch (err) { alert('儲存失敗: ' + err.message); }
    };

    window.toggleOrderPhoto = async (docId, shouldSend) => {
      const todayObj = new Date();
      const todayStr = todayObj.toISOString().slice(0,10);
      const expireObj = new Date(todayObj.getTime() + 8 * 24 * 60 * 60 * 1000);
      const expireStr = expireObj.toISOString().slice(0,10);

      try {
        await updateDoc(doc(db, "orders", docId), {
          isPhotoSent: shouldSend,
          photoSentAt: shouldSend ? todayStr : '',
          photoExpireAt: shouldSend ? expireStr : ''
        });
        alert(shouldSend ? '✅ 已成功設為已發圖 (自動帶入 8 天刪除期限)' : '✅ 已取消發圖狀態');
      } catch (err) { alert('更新發圖狀態失敗: ' + err.message); }
    };

    window.deleteOrder = async (docId) => {
      if (confirm('確定要刪除這筆訂單嗎？')) {
        try { await deleteDoc(doc(db, "orders", docId)); } catch (err) { alert('刪除失敗: ' + err.message); }
      }
    };

    function notifyHeight() {
      setTimeout(() => { window.parent.postMessage({ frameHeight: document.body.scrollHeight }, '*'); }, 100);
    }
  </script>
</body>
</html>
