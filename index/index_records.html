<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>登記與對帳進度查詢</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 0; margin: 0; background: transparent; color: #333; }
    
    .filter-card { background: #fff; border: 1px solid #e4e7ed; border-radius: 12px; padding: 14px; margin-bottom: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.02); display: flex; flex-direction: column; gap: 8px; }
    .filter-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .filter-label { font-size: 12px; font-weight: bold; color: #606266; min-width: 80px; }

    .capsule-group { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
    .capsule-filter-btn { background: #f4f4f5; color: #606266; border: 1px solid #dcdfe6; padding: 4px 12px; border-radius: 16px; font-size: 12px; font-weight: bold; cursor: pointer; transition: all 0.2s; outline: none; }
    .capsule-filter-btn:hover { background: #ecf5ff; color: #409eff; border-color: #c6e2ff; }
    .capsule-filter-btn.active { background: #409eff; color: #fff; border-color: #409eff; box-shadow: 0 2px 6px rgba(64,158,255,0.25); }
    .capsule-filter-btn.sub-active { background: #67c23a; color: #fff; border-color: #67c23a; box-shadow: 0 2px 6px rgba(103,194,58,0.25); }
    .capsule-filter-btn.user-active { background: #e6a23c; color: #fff; border-color: #e6a23c; box-shadow: 0 2px 6px rgba(230,162,60,0.25); }
    
    .capsule-filter-btn.pending-red-btn { background: #fef0f0; color: #f56c6c; border-color: #fde2e2; }
    .capsule-filter-btn.pending-red-btn:hover { background: #f56c6c; color: #fff; border-color: #f56c6c; }
    .capsule-filter-btn.pending-red-btn.active { background: #f56c6c; color: #fff; border-color: #f56c6c; box-shadow: 0 2px 6px rgba(245,108,108,0.3); }

    .user-stat-card { background: #fff; border: 1px solid #e4e7ed; border-radius: 12px; padding: 16px; margin-bottom: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.03); }
    .user-stat-header { font-size: 16px; font-weight: bold; color: #303133; margin-bottom: 12px; border-bottom: 1px solid #f0f2f5; padding-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
    
    .status-badges-row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
    .badge-chip { padding: 4px 10px; border-radius: 16px; font-size: 12px; font-weight: bold; display: inline-flex; align-items: center; gap: 4px; }
    .chip-paid { background: #f0f9eb; color: #67c23a; border: 1px solid #e1f3d8; }
    .chip-checking { background: #fdf6ec; color: #e6a23c; border: 1px solid #faebd7; }
    .chip-pending { background: #fef0f0; color: #f56c6c; border: 1px solid #fde2e2; }
    .chip-issue { background: #fef0f0; color: #f56c6c; border: 1px solid #fde2e2; }

    .amount-three-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; background: #f8f9fa; padding: 12px; border-radius: 8px; border: 1px solid #ebeef5; text-align: center; }
    @media (max-width: 600px) { .amount-three-grid { grid-template-columns: 1fr; } }
    .amount-col-item { display: flex; flex-direction: column; gap: 4px; }
    .amount-col-label { font-size: 12px; color: #606266; font-weight: bold; }
    .amount-col-val { font-size: 18px; font-weight: bold; }

    .pending-flat-box { background: #fef0f0; border: 1px solid #fde2e2; border-radius: 12px; padding: 16px; margin-bottom: 16px; color: #f56c6c; }
    .pending-flat-header { font-size: 15px; font-weight: bold; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px dashed #fde2e2; padding-bottom: 10px; margin-bottom: 12px; }
    .pending-user-block { margin-bottom: 12px; }
    .pending-user-block:last-child { margin-bottom: 0; }
    .pending-user-title { font-size: 14px; font-weight: bold; display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
    .pending-item-line { display: flex; justify-content: space-between; align-items: center; font-size: 13px; color: #606266; padding: 4px 0 4px 12px; }
    .pending-divider { border-top: 1px dashed #fde2e2; margin: 10px 0; }

    .compact-table-card { background: #fff; border: 1px solid #e4e7ed; border-radius: 12px; padding: 14px; margin-bottom: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.02); }
    table.compact-records-table { width: 100%; border-collapse: collapse; font-size: 13px; }
    table.compact-records-table th, table.compact-records-table td { padding: 10px 8px; border-bottom: 1px solid #ebeef5; text-align: left; vertical-align: middle; }
    table.compact-records-table th { background: #f8f9fa; color: #606266; font-weight: bold; white-space: nowrap; }

    #recordsListGrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(480px, 1fr)); gap: 16px; }
    @media (max-width: 650px) { #recordsListGrid { grid-template-columns: 1fr; } }

    .event-section { background: #fff; border: 1px solid #e4e7ed; border-radius: 12px; padding: 14px; box-shadow: 0 2px 8px rgba(0,0,0,0.02); display: flex; flex-direction: column; }
    .event-header { font-size: 15px; font-weight: bold; color: #303133; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #f0f2f5; padding-bottom: 8px; }
    .event-meta { font-size: 12px; color: #409eff; background: #ecf5ff; padding: 4px 8px; border-radius: 6px; font-weight: bold; }

    .status-badge { padding: 3px 8px; border-radius: 6px; font-size: 11px; font-weight: bold; display: inline-block; white-space: nowrap; }
    .status-paid { background: #f0f9eb; color: #67c23a; border: 1px solid #e1f3d8; }
    .status-checking { background: #fdf6ec; color: #e6a23c; border: 1px solid #faebd7; }
    .status-pending { background: #fef0f0; color: #f56c6c; border: 1px solid #fde2e2; }
    .status-issue { background: #fee2e2; color: #991b1b; border: 1px solid #fca5a5; }
    
    .photo-badge-pending { background: #f4f4f5; color: #909399; }
    .photo-badge-sent { background: #ecf5ff; color: #409eff; border: 1px solid #b3d8ff; }
  </style>
</head>
<body>

  <h3 style="margin-top:0; margin-bottom:12px; font-size:18px;">📌 登記與對帳進度查詢</h3>
  
  <div class="filter-card">
    <div class="filter-row">
      <span class="filter-label">1. 團體：</span>
      <div id="groupCapsules" class="capsule-group"></div>
    </div>

    <div class="filter-row">
      <span class="filter-label">2. 檢視模式：</span>
      <div id="modeCapsules" class="capsule-group">
        <button class="capsule-filter-btn active" onclick="setModeFilter('member', this)">👥 依成員</button>
        <button class="capsule-filter-btn" onclick="setModeFilter('event', this)">🗓️ 依活動</button>
      </div>
    </div>

    <div class="filter-row">
      <span class="filter-label">3. 細項篩選：</span>
      <div id="detailCapsules" class="capsule-group"></div>
    </div>

    <div class="filter-row" style="border-top:1px dashed #dcdfe6; padding-top:8px; margin-top:2px;">
      <span class="filter-label">👤 買家暱稱：</span>
      <div id="userCapsules" class="capsule-group"></div>
    </div>

    <div class="filter-row" style="border-top:1px dashed #dcdfe6; padding-top:8px; margin-top:2px;">
      <span class="filter-label">⚡ 快速狀態：</span>
      <div id="statusCapsules" class="capsule-group">
        <button class="capsule-filter-btn pending-red-btn" id="pendingStatusBtn" onclick="togglePendingOnly(this)">🚨 僅顯示待匯款項目</button>
      </div>
    </div>
  </div>

  <div id="userSummary"></div>
  <div id="recordsList">載入中...</div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDF7QySG1Jj4gdZvXwMRaKjRmI-lFKpj7k",
      authDomain: "forsure0922.firebaseapp.com",
      databaseURL: "https://forsure0922-default-rtdb.firebaseio.com",
      projectId: "forsure0922",
      storageBucket: "forsure0922.firebasestorage.app",
      messagingSenderId: "817449290174",
      appId: "1:817449290174:web:6b4ec1d36c171ff97011ef"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const MEMBER_EMOJI_MAP = {
      '方燦': '🐺', 'Lee Know': '🐰', '彰彬': '🐷', '鉉辰': '🥟', 'HAN': '🐹', 'Felix': '🐥', '昇玟': '🐶', 'I.N': '🦊',
      '弘中': '🐿️', '星化': '🐰', '潤浩': '🐶', '呂尚': '🐥', '傘': '⛰️', '旼琦': '🐥', '友榮': '🐈‍⬛', '鍾浩': '🐻'
    };

    const GROUP_EMOJI_MAP = {
      'Stray Kids': '🧭 Stray Kids',
      'ATEEZ': '🏴‍☠️ ATEEZ'
    };

    let allOrders = [];
    let progressMap = {};
    let eventSettingsMap = {};

    let activeGroup = 'ALL';
    let activeMode = 'member';
    let activeDetail = 'ALL';
    let activeUser = 'ALL';
    let isPendingOnly = false;

    let groupList = [];
    let memberMap = {};
    let customUsersSet = new Set();

    document.addEventListener('DOMContentLoaded', async () => {
      try {
        const gRes = await fetch('../json/group.json');
        groupList = await gRes.json();

        for (const g of groupList) {
          const file = (g === 'Stray Kids') ? 'members_skz.json' : (g === 'ATEEZ' ? 'members_atz.json' : '');
          if (file) {
            const mRes = await fetch(`../json/${file}`);
            memberMap[g] = await mRes.json();
          }
        }
      } catch(e) {}

      renderGroupCapsules();

      onSnapshot(collection(db, "users"), snap => {
        customUsersSet = new Set();
        snap.forEach(d => {
          const u = d.data();
          if (u.name && u.type !== 'threads') {
            customUsersSet.add(u.name);
          }
        });
        updateUserCapsules();
        renderCapsulesAndRecords();
      });

      onSnapshot(collection(db, "photo_progress"), snap => {
        progressMap = {};
        snap.forEach(d => {
          const data = d.data();
          const grp = data.group || 'Stray Kids';
          const ev = (data.eventName || data.event || '').trim();
          const mem = (data.member || '').trim();
          if (ev && mem) {
            progressMap[`${grp}_${ev}_${mem}`] = data.status || '';
          }
        });
        updateDetailCapsules();
        updateUserCapsules();
        renderCapsulesAndRecords();
      });

      onSnapshot(collection(db, "event_settings"), snap => {
        eventSettingsMap = {};
        snap.forEach(d => {
          const data = d.data();
          const grp = data.group || 'Stray Kids';
          const ev = (data.name || data.rawName || '').trim();
          const mem = (data.member || '').trim();
          const key = `${grp}_${ev}_${mem}`;
          eventSettingsMap[key] = {
            price: Number(data.actualPrice || data.price || data.estimatedPrice || data.unitPrice) || 0,
            packQty: Number(data.packQty) || 1,
            discounts: data.discounts || [],
            unit: data.unit || '包'
          };
        });
        renderCapsulesAndRecords();
      });

      onSnapshot(collection(db, "orders"), snap => {
        const ordersMap = new Map();
        snap.forEach(d => {
          const data = d.data();
          ordersMap.set(d.id, { id: d.id, ...data, group: data.group || "Stray Kids" });
        });
        allOrders = Array.from(ordersMap.values());
        updateDetailCapsules();
        updateUserCapsules();
        renderCapsulesAndRecords();
      });
    });

    function formatDisplayName(name) {
      if (!name) return '';
      if (customUsersSet.has(name)) return name;
      
      const len = name.length;
      if (len <= 6) {
        if (len <= 2) return name[0] + '*';
        return name[0] + '*'.repeat(len - 2) + name[len - 1];
      }
      return name.slice(0, 3) + '*'.repeat(len - 6) + name.slice(-3);
    }

    function isArchivedOrder(ord) {
      const grp = ord.group || 'Stray Kids';
      const ev = (ord.event || ord.eventName || '').trim();
      const mem = (ord.member || '').trim();
      const st = progressMap[`${grp}_${ev}_${mem}`] || '';
      return st === '已結束' || st === '到期/已刪除';
    }

    function extractDateScore(evName) {
      if (!evName) return 99999999;
      const match = evName.match(/\d{6}/);
      if (match) return parseInt(match[0], 10);
      return 99999999;
    }

    function sortOrdersTriple(orders) {
      return orders.sort((a, b) => {
        const evA = (a.event || a.eventName || '').trim();
        const evB = (b.event || b.eventName || '').trim();
        const dateA = extractDateScore(evA);
        const dateB = extractDateScore(evB);

        if (dateA !== dateB) return dateA - dateB;

        const grpA = a.group || 'Stray Kids';
        const grpB = b.group || 'Stray Kids';
        if (grpA !== grpB) {
          return (grpA === 'ATEEZ') ? -1 : 1;
        }

        const memList = memberMap[grpA] || [];
        const memA = (a.member || '').trim();
        const memB = (b.member || '').trim();
        const idxA = memList.indexOf(memA);
        const idxB = memList.indexOf(memB);

        return (idxA === -1 ? 99 : idxA) - (idxB === -1 ? 99 : idxB);
      });
    }

    function renderGroupCapsules() {
      const container = document.getElementById('groupCapsules');
      container.innerHTML = '';

      const allBtn = document.createElement('button');
      allBtn.className = `capsule-filter-btn ${activeGroup === 'ALL' ? 'active' : ''}`;
      allBtn.textContent = '全部';
      allBtn.onclick = () => {
        activeGroup = 'ALL';
        document.querySelectorAll('#groupCapsules .capsule-filter-btn').forEach(b => b.classList.remove('active'));
        allBtn.classList.add('active');
        activeDetail = 'ALL';
        activeUser = 'ALL';
        updateDetailCapsules();
        updateUserCapsules();
        renderCapsulesAndRecords();
      };
      container.appendChild(allBtn);

      groupList.forEach(g => {
        const btn = document.createElement('button');
        btn.className = `capsule-filter-btn ${activeGroup === g ? 'active' : ''}`;
        btn.textContent = GROUP_EMOJI_MAP[g] || g;
        btn.onclick = () => {
          activeGroup = g;
          document.querySelectorAll('#groupCapsules .capsule-filter-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          activeDetail = 'ALL';
          activeUser = 'ALL';
          updateDetailCapsules();
          updateUserCapsules();
          renderCapsulesAndRecords();
        };
        container.appendChild(btn);
      });
    }

    window.setModeFilter = (mode, btn) => {
      activeMode = mode;
      document.querySelectorAll('#modeCapsules .capsule-filter-btn').forEach(b => b.classList.remove('active'));
      if(btn) btn.classList.add('active');
      activeDetail = 'ALL';
      updateDetailCapsules();
      renderCapsulesAndRecords();
    };

    window.togglePendingOnly = (btn) => {
      isPendingOnly = !isPendingOnly;
      btn.classList.toggle('active', isPendingOnly);
      renderCapsulesAndRecords();
    };

    function updateDetailCapsules() {
      const container = document.getElementById('detailCapsules');
      container.innerHTML = '';

      const allBtn = document.createElement('button');
      allBtn.className = `capsule-filter-btn ${activeDetail === 'ALL' ? 'sub-active' : ''}`;
      allBtn.textContent = '全部顯示';
      allBtn.onclick = () => {
        activeDetail = 'ALL';
        document.querySelectorAll('#detailCapsules .capsule-filter-btn').forEach(b => b.classList.remove('sub-active'));
        allBtn.classList.add('sub-active');
        renderCapsulesAndRecords();
      };
      container.appendChild(allBtn);

      let filtered = allOrders.filter(o => !isArchivedOrder(o));
      if (activeGroup !== 'ALL') {
        filtered = filtered.filter(o => o.group === activeGroup);
      }

      if (activeMode === 'member') {
        let membersInJson = [];
        if (activeGroup === 'ALL') {
          Object.values(memberMap).forEach(list => membersInJson.push(...list));
        } else {
          membersInJson = memberMap[activeGroup] || [];
        }

        const activeMembersWithData = new Set(filtered.map(o => o.member).filter(Boolean));

        membersInJson.forEach(m => {
          if (activeMembersWithData.has(m)) {
            const btn = document.createElement('button');
            btn.className = `capsule-filter-btn ${activeDetail === m ? 'sub-active' : ''}`;
            btn.textContent = (MEMBER_EMOJI_MAP[m] ? `${MEMBER_EMOJI_MAP[m]} ` : '') + m;
            btn.onclick = () => {
              activeDetail = m;
              document.querySelectorAll('#detailCapsules .capsule-filter-btn').forEach(b => b.classList.remove('sub-active'));
              btn.classList.add('sub-active');
              renderCapsulesAndRecords();
            };
            container.appendChild(btn);
          }
        });
      } else if (activeMode === 'event') {
        const eventsSet = new Set();
        filtered.forEach(o => {
          if (o.event || o.eventName) eventsSet.add(o.event || o.eventName);
        });
        Array.from(eventsSet).sort().forEach(ev => {
          const btn = document.createElement('button');
          btn.className = `capsule-filter-btn ${activeDetail === ev ? 'sub-active' : ''}`;
          btn.textContent = ev;
          btn.onclick = () => {
            activeDetail = ev;
            document.querySelectorAll('#detailCapsules .capsule-filter-btn').forEach(b => b.classList.remove('sub-active'));
            btn.classList.add('sub-active');
            renderCapsulesAndRecords();
          };
          container.appendChild(btn);
        });
      }
    }

    function updateUserCapsules() {
      const container = document.getElementById('userCapsules');
      container.innerHTML = '';

      const allBtn = document.createElement('button');
      allBtn.className = `capsule-filter-btn ${activeUser === 'ALL' ? 'user-active' : ''}`;
      allBtn.textContent = '全部買家';
      allBtn.onclick = () => {
        activeUser = 'ALL';
        document.querySelectorAll('#userCapsules .capsule-filter-btn').forEach(b => b.classList.remove('user-active'));
        allBtn.classList.add('user-active');
        renderCapsulesAndRecords();
      };
      container.appendChild(allBtn);

      const usersSet = new Set();
      allOrders.filter(o => !isArchivedOrder(o)).forEach(o => {
        let matchGroup = true;
        if (activeGroup !== 'ALL') matchGroup = o.group === activeGroup;
        if (matchGroup) {
          const name = o.buyerName || o.user || o.nickname;
          if (name) usersSet.add(name);
        }
      });

      Array.from(usersSet).sort((a,b)=>a.localeCompare(b,'zh-TW')).forEach(uName => {
        const btn = document.createElement('button');
        btn.className = `capsule-filter-btn ${activeUser === uName ? 'user-active' : ''}`;
        btn.textContent = formatDisplayName(uName);
        btn.onclick = () => {
          activeUser = uName;
          document.querySelectorAll('#userCapsules .capsule-filter-btn').forEach(b => b.classList.remove('user-active'));
          btn.classList.add('user-active');
          renderCapsulesAndRecords();
        };
        container.appendChild(btn);
      });
    }

    function getItemPriceAndUnit(item) {
      const grp = item.group || 'Stray Kids';
      const eventName = (item.event || item.eventName || '').trim();
      const member = (item.member || '').trim();
      const userName = item.user || item.buyerName || item.nickname || '';
      
      const key = `${grp}_${eventName}_${member}`;
      const setting = eventSettingsMap[key] || {};
      
      const pricePerPack = setting.price || Number(item.price) || 0;
      const packQty = setting.packQty || 1;
      const rawQty = Number(item.quantity !== undefined ? item.quantity : (item.qty !== undefined ? item.qty : item.count)) || 0;

      let packs = 1;
      let totalCards = rawQty;

      if (packQty > 1) {
        if (rawQty >= packQty && rawQty % packQty === 0) {
          packs = Math.round(rawQty / packQty);
          totalCards = rawQty;
        } else {
          packs = rawQty;
          totalCards = packs * packQty;
        }
      } else {
        packs = rawQty;
        totalCards = rawQty;
      }

      let totalPrice = packs * pricePerPack;

      if (setting.discounts && Array.isArray(setting.discounts)) {
        const userDisc = setting.discounts.find(d => !d.targetUser || d.targetUser === userName);
        if (userDisc) {
          const discCount = Math.min(packs, Number(userDisc.count) || 0);
          const discPrice = Number(userDisc.price) || 0;
          totalPrice = (discCount * discPrice) + ((packs - discCount) * pricePerPack);
        }
      }

      const unitTag = setting.unit || '包';
      const qtyText = (packQty > 1) ? `${packs}${unitTag} (${totalCards}張)` : `${totalCards}張`;

      return { totalPrice, qtyText };
    }

    function getPaymentPhotoBadge(ord) {
      const payStatus = ord.paymentStatus || ord.status || (ord.hasPaid ? '已對帳' : '待匯款');
      
      let payBadgeHtml = '<span class="status-badge status-pending">🚨 待匯款</span>';
      if (payStatus === '已對帳' || ord.hasPaid) payBadgeHtml = '<span class="status-badge status-paid">🟢 已對帳</span>';
      else if (payStatus === '待對帳' || payStatus === '對帳中') payBadgeHtml = '<span class="status-badge status-checking">⏳ 待對帳</span>';
      else if (payStatus === '對帳有問題' || payStatus === '有問題') payBadgeHtml = '<span class="status-badge status-issue">⚠️ 帳有問題</span>';

      const isPhotoSent = (ord.isPhotoSent === true || ord.status === '已發圖');

      let photoBadgeHtml = '<div><span class="status-badge photo-badge-pending">📷 待發圖</span></div>';
      if (isPhotoSent) {
        const sentAt = ord.photoSentAt || '';
        const expireAt = ord.photoExpireAt || '';
        photoBadgeHtml = `
          <div><span class="status-badge photo-badge-sent">🔵 已發圖</span></div>
          ${sentAt ? `<div style="font-size:11px; color:#606266; margin-top:3px;">📅 ${sentAt} 發圖</div>` : ''}
          ${expireAt ? `<div style="font-size:11px; color:#909399;">⏳ ${expireAt} 刪除</div>` : ''}
        `;
      }

      return { payBadgeHtml, photoBadgeHtml };
    }

    function renderCapsulesAndRecords() {
      const recordsList = document.getElementById('recordsList');
      const summary = document.getElementById('userSummary');
      recordsList.innerHTML = '';
      summary.innerHTML = '';

      let list = allOrders.filter(o => !isArchivedOrder(o));

      if (activeGroup !== 'ALL') {
        list = list.filter(o => o.group === activeGroup);
      }

      if (activeDetail !== 'ALL') {
        if (activeMode === 'member') list = list.filter(o => o.member === activeDetail);
        else if (activeMode === 'event') list = list.filter(o => (o.event || o.eventName) === activeDetail);
      }

      if (activeUser !== 'ALL') {
        list = list.filter(o => (o.buyerName || o.user || o.nickname) === activeUser);
      }

      if (isPendingOnly) {
        list = list.filter(o => {
          const st = o.paymentStatus || o.status || (o.hasPaid ? '已對帳' : '待匯款');
          return st === '待匯款' || st === 'pending_payment';
        });
      }

      if (activeUser !== 'ALL' && !isPendingOnly) {
        const userEventsSet = new Set();
        let paidCount = 0, checkingCount = 0, pendingCount = 0, issueCount = 0;
        let grandTotal = 0, paidTotal = 0, pendingTotal = 0;

        list.forEach(o => {
          userEventsSet.add((o.group || '') + '_' + (o.event || o.eventName) + '_' + o.member);
          const status = o.paymentStatus || o.status || (o.hasPaid ? '已對帳' : '待匯款');
          const info = getItemPriceAndUnit(o);

          if (status === '已對帳' || o.hasPaid) { paidCount++; paidTotal += info.totalPrice; }
          else if (status === '待對帳' || status === '對帳中') checkingCount++;
          else if (status === '對帳有問題' || status === '有問題') issueCount++;
          else { pendingCount++; pendingTotal += info.totalPrice; }

          grandTotal += info.totalPrice;
        });

        summary.innerHTML = `
          <div class="user-stat-card">
            <div class="user-stat-header">
              <span>👤 ${formatDisplayName(activeUser)} 的進行中喊單個人統計</span>
              <span style="font-size:13px; color:#409eff;">已登記 ${userEventsSet.size} 場活動</span>
            </div>

            <div class="status-badges-row">
              <span class="badge-chip chip-paid">🟢 已對帳 ${paidCount} 筆</span>
              <span class="badge-chip chip-checking">⏳ 待對帳 ${checkingCount} 筆</span>
              <span class="badge-chip chip-pending">🚨 待匯款 ${pendingCount} 筆</span>
              <span class="badge-chip chip-issue">⚠️ 帳有問題 ${issueCount} 筆</span>
            </div>

            <div class="amount-three-grid">
              <div class="amount-col-item">
                <span class="amount-col-label">💰 喊單總金額</span>
                <span class="amount-col-val" style="color:#303133;">$${grandTotal.toLocaleString()}</span>
              </div>
              <div class="amount-col-item">
                <span class="amount-col-label">🟢 已對帳付清</span>
                <span class="amount-col-val" style="color:#67c23a;">$${paidTotal.toLocaleString()}</span>
              </div>
              <div class="amount-col-item">
                <span class="amount-col-label">🚨 待匯款金額</span>
                <span class="amount-col-val" style="color:#f56c6c;">$${pendingTotal.toLocaleString()}</span>
              </div>
            </div>
          </div>
        `;
      } 
      else if (isPendingOnly) {
        const userPendingGroups = {};
        let grandPendingTotal = 0;

        list.forEach(ord => {
          const uName = ord.user || ord.buyerName || ord.nickname || '未知';
          if (!userPendingGroups[uName]) userPendingGroups[uName] = [];
          userPendingGroups[uName].push(ord);
        });

        const sortedUsers = Object.keys(userPendingGroups).sort((a,b)=>a.localeCompare(b,'zh-TW'));
        let userLinesHtml = '';

        sortedUsers.forEach((uName, idx) => {
          const uOrders = sortOrdersTriple(userPendingGroups[uName]);
          let userSubTotal = 0;
          let itemsHtml = '';

          uOrders.forEach(ord => {
            const info = getItemPriceAndUnit(ord);
            userSubTotal += info.totalPrice;
            grandPendingTotal += info.totalPrice;
            const grpDisplay = GROUP_EMOJI_MAP[ord.group] || ord.group;
            const evName = ord.event || ord.eventName || '活動';
            const memName = ord.member || '全體';
            const memEmoji = MEMBER_EMOJI_MAP[memName] ? `${MEMBER_EMOJI_MAP[memName]} ` : '';

            itemsHtml += `
              <div class="pending-item-line">
                <span>• [${grpDisplay}] ${evName} (${memEmoji}${memName} - ${info.qtyText})</span>
                <b>$${info.totalPrice.toLocaleString()}</b>
              </div>
            `;
          });

          userLinesHtml += `
            <div class="pending-user-block">
              <div class="pending-user-title">
                <span>👤 ${formatDisplayName(uName)} (${uOrders.length} 筆)</span>
                <span>小計：<b>$${userSubTotal.toLocaleString()}</b></span>
              </div>
              ${itemsHtml}
            </div>
            ${idx < sortedUsers.length - 1 ? '<div class="pending-divider"></div>' : ''}
          `;
        });

        summary.innerHTML = `
          <div class="pending-flat-box">
            <div class="pending-flat-header">
              <span>🚨 待匯款項目彙總列表 (共 ${sortedUsers.length} 位買家 / ${list.length} 筆)</span>
              <span style="font-size:16px;">總應匯款：<b>$${grandPendingTotal.toLocaleString()}</b></span>
            </div>
            ${userLinesHtml || '<p style="color:#f56c6c; text-align:center; padding:10px 0;">目前尚無任何待匯款項目</p>'}
          </div>
        `;

        notifyHeight();
        return;
      }

      if (list.length === 0) {
        recordsList.innerHTML = '<p style="color:#909399; padding:20px 0; text-align:center;">目前無符合條件的進行中對帳紀錄。</p>';
        notifyHeight();
        return;
      }

      const sortedList = sortOrdersTriple(list);

      if (activeUser !== 'ALL') {
        renderCompactUserTable(sortedList);
      } else {
        renderCardsGrouped(sortedList);
      }

      notifyHeight();
    }

    function renderCompactUserTable(orders) {
      const recordsList = document.getElementById('recordsList');
      let rowsHtml = '';

      orders.forEach((ord, idx) => {
        const info = getItemPriceAndUnit(ord);
        const grp = ord.group || 'Stray Kids';
        const grpDisplay = GROUP_EMOJI_MAP[grp] || grp;
        const evName = ord.event || ord.eventName || '未分類活動';
        const mem = ord.member || '全體';
        const memDisplay = (MEMBER_EMOJI_MAP[mem] ? `${MEMBER_EMOJI_MAP[mem]} ` : '') + mem;
        const badges = getPaymentPhotoBadge(ord);

        rowsHtml += `
          <tr>
            <td>#${idx + 1}</td>
            <td>
              <b>${evName}</b><br>
              <span style="font-size:12px; color:#409eff; font-weight:bold;">${grpDisplay} · ${memDisplay}</span>
            </td>
            <td>${info.qtyText}</td>
            <td><b style="color:#f56c6c;">$${info.totalPrice.toLocaleString()}</b></td>
            <td>${badges.payBadgeHtml}</td>
            <td>${badges.photoBadgeHtml}</td>
          </tr>
        `;
      });

      recordsList.innerHTML = `
        <div class="compact-table-card">
          <table class="compact-records-table">
            <thead>
              <tr>
                <th style="width:5%;">#</th>
                <th style="width:35%;">活動名稱與成員</th>
                <th style="width:18%;">喊單數量</th>
                <th style="width:15%;">小計</th>
                <th style="width:13%;">對帳狀態</th>
                <th style="width:14%;">發圖與刪除期限</th>
              </tr>
            </thead>
            <tbody>${rowsHtml}</tbody>
          </table>
        </div>
      `;
    }

    function renderCardsGrouped(orders) {
      const recordsList = document.getElementById('recordsList');
      const groups = {};

      orders.forEach(o => {
        const grp = o.group || 'Stray Kids';
        const grpDisplay = GROUP_EMOJI_MAP[grp] || grp;
        const key = `[${grpDisplay}] ` + (o.event || o.eventName || '未分類活動') + (o.member ? ' - ' + (MEMBER_EMOJI_MAP[o.member] ? `${MEMBER_EMOJI_MAP[o.member]} ` : '') + o.member : '');
        if (!groups[key]) groups[key] = [];
        groups[key].push(o);
      });

      let gridHtml = '<div id="recordsListGrid">';
      for (const [title, list] of Object.entries(groups)) {
        const totalPacks = list.reduce((sum, item) => sum + (Number(item.quantity) || Number(item.qty) || 1), 0);
        const sampleKey = `${list[0].group || 'Stray Kids'}_${(list[0].event || list[0].eventName || '').trim()}_${(list[0].member || '').trim()}`;
        const sampleSetting = eventSettingsMap[sampleKey] || {};
        const groupUnitLabel = sampleSetting.unit || '包';

        let rowsHtml = '';
        list.forEach((ord, idx) => {
          const name = ord.user || ord.buyerName || ord.nickname || '未知';
          const info = getItemPriceAndUnit(ord);
          const badges = getPaymentPhotoBadge(ord);

          rowsHtml += `
            <tr>
              <td>#${idx + 1}</td>
              <td><b>${formatDisplayName(name)}</b></td>
              <td>${info.qtyText}</td>
              <td><b style="color:#f56c6c;">$${info.totalPrice.toLocaleString()}</b></td>
              <td>${badges.payBadgeHtml}</td>
              <td>${badges.photoBadgeHtml}</td>
            </tr>
          `;
        });

        gridHtml += `
          <div class="event-section">
            <div class="event-header">
              <span>📌 ${title}</span>
              <span class="event-meta">共 ${list.length} 筆 / ${totalPacks} ${groupUnitLabel}</span>
            </div>
            <table class="compact-records-table">
              <thead>
                <tr>
                  <th style="width:5%;">#</th>
                  <th style="width:25%;">買家暱稱</th>
                  <th style="width:20%;">喊單數量</th>
                  <th style="width:15%;">小計</th>
                  <th style="width:15%;">對帳狀態</th>
                  <th style="width:20%;">發圖與刪除期限</th>
                </tr>
              </thead>
              <tbody>${rowsHtml}</tbody>
            </table>
          </div>
        `;
      }
      gridHtml += '</div>';
      recordsList.innerHTML = gridHtml;
    }

    function notifyHeight() {
      setTimeout(() => {
        window.parent.postMessage({ frameHeight: document.body.scrollHeight }, '*');
      }, 200);
    }
  </script>
</body>
</html>
