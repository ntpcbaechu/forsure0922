<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>登記與對帳進度查詢</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 0; margin: 0; background: transparent; color: #333; }
    .jump-bar { display: flex; flex-wrap: wrap; gap: 6px; padding-bottom: 10px; margin-bottom: 15px; }
    .jump-btn { background: #ecf5ff; color: #409eff; border: 1px solid #d9ecff; padding: 6px 12px; border-radius: 20px; font-size: 12px; font-weight: bold; white-space: nowrap; cursor: pointer; flex-shrink: 0; }
    .jump-btn:hover { background: #409eff; color: #fff; }
    
    .event-section { background: #fff; border: 1px solid #e4e7ed; border-radius: 12px; padding: 14px; margin-bottom: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.02); }
    .event-header { font-size: 16px; font-weight: bold; color: #303133; margin-bottom: 6px; display: flex; justify-content: space-between; align-items: center; }
    .event-meta { font-size: 12px; color: #409eff; background: #ecf5ff; padding: 4px 8px; border-radius: 6px; }

    .order-card { background: #fafafa; border: 1px solid #ebeef5; border-radius: 8px; padding: 10px 12px; margin-top: 8px; font-size: 13px; }
    .order-top { display: flex; justify-content: space-between; font-weight: bold; margin-bottom: 6px; }
    .order-info { color: #606266; font-size: 12px; line-height: 1.6; }
    .status-badge { padding: 2px 6px; border-radius: 4px; font-size: 11px; }
    .status-paid { background: #f0f9eb; color: #67c23a; }
    .status-pending { background: #fef0f0; color: #f56c6c; }
  </style>
</head>
<body>

  <h3 style="margin-top:0; margin-bottom:12px; font-size:18px;">📌 登記與對帳進度查詢</h3>
  
  <div class="jump-bar" id="jumpBar"></div>
  <div id="recordsList">載入中...</div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDF7QySG1Jj4gdZvXwMRaKjRmI-lFKpj7k",
      authDomain: "forsure0922.firebaseapp.com",
      databaseURL: "https://forsure0922-default-rtdb.firebaseio.com",
      projectId: "forsure0922",
      storageBucket: "forsure0922.firebasestorage.app",
      messagingSenderId: "817449290174",
      appId: "1:817449290174:web:6b4ec1d36c171ff97011ef"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // 成員順序表
    const memberOrder = ["方燦", "Lee Know", "彰彬", "鉉辰", "HAN", "Felix", "昇玟", "I.N"];

    onSnapshot(collection(db, "orders"), snap => {
      const recordsList = document.getElementById('recordsList');
      const jumpBar = document.getElementById('jumpBar');
      recordsList.innerHTML = '';
      jumpBar.innerHTML = '';

      if (snap.empty) {
        recordsList.innerHTML = '<p style="color:#909399;">目前無登記紀錄。</p>';
        notifyHeight();
        return;
      }

      let orders = [];
      snap.forEach(d => orders.push({ id: d.id, ...d.data() }));

      // 依「活動名稱 + 成員」進行雙重分組
      const groups = {};
      orders.forEach(o => {
        const eventName = o.event || '未分類活動';
        const memberName = o.member ? ` - ${o.member}` : '';
        const key = eventName + memberName;

        if (!groups[key]) groups[key] = [];
        groups[key].push(o);
      });

      // 針對活動區塊進行【日期舊到新 + 成員順序】排序
      const sortedGroupKeys = Object.keys(groups).sort((a, b) => {
        // 抓取日期 (例如從 260725 RUN IT... 提取 260725)
        const matchA = a.match(/\d{6}/);
        const matchB = b.match(/\d{6}/);
        const dateA = matchA ? parseInt(matchA[0], 10) : 0;
        const dateB = matchB ? parseInt(matchB[0], 10) : 0;

        if (dateA !== dateB) {
          return dateA - dateB; // 日期小的排前面 (舊 -> 新)
        }

        // 若日期相同，比對成員順序
        const getMemberIndex = (title) => {
          for (let i = 0; i < memberOrder.length; i++) {
            if (title.includes(memberOrder[i])) return i;
          }
          return 999;
        };

        const idxA = getMemberIndex(a);
        const idxB = getMemberIndex(b);

        if (idxA !== idxB) {
          return idxA - idxB;
        }

        return a.localeCompare(b, 'zh-TW');
      });

      let groupIdx = 0;
      for (const groupTitle of sortedGroupKeys) {
        const list = groups[groupTitle];
        groupIdx++;
        const sectionId = `event-sec-${groupIdx}`;
        const totalPacks = list.reduce((sum, item) => sum + (Number(item.quantity) || Number(item.qty) || 1), 0);

        jumpBar.innerHTML += `<button class="jump-btn" onclick="scrollToSection('${sectionId}')">📍 ${groupTitle}</button>`;

        // 區塊內部的個人訂單依填單時間由早到晚 (舊 -> 新) 排序
        list.sort((a, b) => {
          const getTime = (val) => {
            if (!val) return 0;
            if (typeof val.toDate === 'function') return val.toDate().getTime();
            return new Date(val).getTime() || 0;
          };
          return getTime(a.createdAt) - getTime(b.createdAt);
        });

        let cardsHtml = '';
        list.forEach((ord, idx) => {
          const isPaid = ord.paymentStatus === '已對帳' || ord.status === '已對帳';
          const badgeHtml = isPaid 
            ? '<span class="status-badge status-paid">🟢 已對帳</span>' 
            : '<span class="status-badge status-pending">⏳ 待匯款</span>';

          // 時間解析
          let dateFormatted = '-';
          if (ord.createdAt) {
            if (typeof ord.createdAt.toDate === 'function') {
              const d = ord.createdAt.toDate();
              const mm = String(d.getMonth() + 1).padStart(2, '0');
              const dd = String(d.getDate()).padStart(2, '0');
              const hh = String(d.getHours()).padStart(2, '0');
              const min = String(d.getMinutes()).padStart(2, '0');
              dateFormatted = `${mm}-${dd} ${hh}:${min}`;
            } else if (typeof ord.createdAt === 'string') {
              dateFormatted = ord.createdAt.substring(5, 16).replace('T', ' ');
            }
          }

          // 準確抓取 buyerName (加入 user 欄位)
          const rawName = ord.user || ord.buyerName || ord.name || ord.buyer || ord.nickname;
          const displayName = (rawName && String(rawName).trim() !== '') ? rawName : '未知成員';

          cardsHtml += `
            <div class="order-card">
              <div class="order-top">
                <span>#${idx + 1} ${displayName}</span>
                ${badgeHtml}
              </div>
              <div class="order-info">
                <div>喊單張數：<b>${ord.quantity || ord.qty || 1} 張</b></div>
                <div>填單 / 更新時間：${dateFormatted}</div>
              </div>
            </div>
          `;
        });

        recordsList.innerHTML += `
          <div class="event-section" id="${sectionId}">
            <div class="event-header">
              <span>📌 ${groupTitle}</span>
              <span class="event-meta">共 ${list.length} 筆 / 總計 ${totalPacks} 張</span>
            </div>
            ${cardsHtml}
          </div>
        `;
      }

      notifyHeight();
    });

    window.scrollToSection = (secId) => {
      const el = document.getElementById(secId);
      if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
    };

    function notifyHeight() {
      setTimeout(() => {
        window.parent.postMessage({ frameHeight: document.body.scrollHeight }, '*');
      }, 100);
    }
  </script>
</body>
</html>
