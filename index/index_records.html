<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>團員登記管理</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 0; margin: 0; background: #fff; color: #333; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    th, td { padding: 10px; border-bottom: 1px solid #e4e7ed; text-align: left; font-size: 13px; }
    th { background: #f8f9fa; }
    input { padding: 8px 10px; border: 1px solid #dcdfe6; border-radius: 6px; font-size: 14px; box-sizing: border-box; }
    .btn-danger { background-color: #f56c6c; color: white; padding: 4px 8px; font-size: 12px; border-radius: 4px; border: none; cursor: pointer; }
    .btn-edit { background-color: #e6a23c; color: white; padding: 4px 8px; font-size: 12px; border-radius: 4px; border: none; cursor: pointer; margin-right: 4px; }
    .status-clickable { cursor: pointer; user-select: none; }
  </style>
</head>
<body>

  <h3>團員填單紀錄管理 (修正登記錯成員/張數)</h3>
  <div style="margin-bottom:12px; display:flex; gap:10px;">
    <input type="text" id="searchOrderInput" placeholder="搜尋社群名稱或活動/成員..." style="max-width:300px;">
  </div>
  <table>
    <thead>
      <tr>
        <th>社群暱稱</th>
        <th>活動名稱</th>
        <th>登記成員</th>
        <th>登記張數</th>
        <th>登記時間</th>
        <th>匯款狀態 (點擊可切換)</th>
        <th>操作</th>
      </tr>
    </thead>
    <tbody id="ordersAdminTable"></tbody>
  </table>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, doc, deleteDoc, updateDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDF7QySG1Jj4gdZvXwMRaKjRmI-lFKpj7k",
      authDomain: "forsure0922.firebaseapp.com",
      databaseURL: "https://forsure0922-default-rtdb.firebaseio.com",
      projectId: "forsure0922",
      storageBucket: "forsure0922.firebasestorage.app",
      messagingSenderId: "817449290174",
      appId: "1:817449290174:web:6b4ec1d36c171ff97011ef"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    onSnapshot(collection(db, "orders"), snap => {
      const tb = document.getElementById('ordersAdminTable');
      tb.innerHTML = '';

      snap.forEach(d => {
        const item = d.data();
        const docId = d.id;
        const eName = item.event || item.eventName || item.fullEvent || '未命名';
        const qty = item.qty !== undefined ? item.qty : (item.quantity !== undefined ? item.quantity : (item.count || 0));
        const timeStr = item.time || (item.createdAt ? new Date(item.createdAt.seconds * 1000).toLocaleString('zh-TW', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit', hour12: false }) : '-');

        // 同步相容三種狀態判斷 (嚴格連動前台)
        const isPaid = item.hasPaid === true || item.paymentStatus === '已對帳' || item.status === '已對帳';

        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td><b>${item.user || '-'}</b></td>
          <td>${eName}</td>
          <td><b style="color:#409eff;">${item.member || '未設定'}</b></td>
          <td>${qty} 張</td>
          <td><small style="color:#909399;">${timeStr}</small></td>
          <td class="status-clickable" onclick="togglePayStatus('${docId}', ${isPaid})">
            ${isPaid ? '<span style="color:#67c23a; font-weight:bold;">🟢 已對帳/已匯款 (點擊切換)</span>' : '<span style="color:#f56c6c; font-weight:bold;">⏳ 待匯款 (點擊切換)</span>'}
          </td>
          <td>
            <button class="btn-edit" onclick="editUserOrder('${docId}', '${item.member||''}', ${qty})">修改成員/張數</button>
            <button class="btn-danger" onclick="deleteUserOrder('${docId}', '${item.user}', '${item.member}')">刪除</button>
          </td>
        `;
        tb.appendChild(tr);
      });
      notifyHeight();
    });

    // 切換匯款/對帳狀態：同時把三個關鍵欄位一次寫入，徹底解決前後台同步問題
    window.togglePayStatus = async (docId, currentStatus) => {
      const nextStatus = !currentStatus;
      try {
        await updateDoc(doc(db, "orders", docId), {
          hasPaid: nextStatus,
          paymentStatus: nextStatus ? '已對帳' : 'pending_payment',
          status: nextStatus ? '已對帳' : 'pending_payment'
        });
      } catch (err) {
        alert('修改狀態失敗: ' + err.message);
      }
    };

    window.editUserOrder = async (docId, oldMember, oldQty) => {
      const newMember = prompt(`請輸入要修正的成員名稱（目前為 ${oldMember}）：\n可填寫例如：方燦, Lee Know, 彰彬, 鉉辰, Han, Felix, 昇玟, I.N, 團體/全體`, oldMember);
      if (newMember === null || newMember.trim() === '') return;

      const newQtyStr = prompt(`請確認或修改張數（目前為 ${oldQty} 張）：`, oldQty);
      if (newQtyStr === null) return;
      const newQty = parseInt(newQtyStr) || 0;

      try {
        await updateDoc(doc(db, "orders", docId), {
          member: newMember.trim(),
          qty: newQty,
          quantity: newQty
        });
        alert('✅ 登記成員與張數已成功修改！');
      } catch (err) {
        alert('修改失敗: ' + err.message);
      }
    };

    window.deleteUserOrder = async (docId, user, member) => {
      if (confirm(`確定要刪除 [${user}] 登記的 [${member}] 紀錄嗎？`)) {
        await deleteDoc(doc(db, "orders", docId));
        alert('已成功刪除該筆登記。');
      }
    };

    document.getElementById('searchOrderInput').addEventListener('input', (e) => {
      const kw = e.target.value.toLowerCase();
      const rows = document.querySelectorAll('#ordersAdminTable tr');
      rows.forEach(r => {
        r.style.display = r.textContent.toLowerCase().includes(kw) ? '' : 'none';
      });
    });

    function notifyHeight() {
      setTimeout(() => {
        window.parent.postMessage({ frameHeight: document.body.scrollHeight }, '*');
      }, 100);
    }
  </script>

</body>
</html>
