<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>登記與對帳進度查詢</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 0; margin: 0; background: transparent; color: #333; }
    
    .filter-card { background: #fff; border: 1px solid #e4e7ed; border-radius: 12px; padding: 14px; margin-bottom: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.02); }
    .filter-title { font-size: 14px; font-weight: bold; color: #303133; margin-bottom: 8px; }
    .filter-options { display: flex; gap: 15px; margin-bottom: 10px; }
    .filter-label { font-size: 13px; cursor: pointer; display: flex; align-items: center; gap: 4px; }

    /* 動態膠囊按鈕區塊 */
    .capsule-bar { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
    .capsule-btn { background: #ecf5ff; color: #409eff; border: 1px solid #d9ecff; padding: 6px 14px; border-radius: 20px; font-size: 13px; font-weight: bold; cursor: pointer; transition: all 0.2s; }
    .capsule-btn:hover, .capsule-btn.active { background: #409eff; color: #fff; border-color: #409eff; }

    .summary-card { background: #ecf5ff; border: 1px solid #d9ecff; border-radius: 10px; padding: 12px 14px; margin-bottom: 15px; font-size: 13px; color: #409eff; line-height: 1.8; }
    .summary-card b { font-size: 15px; }

    .event-section { background: #fff; border: 1px solid #e4e7ed; border-radius: 12px; padding: 14px; margin-bottom: 16px; }
    .event-header { font-size: 15px; font-weight: bold; color: #303133; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
    .event-meta { font-size: 12px; color: #409eff; background: #ecf5ff; padding: 4px 8px; border-radius: 6px; }

    .cards-list { display: flex; flex-direction: column; gap: 8px; margin-top: 8px; }
    .order-card { background: #fafafa; border: 1px solid #ebeef5; border-radius: 8px; padding: 12px 14px; font-size: 13px; }
    .order-top { display: flex; justify-content: space-between; align-items: center; font-weight: bold; margin-bottom: 6px; }
    .order-info { display: flex; flex-wrap: wrap; gap: 15px; color: #606266; font-size: 13px; margin-top: 4px; }
    
    .status-badge { padding: 2px 8px; border-radius: 4px; font-size: 12px; }
    .status-paid { background: #f0f9eb; color: #67c23a; }
    .status-pending { background: #fef0f0; color: #f56c6c; }
    .status-issue { background: #fdf6ec; color: #e6a23c; }
    
    .type-badge { font-size: 11px; padding: 1px 5px; border-radius: 4px; background: #f4f4f5; color: #909399; margin-left: 4px; }
    .type-add { background: #fdf6ec; color: #e6a23c; border: 1px solid #faebd7; }
  </style>
</head>
<body>

  <h3 style="margin-top:0; margin-bottom:12px; font-size:18px;">📌 登記與對帳進度查詢</h3>
  
  <div class="filter-card">
    <div class="filter-title">🔍 請選擇篩選模式：</div>
    <div class="filter-options">
      <label class="filter-label"><input type="radio" name="filterMode" value="event" checked> 依活動日期與場次查詢</label>
      <label class="filter-label"><input type="radio" name="filterMode" value="user"> 依社群暱稱查詢</label>
    </div>

    <!-- 動態生成按鈕容器 -->
    <div id="capsuleContainer" class="capsule-bar"></div>
  </div>

  <div id="userSummary"></div>
  <div id="recordsList">載入中...</div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDF7QySG1Jj4gdZvXwMRaKjRmI-lFKpj7k",
      authDomain: "forsure0922.firebaseapp.com",
      databaseURL: "https://forsure0922-default-rtdb.firebaseio.com",
      projectId: "forsure0922",
      storageBucket: "forsure0922.firebasestorage.app",
      messagingSenderId: "817449290174",
      appId: "1:817449290174:web:6b4ec1d36c171ff97011ef"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let allOrders = [];
    let eventPricesMap = {};
    let activeFilterValue = 'ALL';

    onSnapshot(collection(db, "event_settings"), snap => {
      eventPricesMap = {};
      snap.forEach(d => {
        const data = d.data();
        const key = `${data.name || data.rawName}_${data.member || ''}`;
        eventPricesMap[key] = {
          price: Number(data.price || data.unitPrice) || 0,
          packQty: Number(data.packQty) || 1
        };
      });
    });

    document.querySelectorAll('input[name="filterMode"]').forEach(r => {
      r.addEventListener('change', () => {
        activeFilterValue = 'ALL';
        renderCapsulesAndRecords();
      });
    });

    onSnapshot(collection(db, "orders"), snap => {
      allOrders = [];
      snap.forEach(d => allOrders.push({ id: d.id, ...d.data() }));
      renderCapsulesAndRecords();
    });

    function getItemPriceInfo(item) {
      const eventName = item.event || item.eventName || '';
      const member = item.member || '';
      const key = `${eventName}_${member}`;
      const setting = eventPricesMap[key] || {};
      
      const pricePerPack = setting.price || 0;
      const packQty = setting.packQty || 1;
      const qty = Number(item.quantity) || Number(item.qty) || 0;
      
      const numPacks = (packQty > 0) ? (qty / packQty) : 1;
      const totalPrice = Math.round(numPacks * pricePerPack);

      return { pricePerPack, totalPrice, qty };
    }

    function renderCapsulesAndRecords() {
      const mode = document.querySelector('input[name="filterMode"]:checked').value;
      const container = document.getElementById('capsuleContainer');
      const recordsList = document.getElementById('recordsList');
      const summary = document.getElementById('userSummary');

      container.innerHTML = '';
      recordsList.innerHTML = '';
      summary.innerHTML = '';

      if (allOrders.length === 0) {
        recordsList.innerHTML = '<p style="color:#909399;">目前無登記紀錄。</p>';
        notifyHeight();
        return;
      }

      if (mode === 'event') {
        // 抓出「有喊單」的場次
        const eventsSet = new Set();
        allOrders.forEach(o => {
          const key = (o.event || o.eventName || '未分類活動') + (o.member ? ` - ${o.member}` : '');
          eventsSet.add(key);
        });

        const sortedEvents = Array.from(eventsSet).sort((a, b) => {
          const matchA = a.match(/\d{6}/); const matchB = b.match(/\d{6}/);
          const dateA = matchA ? parseInt(matchA[0], 10) : 0;
          const dateB = matchB ? parseInt(matchB[0], 10) : 0;
          if (dateA !== dateB) return dateA - dateB;
          return a.localeCompare(b, 'zh-TW');
        });

        // 建立「全部」按鈕
        const allBtn = document.createElement('button');
        allBtn.className = `capsule-btn ${activeFilterValue === 'ALL' ? 'active' : ''}`;
        allBtn.textContent = '📍 全部活動場次';
        allBtn.onclick = () => { activeFilterValue = 'ALL'; renderCapsulesAndRecords(); };
        container.appendChild(allBtn);

        sortedEvents.forEach(evTitle => {
          const btn = document.createElement('button');
          btn.className = `capsule-btn ${activeFilterValue === evTitle ? 'active' : ''}`;
          btn.textContent = `📍 ${evTitle}`;
          btn.onclick = () => { activeFilterValue = evTitle; renderCapsulesAndRecords(); };
          container.appendChild(btn);
        });

        // 渲染對應資料
        let filteredOrders = allOrders;
        if (activeFilterValue !== 'ALL') {
          filteredOrders = allOrders.filter(o => {
            const key = (o.event || o.eventName || '未分類活動') + (o.member ? ` - ${o.member}` : '');
            return key === activeFilterValue;
          });
        }
        renderCardsGrouped(filteredOrders);

      } else {
        // 抓出「有喊單」的社群暱稱
        const usersSet = new Set();
        allOrders.forEach(o => {
          const name = o.buyerName || o.user || o.nickname;
          if (name) usersSet.add(name);
        });

        const sortedUsers = Array.from(usersSet).sort((a, b) => a.localeCompare(b, 'zh-TW'));

        sortedUsers.forEach(userName => {
          const btn = document.createElement('button');
          btn.className = `capsule-btn ${activeFilterValue === userName ? 'active' : ''}`;
          btn.textContent = `👤 ${userName}`;
          btn.onclick = () => { activeFilterValue = userName; renderCapsulesAndRecords(); };
          container.appendChild(btn);
        });

        if (activeFilterValue === 'ALL' || !usersSet.has(activeFilterValue)) {
          recordsList.innerHTML = '<p style="color:#909399;">👈 請點選上方的暱稱按鈕查看個人喊單。</p>';
        } else {
          const userOrders = allOrders.filter(o => (o.buyerName || o.user || o.nickname) === activeFilterValue);
          
          // 計算個人統計
          const userEventsSet = new Set();
          let paidCount = 0, pendingCount = 0, issueCount = 0, grandTotal = 0;

          userOrders.forEach(o => {
            const key = `${o.event || o.eventName}_${o.member}`;
            userEventsSet.add(key);

            const status = o.paymentStatus || o.status || (o.hasPaid ? '已對帳' : '待匯款');
            if (status === '已對帳') paidCount++;
            else if (status === '對帳有問題' || status === '有問題') issueCount++;
            else pendingCount++;

            const info = getItemPriceInfo(o);
            grandTotal += info.totalPrice;
          });

          summary.innerHTML = `
            <div class="summary-card">
              <b>👤 ${activeFilterValue} 的喊單個人統計：</b><br>
              • 已登記場次：<b>${userEventsSet.size}</b> 場<br>
              • 對帳狀態：🟢 已對帳 <b>${paidCount}</b> 筆 ｜ ⏳ 待匯款 <b>${pendingCount}</b> 筆 ｜ ⚠️ 對帳有問題 <b>${issueCount}</b> 筆<br>
              • 喊單總金額：<b>$${grandTotal.toLocaleString()}</b>
            </div>
          `;

          renderCardsGrouped(userOrders);
        }
      }
      notifyHeight();
    }

    function renderCardsGrouped(orders) {
      const recordsList = document.getElementById('recordsList');

      const groups = {};
      orders.forEach(o => {
        const key = (o.event || o.eventName || '未分類活動') + (o.member ? ` - ${o.member}` : '');
        if (!groups[key]) groups[key] = [];
        groups[key].push(o);
      });

      const sortedKeys = Object.keys(groups).sort((a, b) => {
        const matchA = a.match(/\d{6}/); const matchB = b.match(/\d{6}/);
        const dateA = matchA ? parseInt(matchA[0], 10) : 0;
        const dateB = matchB ? parseInt(matchB[0], 10) : 0;
        if (dateA !== dateB) return dateA - dateB;
        return a.localeCompare(b, 'zh-TW');
      });

      for (const title of sortedKeys) {
        const list = groups[title];
        const totalPacks = list.reduce((sum, item) => sum + (Number(item.quantity) || Number(item.qty) || 1), 0);

        let cardsHtml = '';
        list.forEach((ord, idx) => {
          const status = ord.paymentStatus || ord.status || (ord.hasPaid ? '已對帳' : '待匯款');
          
          let badgeHtml = '<span class="status-badge status-pending">⏳ 待匯款</span>';
          if (status === '已對帳') badgeHtml = '<span class="status-badge status-paid">🟢 已對帳</span>';
          else if (status === '對帳有問題' || status === '有問題') badgeHtml = '<span class="status-badge status-issue">⚠️ 對帳有問題</span>';

          const typeBadge = (ord.orderType === '追加') ? '<span class="type-badge type-add">追加</span>' : '<span class="type-badge">一般</span>';

          const name = ord.user || ord.buyerName || ord.nickname || '未知';
          const info = getItemPriceInfo(ord);

          cardsHtml += `
            <div class="order-card">
              <div class="order-top">
                <span>#${idx + 1} ${name} ${typeBadge}</span>
                ${badgeHtml}
              </div>
              <div class="order-info">
                <span>喊單張數：<b>${info.qty} 張</b></span>
                <span>每包金額：<b>$${info.pricePerPack}</b></span>
                <span style="color:#409eff;">總金額：<b>$${info.totalPrice.toLocaleString()}</b></span>
              </div>
            </div>
          `;
        });

        recordsList.innerHTML += `
          <div class="event-section">
            <div class="event-header">
              <span>📌 ${title}</span>
              <span class="event-meta">共 ${list.length} 筆 / ${totalPacks} 張</span>
            </div>
            <div class="cards-list">${cardsHtml}</div>
          </div>
        `;
      }
    }

    function notifyHeight() {
      setTimeout(() => {
        window.parent.postMessage({ frameHeight: document.body.scrollHeight }, '*');
      }, 100);
    }
  </script>
</body>
</html>
