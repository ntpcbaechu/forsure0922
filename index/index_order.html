<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>登記表單</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 0; margin: 0; background: transparent; color: #333; }
    .form-group { margin-bottom: 16px; }
    label { font-size: 14px; font-weight: bold; color: #303133; display: block; margin-bottom: 6px; }
    input, select, textarea { width: 100%; padding: 12px; border: 1px solid #dcdfe6; border-radius: 10px; font-size: 15px; box-sizing: border-box; background: #fff; }
    button { width: 100%; padding: 14px; background: #409eff; color: white; border: none; border-radius: 10px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px; }
    button:disabled { background: #a0cfff; }
  </style>
</head>
<body>

  <h3 style="margin-top:0; margin-bottom:20px; text-align:center; font-size:20px;">登記表單</h3>
  <form id="orderForm">
    <div class="form-group">
      <label>社群名稱 / 暱稱 *</label>
      <select id="buyerName" required><option value="">載入中...</option></select>
    </div>
    <div class="form-group">
      <label>品項 / 活動名稱 *</label>
      <select id="eventName" required><option value="">載入中...</option></select>
    </div>
    <div class="form-group">
      <label>成員 *</label>
      <select id="member" required><option value="">載入中...</option></select>
    </div>
    <div class="form-group">
      <label>數量 *</label>
      <input type="number" id="qty" min="1" placeholder="請輸入數量" required>
    </div>
    <div class="form-group">
      <label>備註欄位</label>
      <input type="text" id="note" placeholder="如有其他需求請填寫">
    </div>
    <button type="submit" id="submitBtn">提交訂單</button>
  </form>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, addDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDF7QySG1Jj4gdZvXwMRaKjRmI-lFKpj7k",
      authDomain: "forsure0922.firebaseapp.com",
      databaseURL: "https://forsure0922-default-rtdb.firebaseio.com",
      projectId: "forsure0922",
      storageBucket: "forsure0922.firebasestorage.app",
      messagingSenderId: "817449290174",
      appId: "1:817449290174:web:6b4ec1d36c171ff97011ef"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    document.addEventListener('DOMContentLoaded', async () => {
      // 直連 GitHub Pages 根目錄 json 檔案
      const [buyersRes, membersRes] = await Promise.all([
        fetch('../json/buyers.json'),
        fetch('../json/members.json')
      ]);
      const buyers = await buyersRes.json();
      const members = await membersRes.json();

      const buyerSel = document.getElementById('buyerName');
      buyerSel.innerHTML = '<option value="">請選擇您的名稱</option>';
      buyers.forEach(b => { buyerSel.innerHTML += `<option value="${b}">${b}</option>`; });

      const memberSel = document.getElementById('member');
      memberSel.innerHTML = '<option value="">請選擇成員</option>';
      members.forEach(m => { memberSel.innerHTML += `<option value="${m}">${m}</option>`; });

      onSnapshot(collection(db, "event_settings"), snap => {
        const eventSel = document.getElementById('eventName');
        eventSel.innerHTML = '<option value="">請選擇品項 / 活動</option>';
        snap.forEach(d => {
          const data = d.data();
          if (!data.isClosed) {
            eventSel.innerHTML += `<option value="${data.name}">${data.name} (${data.member || '全體'})</option>`;
          }
        });
        notifyHeight();
      });
    });

    document.getElementById('orderForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('submitBtn');
      btn.disabled = true;
      btn.textContent = '提交中...';

      const data = {
        buyerName: document.getElementById('buyerName').value,
        event: document.getElementById('eventName').value,
        member: document.getElementById('member').value,
        qty: parseInt(document.getElementById('qty').value) || 1,
        note: document.getElementById('note').value.trim(),
        createdAt: new Date().toISOString(),
        paymentStatus: '待匯款'
      };

      try {
        await addDoc(collection(db, "orders"), data);
        alert('🎉 登記成功！');
        document.getElementById('orderForm').reset();
      } catch (err) {
        alert('提交失敗：' + err.message);
      } finally {
        btn.disabled = false;
        btn.textContent = '提交訂單';
      }
    });

    function notifyHeight() {
      setTimeout(() => {
        window.parent.postMessage({ frameHeight: document.body.scrollHeight }, '*');
      }, 100);
    }
  </script>
</body>
</html>
