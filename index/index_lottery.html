<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>抽獎結果公告</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 0; margin: 0; background: transparent; color: #333; }
    
    .lottery-card { background: #fff; border: 1px solid #e4e7ed; border-radius: 12px; padding: 16px; margin-bottom: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.02); }
    .lottery-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #f0f2f5; padding-bottom: 10px; margin-bottom: 12px; }
    .lottery-title { font-size: 16px; font-weight: bold; color: #303133; }
    .lottery-date { font-size: 12px; color: #909399; }

    .winner-list { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
    .winner-item { background: #fdf6ec; border: 1px solid #faebd7; padding: 10px 12px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; font-size: 13px; }
    .winner-name { font-weight: bold; color: #e6a23c; }
    .winner-prize { color: #606266; }

    .special-badge { background: #fef0f0; color: #f56c6c; border: 1px solid #fde2e2; padding: 2px 6px; border-radius: 4px; font-size: 11px; margin-left: 6px; }
  </style>
</head>
<body>

  <h3 style="margin-top:0; margin-bottom:12px; font-size:18px;">🎉 抽獎結果公告</h3>
  
  <div id="lotteryList">載入中...</div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDF7QySG1Jj4gdZvXwMRaKjRmI-lFKpj7k",
      authDomain: "forsure0922.firebaseapp.com",
      databaseURL: "https://forsure0922-default-rtdb.firebaseio.com",
      projectId: "forsure0922",
      storageBucket: "forsure0922.firebasestorage.app",
      messagingSenderId: "817449290174",
      appId: "1:817449290174:web:6b4ec1d36c171ff97011ef"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    onSnapshot(collection(db, "lottery_events"), snap => {
      const container = document.getElementById('lotteryList');
      container.innerHTML = '';

      if (snap.empty) {
        container.innerHTML = '<p style="color:#909399;">目前尚無抽獎結果公告。</p>';
        notifyHeight();
        return;
      }

      let list = [];
      snap.forEach(d => list.push({ id: d.id, ...d.data() }));
      list.sort((a, b) => (b.createdAt?.seconds || 0) - (a.createdAt?.seconds || 0));

      list.forEach(item => {
        let dateStr = '-';
        if (item.createdAt) {
          const dt = item.createdAt.seconds ? new Date(item.createdAt.seconds * 1000) : new Date(item.createdAt);
          dateStr = dt.toLocaleDateString('zh-TW');
        }

        let winnersHtml = '';
        if (item.winners && item.winners.length > 0) {
          item.winners.forEach(w => {
            const specialBadge = w.isSpecial ? '<span class="special-badge">特別獎</span>' : '';
            winnersHtml += `
              <div class="winner-item">
                <span><span class="winner-name">🎁 ${w.name}</span> ${specialBadge}</span>
                <span class="winner-prize">${w.prize || '專屬獎項'}</span>
              </div>
            `;
          });
        } else {
          winnersHtml = '<p style="font-size:12px; color:#909399; margin:4px 0;">尚未公佈中獎名單</p>';
        }

        container.innerHTML += `
          <div class="lottery-card">
            <div class="lottery-header">
              <span class="lottery-title">🎁 ${item.title}</span>
              <span class="lottery-date">發佈日期：${dateStr}</span>
            </div>
            <div style="font-size:13px; color:#606266; margin-bottom:8px;">
              對應成員：<b>${item.member || '全體'}</b> ｜ 總抽獎籤數：<b>${item.participants?.length || 0}</b> 籤
            </div>
            <div class="winner-list">${winnersHtml}</div>
          </div>
        `;
      });

      notifyHeight();
    });

    function notifyHeight() {
      setTimeout(() => {
        const h = Math.max(document.body.scrollHeight, 400);
        window.parent.postMessage({ frameHeight: h }, '*');
      }, 100);
    }
  </script>
</body>
</html>
