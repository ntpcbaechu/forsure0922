<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>抽獎結果公告</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 0; margin: 0; background: transparent; color: #333; }
    
    .filter-card { background: #fff; border: 1px solid #e4e7ed; border-radius: 12px; padding: 12px 14px; margin-bottom: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.02); display: flex; flex-direction: column; gap: 8px; }
    .filter-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .filter-label { font-size: 12px; font-weight: bold; color: #606266; min-width: 80px; }

    .capsule-group { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
    .capsule-filter-btn { background: #ecf5ff; color: #409eff; border: 1px solid #d9ecff; padding: 5px 12px; border-radius: 20px; font-size: 12px; font-weight: bold; cursor: pointer; transition: all 0.2s; outline: none; }
    .capsule-filter-btn:hover { background: #409eff; color: #fff; border-color: #409eff; }
    .capsule-filter-btn.active { background: #409eff; color: #fff; border-color: #409eff; }
    .capsule-filter-btn.sub-active { background: #67c23a; color: #fff; border-color: #67c23a; }

    .lottery-card { background: #fff; border: 1px solid #e4e7ed; border-radius: 12px; padding: 16px; margin-bottom: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.02); }
    .lottery-top { display: flex; justify-content: space-between; align-items: flex-start; border-bottom: 1px solid #f0f2f5; padding-bottom: 10px; margin-bottom: 12px; }
    .lottery-title { font-size: 16px; font-weight: bold; color: #303133; }
    .lottery-meta { font-size: 12px; color: #909399; margin-top: 4px; }

    .status-badges-container { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
    .status-badge { padding: 2px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; display: inline-block; }
    .photo-badge-pending { background: #f4f4f5; color: #909399; }
    .photo-badge-sent { background: #ecf5ff; color: #409eff; border: 1px solid #b3d8ff; }
    .photo-dates-box { font-size: 11px; color: #606266; margin-top: 2px; text-align: right; line-height: 1.3; }

    .winner-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-top: 10px; }
    @media (max-width: 650px) { .winner-grid { grid-template-columns: 1fr; } }

    .winner-card { background: #fafafa; border: 1px solid #ebeef5; border-radius: 8px; padding: 10px 12px; display: flex; flex-direction: column; gap: 4px; position: relative; }
    .winner-card.special { background: #fff6f6; border-color: #fde2e2; }

    .winner-card-top { display: flex; justify-content: space-between; align-items: center; }
    .winner-name { font-size: 14px; font-weight: bold; color: #303133; }
    .winner-prize { font-size: 12px; color: #606266; word-break: break-all; margin-top: 2px; }

    .special-badge { background: #fef0f0; color: #f56c6c; border: 1px solid #fde2e2; padding: 1px 6px; border-radius: 4px; font-size: 11px; font-weight: bold; }
  </style>
</head>
<body>

  <h3 style="margin-top:0; margin-bottom:12px; font-size:18px;">🎉 抽獎結果與發圖進度</h3>

  <div class="filter-card">
    <div class="filter-row">
      <span class="filter-label">1. 團體：</span>
      <div id="groupCapsules" class="capsule-group"></div>
    </div>

    <div class="filter-row">
      <span class="filter-label">2. 細項篩選：</span>
      <div id="detailCapsules" class="capsule-group"></div>
    </div>
  </div>

  <div id="lotteryList">載入中...</div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDF7QySG1Jj4gdZvXwMRaKjRmI-lFKpj7k",
      authDomain: "forsure0922.firebaseapp.com",
      databaseURL: "https://forsure0922-default-rtdb.firebaseio.com",
      projectId: "forsure0922",
      storageBucket: "forsure0922.firebasestorage.app",
      messagingSenderId: "817449290174",
      appId: "1:817449290174:web:6b4ec1d36c171ff97011ef"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let allLotteries = [];
    let activeGroup = 'Stray Kids';
    let activeDetail = 'ALL';

    let groupList = [];
    let memberMap = {};

    document.addEventListener('DOMContentLoaded', async () => {
      try {
        const gRes = await fetch('../json/group.json');
        groupList = await gRes.json();

        for (const g of groupList) {
          const file = (g === 'Stray Kids') ? 'members_skz.json' : (g === 'ATEEZ' ? 'members_atz.json' : '');
          if (file) {
            const mRes = await fetch(`../json/${file}`);
            memberMap[g] = await mRes.json();
          }
        }
      } catch(e) {}

      renderGroupCapsules();

      onSnapshot(collection(db, "lottery_events"), snap => {
        allLotteries = [];
        snap.forEach(d => {
          allLotteries.push({ id: d.id, group: "Stray Kids", ...d.data() });
        });
        updateDetailCapsules();
        renderLotteryCards();
      });
    });

    function renderGroupCapsules() {
      const container = document.getElementById('groupCapsules');
      container.innerHTML = '';
      groupList.forEach(g => {
        const btn = document.createElement('button');
        btn.className = `capsule-filter-btn ${activeGroup === g ? 'active' : ''}`;
        btn.textContent = g;
        btn.onclick = () => {
          activeGroup = g;
          document.querySelectorAll('#groupCapsules .capsule-filter-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          activeDetail = 'ALL';
          updateDetailCapsules();
          renderLotteryCards();
        };
        container.appendChild(btn);
      });
    }

    function updateDetailCapsules() {
      const container = document.getElementById('detailCapsules');
      container.innerHTML = '';

      const allBtn = document.createElement('button');
      allBtn.className = `capsule-filter-btn ${activeDetail === 'ALL' ? 'sub-active' : ''}`;
      allBtn.textContent = '全部顯示';
      allBtn.onclick = () => {
        activeDetail = 'ALL';
        document.querySelectorAll('#detailCapsules .capsule-filter-btn').forEach(b => b.classList.remove('sub-active'));
        allBtn.classList.add('sub-active');
        renderLotteryCards();
      };
      container.appendChild(allBtn);

      const filtered = allLotteries.filter(l => l.group === activeGroup);
      const membersInJson = memberMap[activeGroup] || [];
      const activeMembersWithData = new Set(filtered.map(l => l.member).filter(Boolean));

      membersInJson.forEach(m => {
        if (activeMembersWithData.has(m)) {
          const btn = document.createElement('button');
          btn.className = `capsule-filter-btn ${activeDetail === m ? 'sub-active' : ''}`;
          btn.textContent = m;
          btn.onclick = () => {
            activeDetail = m;
            document.querySelectorAll('#detailCapsules .capsule-filter-btn').forEach(b => b.classList.remove('sub-active'));
            btn.classList.add('sub-active');
            renderLotteryCards();
          };
          container.appendChild(btn);
        }
      });
    }

    function renderLotteryCards() {
      const container = document.getElementById('lotteryList');
      container.innerHTML = '';

      let list = allLotteries.filter(l => l.group === activeGroup);
      if (activeDetail !== 'ALL') list = list.filter(l => l.member === activeDetail);

      if (list.length === 0) {
        container.innerHTML = '<p style="color:#909399; padding:20px 0; text-align:center;">目前尚無相關的抽獎結果公告。</p>';
        notifyHeight();
        return;
      }

      list.sort((a, b) => (b.createdAt?.seconds || 0) - (a.createdAt?.seconds || 0));

      list.forEach(item => {
        let dateStr = '-';
        if (item.createdAt) {
          const dt = item.createdAt.seconds ? new Date(item.createdAt.seconds * 1000) : new Date(item.createdAt);
          dateStr = dt.toLocaleDateString('zh-TW');
        }

        const isPhotoSent = item.isPhotoSent === true || item.photoStatus === '已發圖';
        let photoBadgeHtml = isPhotoSent
          ? '<span class="status-badge photo-badge-sent">🔵 已發圖</span>'
          : '<span class="status-badge photo-badge-pending">📷 待發圖</span>';

        let photoDatesHtml = (isPhotoSent && item.photoSentAt)
          ? `<div class="photo-dates-box">📅 發圖日：${item.photoSentAt}<br>⏳ 刪除日：<b style="color:#f56c6c;">${item.photoExpireAt || '-'}</b></div>`
          : '';

        let winnersHtml = '';
        if (item.winners && item.winners.length > 0) {
          item.winners.forEach(w => {
            winnersHtml += `
              <div class="winner-card ${w.isSpecial ? 'special' : ''}">
                <div class="winner-card-top">
                  <span class="winner-name">🎁 ${w.name}</span>
                  ${w.isSpecial ? '<span class="special-badge">特別獎</span>' : ''}
                </div>
                <div class="winner-prize">獲得：${w.prize || '專屬獎項'}</div>
              </div>
            `;
          });
        } else {
          winnersHtml = '<p style="font-size:12px; color:#909399; margin:4px 0;">尚未公佈中獎名單</p>';
        }

        container.innerHTML += `
          <div class="lottery-card">
            <div class="lottery-top">
              <div>
                <div class="lottery-title">🎁 [${activeGroup}] ${item.title}</div>
                <div class="lottery-meta">
                  成員：<b>${item.member || '全體'}</b> ｜ 總籤數：<b>${item.participants?.length || 0}</b> 籤 ｜ 發佈日期：${dateStr}
                </div>
              </div>
              <div class="status-badges-container">
                ${photoBadgeHtml}
                ${photoDatesHtml}
              </div>
            </div>
            <div class="winner-grid">${winnersHtml}</div>
          </div>
        `;
      });

      notifyHeight();
    }

    function notifyHeight() {
      setTimeout(() => {
        const h = Math.max(document.body.scrollHeight, 400);
        window.parent.postMessage({ frameHeight: h }, '*');
      }, 100);
    }
  </script>
</body>
</html>
