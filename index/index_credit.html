<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>個人抵用金餘額查詢</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 0; margin: 0; background: transparent; color: #333; }
    .search-box { margin-bottom: 16px; }
    label { font-size: 14px; font-weight: bold; color: #303133; display: block; margin-bottom: 6px; }
    select { width: 100%; padding: 12px; border: 1px solid #dcdfe6; border-radius: 10px; font-size: 15px; box-sizing: border-box; background: #fff; }
    
    /* 新增：User 大標題區塊外層與標題樣式 */
    .user-group { background: #fff; border: 1px solid #e4e7ed; border-radius: 12px; padding: 16px; margin-bottom: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.02); }
    .user-header { font-size: 16px; font-weight: bold; color: #303133; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #409eff; padding-bottom: 8px; margin-bottom: 12px; }
    .user-total-badge { background: #f0f9eb; color: #67c23a; padding: 4px 10px; border-radius: 20px; font-size: 13px; }

    /* 保留原始卡片樣式 */
    .credit-card { background: #fafafa; border: 1px solid #ebeef5; border-radius: 8px; padding: 12px; margin-bottom: 10px; }
    .credit-card:last-child { margin-bottom: 0; }
    .credit-title { font-weight: bold; font-size: 14px; color: #409eff; margin-bottom: 6px; border-bottom: 1px dashed #ebeef5; padding-bottom: 4px; }
    .credit-row { display: flex; justify-content: space-between; font-size: 13px; color: #606266; margin-bottom: 4px; }
    .credit-balance { font-size: 14px; font-weight: bold; color: #67c23a; text-align: right; margin-top: 4px; }
  </style>
</head>
<body>

  <h3 style="margin-top:0; margin-bottom:15px; font-size:18px;">💳 個人抵用金餘額查詢</h3>
  
  <div class="search-box">
    <label>請選擇您的社群暱稱：</label>
    <select id="buyerFilter">
      <option value="">全體社群成員 (顯示全部)</option>
    </select>
  </div>

  <div id="creditsList">載入中...</div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDF7QySG1Jj4gdZvXwMRaKjRmI-lFKpj7k",
      authDomain: "forsure0922.firebaseapp.com",
      databaseURL: "https://forsure0922-default-rtdb.firebaseio.com",
      projectId: "forsure0922",
      storageBucket: "forsure0922.firebasestorage.app",
      messagingSenderId: "817449290174",
      appId: "1:817449290174:web:6b4ec1d36c171ff97011ef"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let allCredits = [];

    document.addEventListener('DOMContentLoaded', async () => {
      // 這裡修正抓取檔案名稱為 users.json
      const res = await fetch('../json/users.json');
      const buyers = await res.json();
      const sel = document.getElementById('buyerFilter');
      buyers.forEach(b => {
        sel.innerHTML += `<option value="${b}">${b}</option>`;
      });

      document.getElementById('buyerFilter').addEventListener('change', renderCredits);
    });

    // 修正為連動 user_credits 集合
    onSnapshot(collection(db, "user_credits"), snap => {
      allCredits = [];
      snap.forEach(d => {
        allCredits.push({ id: d.id, ...d.data() });
      });

      allCredits.sort((a, b) => (b.fullEvent || b.rawDate || '').localeCompare(a.fullEvent || a.rawDate || ''));
      renderCredits();
    });

    function renderCredits() {
      const selectedBuyer = document.getElementById('buyerFilter').value;
      const container = document.getElementById('creditsList');
      container.innerHTML = '';

      // 1. 篩選有剩餘金額且符合選單條件的紀錄
      const filtered = allCredits.filter(c => {
        const buyerName = c.user || c.buyerName || '未知';
        const creditAmt = Number(c.credit) || Number(c.amount) || 0;
        const usedAmt = Number(c.used) || 0;
        const remain = c.remaining !== undefined ? Number(c.remaining) : (creditAmt - usedAmt);

        const matchBuyer = !selectedBuyer || buyerName === selectedBuyer;
        return matchBuyer && remain > 0;
      });

      if (filtered.length === 0) {
        container.innerHTML = '<p style="color:#909399; font-size:14px; text-align:center; padding:20px 0;">目前無可用的抵用金餘額。</p>';
        notifyHeight();
        return;
      }

      // 2. 依 User 進行分組 (Group by User)
      const groupedByUser = {};
      filtered.forEach(c => {
        const userName = c.user || c.buyerName || '未知成員';
        if (!groupedByUser[userName]) {
          groupedByUser[userName] = [];
        }
        groupedByUser[userName].push(c);
      });

      // 3. 渲染：大標題 User -> 小卡片活動紀錄
      for (const [userName, items] of Object.entries(groupedByUser)) {
        let userTotalRemain = 0;
        let cardsHtml = '';

        items.forEach(c => {
          const total = Number(c.credit) || Number(c.amount) || 0;
          const used = Number(c.used) || 0;
          const remain = c.remaining !== undefined ? Number(c.remaining) : (total - used);
          userTotalRemain += remain;

          const eventName = c.fullEvent || c.eventName || '抵用金紀錄';
          const memberName = c.member ? ` (${c.member})` : '';

          cardsHtml += `
            <div class="credit-card">
              <div class="credit-title">📌 ${eventName}${memberName}</div>
              <div class="credit-row"><span>轉抵用金金額：</span><span>$${total}</span></div>
              <div class="credit-row"><span>已使用金額：</span><span>$${used}</span></div>
              <div class="credit-balance">💰 剩餘抵用金：$${remain}</div>
            </div>
          `;
        });

        container.innerHTML += `
          <div class="user-group">
            <div class="user-header">
              <span>👤 ${userName}</span>
              <span class="user-total-badge">總剩餘抵用金：<b>$${userTotalRemain}</b></span>
            </div>
            ${cardsHtml}
          </div>
        `;
      }

      notifyHeight();
    }

    function notifyHeight() {
      setTimeout(() => {
        window.parent.postMessage({ frameHeight: document.body.scrollHeight }, '*');
      }, 100);
    }
  </script>
</body>
</html>
