<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>個人抵用金餘額查詢</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 0; margin: 0; background: transparent; color: #333; }
    .search-box { margin-bottom: 16px; }
    label { font-size: 14px; font-weight: bold; color: #303133; display: block; margin-bottom: 6px; }
    select { width: 100%; padding: 12px; border: 1px solid #dcdfe6; border-radius: 10px; font-size: 15px; box-sizing: border-box; background: #fff; }
    
    .credit-card { background: #fff; border: 1px solid #e4e7ed; border-radius: 12px; padding: 14px; margin-bottom: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.02); }
    .credit-title { font-weight: bold; font-size: 15px; color: #303133; margin-bottom: 8px; border-bottom: 1px dashed #ebeef5; padding-bottom: 6px; }
    .credit-row { display: flex; justify-content: space-between; font-size: 13px; color: #606266; margin-bottom: 4px; }
    .credit-balance { font-size: 15px; font-weight: bold; color: #67c23a; text-align: right; margin-top: 6px; }
  </style>
</head>
<body>

  <h3 style="margin-top:0; margin-bottom:15px; font-size:18px;">💳 個人抵用金餘額查詢</h3>
  
  <div class="search-box">
    <label>請選擇您的社群暱稱：</label>
    <select id="buyerFilter">
      <option value="">全體社群成員 (顯示全部)</option>
    </select>
  </div>

  <div id="creditsList">載入中...</div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDF7QySG1Jj4gdZvXwMRaKjRmI-lFKpj7k",
      authDomain: "forsure0922.firebaseapp.com",
      databaseURL: "https://forsure0922-default-rtdb.firebaseio.com",
      projectId: "forsure0922",
      storageBucket: "forsure0922.firebasestorage.app",
      messagingSenderId: "817449290174",
      appId: "1:817449290174:web:6b4ec1d36c171ff97011ef"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let allCredits = [];

    document.addEventListener('DOMContentLoaded', async () => {
      const res = await fetch('../json/buyers.json');
      const buyers = await res.json();
      const sel = document.getElementById('buyerFilter');
      buyers.forEach(b => {
        sel.innerHTML += `<option value="${b}">${b}</option>`;
      });

      document.getElementById('buyerFilter').addEventListener('change', renderCredits);
    });

    onSnapshot(collection(db, "credits"), snap => {
      allCredits = [];
      snap.forEach(d => {
        allCredits.push({ id: d.id, ...d.data() });
      });

      allCredits.sort((a, b) => (b.eventDate || b.createdAt || '').localeCompare(a.eventDate || a.createdAt || ''));
      renderCredits();
    });

    function renderCredits() {
      const selectedBuyer = document.getElementById('buyerFilter').value;
      const container = document.getElementById('creditsList');
      container.innerHTML = '';

      const filtered = allCredits.filter(c => {
        const matchBuyer = !selectedBuyer || c.buyerName === selectedBuyer;
        const remaining = (c.amount || 0) - (c.used || 0);
        return matchBuyer && remaining > 0;
      });

      if (filtered.length === 0) {
        container.innerHTML = '<p style="color:#909399; font-size:14px; text-align:center; padding:20px 0;">目前無可用的抵用金餘額。</p>';
        notifyHeight();
        return;
      }

      filtered.forEach(c => {
        const total = c.amount || 0;
        const used = c.used || 0;
        const remain = total - used;

        container.innerHTML += `
          <div class="credit-card">
            <div class="credit-title">📌 ${c.eventName || '抵用金紀錄'} (${c.buyerName || '未知'})</div>
            <div class="credit-row"><span>轉抵用金金額：</span><span>$${total}</span></div>
            <div class="credit-row"><span>已使用金額：</span><span>$${used}</span></div>
            <div class="credit-balance">💰 剩餘抵用金：$${remain}</div>
          </div>
        `;
      });

      notifyHeight();
    }

    function notifyHeight() {
      setTimeout(() => {
        window.parent.postMessage({ frameHeight: document.body.scrollHeight }, '*');
      }, 100);
    }
  </script>
</body>
</html>
