<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>儲值金餘額查詢</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 0; margin: 0; background: transparent; color: #333; }
    
    .search-card { background: #fff; border: 1px solid #e4e7ed; border-radius: 12px; padding: 16px; margin-bottom: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.02); }
    .search-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .search-title { font-size: 15px; font-weight: bold; color: #303133; white-space: nowrap; }

    select { flex: 1; min-width: 200px; padding: 10px 12px; border: 1px solid #dcdfe6; border-radius: 8px; font-size: 14px; background: #fff; outline: none; }
    select:focus { border-color: #409eff; }

    .user-block { background: #fff; border: 1px solid #e4e7ed; border-radius: 12px; padding: 16px; margin-bottom: 16px; }
    .user-header { font-size: 16px; font-weight: bold; color: #303133; margin-bottom: 12px; padding-bottom: 8px; border-bottom: 1px solid #ebeef5; display: flex; justify-content: space-between; align-items: center; }

    .summary-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 14px; }
    @media (max-width: 600px) { .summary-grid { grid-template-columns: 1fr; } }

    .stat-box { background: #fafafa; border: 1px solid #ebeef5; border-radius: 8px; padding: 10px; text-align: center; }
    .stat-box.highlight { background: #f0f9eb; border-color: #e1f3d8; }
    .stat-label { font-size: 11px; color: #909399; font-weight: bold; margin-bottom: 4px; }
    .stat-val { font-size: 18px; font-weight: bold; color: #303133; }
    .stat-val.green { color: #67c23a; }
    .stat-val.blue { color: #409eff; }
    .stat-val.orange { color: #e6a23c; }

    .history-list { display: flex; flex-direction: column; gap: 6px; }
    .history-item { display: flex; justify-content: space-between; align-items: center; padding: 8px 12px; background: #fdfdfd; border: 1px solid #ebeef5; border-radius: 6px; font-size: 12px; }
    .history-item.deposit { border-left: 3px solid #67c23a; }
    .history-item.usage { border-left: 3px solid #f56c6c; }

    .item-left { display: flex; flex-direction: column; gap: 2px; }
    .item-note { font-weight: bold; color: #303133; }
    .item-date { font-size: 11px; color: #909399; }
    
    .item-amt { font-size: 14px; font-weight: bold; }
    .amt-plus { color: #67c23a; }
    .amt-minus { color: #f56c6c; }

    .empty-tip { text-align: center; color: #909399; padding: 30px 0; font-size: 14px; }
  </style>
</head>
<body>

  <h3 style="margin-top:0; margin-bottom:12px; font-size:18px;">💵 預存儲值金查詢</h3>

  <div class="search-card">
    <div class="search-row">
      <span class="search-title">👤 快速篩選社群名稱：</span>
      <select id="userSelect">
        <option value="ALL">顯示全部有儲值紀錄的買家</option>
      </select>
    </div>
  </div>

  <div id="recordsContainer">載入中...</div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDF7QySG1Jj4gdZvXwMRaKjRmI-lFKpj7k",
      authDomain: "forsure0922.firebaseapp.com",
      databaseURL: "https://forsure0922-default-rtdb.firebaseio.com",
      projectId: "forsure0922",
      storageBucket: "forsure0922.firebasestorage.app",
      messagingSenderId: "817449290174",
      appId: "1:817449290174:web:6b4ec1d36c171ff97011ef"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let allDeposits = [];
    let selectedUserFilter = 'ALL';

    document.addEventListener('DOMContentLoaded', () => {
      onSnapshot(collection(db, "user_deposits"), snap => {
        allDeposits = [];
        const activeUsersSet = new Set();

        snap.forEach(d => {
          const data = { id: d.id, ...d.data() };
          allDeposits.push(data);
          const uName = data.user || data.buyerName || data.name;
          if (uName) activeUsersSet.add(uName);
        });

        updateUserDropdown(Array.from(activeUsersSet));
        renderAllUserDeposits();
      });

      document.getElementById('userSelect').addEventListener('change', (e) => {
        selectedUserFilter = e.target.value;
        renderAllUserDeposits();
      });
    });

    function updateUserDropdown(usersList) {
      const sel = document.getElementById('userSelect');
      const cur = sel.value;
      sel.innerHTML = '<option value="ALL">顯示全部有儲值紀錄的買家</option>';

      usersList.sort((a, b) => a.localeCompare(b, 'zh-TW')).forEach(u => {
        sel.innerHTML += `<option value="${u}">${u}</option>`;
      });

      if (cur && (cur === 'ALL' || usersList.includes(cur))) sel.value = cur;
    }

    function renderAllUserDeposits() {
      const container = document.getElementById('recordsContainer');
      container.innerHTML = '';

      if (allDeposits.length === 0) {
        container.innerHTML = '<div class="search-card empty-tip">目前尚無任何預存儲值金紀錄</div>';
        notifyHeight();
        return;
      }

      // 依使用者分組
      const groups = {};
      allDeposits.forEach(d => {
        const uName = d.user || d.buyerName || d.name || '未知買家';
        if (selectedUserFilter !== 'ALL' && uName !== selectedUserFilter) return;
        
        if (!groups[uName]) groups[uName] = [];
        groups[uName].push(d);
      });

      const sortedUsers = Object.keys(groups).sort((a, b) => a.localeCompare(b, 'zh-TW'));

      if (sortedUsers.length === 0) {
        container.innerHTML = '<div class="search-card empty-tip">查無該買家的儲值紀錄</div>';
        notifyHeight();
        return;
      }

      sortedUsers.forEach(uName => {
        const records = groups[uName];
        let totalDep = 0;
        let totalU = 0;
        let historyItems = [];

        records.forEach(c => {
          const amt = Number(c.amount) || Number(c.credit) || 0;
          const isDeposit = (c.type !== 'usage');

          if (isDeposit) totalDep += amt;
          else totalU += amt;

          let dateStr = c.payDate || c.date || c.createdAt || '-';
          if (typeof dateStr === 'object' && dateStr.seconds) {
            dateStr = new Date(dateStr.seconds * 1000).toISOString().slice(0,10);
          } else if (typeof dateStr === 'string' && dateStr.length > 10) {
            dateStr = dateStr.slice(0, 10);
          }

          historyItems.push({
            type: isDeposit ? 'deposit' : 'usage',
            title: c.note || (isDeposit ? '預存儲值入帳' : '扣款/消費折抵'),
            date: dateStr,
            amount: amt
          });
        });

        const available = totalDep - totalU;
        historyItems.sort((a, b) => new Date(b.date).getTime() - new Date(a.date).getTime());

        let historyHtml = '';
        historyItems.forEach(item => {
          const isDep = item.type === 'deposit';
          historyHtml += `
            <div class="history-item ${isDep ? 'deposit' : 'usage'}">
              <div class="item-left">
                <span class="item-note">${isDep ? '➕' : '➖'} ${item.title}</span>
                <span class="item-date">⏱️ 日期：${item.date}</span>
              </div>
              <div class="item-amt ${isDep ? 'amt-plus' : 'amt-minus'}">
                ${isDep ? '+' : '-'}$${item.amount.toLocaleString()}
              </div>
            </div>
          `;
        });

        container.innerHTML += `
          <div class="user-block">
            <div class="user-header">
              <span>👤 ${uName}</span>
              <span style="font-size:12px; font-weight:normal; color:#909399;">共 ${historyItems.length} 筆紀錄</span>
            </div>
            
            <div class="summary-grid">
              <div class="stat-box highlight">
                <div class="stat-label">🟢 目前可用餘額</div>
                <div class="stat-val green">$${available.toLocaleString()}</div>
              </div>
              <div class="stat-box">
                <div class="stat-label">📥 累積儲值</div>
                <div class="stat-val blue">$${totalDep.toLocaleString()}</div>
              </div>
              <div class="stat-box">
                <div class="stat-label">📤 累積已扣款</div>
                <div class="stat-val orange">$${totalU.toLocaleString()}</div>
              </div>
            </div>

            <div class="history-list">${historyHtml}</div>
          </div>
        `;
      });

      notifyHeight();
    }

    function notifyHeight() {
      setTimeout(() => {
        const h = Math.max(document.body.scrollHeight, 500);
        window.parent.postMessage({ frameHeight: h }, '*');
      }, 150);
    }
  </script>
</body>
</html>
