<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>歷年活動餘圖與現貨圖包認領</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 0; margin: 0; background: transparent; color: #333; }
    
    .filter-card { background: #fff; border: 1px solid #e4e7ed; border-radius: 12px; padding: 14px; margin-bottom: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.02); display: flex; flex-direction: column; gap: 8px; }
    .filter-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .filter-label { font-size: 12px; font-weight: bold; color: #606266; min-width: 80px; }

    .capsule-group { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
    .capsule-filter-btn { background: #f4f4f5; color: #606266; border: 1px solid #dcdfe6; padding: 4px 12px; border-radius: 16px; font-size: 12px; font-weight: bold; cursor: pointer; transition: all 0.2s; outline: none; }
    .capsule-filter-btn:hover { background: #ecf5ff; color: #409eff; border-color: #c6e2ff; }
    .capsule-filter-btn.active { background: #409eff; color: #fff; border-color: #409eff; box-shadow: 0 2px 6px rgba(64,158,255,0.25); }
    .capsule-filter-btn.sub-active { background: #67c23a; color: #fff; border-color: #67c23a; box-shadow: 0 2px 6px rgba(103,194,58,0.25); }

    .section-divider { display: flex; align-items: center; justify-content: center; margin: 24px 0 16px 0; font-size: 13px; font-weight: bold; }
    .section-divider::before, .section-divider::after { content: ''; flex: 1; border-bottom: 1px dashed #dcdfe6; margin: 0 12px; }
    .divider-pending { color: #e6a23c; }
    .divider-pending::before, .divider-pending::after { border-bottom-color: #f5dab1; }
    .divider-soldout { color: #606266; }
    .divider-soldout::before, .divider-soldout::after { border-bottom-color: #dcdfe6; }

    .stock-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 16px; }

    .member-group-card { background: #fff; border: 1px solid #e4e7ed; border-radius: 12px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.02); display: flex; flex-direction: column; }
    .member-group-card.pending-card { border-color: #f5dab1; background: #fffdfa; }
    .member-group-card.sold-out-card { opacity: 0.6; filter: grayscale(0.85); background: #fafafa; }

    .member-group-header { background: #eef5fe; border-left: 4px solid #409eff; color: #1a252f; font-size: 15px; font-weight: bold; padding: 10px 14px; display: flex; align-items: center; gap: 6px; }
    .member-group-header.header-ateez { background: #f3e8ff; border-left: 4px solid #7e22ce; color: #581c87; }
    .pending-card .member-group-header { background: #fdf6ec; border-left-color: #e6a23c; color: #b88230; }
    .sold-out-card .member-group-header { background: #f4f4f5; border-left-color: #909399; color: #606266; }

    .events-list-box { padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; }
    .event-item-block { background: #f8f9fa; border: 1px solid #e4e7ed; border-radius: 8px; padding: 8px 12px; display: flex; flex-direction: column; gap: 4px; }
    .event-header-row { display: flex; justify-content: space-between; align-items: center; font-size: 13px; font-weight: bold; color: #303133; }
    .event-detail-row { display: flex; justify-content: space-between; align-items: center; font-size: 12px; color: #606266; }

    .stock-tag { display: inline-block; padding: 2px 8px; border-radius: 12px; font-size: 11px; font-weight: bold; white-space: nowrap; }
    .stock-tag-open { background: #e8f5e9; color: #2e7d32; }
    .stock-tag-pending { background: #fdf6ec; color: #e6a23c; border: 1px solid #faebd7; }
    .stock-tag-sold { background: #f4f4f5; color: #606266; border: 1px solid #dcdfe6; }
  </style>
</head>
<body>

  <h3 style="margin-top:0; margin-bottom:12px; font-size:18px;">🛍️ 歷年活動餘圖與現貨圖包認領</h3>

  <div class="filter-card">
    <div class="filter-row">
      <span class="filter-label">1. 團體：</span>
      <div id="groupCapsules" class="capsule-group"></div>
    </div>
    <div class="filter-row">
      <span class="filter-label">2. 檢視模式：</span>
      <div id="modeCapsules" class="capsule-group">
        <button class="capsule-filter-btn active" onclick="setModeFilter('member', this)">👥 依成員</button>
        <button class="capsule-filter-btn" onclick="setModeFilter('event', this)">🗓️ 依活動</button>
      </div>
    </div>
    <div class="filter-row">
      <span class="filter-label">3. 細項篩選：</span>
      <div id="detailCapsules" class="capsule-group"></div>
    </div>
  </div>

  <div id="stockDisplayArea">
    <!-- 1. 開放認領區塊 -->
    <div class="stock-grid" id="activeStockContainer">載入中...</div>

    <!-- 2. 交易中區塊 -->
    <div id="pendingDividerBlock" style="display:none;">
      <div class="section-divider divider-pending">🟡 交易中 (待對帳 / 釋出即開放)</div>
      <div class="stock-grid" id="pendingStockContainer"></div>
    </div>

    <!-- 3. 已售完區塊 -->
    <div id="soldOutDividerBlock" style="display:none;">
      <div class="section-divider divider-soldout">⚫ 已售完</div>
      <div class="stock-grid" id="soldOutStockContainer"></div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDF7QySG1Jj4gdZvXwMRaKjRmI-lFKpj7k",
      authDomain: "forsure0922.firebaseapp.com",
      databaseURL: "https://forsure0922-default-rtdb.firebaseio.com",
      projectId: "forsure0922",
      storageBucket: "forsure0922.firebasestorage.app",
      messagingSenderId: "817449290174",
      appId: "1:817449290174:web:6b4ec1d36c171ff97011ef"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const MEMBER_EMOJI_MAP = {
      '方燦': '🐺', 'Lee Know': '🐰', '彰彬': '🐷', '鉉辰': '🥟', 'HAN': '🐹', 'Felix': '🐥', '昇玟': '🐶', 'I.N': '🦊',
      '弘中': '🐿️', '星化': '🐰', '潤浩': '🐶', '呂尚': '🐥', '傘': '⛰️', '旼琦': '🐥', '友榮': '🐈‍⬛', '鍾浩': '🐻'
    };

    const GROUP_EMOJI_MAP = {
      'Stray Kids': '🧭 Stray Kids',
      'ATEEZ': '🏴‍☠️ ATEEZ'
    };

    let stockList = [];
    let ordersList = [];
    let groupList = [];
    let memberMap = {};

    let activeGroup = 'ALL';
    let activeMode = 'member';
    let activeDetail = 'ALL';

    document.addEventListener('DOMContentLoaded', async () => {
      try {
        const gRes = await fetch('../json/group.json');
        groupList = await gRes.json();

        for (const g of groupList) {
          const file = (g === 'Stray Kids') ? 'members_skz.json' : (g === 'ATEEZ' ? 'members_atz.json' : '');
          if (file) {
            const mRes = await fetch(`../json/${file}`);
            memberMap[g] = await mRes.json();
          }
        }
      } catch(e) {}

      renderGroupCapsules();
      updateDetailCapsules();

      onSnapshot(collection(db, "orders"), snap => {
        ordersList = [];
        snap.forEach(d => {
          const data = d.data();
          const isSurplus = (data.orderType === '餘圖認領' || (data.event || data.eventName || '').startsWith('【餘圖認領】'));
          if (isSurplus) {
            ordersList.push({ id: d.id, ...data });
          }
        });
        renderStockCards();
      });

      onSnapshot(collection(db, "stock_photos"), snap => {
        stockList = [];
        snap.forEach(d => {
          const data = d.data();
          if (data.status !== '暫停') {
            stockList.push({ id: d.id, ...data });
          }
        });
        updateDetailCapsules();
        renderStockCards();
      });
    });

    function extractDateScore(evName) {
      if (!evName) return 99999999;
      const match = evName.match(/\d{6}/);
      if (match) return parseInt(match[0], 10);
      return 99999999;
    }

    function renderGroupCapsules() {
      const container = document.getElementById('groupCapsules');
      container.innerHTML = '';

      const allBtn = document.createElement('button');
      allBtn.className = `capsule-filter-btn ${activeGroup === 'ALL' ? 'active' : ''}`;
      allBtn.textContent = '全部';
      allBtn.onclick = () => {
        activeGroup = 'ALL';
        document.querySelectorAll('#groupCapsules .capsule-filter-btn').forEach(b => b.classList.remove('active'));
        allBtn.classList.add('active');
        activeDetail = 'ALL';
        updateDetailCapsules();
        renderStockCards();
      };
      container.appendChild(allBtn);

      groupList.forEach(g => {
        const btn = document.createElement('button');
        btn.className = `capsule-filter-btn ${activeGroup === g ? 'active' : ''}`;
        btn.textContent = GROUP_EMOJI_MAP[g] || g;
        btn.onclick = () => {
          activeGroup = g;
          document.querySelectorAll('#groupCapsules .capsule-filter-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          activeDetail = 'ALL';
          updateDetailCapsules();
          renderStockCards();
        };
        container.appendChild(btn);
      });
    }

    window.setModeFilter = (mode, btn) => {
      activeMode = mode;
      document.querySelectorAll('#modeCapsules .capsule-filter-btn').forEach(b => b.classList.remove('active'));
      if (btn) btn.classList.add('active');
      activeDetail = 'ALL';
      updateDetailCapsules();
      renderStockCards();
    };

    function updateDetailCapsules() {
      const container = document.getElementById('detailCapsules');
      container.innerHTML = '';

      const allBtn = document.createElement('button');
      allBtn.className = `capsule-filter-btn ${activeDetail === 'ALL' ? 'sub-active' : ''}`;
      allBtn.textContent = '全部顯示';
      allBtn.onclick = () => {
        activeDetail = 'ALL';
        document.querySelectorAll('#detailCapsules .capsule-filter-btn').forEach(b => b.classList.remove('sub-active'));
        allBtn.classList.add('sub-active');
        renderStockCards();
      };
      container.appendChild(allBtn);

      let inStockList = stockList.filter(i => Number(i.stockQty || 0) > 0 && i.status !== '已售完');
      if (activeGroup !== 'ALL') inStockList = inStockList.filter(i => i.group === activeGroup);

      if (activeMode === 'member') {
        let membersInJson = [];
        if (activeGroup === 'ALL') {
          Object.values(memberMap).forEach(l => membersInJson.push(...l));
        } else {
          membersInJson = memberMap[activeGroup] || [];
        }

        const activeMembersWithStock = new Set(inStockList.map(i => i.member).filter(Boolean));
        membersInJson.forEach(m => {
          if (activeMembersWithStock.has(m)) {
            const btn = document.createElement('button');
            btn.className = `capsule-filter-btn ${activeDetail === m ? 'sub-active' : ''}`;
            btn.textContent = (MEMBER_EMOJI_MAP[m] ? `${MEMBER_EMOJI_MAP[m]} ` : '') + m;
            btn.onclick = () => {
              activeDetail = m;
              document.querySelectorAll('#detailCapsules .capsule-filter-btn').forEach(b => b.classList.remove('sub-active'));
              btn.classList.add('sub-active');
              renderStockCards();
            };
            container.appendChild(btn);
          }
        });
      } else if (activeMode === 'event') {
        const eventsSet = new Set();
        inStockList.forEach(i => { if (i.eventName) eventsSet.add(i.eventName); });
        Array.from(eventsSet).sort().forEach(ev => {
          const btn = document.createElement('button');
          btn.className = `capsule-filter-btn ${activeDetail === ev ? 'sub-active' : ''}`;
          btn.textContent = ev;
          btn.onclick = () => {
            activeDetail = ev;
            document.querySelectorAll('#detailCapsules .capsule-filter-btn').forEach(b => b.classList.remove('sub-active'));
            btn.classList.add('sub-active');
            renderStockCards();
          };
          container.appendChild(btn);
        });
      }
    }

    function formatSpec(spec) {
      if (!spec) return '現貨圖包';
      return spec.replace(/\/包$/g, '').trim();
    }

    function getItemStage(item) {
      const isQtyZero = (Number(item.stockQty || 0) <= 0 || item.status === '已售完');
      if (!isQtyZero) {
        return 'OPEN'; // 🟢 開放認領
      }

      // 檢查此商品是否有「未完成對帳」的訂單
      const evName = item.eventName || '';
      const memName = item.member || '';
      const grp = item.group || 'Stray Kids';

      const relatedOrders = ordersList.filter(o => {
        const ordGrp = o.group || 'Stray Kids';
        const ordMem = o.member || '';
        const ordEv = (o.event || o.eventName || '').replace('【餘圖認領】', '').trim();
        return (ordGrp === grp && ordMem === memName && ordEv === evName);
      });

      if (relatedOrders.length > 0) {
        const hasUnpaid = relatedOrders.some(o => {
          const st = o.paymentStatus || o.status || (o.hasPaid ? '已對帳' : '待匯款');
          return (st === '待匯款' || st === '待對帳' || st === '對帳中' || st === '有問題');
        });

        if (hasUnpaid) {
          return 'PENDING'; // 🟡 交易中
        }
      }

      return 'SOLDOUT'; // ⚫ 已售完
    }

    function renderStockCards() {
      const activeContainer = document.getElementById('activeStockContainer');
      const pendingContainer = document.getElementById('pendingStockContainer');
      const pendingBlock = document.getElementById('pendingDividerBlock');
      const soldOutContainer = document.getElementById('soldOutStockContainer');
      const soldOutBlock = document.getElementById('soldOutDividerBlock');

      activeContainer.innerHTML = '';
      pendingContainer.innerHTML = '';
      soldOutContainer.innerHTML = '';

      let list = stockList;
      if (activeGroup !== 'ALL') list = list.filter(i => i.group === activeGroup);
      if (activeDetail !== 'ALL') {
        if (activeMode === 'member') list = list.filter(i => i.member === activeDetail);
        else list = list.filter(i => i.eventName === activeDetail);
      }

      if (list.length === 0) {
        activeContainer.innerHTML = '<p style="color:#909399; font-size:14px; grid-column: 1 / -1;">目前尚無開放認領的餘圖庫存。</p>';
        pendingBlock.style.display = 'none';
        soldOutBlock.style.display = 'none';
        notifyHeight();
        return;
      }

      const activeMemberGroups = {};
      const pendingMemberGroups = {};
      const soldOutMemberGroups = {};

      list.forEach(item => {
        const stage = getItemStage(item);
        const grp = item.group || 'Stray Kids';
        const mem = item.member || '全體';
        const groupKey = `${grp}___${mem}`;

        if (stage === 'OPEN') {
          if (!activeMemberGroups[groupKey]) activeMemberGroups[groupKey] = [];
          activeMemberGroups[groupKey].push(item);
        } else if (stage === 'PENDING') {
          if (!pendingMemberGroups[groupKey]) pendingMemberGroups[groupKey] = [];
          pendingMemberGroups[groupKey].push(item);
        } else {
          if (!soldOutMemberGroups[groupKey]) soldOutMemberGroups[groupKey] = [];
          soldOutMemberGroups[groupKey].push(item);
        }
      });

      renderGroupedCards(activeMemberGroups, activeContainer, 'OPEN');

      if (Object.keys(pendingMemberGroups).length > 0) {
        pendingBlock.style.display = 'block';
        renderGroupedCards(pendingMemberGroups, pendingContainer, 'PENDING');
      } else {
        pendingBlock.style.display = 'none';
      }

      if (Object.keys(soldOutMemberGroups).length > 0) {
        soldOutBlock.style.display = 'block';
        renderGroupedCards(soldOutMemberGroups, soldOutContainer, 'SOLDOUT');
      } else {
        soldOutBlock.style.display = 'none';
      }

      notifyHeight();
    }

    function renderGroupedCards(groupsMap, targetContainer, sectionType) {
      const keys = Object.keys(groupsMap);
      if (keys.length === 0) {
        if (sectionType === 'OPEN') {
          targetContainer.innerHTML = '<p style="color:#909399; font-size:14px; grid-column: 1 / -1;">目前無進行中可認領的現貨餘圖。</p>';
        }
        return;
      }

      keys.sort((a, b) => {
        const [grpA, memA] = a.split('___');
        const [grpB, memB] = b.split('___');

        if (grpA !== grpB) {
          return grpA === 'Stray Kids' ? -1 : 1;
        }

        const mList = memberMap[grpA] || [];
        const idxA = mList.indexOf(memA);
        const idxB = mList.indexOf(memB);
        return (idxA === -1 ? 99 : idxA) - (idxB === -1 ? 99 : idxB);
      });

      keys.forEach(groupKey => {
        const items = groupsMap[groupKey];
        const [grpName, memName] = groupKey.split('___');
        const isAteez = (grpName === 'ATEEZ');

        items.sort((a, b) => {
          const dateA = extractDateScore(a.eventName || '');
          const dateB = extractDateScore(b.eventName || '');
          if (dateA !== dateB) return dateA - dateB;
          return (a.eventName || '').localeCompare(b.eventName || '', 'zh-TW');
        });

        let eventsHtml = '';
        items.forEach(item => {
          let tagClass = 'stock-tag stock-tag-open';
          let tagText = `🟢 剩餘 ${item.stockQty} 包`;

          if (sectionType === 'PENDING') {
            tagClass = 'stock-tag stock-tag-pending';
            tagText = '🟡 交易中';
          } else if (sectionType === 'SOLDOUT') {
            tagClass = 'stock-tag stock-tag-sold';
            tagText = '⚫ 已售完';
          }

          if (sectionType === 'SOLDOUT') {
            eventsHtml += `
              <div class="event-item-block">
                <div class="event-header-row">
                  <span>🗓️ ${item.eventName}</span>
                  <span class="${tagClass}">${tagText}</span>
                </div>
              </div>
            `;
          } else {
            eventsHtml += `
              <div class="event-item-block">
                <div class="event-header-row">
                  <span>🗓️ ${item.eventName}</span>
                  <span class="${tagClass}">${tagText}</span>
                </div>
                <div class="event-detail-row">
                  <span>• 內容：<b>${formatSpec(item.spec)}</b>${item.note ? ` (${item.note})` : ''}</span>
                  <span style="font-weight:bold; color:${sectionType === 'PENDING' ? '#e6a23c' : '#f56c6c'};">$${Number(item.price || 0).toLocaleString()} 元/包</span>
                </div>
              </div>
            `;
          }
        });

        const headerClass = isAteez ? 'member-group-header header-ateez' : 'member-group-header';
        let cardClass = 'member-group-card';
        if (sectionType === 'PENDING') cardClass += ' pending-card';
        else if (sectionType === 'SOLDOUT') cardClass += ' sold-out-card';

        const emoji = MEMBER_EMOJI_MAP[memName] || '👤';

        const card = document.createElement('div');
        card.className = cardClass;
        card.innerHTML = `
          <div class="${headerClass}">${emoji} [${grpName}] ${memName}</div>
          <div class="events-list-box">${eventsHtml}</div>
        `;
        targetContainer.appendChild(card);
      });
    }

    function notifyHeight() {
      setTimeout(() => {
        window.parent.postMessage({ frameHeight: document.body.scrollHeight }, '*');
      }, 100);
    }
  </script>
</body>
</html>
