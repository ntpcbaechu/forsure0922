<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>預存儲值申請與查詢</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 0; margin: 0; background: transparent; color: #333; }
    .form-card { background: #fff; border: 1px solid #e4e7ed; border-radius: 12px; padding: 18px; box-shadow: 0 2px 8px rgba(0,0,0,0.02); max-width: 650px; margin: 0 auto 20px auto; }
    .form-group { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
    label { font-size: 13px; font-weight: bold; color: #303133; }
    input, select, textarea { padding: 8px 10px; border: 1px solid #dcdfe6; border-radius: 6px; font-size: 13px; outline: none; box-sizing: border-box; }
    input:focus, select:focus, textarea:focus { border-color: #409eff; }
    button { padding: 10px; background-color: #409eff; color: white; border: none; font-weight: bold; cursor: pointer; border-radius: 6px; font-size: 14px; width: 100%; }
    button:disabled { background-color: #a0cfff; }

    .bank-info-box { background: #fffbe6; border: 1px solid #ffe58f; border-radius: 10px; padding: 12px; margin-bottom: 16px; font-size: 13px; color: #595959; line-height: 1.6; }
    .bank-info-title { font-weight: bold; color: #d46b08; font-size: 14px; margin-bottom: 6px; }
    .bank-warning { color: #f56c6c; font-weight: bold; margin-top: 6px; }
    .input-hint-box { font-size: 12px; color: #e6a23c; background: #fdf6ec; border: 1px solid #faebd7; border-radius: 6px; padding: 6px 10px; margin-top: 4px; line-height: 1.5; font-weight: bold; }

    .balance-card { background: #ecf5ff; border: 1px solid #d9ecff; border-radius: 8px; padding: 12px; margin-bottom: 14px; display: flex; justify-content: space-between; align-items: center; }
    .balance-val { font-size: 18px; font-weight: bold; color: #409eff; }
  </style>
</head>
<body>

  <div class="form-card">
    <h3 style="margin-top:0; margin-bottom:14px; font-size:18px; text-align:center;">💳 預存儲值申請</h3>

    <div class="bank-info-box" id="bankInfoCard">
      <div class="bank-info-title">🔸 儲值匯款帳號：</div>
      <div>載入帳號資料中...</div>
    </div>

    <form id="depositForm">
      <div class="form-group">
        <label>1. 選擇團體 *</label>
        <select id="groupSelect" required>
          <option value="">請選擇團體</option>
          <option value="Stray Kids">🧭 Stray Kids</option>
          <option value="ATEEZ">🏴‍☠️ ATEEZ</option>
        </select>
      </div>

      <div class="form-group">
        <label>2. 您的社群暱稱 *</label>
        <select id="buyerSelect" required disabled>
          <option value="">請先選擇團體</option>
        </select>
        <input type="text" id="customBuyerInput" placeholder="請輸入社群暱稱或帳號" style="display:none; margin-top:4px;">
      </div>

      <div id="balanceCard" class="balance-card" style="display:none;">
        <span>目前預存儲值金餘額：</span>
        <span id="currentBalance" class="balance-val">$0</span>
      </div>

      <div class="form-group">
        <label>3. 儲值金額 ($) *</label>
        <input type="number" id="depositAmount" min="1" placeholder="請輸入儲值金額" required>
      </div>

      <div class="form-group">
        <label>4. 匯款日期 *</label>
        <input type="date" id="payDate" required>
      </div>

      <div class="form-group">
        <label>5. 匯款到哪個帳戶 *</label>
        <select id="bankName" required>
          <option value="">請選擇匯款帳戶</option>
        </select>
      </div>

      <div class="form-group">
        <label>6. 匯款帳號末 5 碼 *</label>
        <input type="text" id="last5" placeholder="例如: 12345" required>
        <div class="input-hint-box">
          ⚠️ 使用台灣Pay等轉帳時，若不確定請填寫 ①卡號末5碼 + ②帳戶末5碼，或私訊提供截圖以利對帳
        </div>
      </div>

      <div class="form-group">
        <label>7. 備註說明 (選填)</label>
        <textarea id="note" rows="2" placeholder="如有其他說明請在此備註..."></textarea>
      </div>

      <button type="submit" id="submitDepositBtn">送出儲值申請</button>
    </form>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, doc, setDoc, addDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDF7QySG1Jj4gdZvXwMRaKjRmI-lFKpj7k",
      authDomain: "forsure0922.firebaseapp.com",
      databaseURL: "https://forsure0922-default-rtdb.firebaseio.com",
      projectId: "forsure0922",
      storageBucket: "forsure0922.firebasestorage.app",
      messagingSenderId: "817449290174",
      appId: "1:817449290174:web:6b4ec1d36c171ff97011ef"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let usersDatabase = [];
    let allDeposits = [];

    const groupSel = document.getElementById('groupSelect');
    const buyerSel = document.getElementById('buyerSelect');
    const customBuyerInput = document.getElementById('customBuyerInput');
    const balanceCard = document.getElementById('balanceCard');
    const currentBalance = document.getElementById('currentBalance');

    function loadBankInfo() {
      fetch('../json/bank_info.json')
        .then(res => res.json())
        .then(data => {
          const card = document.getElementById('bankInfoCard');
          let html = `<div class="bank-info-title">${data.title || '🔸 儲值匯款帳號：'}</div>`;
          if (data.accounts && Array.isArray(data.accounts)) {
            data.accounts.forEach(acc => { html += `<div>${acc}</div>`; });
          }
          if (data.note) { html += `<div class="bank-warning">${data.note}</div>`; }
          card.innerHTML = html;
          notifyHeight();
        })
        .catch(() => {});
    }

    function loadBankDropdown() {
      fetch('../json/banks.json')
        .then(res => res.json())
        .then(bankList => {
          const bankSel = document.getElementById('bankName');
          bankSel.innerHTML = '<option value="">請選擇匯款帳戶</option>';
          bankList.forEach(b => {
            bankSel.innerHTML += `<option value="${b}">${b}</option>`;
          });
          bankSel.innerHTML += `<option value="其他">其他</option>`;
        })
        .catch(() => {
          const bankSel = document.getElementById('bankName');
          bankSel.innerHTML = '<option value="">請選擇匯款帳戶</option><option value="其他">其他</option>';
        });
    }

    document.addEventListener('DOMContentLoaded', () => {
      loadBankInfo();
      loadBankDropdown();

      onSnapshot(collection(db, "users"), snap => {
        usersDatabase = [];
        snap.forEach(d => usersDatabase.push(d.data()));
        updateBuyersDropdown();
      });

      onSnapshot(collection(db, "user_deposits"), snap => {
        allDeposits = [];
        snap.forEach(d => allDeposits.push({ id: d.id, ...d.data() }));
        calcUserBalance();
      });

      groupSel.addEventListener('change', () => {
        updateBuyersDropdown();
        calcUserBalance();
      });

      buyerSel.addEventListener('change', () => {
        if (buyerSel.value === 'CUSTOM') {
          customBuyerInput.style.display = 'block';
          customBuyerInput.required = true;
        } else {
          customBuyerInput.style.display = 'none';
          customBuyerInput.required = false;
        }
        calcUserBalance();
      });

      customBuyerInput.addEventListener('input', calcUserBalance);
    });

    function updateBuyersDropdown() {
      const chosenGroup = groupSel.value;
      customBuyerInput.style.display = 'none';
      customBuyerInput.value = '';

      if (!chosenGroup) {
        buyerSel.innerHTML = '<option value="">請先選擇團體</option>';
        buyerSel.disabled = true;
        return;
      }

      buyerSel.disabled = false;
      const filtered = usersDatabase.filter(u => u.group === chosenGroup && u.name).map(u => u.name);
      const uniqueBuyers = Array.from(new Set(filtered)).sort((a,b)=>a.localeCompare(b,'zh-TW'));

      buyerSel.innerHTML = '<option value="">請選擇您的名稱</option>';
      uniqueBuyers.forEach(b => {
        buyerSel.innerHTML += `<option value="${b}">${b}</option>`;
      });
      buyerSel.innerHTML += '<option value="CUSTOM">➕ 其他 (手動輸入)...</option>';
    }

    function calcUserBalance() {
      let bName = buyerSel.value;
      if (bName === 'CUSTOM') bName = customBuyerInput.value.trim();

      if (!bName) {
        balanceCard.style.display = 'none';
        notifyHeight();
        return;
      }

      const userDeps = allDeposits.filter(d => (d.user === bName || d.buyerName === bName || d.name === bName));
      const total = userDeps.reduce((sum, d) => {
        const amt = Number(d.amount) || 0;
        return (d.type !== 'usage') ? (sum + amt) : (sum - amt);
      }, 0);

      currentBalance.textContent = `$${total.toLocaleString()}`;
      balanceCard.style.display = 'flex';
      notifyHeight();
    }

    document.getElementById('depositForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const submitBtn = document.getElementById('submitDepositBtn');
      submitBtn.disabled = true;
      submitBtn.textContent = '送出中...';

      const chosenGroup = groupSel.value;
      let chosenBuyer = buyerSel.value;
      if (chosenBuyer === 'CUSTOM') {
        chosenBuyer = customBuyerInput.value.trim();
        try {
          await setDoc(doc(db, "users", `${chosenGroup}_${chosenBuyer}`), {
            group: chosenGroup,
            name: chosenBuyer,
            type: "custom",
            updatedAt: new Date().toISOString()
          }, { merge: true });
        } catch(e) {}
      }

      const amount = Number(document.getElementById('depositAmount').value);
      const payDate = document.getElementById('payDate').value;
      const bankName = document.getElementById('bankName').value;
      const last5 = document.getElementById('last5').value.trim();
      const note = document.getElementById('note').value.trim();

      try {
        await addDoc(collection(db, "user_deposits"), {
          group: chosenGroup,
          user: chosenBuyer,
          buyerName: chosenBuyer,
          amount: amount,
          payDate: payDate,
          bank: bankName,
          last5: last5,
          type: 'deposit',
          note: note ? `買家自主儲值: ${note}` : '買家自主預存儲值',
          status: 'pending',
          createdAt: new Date().toISOString()
        });

        alert('🎉 預存儲值申請已送出，管理員對帳審核後將會為您入帳！');
        document.getElementById('depositForm').reset();
        customBuyerInput.style.display = 'none';
        balanceCard.style.display = 'none';
        updateBuyersDropdown();
      } catch(err) {
        alert('申請失敗: ' + err.message);
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = '送出儲值申請';
      }
    });

    function notifyHeight() {
      setTimeout(() => {
        window.parent.postMessage({ frameHeight: document.body.scrollHeight }, '*');
      }, 100);
    }
  </script>
</body>
</html>
