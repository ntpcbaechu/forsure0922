<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>帳戶儲值與退款申請</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 0; margin: 0; background: transparent; color: #333; }
    
    /* 上半部填單與申請區 */
    .app-card { background: #fff; border: 1px solid #e4e7ed; border-radius: 12px; padding: 16px 18px; margin-bottom: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.02); }
    .sub-tabs { display: flex; gap: 8px; margin-bottom: 14px; border-bottom: 1px solid #ebeef5; padding-bottom: 10px; }
    .sub-tab-btn { background: #f4f4f5; color: #606266; border: 1px solid #dcdfe6; padding: 6px 14px; border-radius: 16px; font-size: 13px; font-weight: bold; cursor: pointer; transition: all 0.2s; }
    .sub-tab-btn:hover, .sub-tab-btn.active { background: #409eff; color: #fff; border-color: #409eff; }

    .form-section { display: none; }
    .form-section.active { display: block; }
    
    .form-group { margin-bottom: 10px; }
    label { font-size: 12px; font-weight: bold; color: #303133; display: block; margin-bottom: 4px; }
    input, select, textarea { width: 100%; padding: 8px 10px; border: 1px solid #dcdfe6; border-radius: 8px; font-size: 13px; box-sizing: border-box; background: #fff; outline: none; font-family: inherit; }
    input:focus, select:focus, textarea:focus { border-color: #409eff; }
    textarea { height: 60px; resize: vertical; }

    .btn-submit { width: 100%; padding: 10px; background: #409eff; color: white; border: none; border-radius: 8px; font-size: 14px; font-weight: bold; cursor: pointer; margin-top: 6px; }
    .btn-submit:disabled { background: #a0cfff; }

    .balance-info-box { background: #f0f9eb; border: 1px solid #e1f3d8; border-radius: 8px; padding: 10px 12px; font-size: 13px; color: #67c23a; margin-bottom: 10px; font-weight: bold; display: flex; justify-content: space-between; align-items: center; }
    .warning-tip { color: #f56c6c; font-size: 12px; font-weight: bold; margin-top: 4px; display: none; line-height: 1.4; background: #fef0f0; border: 1px solid #fde2e2; padding: 6px 8px; border-radius: 6px; }

    /* 下半部原本的明細查詢與篩選區 */
    .search-card { background: #fff; border: 1px solid #e4e7ed; border-radius: 12px; padding: 14px; margin-bottom: 14px; box-shadow: 0 2px 8px rgba(0,0,0,0.02); }
    .search-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
    .search-title { font-size: 14px; font-weight: bold; color: #303133; white-space: nowrap; }

    .filter-tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
    .tab-btn { background: #f4f4f5; color: #606266; border: 1px solid #dcdfe6; padding: 5px 12px; border-radius: 16px; font-size: 12px; font-weight: bold; cursor: pointer; transition: all 0.2s; }
    .tab-btn:hover, .tab-btn.active { background: #409eff; color: #fff; border-color: #409eff; }

    .grid-container { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
    @media (max-width: 768px) { .grid-container { grid-template-columns: 1fr; } }

    .user-block { background: #fff; border: 1px solid #e4e7ed; border-radius: 10px; padding: 12px 14px; display: flex; flex-direction: column; justify-content: space-between; box-shadow: 0 2px 6px rgba(0,0,0,0.01); }
    .user-header { font-size: 14px; font-weight: bold; color: #303133; margin-bottom: 6px; padding-bottom: 6px; border-bottom: 1px solid #ebeef5; display: flex; justify-content: space-between; align-items: center; }

    .summary-bar { background: #f8f9fa; border: 1px solid #ebeef5; border-radius: 6px; padding: 6px 10px; margin-bottom: 8px; font-size: 11px; color: #606266; display: flex; justify-content: space-between; align-items: center; }
    .summary-bar b { color: #303133; }
    .summary-bar .green { color: #67c23a; font-size: 13px; font-weight: bold; }

    .history-list { display: flex; flex-direction: column; gap: 4px; max-height: 180px; overflow-y: auto; }
    .history-item { display: flex; justify-content: space-between; align-items: center; padding: 6px 10px; background: #fafafa; border: 1px solid #ebeef5; border-radius: 6px; font-size: 11px; }
    .history-item.deposit { border-left: 3px solid #67c23a; }
    .history-item.credit { border-left: 3px solid #409eff; }
    .history-item.usage { border-left: 3px solid #f56c6c; }

    .item-left { display: flex; flex-direction: column; gap: 1px; }
    .item-note { font-weight: bold; color: #303133; }
    .item-date { font-size: 10px; color: #909399; }
    
    .item-amt { font-size: 12px; font-weight: bold; }
    .amt-plus { color: #67c23a; }
    .amt-minus { color: #f56c6c; }

    .empty-tip { text-align: center; color: #909399; padding: 30px 0; font-size: 13px; background: #fff; border-radius: 10px; border: 1px solid #e4e7ed; }
  </style>
</head>
<body>

  <!-- 上半部：填單與退款申請區 -->
  <div class="app-card">
    <div style="font-size:16px; font-weight:bold; color:#303133; margin-bottom:10px;">💳 帳戶儲值與退款專區</div>
    
    <div class="sub-tabs">
      <button class="sub-tab-btn active" onclick="switchSubTab('deposit', this)">📥 預存儲值回報</button>
      <button class="sub-tab-btn" onclick="switchSubTab('refund', this)">📤 申請退款</button>
    </div>

    <!-- 1. 預存儲值表單 -->
    <form id="depositForm" class="form-section active">
      <div class="form-group">
        <label>社群名稱 *</label>
        <select id="depUser" required><option value="">載入中...</option></select>
      </div>
      <div style="display:grid; grid-template-columns: 1fr 1fr; gap:8px;">
        <div class="form-group">
          <label>匯款日期 *</label>
          <input type="date" id="depDate" required>
        </div>
        <div class="form-group">
          <label>匯款銀行 *</label>
          <select id="depBank" required>
            <option value="">請選擇銀行</option>
            <option value="台銀">台銀</option>
            <option value="樂天">樂天</option>
            <option value="中信">中信</option>
            <option value="其他">其他</option>
          </select>
        </div>
      </div>
      <div style="display:grid; grid-template-columns: 1fr 1fr; gap:8px;">
        <div class="form-group">
          <label>儲值金額 ($) *</label>
          <input type="number" id="depAmt" min="1" placeholder="例如: 3000" required>
        </div>
        <div class="form-group">
          <label>帳號後 5 碼 *</label>
          <input type="text" id="depLast5" maxlength="5" placeholder="例如: 12345" required>
        </div>
      </div>
      <div class="form-group">
        <label>備註說明</label>
        <input type="text" id="depNote" placeholder="如有特殊說明請在此註明...">
      </div>
      <button type="submit" class="btn-submit" id="depSubmitBtn">提交儲值申報 (等待對帳入帳)</button>
    </form>

    <!-- 2. 申請退款表單 -->
    <form id="refundForm" class="form-section">
      <div class="form-group">
        <label>社群名稱 *</label>
        <select id="refUser" required><option value="">請先選擇您的暱稱</option></select>
      </div>

      <div class="balance-info-box" id="refBalanceBox" style="display:none;">
        <span>目前帳戶可用餘額：</span>
        <b id="refBalanceNum" style="font-size:16px;">$0</b>
      </div>

      <div class="form-group">
        <label>退款金額 ($) *</label>
        <input type="number" id="refAmt" min="1" placeholder="請輸入退款金額" required>
        <div id="refWarning" class="warning-tip">⚠️ 提醒：您填寫的退款金額已超過目前可用餘額，送出後將由管理者手動核對審核！</div>
      </div>

      <div class="form-group">
        <label>退款原因 *</label>
        <select id="refReason" required>
          <option value="">請選擇退款原因</option>
          <option value="成團未滿退款">成團未滿退款</option>
          <option value="代拍少給圖/欠圖退款">代拍少給圖/欠圖退款</option>
          <option value="溢繳退款">溢繳退款</option>
          <option value="其他">其他</option>
        </select>
      </div>

      <div class="form-group">
        <label>退款銀行與帳號 (例: 中信 822-123456789) *</label>
        <input type="text" id="refBankAcc" placeholder="請填寫您的退款收款帳號" required>
      </div>

      <div class="form-group">
        <label>備註說明</label>
        <textarea id="refNote" placeholder="如有特殊需求請在此註明..."></textarea>
      </div>

      <button type="submit" class="btn-submit" style="background:#e6a23c;" id="refSubmitBtn">提交退款申請 (等待審核撥款)</button>
    </form>
  </div>

  <!-- 下半部：原本的明細查詢與篩選區 -->
  <div class="search-card">
    <div class="search-row">
      <span class="search-title">👤 快速篩選：</span>
      <select id="userSelect">
        <option value="ALL">顯示全部成員紀錄</option>
      </select>
    </div>
    <div class="filter-tabs">
      <button class="tab-btn active" onclick="setBalanceFilter('active', this)">🟢 尚有餘額</button>
      <button class="tab-btn" onclick="setBalanceFilter('zero', this)">📁 已用完/歸零</button>
      <button class="tab-btn" onclick="setBalanceFilter('all', this)">👤 顯示全部</button>
    </div>
  </div>

  <div id="recordsContainer" class="grid-container">載入中...</div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, addDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDF7QySG1Jj4gdZvXwMRaKjRmI-lFKpj7k",
      authDomain: "forsure0922.firebaseapp.com",
      databaseURL: "https://forsure0922-default-rtdb.firebaseio.com",
      projectId: "forsure0922",
      storageBucket: "forsure0922.firebasestorage.app",
      messagingSenderId: "817449290174",
      appId: "1:817449290174:web:6b4ec1d36c171ff97011ef"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let allDeposits = [];
    let allCredits = [];
    let userBalancesMap = {};
    let selectedUserFilter = 'ALL';
    let balanceTabFilter = 'active';

    window.switchSubTab = (tabName, btnElem) => {
      document.querySelectorAll('.sub-tab-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.form-section').forEach(s => s.classList.remove('active'));
      if (btnElem) btnElem.classList.add('active');
      document.getElementById(tabName === 'deposit' ? 'depositForm' : 'refundForm').classList.add('active');
      notifyHeight();
    };

    document.addEventListener('DOMContentLoaded', async () => {
      document.getElementById('depDate').value = new Date().toISOString().slice(0,10);

      try {
        const res = await fetch('../json/users.json');
        const users = await res.json();
        const depSel = document.getElementById('depUser');
        const refSel = document.getElementById('refUser');
        depSel.innerHTML = '<option value="">請選擇您的名稱</option>';
        refSel.innerHTML = '<option value="">請選擇您的名稱</option>';
        users.sort((a, b) => a.localeCompare(b, 'zh-TW')).forEach(u => {
          depSel.innerHTML += `<option value="${u}">${u}</option>`;
          refSel.innerHTML += `<option value="${u}">${u}</option>`;
        });
      } catch (e) {}

      // 監聽退款金額輸入，即時比對餘額跳紅字
      document.getElementById('refUser').addEventListener('change', updateRefundBalanceDisplay);
      document.getElementById('refAmt').addEventListener('input', checkRefundExceed);

      onSnapshot(collection(db, "user_deposits"), snap => {
        allDeposits = [];
        snap.forEach(d => allDeposits.push({ id: d.id, ...d.data() }));
        refreshDataView();
      });

      onSnapshot(collection(db, "user_credits"), snap => {
        allCredits = [];
        snap.forEach(d => allCredits.push({ id: d.id, ...d.data() }));
        refreshDataView();
      });

      document.getElementById('userSelect').addEventListener('change', (e) => {
        selectedUserFilter = e.target.value;
        renderAllUserDeposits();
      });
    });

    function getUserAvailableBalance(uName) {
      if (!uName) return 0;
      let plus = 0, used = 0;
      allDeposits.forEach(d => {
        if ((d.user || d.buyerName || d.name) === uName) {
          const amt = Number(d.amount) || 0;
          if (d.type !== 'usage') plus += amt;
          else used += amt;
        }
      });
      allCredits.forEach(c => {
        if ((c.user || c.buyerName || c.name) === uName) {
          plus += (Number(c.credit) || Number(c.amount) || 0);
          used += (Number(c.used) || 0);
        }
      });
      return Math.max(0, plus - used);
    }

    function updateRefundBalanceDisplay() {
      const uName = document.getElementById('refUser').value;
      const box = document.getElementById('refBalanceBox');
      const numElem = document.getElementById('refBalanceNum');
      if (!uName) {
        box.style.display = 'none';
        return;
      }
      const bal = getUserAvailableBalance(uName);
      numElem.textContent = `$${bal.toLocaleString()}`;
      box.style.display = 'flex';
      checkRefundExceed();
    }

    function checkRefundExceed() {
      const uName = document.getElementById('refUser').value;
      const amt = parseFloat(document.getElementById('refAmt').value) || 0;
      const warning = document.getElementById('refWarning');
      if (!uName) {
        warning.style.display = 'none';
        return;
      }
      const bal = getUserAvailableBalance(uName);
      if (amt > bal && amt > 0) {
        warning.textContent = `⚠️ 提醒：您填寫的退款金額 ($${amt}) 已超過目前可用餘額 ($${bal})，送出後將由管理者手動核對審核！`;
        warning.style.display = 'block';
      } else {
        warning.style.display = 'none';
      }
      notifyHeight();
    }

    // 1. 提交預存儲值表單
    document.getElementById('depositForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('depSubmitBtn');
      btn.disabled = true;
      btn.textContent = '提交中...';

      try {
        await addDoc(collection(db, "user_deposits"), {
          user: document.getElementById('depUser').value,
          buyerName: document.getElementById('depUser').value,
          payDate: document.getElementById('depDate').value,
          bank: document.getElementById('depBank').value,
          amount: parseFloat(document.getElementById('depAmt').value) || 0,
          last5: document.getElementById('depLast5').value.trim(),
          note: document.getElementById('depNote').value.trim(),
          type: 'deposit',
          status: '待對帳',
          createdAt: new Date().toISOString()
        });
        alert('✅ 儲值申報已送出，請等待管理者對帳入帳！');
        document.getElementById('depositForm').reset();
        document.getElementById('depDate').value = new Date().toISOString().slice(0,10);
      } catch (err) {
        alert('提交失敗: ' + err.message);
      } finally {
        btn.disabled = false;
        btn.textContent = '提交儲值申報 (等待對帳入帳)';
      }
    });

    // 2. 提交退款申請表單
    document.getElementById('refundForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('refSubmitBtn');
      btn.disabled = true;
      btn.textContent = '提交中...';

      try {
        await addDoc(collection(db, "refund_requests"), {
          user: document.getElementById('refUser').value,
          buyerName: document.getElementById('refUser').value,
          amount: parseFloat(document.getElementById('refAmt').value) || 0,
          reason: document.getElementById('refReason').value,
          bankAccount: document.getElementById('refBankAcc.value' || 'refBankAcc').value.trim(),
          note: document.getElementById('refNote').value.trim(),
          status: '待退款',
          createdAt: new Date().toISOString()
        });
        alert('✅ 退款申請已送出，管理者審核撥款後將自動扣抵帳戶餘額！');
        document.getElementById('refundForm').reset();
        document.getElementById('refBalanceBox').style.display = 'none';
        document.getElementById('refWarning').style.display = 'none';
      } catch (err) {
        alert('提交失敗: ' + err.message);
      } finally {
        btn.disabled = false;
        btn.textContent = '提交退款申請 (等待審核撥款)';
      }
    });

    window.setBalanceFilter = (filterType, btnElem) => {
      balanceTabFilter = filterType;
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      if (btnElem) btnElem.classList.add('active');
      renderAllUserDeposits();
    };

    function refreshDataView() {
      const activeUsersSet = new Set();
      allDeposits.forEach(d => {
        const u = d.user || d.buyerName || d.name;
        if (u) activeUsersSet.add(u);
      });
      allCredits.forEach(c => {
        const u = c.user || c.buyerName || c.name;
        if (u) activeUsersSet.add(u);
      });
      updateUserDropdown(Array.from(activeUsersSet));
      renderAllUserDeposits();
    }

    function updateUserDropdown(usersList) {
      const sel = document.getElementById('userSelect');
      const cur = sel.value;
      sel.innerHTML = '<option value="ALL">顯示全部成員紀錄</option>';
      usersList.sort((a, b) => a.localeCompare(b, 'zh-TW')).forEach(u => {
        sel.innerHTML += `<option value="${u}">${u}</option>`;
      });
      if (cur && (cur === 'ALL' || usersList.includes(cur))) sel.value = cur;
    }

    function renderAllUserDeposits() {
      const container = document.getElementById('recordsContainer');
      container.innerHTML = '';

      if (allDeposits.length === 0 && allCredits.length === 0) {
        container.innerHTML = '<div class="empty-tip" style="grid-column: span 2;">目前尚無任何抵用金或儲值金紀錄</div>';
        notifyHeight();
        return;
      }

      const groups = {};
      allDeposits.forEach(d => {
        const uName = d.user || d.buyerName || d.name || '未知買家';
        if (!groups[uName]) groups[uName] = [];
        const amt = Number(d.amount) || Number(d.credit) || 0;
        const isDeposit = (d.type !== 'usage');
        let dateStr = d.payDate || d.date || d.createdAt || '-';
        if (typeof dateStr === 'object' && dateStr.seconds) {
          dateStr = new Date(dateStr.seconds * 1000).toISOString().slice(0,10);
        } else if (typeof dateStr === 'string' && dateStr.length > 10) {
          dateStr = dateStr.slice(0, 10);
        }
        groups[uName].push({
          type: isDeposit ? 'deposit' : 'usage',
          title: d.note || (isDeposit ? '預存儲值入帳' : '扣款/消費折抵'),
          date: dateStr,
          amount: amt
        });
      });

      allCredits.forEach(c => {
        const uName = c.user || c.buyerName || c.name || '未知買家';
        if (!groups[uName]) groups[uName] = [];
        const total = Number(c.credit) || Number(c.amount) || 0;
        const used = Number(c.used) || 0;
        const evName = c.fullEvent || c.eventName || '活動轉抵用金';
        const memName = c.member ? ` (${c.member})` : '';
        let dateStr = c.rawDate || c.date || c.createdAt || '-';
        if (typeof dateStr === 'object' && dateStr.seconds) {
          dateStr = new Date(dateStr.seconds * 1000).toISOString().slice(0,10);
        } else if (typeof dateStr === 'string' && dateStr.length > 10) {
          dateStr = dateStr.slice(0, 10);
        }
        if (total > 0) {
          groups[uName].push({ type: 'credit', title: `[抵用金] ${evName}${memName}`, date: dateStr, amount: total });
        }
        if (used > 0) {
          groups[uName].push({ type: 'usage', title: `[抵用金折抵] ${evName}${memName}`, date: dateStr, amount: used });
        }
      });

      const sortedUsers = Object.keys(groups).sort((a, b) => a.localeCompare(b, 'zh-TW'));
      let renderCount = 0;

      sortedUsers.forEach(uName => {
        if (selectedUserFilter !== 'ALL' && uName !== selectedUserFilter) return;

        const historyItems = groups[uName];
        let totalPlus = 0, totalUsed = 0;
        historyItems.forEach(item => {
          if (item.type === 'deposit' || item.type === 'credit') totalPlus += item.amount;
          else totalUsed += item.amount;
        });

        const available = totalPlus - totalUsed;
        if (balanceTabFilter === 'active' && available <= 0) return;
        if (balanceTabFilter === 'zero' && available > 0) return;

        renderCount++;
        historyItems.sort((a, b) => new Date(b.date).getTime() - new Date(a.date).getTime());

        let historyHtml = '';
        historyItems.forEach(item => {
          const isPlus = (item.type === 'deposit' || item.type === 'credit');
          historyHtml += `
            <div class="history-item ${item.type}">
              <div class="item-left">
                <span class="item-note">${isPlus ? '➕' : '➖'} ${item.title}</span>
                <span class="item-date">⏱️ ${item.date}</span>
              </div>
              <div class="item-amt ${isPlus ? 'amt-plus' : 'amt-minus'}">
                ${isPlus ? '+' : '-'}$${item.amount.toLocaleString()}
              </div>
            </div>
          `;
        });

        container.innerHTML += `
          <div class="user-block">
            <div>
              <div class="user-header">
                <span>👤 ${uName}</span>
                <span style="font-size:11px; font-weight:normal; color:#909399;">${historyItems.length} 筆</span>
              </div>
              <div class="summary-bar">
                <span>可用: <b class="green">$${available.toLocaleString()}</b></span>
                <span>入帳: <b>$${totalPlus.toLocaleString()}</b></span>
                <span>已用: <b style="color:#e6a23c;">$${totalUsed.toLocaleString()}</b></span>
              </div>
            </div>
            <div class="history-list">${historyHtml}</div>
          </div>
        `;
      });

      if (renderCount === 0) {
        container.innerHTML = '<div class="empty-tip" style="grid-column: span 2;">目前此分類無符合的成員紀錄</div>';
      }

      notifyHeight();
    }

    function notifyHeight() {
      setTimeout(() => {
        const h = Math.max(document.body.scrollHeight, 600);
        window.parent.postMessage({ frameHeight: h }, '*');
      }, 150);
    }
  </script>
</body>
</html>
