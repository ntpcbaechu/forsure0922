<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>儲值 / 退款 / 抵用金確認</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 0; margin: 0; background: transparent; color: #333; }
    
    .app-card { background: #fff; border: 1px solid #e4e7ed; border-radius: 12px; padding: 16px 18px; margin-bottom: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.02); }
    .sub-tabs { display: flex; gap: 8px; margin-bottom: 14px; border-bottom: 1px solid #ebeef5; padding-bottom: 10px; }
    .sub-tab-btn { background: #f4f4f5; color: #606266; border: 1px solid #dcdfe6; padding: 6px 14px; border-radius: 16px; font-size: 13px; font-weight: bold; cursor: pointer; transition: all 0.2s; }
    .sub-tab-btn:hover, .sub-tab-btn.active { background: #409eff; color: #fff; border-color: #409eff; }

    .form-section { display: none; }
    .form-section.active { display: block; }
    
    .form-group { margin-bottom: 0; }
    label { font-size: 12px; font-weight: bold; color: #303133; display: block; margin-bottom: 4px; }
    input, select, textarea { width: 100%; padding: 8px 10px; border: 1px solid #dcdfe6; border-radius: 8px; font-size: 13px; box-sizing: border-box; background: #fff; outline: none; font-family: inherit; }
    input:focus, select:focus, textarea:focus { border-color: #409eff; }

    .btn-submit { width: 100%; padding: 9px; background: #409eff; color: white; border: none; border-radius: 8px; font-size: 13px; font-weight: bold; cursor: pointer; height: 37px; }
    .btn-submit:disabled { background: #a0cfff; }

    .form-grid-2rows { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px 12px; align-items: end; }
    @media (max-width: 900px) { .form-grid-2rows { grid-template-columns: repeat(2, 1fr); } }
    @media (max-width: 600px) { .form-grid-2rows { grid-template-columns: 1fr; } }

    .bank-account-tip { background: #fffbe6; border: 1px solid #ffe58f; color: #d46b08; font-size: 12px; padding: 8px 12px; border-radius: 8px; margin-top: 10px; font-weight: bold; display: none; line-height: 1.5; }

    .warning-tip { color: #f56c6c; font-size: 12px; font-weight: bold; margin-top: 4px; display: none; line-height: 1.4; background: #fef0f0; border: 1px solid #fde2e2; padding: 6px 8px; border-radius: 6px; }
    .legal-warning { background: #fdf6ec; border: 1px solid #faebd7; color: #e6a23c; font-size: 11px; padding: 8px 10px; border-radius: 6px; margin-bottom: 10px; line-height: 1.4; font-weight: bold; }

    .search-card { background: #fff; border: 1px solid #e4e7ed; border-radius: 12px; padding: 12px 14px; margin-bottom: 14px; box-shadow: 0 2px 8px rgba(0,0,0,0.02); display: flex; flex-direction: column; gap: 10px; }
    .search-inline-bar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .search-title { font-size: 13px; font-weight: bold; color: #303133; white-space: nowrap; }

    .capsule-filters { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
    .capsule-btn { background: #f4f4f5; color: #606266; border: 1px solid #dcdfe6; padding: 4px 12px; border-radius: 16px; font-size: 12px; font-weight: bold; cursor: pointer; transition: all 0.2s; outline: none; }
    .capsule-btn:hover { background: #ecf5ff; color: #409eff; border-color: #c6e2ff; }
    .capsule-btn.active { background: #409eff; color: #fff; border-color: #409eff; box-shadow: 0 2px 6px rgba(64,158,255,0.25); }
    .capsule-btn.gray-style { background: #f8f9fa; color: #909399; border-color: #dcdfe6; }
    .capsule-btn.gray-style.active { background: #909399 !important; color: #fff !important; border-color: #909399 !important; }

    .grid-container { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
    @media (max-width: 1024px) { .grid-container { grid-template-columns: repeat(2, 1fr); } }
    @media (max-width: 650px) { .grid-container { grid-template-columns: 1fr; } }

    .user-block { background: #fff; border: 1px solid #e4e7ed; border-radius: 10px; padding: 12px 14px; display: flex; flex-direction: column; box-shadow: 0 2px 6px rgba(0,0,0,0.01); gap: 8px; }
    .user-header { font-size: 14px; font-weight: bold; color: #303133; margin-bottom: 4px; padding-bottom: 6px; border-bottom: 1px solid #ebeef5; display: flex; justify-content: space-between; align-items: center; }

    .section-block { border-radius: 8px; padding: 8px 10px; font-size: 11px; display: flex; flex-direction: column; gap: 4px; }
    .block-credit { background: #f0f9eb; border: 1px solid #e1f3d8; }
    .block-deposit { background: #f8f9fa; border: 1px solid #e4e7ed; }
    .block-refund { background: #f8f9fa; border: 1px solid #e4e7ed; }
    .block-title { font-weight: bold; font-size: 11px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 2px; }
    
    .item-group-row { background: #fff; padding: 6px 8px; border-radius: 6px; border: 1px solid rgba(0,0,0,0.04); margin-bottom: 4px; }
    .item-group-header { display: flex; justify-content: space-between; align-items: center; font-weight: bold; }
    .item-sub-list { margin-top: 4px; padding-left: 18px; color: #606266; font-size: 10px; line-height: 1.5; border-top: 1px dashed #f0f2f5; padding-top: 4px; }
    
    .empty-tip { text-align: center; color: #909399; padding: 30px 0; font-size: 13px; background: #fff; border-radius: 10px; border: 1px solid #e4e7ed; }
  </style>
</head>
<body>

  <div class="app-card">
    <div style="font-size:16px; font-weight:bold; color:#303133; margin-bottom:10px;">💳 儲值 / 退款 / 抵用金確認專區</div>
    
    <div class="sub-tabs">
      <button class="sub-tab-btn active" onclick="switchSubTab('deposit', this)">📥 儲值金額</button>
      <button class="sub-tab-btn" onclick="switchSubTab('refund', this)">📤 申請退款</button>
    </div>

    <form id="depositForm" class="form-section active">
      <div class="form-grid-2rows">
        <div class="form-group">
          <label>社群名稱 *</label>
          <select id="depUser" required><option value="">請選擇</option></select>
        </div>
        <div class="form-group">
          <label>儲值原因 *</label>
          <input type="text" id="depReason" placeholder="請輸入儲值原因" required>
        </div>
        <div class="form-group">
          <label>匯款日期 *</label>
          <input type="date" id="depDate" required>
        </div>
        <div class="form-group">
          <label>匯款銀行 *</label>
          <select id="depBank" required>
            <option value="">請選擇銀行</option>
            <option value="台銀">台銀 (004)</option>
            <option value="樂天">樂天 (826)</option>
            <option value="中信">中信 (822)</option>
            <option value="其他">其他</option>
          </select>
        </div>

        <div class="form-group">
          <label>儲值金額 ($) *</label>
          <input type="number" id="depAmt" min="1" placeholder="" required>
        </div>
        <div class="form-group">
          <label>帳號後 5 碼 *</label>
          <input type="text" id="depLast5" maxlength="5" placeholder="" required>
        </div>
        <div class="form-group">
          <label>備註</label>
          <input type="text" id="depNote" placeholder="">
        </div>
        <div>
          <button type="submit" class="btn-submit" id="depSubmitBtn">提交儲值申報</button>
        </div>
      </div>

      <div id="bankAccountDisplay" class="bank-account-tip"></div>
    </form>

    <form id="refundForm" class="form-section">
      <div class="form-grid-2rows">
        <div class="form-group">
          <label>社群名稱 *</label>
          <select id="refUser" required><option value="">請選擇</option></select>
        </div>
        <div class="form-group">
          <label>退款原因 *</label>
          <input type="text" id="refReason" placeholder="請輸入退款原因" required>
        </div>
        <div class="form-group">
          <label>匯款銀行 / 代號 *</label>
          <input type="text" id="refBank" placeholder="例: 中信 822" required>
        </div>
        <div class="form-group">
          <label>退款帳號 *</label>
          <input type="text" id="refAccount" placeholder="完整帳號" required>
        </div>

        <div class="form-group">
          <label>退款金額 ($) *</label>
          <input type="number" id="refAmt" min="1" placeholder="" required>
        </div>
        <div class="form-group">
          <label>備註</label>
          <input type="text" id="refNote" placeholder="">
        </div>
        <div style="grid-column: span 2;">
          <button type="submit" class="btn-submit" style="background:#e6a23c;" id="refSubmitBtn">提交退款申請</button>
        </div>
      </div>

      <div id="refWarning" class="warning-tip" style="margin-top:8px;">⚠️ 提醒：填寫的退款金額已超過可用餘額，送出後將由管理者手動審核！</div>
      <div class="legal-warning" style="margin-top:8px;">
        ⚠️ 警語：請務必確認退款帳號資料正確，若因填寫錯誤導致匯款失敗，後續恕不負責協助處理。
      </div>
    </form>
  </div>

  <div class="search-card">
    <div class="search-inline-bar">
      <span class="search-title">👤 餘額狀態：</span>
      <div class="capsule-filters" id="balanceCapsulesContainer">
        <button class="capsule-btn active" onclick="setBalanceFilter('active', this)">🟢 尚有餘額</button>
        <button class="capsule-btn gray-style" onclick="setBalanceFilter('zero', this)">📁 已用完/歸零</button>
        <button class="capsule-btn" onclick="setBalanceFilter('all', this)">👤 顯示全部</button>
      </div>
    </div>
    <div class="search-inline-bar" style="border-top:1px dashed #ebeef5; padding-top:8px;">
      <span class="search-title">🏷️ 成員篩選：</span>
      <div id="userCapsulesContainer" class="capsule-filters">
        <button class="capsule-btn active" onclick="setUserFilter('ALL', this)">全部成員</button>
      </div>
    </div>
  </div>

  <div id="recordsContainer" class="grid-container">載入中...</div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, addDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDF7QySG1Jj4gdZvXwMRaKjRmI-lFKpj7k",
      authDomain: "forsure0922.firebaseapp.com",
      databaseURL: "https://forsure0922-default-rtdb.firebaseio.com",
      projectId: "forsure0922",
      storageBucket: "forsure0922.firebasestorage.app",
      messagingSenderId: "817449290174",
      appId: "1:817449290174:web:6b4ec1d36c171ff97011ef"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let allDeposits = [];
    let allCredits = [];
    let allRefundRequests = [];
    let allPayments = [];
    let allOrders = {};
    let bankAccountsData = {};

    let balanceTabFilter = 'active';
    let selectedUserFilter = 'ALL';

    window.switchSubTab = (tabName, btnElem) => {
      document.querySelectorAll('.sub-tab-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.form-section').forEach(s => s.classList.remove('active'));
      if (btnElem) btnElem.classList.add('active');
      document.getElementById(tabName === 'deposit' ? 'depositForm' : 'refundForm').classList.add('active');
      notifyHeight();
    };

    document.addEventListener('DOMContentLoaded', async () => {
      try {
        const res = await fetch('../json/users.json');
        const users = await res.json();
        const depSel = document.getElementById('depUser');
        const refSel = document.getElementById('refUser');
        depSel.innerHTML = '<option value="">請選擇您的名稱</option>';
        refSel.innerHTML = '<option value="">請選擇您的名稱</option>';
        users.sort((a, b) => a.localeCompare(b, 'zh-TW')).forEach(u => {
          depSel.innerHTML += `<option value="${u}">${u}</option>`;
          refSel.innerHTML += `<option value="${u}">${u}</option>`;
        });
      } catch (e) {}

      fetch('../json/bank_info.json').then(r => r.json()).then(data => {
        bankAccountsData = data;
      }).catch(() => {});

      document.getElementById('depBank').addEventListener('change', (e) => {
        const val = e.target.value;
        const display = document.getElementById('bankAccountDisplay');
        if (!val || val === '其他' || !bankAccountsData.accounts) {
          display.style.display = 'none';
          notifyHeight();
          return;
        }

        let matched = '';
        if (val === '台銀') matched = bankAccountsData.accounts.find(a => a.includes('台銀'));
        else if (val === '樂天') matched = bankAccountsData.accounts.find(a => a.includes('樂天'));
        else if (val === '中信') matched = bankAccountsData.accounts.find(a => a.includes('中信'));

        if (matched) {
          display.innerHTML = `🏦 轉帳收款帳號資訊：<br><b>${matched}</b>`;
          display.style.display = 'block';
        } else {
          display.style.display = 'none';
        }
        notifyHeight();
      });

      document.getElementById('refUser').addEventListener('change', checkRefundExceed);
      document.getElementById('refAmt').addEventListener('input', checkRefundExceed);

      onSnapshot(collection(db, "orders"), snap => {
        allOrders = {};
        snap.forEach(d => { allOrders[d.id] = d.data(); });
        refreshData();
      });

      onSnapshot(collection(db, "payments"), snap => {
        allPayments = [];
        snap.forEach(d => { allPayments.push({ id: d.id, ...d.data() }); });
        refreshData();
      });

      onSnapshot(collection(db, "user_deposits"), snap => {
        allDeposits = [];
        snap.forEach(d => allDeposits.push({ id: d.id, ...d.data() }));
        refreshData();
      });

      onSnapshot(collection(db, "user_credits"), snap => {
        allCredits = [];
        snap.forEach(d => allCredits.push({ id: d.id, ...d.data() }));
        refreshData();
      });

      onSnapshot(collection(db, "refund_requests"), snap => {
        allRefundRequests = [];
        snap.forEach(d => allRefundRequests.push({ id: d.id, ...d.data() }));
        refreshData();
      });
    });

    function refreshData() {
      updateUserCapsules();
      renderAllUserCards();
    }

    function updateUserCapsules() {
      const container = document.getElementById('userCapsulesContainer');
      const allUsersSet = new Set();
      allDeposits.forEach(d => allUsersSet.add(d.user || d.buyerName));
      allCredits.forEach(c => allUsersSet.add(c.user || c.buyerName));
      allRefundRequests.forEach(r => allUsersSet.add(r.user || r.buyerName));

      let html = `<button class="capsule-btn ${selectedUserFilter === 'ALL' ? 'active' : ''}" onclick="setUserFilter('ALL', this)">全部成員</button>`;
      Array.from(allUsersSet).sort((a,b)=>a.localeCompare(b,'zh-TW')).forEach(uName => {
        html += `<button class="capsule-btn ${selectedUserFilter === uName ? 'active' : ''}" onclick="setUserFilter('${uName}', this)">${uName}</button>`;
      });
      container.innerHTML = html;
    }

    window.setBalanceFilter = (filterType, btnElem) => {
      balanceTabFilter = filterType;
      document.querySelectorAll('#balanceCapsulesContainer .capsule-btn').forEach(b => b.classList.remove('active'));
      if (btnElem) btnElem.classList.add('active');
      renderAllUserCards();
    };

    window.setUserFilter = (uName, btnElem) => {
      selectedUserFilter = uName;
      document.querySelectorAll('#userCapsulesContainer .capsule-btn').forEach(b => b.classList.remove('active'));
      if (btnElem) btnElem.classList.add('active');
      renderAllUserCards();
    };

    function getUserAvailableBalance(uName) {
      if (!uName) return 0;
      let plus = 0, used = 0;
      allDeposits.forEach(d => {
        if ((d.user || d.buyerName || d.name) === uName && d.status !== '待對帳') {
          const amt = Number(d.amount) || 0;
          if (d.type !== 'usage') plus += amt;
          else used += amt;
        }
      });
      allCredits.forEach(c => {
        if ((c.user || c.buyerName || c.name) === uName) {
          plus += (Number(c.credit) || Number(c.amount) || 0);
          used += (Number(c.used) || 0);
        }
      });
      return Math.max(0, plus - used);
    }

    function checkRefundExceed() {
      const uName = document.getElementById('refUser').value;
      const amt = parseFloat(document.getElementById('refAmt').value) || 0;
      const warning = document.getElementById('refWarning');
      if (!uName) { warning.style.display = 'none'; return; }
      const bal = getUserAvailableBalance(uName);
      if (amt > bal && amt > 0) {
        warning.textContent = `⚠️ 提醒：您填寫的退款金額 ($${amt}) 已超過目前可用餘額 ($${bal})，送出後將由管理者手動核對審核！`;
        warning.style.display = 'block';
      } else {
        warning.style.display = 'none';
      }
      notifyHeight();
    }

    document.getElementById('depositForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('depSubmitBtn');
      btn.disabled = true;
      btn.textContent = '提交中...';

      const reason = document.getElementById('depReason').value.trim();
      const noteInput = document.getElementById('depNote').value.trim();
      const combinedNote = reason ? `${reason}${noteInput ? ' (' + noteInput + ')' : ''}` : noteInput;

      try {
        await addDoc(collection(db, "user_deposits"), {
          user: document.getElementById('depUser').value,
          buyerName: document.getElementById('depUser').value,
          payDate: document.getElementById('depDate').value,
          bank: document.getElementById('depBank').value,
          amount: parseFloat(document.getElementById('depAmt').value) || 0,
          last5: document.getElementById('depLast5').value.trim(),
          note: combinedNote,
          type: 'deposit',
          status: '待對帳',
          createdAt: new Date().toISOString()
        });
        alert('✅ 儲值申報已送出，已顯示在下方待對帳區塊！');
        document.getElementById('depositForm').reset();
        document.getElementById('bankAccountDisplay').style.display = 'none';
      } catch (err) {
        alert('失敗: ' + err.message);
      } finally {
        btn.disabled = false;
        btn.textContent = '提交儲值申報';
      }
    });

    document.getElementById('refundForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('refSubmitBtn');
      btn.disabled = true;
      btn.textContent = '提交中...';

      try {
        await addDoc(collection(db, "refund_requests"), {
          user: document.getElementById('refUser').value,
          buyerName: document.getElementById('refUser').value,
          amount: parseFloat(document.getElementById('refAmt').value) || 0,
          reason: document.getElementById('refReason').value.trim(),
          bank: document.getElementById('refBank').value.trim(),
          account: document.getElementById('refAccount').value.trim(),
          bankAccount: `${document.getElementById('refBank').value.trim()} (${document.getElementById('refAccount').value.trim()})`,
          note: document.getElementById('refNote').value.trim(),
          status: '待退款',
          createdAt: new Date().toISOString()
        });
        alert('✅ 退款申請已送出，已顯示在下方待審核區塊！');
        document.getElementById('refundForm').reset();
        document.getElementById('refWarning').style.display = 'none';
      } catch (err) {
        alert('失敗: ' + err.message);
      } finally {
        btn.disabled = false;
        btn.textContent = '提交退款申請';
      }
    });

    function renderAllUserCards() {
      const container = document.getElementById('recordsContainer');
      container.innerHTML = '';

      const allUsersSet = new Set();
      allDeposits.forEach(d => allUsersSet.add(d.user || d.buyerName));
      allCredits.forEach(c => allUsersSet.add(c.user || c.buyerName));
      allRefundRequests.forEach(r => allUsersSet.add(r.user || r.buyerName));

      if (allUsersSet.size === 0) {
        container.innerHTML = '<div class="empty-tip" style="grid-column: span 3;">目前尚無任何紀錄</div>';
        notifyHeight();
        return;
      }

      const sortedUsers = Array.from(allUsersSet).sort((a, b) => a.localeCompare(b, 'zh-TW'));
      let renderCount = 0;

      sortedUsers.forEach(uName => {
        if (selectedUserFilter !== 'ALL' && uName !== selectedUserFilter) return;

        let plus = 0, used = 0;
        let depositItems = allDeposits.filter(d => (d.user || d.buyerName) === uName);
        let creditItems = allCredits.filter(c => (c.user || c.buyerName) === uName);
        let refundItems = allRefundRequests.filter(r => (r.user || r.buyerName) === uName);

        depositItems.forEach(d => {
          const amt = Number(d.amount) || 0;
          if (d.status !== '待對帳') {
            if (d.type !== 'usage') plus += amt;
            else used += amt;
          }
        });
        creditItems.forEach(c => {
          plus += (Number(c.credit) || Number(c.amount) || 0);
          used += (Number(c.used) || 0);
        });

        const available = Math.max(0, plus - used);

        if (balanceTabFilter === 'active' && available <= 0) return;
        if (balanceTabFilter === 'zero' && available > 0) return;

        renderCount++;

        let creditHtml = '';

        creditItems.forEach(c => {
          const crAmt = Number(c.credit) || Number(c.amount) || 0;
          const uAmt = Number(c.used) || 0;
          let dateStr = c.createdAt ? new Date(c.createdAt).toLocaleDateString('zh-TW', {month:'2-digit', day:'2-digit'}) : '';
          
          if (crAmt > 0) {
            creditHtml += `<div class="item-group-row"><div class="item-group-header"><span>➕ ${dateStr ? dateStr + ' ' : ''}${c.fullEvent || c.eventName || '活動轉入'}</span><b style="color:#67c23a;">+$${crAmt.toLocaleString()}</b></div></div>`;
          }
          if (uAmt > 0) {
            creditHtml += `<div class="item-group-row"><div class="item-group-header"><span>➖ ${dateStr ? dateStr + ' ' : ''}抵用金折抵</span><b style="color:#f56c6c;">-$${uAmt.toLocaleString()}</b></div></div>`;
          }
        });

        depositItems.filter(d => d.status !== '待對帳').forEach(d => {
          const isPlus = (d.type !== 'usage');
          let dateStr = '';
          if (d.payDate) {
            const parts = d.payDate.split('-');
            if (parts.length === 3) dateStr = `${parts[1]}/${parts[2]}`;
          } else if (d.createdAt) {
            dateStr = new Date(d.createdAt).toLocaleDateString('zh-TW', {month:'2-digit', day:'2-digit'});
          }

          if (isPlus) {
            creditHtml += `
              <div class="item-group-row">
                <div class="item-group-header">
                  <span>➕ ${dateStr ? dateStr + ' ' : ''}${d.note || '預存儲值入帳'}</span>
                  <b style="color:#67c23a;">+$${Number(d.amount).toLocaleString()}</b>
                </div>
              </div>`;
          } else {
            const matchedPay = allPayments.find(p => (p.user === uName || p.buyerName === uName) && p.depositUsed > 0);
            let orderDetailsHtml = '';
            let orderCount = 0;

            if (matchedPay && matchedPay.relatedOrderIds && matchedPay.relatedOrderIds.length > 0) {
              orderCount = matchedPay.relatedOrderIds.length;
              let listLines = [];
              matchedPay.relatedOrderIds.forEach(oId => {
                const o = allOrders[oId];
                if (o) listLines.push(`• ${o.event || o.eventName} (${o.member} / ${o.qty || o.quantity}張)`);
              });
              if (listLines.length > 0) {
                orderDetailsHtml = `<div class="item-sub-list">${listLines.join('<br>')}</div>`;
              }
            }

            const headerTitle = orderCount > 0 ? `➖ ${dateStr ? dateStr + ' ' : ''}訂單扣抵 (共 ${orderCount} 筆)` : `➖ ${dateStr ? dateStr + ' ' : ''}${d.note || '扣款折抵'}`;

            creditHtml += `
              <div class="item-group-row">
                <div class="item-group-header">
                  <span>${headerTitle}</span>
                  <b style="color:#f56c6c;">-$${Number(d.amount).toLocaleString()}</b>
                </div>
                ${orderDetailsHtml}
              </div>`;
          }
        });

        if (!creditHtml) creditHtml = '<div style="color:#909399; font-size:11px; padding:2px;">目前無已結算明細</div>';

        let depPendingHtml = '';
        const pendingDeposits = depositItems.filter(d => d.status === '待對帳');
        if (pendingDeposits.length > 0) {
          pendingDeposits.forEach(d => {
            depPendingHtml += `<div class="item-group-row"><div class="item-group-header"><span>📥 儲值 $${Number(d.amount).toLocaleString()} (${d.bank} / 後5碼:${d.last5})</span><b style="color:#e6a23c;">⏳ 待確認對帳中</b></div></div>`;
          });
        }

        let refPendingHtml = '';
        const pendingRefunds = refundItems.filter(r => r.status === '待退款');
        if (pendingRefunds.length > 0) {
          pendingRefunds.forEach(r => {
            refPendingHtml += `<div class="item-group-row"><div class="item-group-header"><span>📤 退款 $${Number(r.amount).toLocaleString()} (${r.reason})</span><b style="color:#f56c6c;">⏳ 待退款審核中</b></div></div>`;
          });
        }

        container.innerHTML += `
          <div class="user-block">
            <div class="user-header">
              <span>👤 ${uName}</span>
              <span style="font-size:14px; font-weight:bold; color:#303133;">可用餘額: <b style="color:#67c23a;">$${available.toLocaleString()}</b></span>
            </div>

            <div class="section-block block-credit">
              <div class="block-title" style="color:#67c23a;"><span>➕ 抵用金與消費明細</span></div>
              ${creditHtml}
            </div>

            ${pendingDeposits.length > 0 ? `
            <div class="section-block block-deposit">
              <div class="block-title" style="color:#606266;"><span>＋ 預存儲值申報確認</span></div>
              ${depPendingHtml}
            </div>` : ''}

            ${pendingRefunds.length > 0 ? `
            <div class="section-block block-refund">
              <div class="block-title" style="color:#606266;"><span>－ 退款申請確認</span></div>
              ${refPendingHtml}
            </div>` : ''}
          </div>
        `;
      });

      if (renderCount === 0) {
        container.innerHTML = '<div class="empty-tip" style="grid-column: span 3;">目前此分類無符合的成員紀錄</div>';
      }

      notifyHeight();
    }

    function notifyHeight() {
      setTimeout(() => {
        const h = Math.max(document.body.scrollHeight, 600);
        window.parent.postMessage({ frameHeight: h }, '*');
      }, 150);
    }
  </script>
</body>
</html>
