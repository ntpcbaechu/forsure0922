<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>目前開團與飯拍發放進度</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 0; margin: 0; background: transparent; color: #333; }
    
    #progressList {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
    }

    .event-group-card { background: #fff; border: 1px solid #e4e7ed; border-radius: 12px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.02); display: flex; flex-direction: column; }
    
    .event-group-header {
      background: #eef5fe;
      border-left: 4px solid #409eff;
      color: #1a252f;
      font-size: 15px;
      font-weight: bold;
      padding: 10px 14px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .progress-list-box { padding: 10px 14px; display: flex; flex-direction: column; gap: 12px; }
    
    .member-block { display: flex; flex-direction: column; gap: 4px; border-bottom: 1px dashed #f0f2f5; padding-bottom: 8px; }
    .member-block:last-child { border-bottom: none; padding-bottom: 0; }

    .member-header-row { display: flex; justify-content: space-between; align-items: center; font-size: 14px; font-weight: bold; color: #303133; }
    
    .seller-row { display: flex; justify-content: space-between; align-items: center; font-size: 13px; color: #606266; padding-left: 18px; margin-top: 2px; }
    .buyer-row { display: flex; justify-content: space-between; align-items: center; font-size: 12px; color: #606266; padding-left: 36px; margin-top: 2px; }

    .status-badge { padding: 3px 10px; border-radius: 20px; font-size: 11px; font-weight: bold; white-space: nowrap; }
    .status-waiting { background: #f4f4f5; color: #909399; }
    .status-sorting { background: #fdf6ec; color: #e6a23c; }
    .status-done { background: #f0f9eb; color: #67c23a; }

    @media (max-width: 768px) {
      #progressList { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <h3 style="margin-top:0; margin-bottom:15px; font-size:18px;">目前開團與飯拍發放進度</h3>
  <div id="progressList">載入中...</div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDF7QySG1Jj4gdZvXwMRaKjRmI-lFKpj7k",
      authDomain: "forsure0922.firebaseapp.com",
      databaseURL: "https://forsure0922-default-rtdb.firebaseio.com",
      projectId: "forsure0922",
      storageBucket: "forsure0922.firebasestorage.app",
      messagingSenderId: "817449290174",
      appId: "1:817449290174:web:6b4ec1d36c171ff97011ef"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let memberOrderList = ["方燦", "Lee Know", "彰彬", "鉉辰", "HAN", "Felix", "昇玟", "I.N"];
    fetch('../json/members.json').then(r => r.json()).then(arr => { memberOrderList = arr; }).catch(() => {});

    let rawProgress = [];
    let ordersCache = {};
    let paymentsCache = {};

    onSnapshot(collection(db, "orders"), snap => {
      ordersCache = {};
      snap.forEach(d => { ordersCache[d.id] = d.data(); });
      renderView();
    });

    onSnapshot(collection(db, "payments"), snap => {
      paymentsCache = {};
      snap.forEach(d => { paymentsCache[d.id] = d.data(); });
      renderView();
    });

    onSnapshot(collection(db, "photo_progress"), snap => {
      rawProgress = [];
      snap.forEach(d => rawProgress.push({ id: d.id, ...d.data() }));
      renderView();
    });

    function renderView() {
      const container = document.getElementById('progressList');
      container.innerHTML = '';

      if (rawProgress.length === 0) {
        container.innerHTML = '<p style="color:#909399; font-size:14px;">目前尚無開團進度公告。</p>';
        notifyHeight();
        return;
      }

      const eventGroups = {};
      rawProgress.forEach(item => {
        const eTitle = item.eventName || item.event || '未命名活動';
        if (!eventGroups[eTitle]) eventGroups[eTitle] = [];
        eventGroups[eTitle].push(item);
      });

      const sortedEventNames = Object.keys(eventGroups).sort((a, b) => {
        const matchA = a.match(/\d{6}/); const matchB = b.match(/\d{6}/);
        const dateA = matchA ? parseInt(matchA[0], 10) : 0;
        const dateB = matchB ? parseInt(matchB[0], 10) : 0;
        if (dateA !== dateB) return dateA - dateB;
        return a.localeCompare(b, 'zh-TW');
      });

      let htmlContent = '';

      sortedEventNames.forEach(eventName => {
        const items = eventGroups[eventName];

        items.sort((a, b) => {
          const mA = a.member || '';
          const mB = b.member || '';
          let idxA = memberOrderList.indexOf(mA);
          let idxB = memberOrderList.indexOf(mB);
          if (idxA === -1) idxA = 99;
          if (idxB === -1) idxB = 99;
          return idxA - idxB;
        });

        const memberMap = {};
        items.forEach(item => {
          const m = item.member || '全體';
          if (!memberMap[m]) memberMap[m] = [];
          memberMap[m].push(item);
        });

        let membersHtml = '';

        Object.keys(memberMap).forEach(mName => {
          const mItems = memberMap[mName];
          
          const matchedBuyers = new Set();
          Object.values(ordersCache).forEach(ord => {
            const ev = ord.event || ord.eventName || '';
            const mem = ord.member || '';
            if (ev === eventName && mem === mName) {
              const bName = ord.buyerName || ord.user || ord.nickname;
              if (bName) matchedBuyers.add(bName);
            }
          });

          let buyersHtml = '';
          Array.from(matchedBuyers).sort().forEach(bName => {
            let isSent = false;
            Object.values(paymentsCache).forEach(p => {
              const pUser = p.user || p.buyerName;
              if (pUser === bName && (p.isPhotoSent === true || p.status === 'photo_sent')) {
                const rels = p.relatedOrderIds || [];
                const hasThisEv = rels.some(rId => {
                  const oObj = ordersCache[rId];
                  return oObj && (oObj.event || oObj.eventName) === eventName;
                });
                if (hasThisEv || rels.length === 0) isSent = true;
              }
            });

            const badgeText = isSent ? '🔵 已發圖' : '📷 待發圖';
            const badgeClass = isSent ? 'status-done' : 'status-waiting';
            buyersHtml += `
              <div class="buyer-row">
                <span>- ${bName}</span>
                <span class="status-badge ${badgeClass}">${badgeText}</span>
              </div>
            `;
          });

          if (mItems.length === 1) {
            let badgeClass = 'status-waiting';
            const st = mItems[0].status || '等圖中';
            if (['分圖中', '整理中', '上傳中'].includes(st)) badgeClass = 'status-sorting';
            if (['已完工', '已發圖', '已結束', '已預約'].includes(st)) badgeClass = 'status-done';

            membersHtml += `
              <div class="member-block">
                <div class="member-header-row">
                  <span>👤 ${mName}</span>
                  <span class="status-badge ${badgeClass}">${st}</span>
                </div>
                ${buyersHtml}
              </div>
            `;
          } else {
            let sellersHtml = '';
            mItems.forEach((it, sIdx) => {
              let badgeClass = 'status-waiting';
              const st = it.status || '等圖中';
              if (['分圖中', '整理中', '上傳中'].includes(st)) badgeClass = 'status-sorting';
              if (['已完工', '已發圖', '已結束', '已預約'].includes(st)) badgeClass = 'status-done';
              
              // 強制匿名化保護隱私：無論後台叫什麼名字，一律顯示為「代拍1」、「代拍2」
              const sellerLabel = `• 代拍${sIdx + 1}`;

              sellersHtml += `
                <div class="seller-row">
                  <span>${sellerLabel}</span>
                  <span class="status-badge ${badgeClass}">${st}</span>
                </div>
              `;
            });

            membersHtml += `
              <div class="member-block">
                <div class="member-header-row">
                  <span>👤 ${mName}</span>
                </div>
                ${sellersHtml}
                ${buyersHtml}
              </div>
            `;
          }
        });

        htmlContent += `
          <div class="event-group-card">
            <div class="event-group-header">📅 ${eventName}</div>
            <div class="progress-list-box">
              ${membersHtml}
            </div>
          </div>
        `;
      });

      container.innerHTML = htmlContent;
      notifyHeight();
    }

    function notifyHeight() {
      setTimeout(() => {
        window.parent.postMessage({ frameHeight: document.body.scrollHeight }, '*');
      }, 100);
    }
  </script>
</body>
</html>
