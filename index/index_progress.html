<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>目前開團與飯拍發放進度</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 0; margin: 0; background: transparent; color: #333; }
    .event-card { background: #fff; border: 1px solid #e4e7ed; border-radius: 12px; padding: 16px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 8px rgba(0,0,0,0.03); }
    .event-title { font-weight: bold; font-size: 16px; color: #303133; margin-bottom: 4px; }
    .event-sub { font-size: 13px; color: #909399; }
    .status-badge { padding: 6px 12px; border-radius: 20px; font-size: 12px; font-weight: bold; white-space: nowrap; }
    .status-waiting { background: #f4f4f5; color: #909399; }
    .status-sorting { background: #fdf6ec; color: #e6a23c; }
    .status-done { background: #f0f9eb; color: #67c23a; }
  </style>
</head>
<body>

  <h3 style="margin-top:0; margin-bottom:15px; font-size:18px;">目前開團與飯拍發放進度</h3>
  <div id="progressList">載入中...</div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDF7QySG1Jj4gdZvXwMRaKjRmI-lFKpj7k",
      authDomain: "forsure0922.firebaseapp.com",
      databaseURL: "https://forsure0922-default-rtdb.firebaseio.com",
      projectId: "forsure0922",
      storageBucket: "forsure0922.firebasestorage.app",
      messagingSenderId: "817449290174",
      appId: "1:817449290174:web:6b4ec1d36c171ff97011ef"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    onSnapshot(collection(db, "event_progress"), snap => {
      const container = document.getElementById('progressList');
      container.innerHTML = '';

      if (snap.empty) {
        container.innerHTML = '<p style="color:#909399; font-size:14px;">目前尚無開團進度公告。</p>';
        notifyHeight();
        return;
      }

      let list = [];
      snap.forEach(d => list.push({ id: d.id, ...d.data() }));
      list.sort((a, b) => (b.date || '').localeCompare(a.date || ''));

      list.forEach(item => {
        let badgeClass = 'status-waiting';
        if (item.status === '分圖中') badgeClass = 'status-sorting';
        if (item.status === '已發圖' || item.status === '發圖完成') badgeClass = 'status-done';

        container.innerHTML += `
          <div class="event-card">
            <div>
              <div class="event-title">${item.eventName || item.name || '未命名活動'}</div>
              <div class="event-sub">成員：${item.member || '全體'} ${item.seller ? '(' + item.seller + ')' : ''}</div>
            </div>
            <div class="status-badge ${badgeClass}">${item.status || '等圖中'}</div>
          </div>
        `;
      });

      notifyHeight();
    });

    function notifyHeight() {
      setTimeout(() => {
        window.parent.postMessage({ frameHeight: document.body.scrollHeight }, '*');
      }, 100);
    }
  </script>
</body>
</html>
