<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>目前開團與飯拍發放進度</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 0; margin: 0; background: transparent; color: #333; }
    
    .event-group-card { background: #fff; border: 1px solid #e4e7ed; border-radius: 12px; padding: 14px 16px; margin-bottom: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.02); }
    .event-group-title { font-size: 15px; font-weight: bold; color: #303133; margin-bottom: 10px; padding-bottom: 6px; border-bottom: 1px dashed #ebeef5; display: flex; align-items: center; gap: 6px; }

    .progress-row { display: flex; justify-content: space-between; align-items: center; padding: 8px 6px; border-bottom: 1px solid #f2f6fc; }
    .progress-row:last-child { border-bottom: none; }
    
    .member-info { font-size: 13px; color: #606266; display: flex; align-items: center; gap: 6px; }
    .member-name { font-weight: bold; color: #303133; }
    .seller-tag { font-size: 11px; color: #909399; background: #f4f4f5; padding: 1px 6px; border-radius: 4px; }

    .status-badge { padding: 4px 10px; border-radius: 20px; font-size: 12px; font-weight: bold; white-space: nowrap; }
    .status-waiting { background: #f4f4f5; color: #909399; }
    .status-sorting { background: #fdf6ec; color: #e6a23c; }
    .status-done { background: #f0f9eb; color: #67c23a; }
  </style>
</head>
<body>

  <h3 style="margin-top:0; margin-bottom:15px; font-size:18px;">目前開團與飯拍發放進度</h3>
  <div id="progressList">載入中...</div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDF7QySG1Jj4gdZvXwMRaKjRmI-lFKpj7k",
      authDomain: "forsure0922.firebaseapp.com",
      databaseURL: "https://forsure0922-default-rtdb.firebaseio.com",
      projectId: "forsure0922",
      storageBucket: "forsure0922.firebasestorage.app",
      messagingSenderId: "817449290174",
      appId: "1:817449290174:web:6b4ec1d36c171ff97011ef"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let memberOrderList = ["方燦", "Lee Know", "彰彬", "鉉辰", "HAN", "Felix", "昇玟", "I.N"];

    // 嘗試讀取官方成員順序設定
    fetch('../json/members.json').then(r => r.json()).then(arr => { memberOrderList = arr; }).catch(() => {});

    onSnapshot(collection(db, "photo_progress"), snap => {
      const container = document.getElementById('progressList');
      container.innerHTML = '';

      if (snap.empty) {
        container.innerHTML = '<p style="color:#909399; font-size:14px;">目前尚無開團進度公告。</p>';
        notifyHeight();
        return;
      }

      let rawList = [];
      snap.forEach(d => rawList.push({ id: d.id, ...d.data() }));

      // 群組化：以活動名稱 (eventName) 分類
      const eventGroups = {};
      rawList.forEach(item => {
        const eTitle = item.eventName || item.event || '未命名活動';
        if (!eventGroups[eTitle]) eventGroups[eTitle] = [];
        eventGroups[eTitle].push(item);
      });

      // 排序活動場次（依照日期先後名稱排序）
      const sortedEventNames = Object.keys(eventGroups).sort((a, b) => {
        const matchA = a.match(/\d{6}/); const matchB = b.match(/\d{6}/);
        const dateA = matchA ? parseInt(matchA[0], 10) : 0;
        const dateB = matchB ? parseInt(matchB[0], 10) : 0;
        if (dateA !== dateB) return dateA - dateB;
        return a.localeCompare(b, 'zh-TW');
      });

      let htmlContent = '';

      sortedEventNames.forEach(eventName => {
        const items = eventGroups[eventName];

        // 內部成員排序：依照 official members.json 順序
        items.sort((a, b) => {
          const mA = a.member || '';
          const mB = b.member || '';
          let idxA = memberOrderList.indexOf(mA);
          let idxB = memberOrderList.indexOf(mB);
          if (idxA === -1) idxA = 99;
          if (idxB === -1) idxB = 99;
          if (idxA !== idxB) return idxA - idxB;
          return (a.seller || '').localeCompare(b.seller || '');
        });

        let rowsHtml = '';
        const isMultipleSellers = items.length > 1;

        items.forEach((item, idx) => {
          let badgeClass = 'status-waiting';
          const st = item.status || '等圖中';
          if (['分圖中', '整理中', '上傳中'].includes(st)) badgeClass = 'status-sorting';
          if (['已完工', '已發圖', '已結束'].includes(st)) badgeClass = 'status-done';

          const sellerText = item.seller ? `<span class="seller-tag">${item.seller}</span>` : '';
          const memberName = item.member || '全體';

          rowsHtml += `
            <div class="progress-row">
              <div class="member-info">
                <span class="member-name">👤 ${memberName}</span>
                ${sellerText}
              </div>
              <div class="status-badge ${badgeClass}">${st}</div>
            </div>
          `;
        });

        htmlContent += `
          <div class="event-group-card">
            <div class="event-group-title">📅 ${eventName}</div>
            ${rowsHtml}
          </div>
        `;
      });

      container.innerHTML = htmlContent;
      notifyHeight();
    });

    function notifyHeight() {
      setTimeout(() => {
        window.parent.postMessage({ frameHeight: document.body.scrollHeight }, '*');
      }, 100);
    }
  </script>
</body>
</html>
