<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>開團與進度</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 0; margin: 0; background: transparent; color: #333; }
    
    .filter-bar { display: flex; gap: 10px; margin-bottom: 20px; align-items: center; background: #fff; padding: 12px 15px; border-radius: 12px; border: 1px solid #e4e7ed; flex-wrap: wrap; }
    select { padding: 8px 12px; border: 1px solid #dcdfe6; border-radius: 8px; font-size: 14px; background: #fff; outline: none; }
    select:focus { border-color: #409eff; }

    /* 改為 3 欄一排的精緻看板網格 */
    .progress-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
    @media (max-width: 768px) {
      .progress-grid { grid-template-columns: 1fr; }
    }

    .progress-card { background: #fff; border: 1px solid #e4e7ed; border-radius: 12px; padding: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.02); display: flex; flex-direction: column; justify-content: space-between; }
    .progress-header { font-size: 14px; font-weight: bold; color: #303133; margin-bottom: 10px; padding-bottom: 6px; border-bottom: 1px dashed #ebeef5; display: flex; align-items: center; gap: 6px; }

    .member-row { display: flex; justify-content: space-between; align-items: center; padding: 6px 8px; margin-bottom: 4px; border-radius: 6px; background: #f8f9fa; font-size: 13px; }
    .member-info { display: flex; align-items: center; gap: 6px; font-weight: bold; color: #606266; }
    
    .badge { padding: 3px 8px; border-radius: 10px; font-size: 11px; font-weight: bold; white-space: nowrap; }
    .badge[data-val="已預約"] { background: #f3e8ff; color: #9c27b0; }
    .badge[data-val="等圖中"] { background: #fdf6ec; color: #e6a23c; }
    .badge[data-val="分圖中"] { background: #ecf5ff; color: #409eff; }
    .badge[data-val="上傳中"] { background: #e8f8f5; color: #009688; }
    .badge[data-val="已通知匯款"] { background: #eef2ff; color: #4f46e5; }
    .badge[data-val="已發圖"] { background: #f0f9eb; color: #67c23a; }
    .badge[data-val="到期/已刪除"] { background: #f4f4f5; color: #909399; }
  </style>
</head>
<body>

  <div class="filter-bar">
    <select id="filterEvent">
      <option value="">全部活動 (全部顯示)</option>
    </select>
    <select id="filterMember">
      <option value="">全部成員</option>
    </select>
  </div>

  <div class="progress-grid" id="progressContainer">
    <p style="text-align:center; color:#909399; grid-column: span 3;">資料載入中...</p>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDF7QySG1Jj4gdZvXwMRaKjRmI-lFKpj7k",
      authDomain: "forsure0922.firebaseapp.com",
      databaseURL: "https://forsure0922-default-rtdb.firebaseio.com",
      projectId: "forsure0922",
      storageBucket: "forsure0922.firebasestorage.app",
      messagingSenderId: "817449290174",
      appId: "1:817449290174:web:6b4ec1d36c171ff97011ef"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let memberOrderList = ["方燦", "Lee Know", "彰彬", "鉉辰", "HAN", "Felix", "昇玟", "I.N"];
    fetch('../json/members.json').then(r => r.json()).then(arr => { memberOrderList = arr; initMemberFilter(); }).catch(() => { initMemberFilter(); });

    function initMemberFilter() {
      const memSel = document.getElementById('filterMember');
      memSel.innerHTML = '<option value="">全部成員</option>';
      memberOrderList.forEach(m => {
        memSel.innerHTML += `<option value="${m}">${m}</option>`;
      });
    }

    let rawProgressData = [];

    document.addEventListener('DOMContentLoaded', () => {
      onSnapshot(collection(db, "progress"), snap => {
        rawProgressData = [];
        snap.forEach(d => rawProgressData.push(d.data()));
        updateEventDropdown();
        renderProgress();
      });

      onSnapshot(collection(db, "photo_progress"), snap => {
        snap.forEach(d => {
          const data = d.data();
          rawProgressData.push({
            eventName: data.eventName || data.event,
            member: data.member,
            seller: data.seller,
            status: data.status
          });
        });
        updateEventDropdown();
        renderProgress();
      });

      document.getElementById('filterEvent').addEventListener('change', renderProgress);
      document.getElementById('filterMember').addEventListener('change', renderProgress);
    });

    function updateEventDropdown() {
      const eventSel = document.getElementById('filterEvent');
      const currentVal = eventSel.value;
      const eventsSet = new Set();

      rawProgressData.forEach(item => {
        const ev = item.eventName || item.event;
        if (ev) eventsSet.add(ev.trim());
      });

      eventSel.innerHTML = '<option value="">全部活動 (全部顯示)</option>';
      Array.from(eventsSet).sort().forEach(ev => {
        eventSel.innerHTML += `<option value="${ev}">${ev}</option>`;
      });
      eventSel.value = currentVal;
    }

    function renderProgress() {
      const container = document.getElementById('progressContainer');
      const selectedEvent = document.getElementById('filterEvent').value;
      const selectedMember = document.getElementById('filterMember').value;

      const eventMap = {};

      rawProgressData.forEach(item => {
        const ev = item.eventName || item.event || '未命名活動';
        if (selectedEvent && ev !== selectedEvent) return;

        const mem = item.member || '全體';
        if (selectedMember && mem !== selectedMember) return;

        if (!eventMap[ev]) eventMap[ev] = [];
        eventMap[ev].push(item);
      });

      container.innerHTML = '';
      const eventKeys = Object.keys(eventMap).sort();

      if (eventKeys.length === 0) {
        container.innerHTML = '<p style="text-align:center; color:#909399; grid-column: span 3;">目前無符合條件的進度紀錄</p>';
        notifyHeight();
        return;
      }

      eventKeys.forEach(ev => {
        const items = eventMap[ev];
        
        items.sort((a, b) => {
          let idxA = memberOrderList.indexOf(a.member);
          let idxB = memberOrderList.indexOf(b.member);
          if (idxA === -1) idxA = 99;
          if (idxB === -1) idxB = 99;
          return idxA - idxB;
        });

        let membersHtml = '';
        items.forEach(it => {
          const st = it.status || '等圖中';
          membersHtml += `
            <div class="member-row">
              <div class="member-info">👤 ${it.member} <span style="font-size:11px; color:#909399; font-weight:normal;">(${it.seller || '-'})</span></div>
              <span class="badge" data-val="${st}">${st}</span>
            </div>
          `;
        });

        container.innerHTML += `
          <div class="progress-card">
            <div>
              <div class="progress-header">🗓️ ${ev}</div>
              <div>${membersHtml}</div>
            </div>
          </div>
        `;
      });

      notifyHeight();
    }

    function notifyHeight() {
      setTimeout(() => {
        window.parent.postMessage({ frameHeight: document.body.scrollHeight }, '*');
      }, 100);
    }
  </script>
</body>
</html>
