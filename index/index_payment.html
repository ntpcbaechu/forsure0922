<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>匯款表單</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 0; margin: 0; background: transparent; color: #333; }
    .form-group { margin-bottom: 16px; }
    label { font-size: 14px; font-weight: bold; color: #303133; display: block; margin-bottom: 6px; }
    input, select, textarea { width: 100%; padding: 12px; border: 1px solid #dcdfe6; border-radius: 10px; font-size: 15px; box-sizing: border-box; background: #fff; font-family: inherit; }
    textarea { resize: vertical; min-height: 80px; }
    button { width: 100%; padding: 14px; background: #67c23a; color: white; border: none; border-radius: 10px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px; }
    button:disabled { background: #b3e19d; }

    .info-card { background: #f4f4f5; border-radius: 10px; padding: 12px; margin-bottom: 16px; font-size: 13px; color: #606266; border: 1px solid #e4e7ed; }
    .info-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
    .orders-select-box { background: #fff; border: 1px solid #dcdfe6; border-radius: 8px; padding: 10px; max-height: 220px; overflow-y: auto; margin-top: 6px; }
    
    .order-item { display: flex; align-items: center; justify-content: space-between; font-size: 13px; padding: 6px 0; border-bottom: 1px dashed #ebeef5; }
    .order-item:last-child { border-bottom: none; }
    .order-left { display: flex; align-items: center; gap: 8px; }
    .order-chk, .credit-chk, .deposit-chk { width: 16px; height: 16px; margin: 0; cursor: pointer; }
    
    .price-box { display: flex; align-items: center; gap: 6px; font-weight: bold; }
    .price-original-strike { text-decoration: line-through; color: #909399; font-size: 12px; }
    .price-final { color: #f56c6c; font-size: 14px; }

    .btn-add-custom { background: #67c23a; color: #fff; border: none; padding: 6px 12px; border-radius: 6px; font-size: 12px; font-weight: bold; cursor: pointer; margin-top: 8px; display: inline-flex; align-items: center; gap: 4px; width: auto; }
    .btn-add-custom:hover { background: #5daf34; }
    .custom-form-box { background: #fff; border: 1px solid #67c23a; border-radius: 8px; padding: 10px; margin-top: 8px; display: none; }
    .custom-form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 8px; }
    .custom-form-grid input, .custom-form-grid select { padding: 6px 8px; font-size: 12px; border-radius: 6px; }

    .btn-add-group { background: #409eff; color: #fff; border: none; padding: 8px 14px; border-radius: 8px; font-size: 13px; font-weight: bold; cursor: pointer; margin-top: 10px; margin-bottom: 14px; display: inline-flex; align-items: center; gap: 4px; width: auto; }
    .btn-add-group:hover { background: #66b1ff; }

    .group-block-card { background: #fff; border: 1px solid #dcdfe6; border-radius: 10px; padding: 12px; margin-bottom: 12px; }
    .group-block-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-weight: bold; color: #303133; }
    .group-block-inputs { display: grid; grid-template-columns: 1fr 1fr auto; gap: 8px; align-items: center; margin-bottom: 8px; }

    .summary-right-box { text-align: right; border-top: 1px dashed #dcdfe6; padding-top: 8px; margin-top: 10px; }
    .summary-right-row { display: flex; justify-content: flex-end; gap: 12px; align-items: center; margin-bottom: 4px; }

    .bank-info-box { background: #fffbe6; border: 1px solid #ffe58f; border-radius: 10px; padding: 12px; margin-bottom: 16px; font-size: 13px; color: #595959; line-height: 1.6; }
    .bank-info-title { font-weight: bold; color: #d46b08; font-size: 14px; margin-bottom: 6px; }
    .bank-warning { color: #f56c6c; font-weight: bold; margin-top: 6px; }

    .input-hint-box { font-size: 12px; color: #e6a23c; background: #fdf6ec; border: 1px solid #faebd7; border-radius: 6px; padding: 6px 10px; margin-top: 6px; line-height: 1.5; font-weight: bold; }
    .overpay-tip { color: #67c23a; font-size: 13px; font-weight: bold; margin-top: 6px; display: none; }

    .line-info-card { background: #f8f9fa; border: 1px solid #e4e7ed; border-radius: 10px; padding: 12px 14px; margin-top: 8px; display: flex; flex-direction: column; gap: 6px; box-sizing: border-box; }
    .line-contact-row { font-size: 14px; font-weight: bold; color: #303133; display: flex; align-items: center; gap: 6px; }
    .line-warning-box { font-size: 12px; color: #e6a23c; font-weight: bold; line-height: 1.5; padding-left: 20px; }
  </style>
</head>
<body>

  <h3 style="margin-top:0; margin-bottom:20px; text-align:center; font-size:20px;">💰 匯款對帳回報</h3>
  <form id="paymentForm">
    
    <!-- 1. 選擇團體 -->
    <div class="form-group">
      <label>1. 選擇團體 *</label>
      <select id="groupSelect" required>
        <option value="">請選擇團體</option>
        <option value="Stray Kids">🧭 Stray Kids</option>
        <option value="ATEEZ">🏴‍☠️ ATEEZ</option>
      </select>
    </div>

    <!-- 2. 社群名稱 -->
    <div class="form-group">
      <label>2. 社群名稱 *</label>
      <select id="buyerName" required disabled>
        <option value="">請先選擇團體</option>
      </select>
    </div>

    <!-- 3. 收圖方式與聯絡帳號 -->
    <div class="form-group">
      <label>3. 收圖方式與聯絡帳號 *</label>
      <select id="contactTypeSelect" required>
        <option value="">請選擇收圖方式...</option>
        <option value="Instagram">Instagram</option>
        <option value="Threads">Threads</option>
        <option value="官方 Line">官方 Line</option>
      </select>

      <input type="text" id="socialAccount" placeholder="請輸入帳號" style="display:none; margin-top:6px;">

      <div id="lineInfoCard" class="line-info-card" style="display:none;">
        <div class="line-contact-row">
          <span>💬</span>
          <span>官方 LINE : @115oyenv</span>
        </div>
        <div class="line-warning-box">
          （⚠️ 填完單後請主動發訊息告知社群暱稱，否則無法對帳發圖）
        </div>
      </div>
    </div>

    <!-- 選完暱稱才帶出的下半部完整表單 -->
    <div id="formContent" style="display: none;">
      
      <!-- 主待匯款訂單區塊 -->
      <div class="info-card">
        <div id="groupBlocksContainer"></div>

        <button type="button" class="btn-add-group" id="addGroupBlockBtn">➕ 合併回報另一個團體 / 帳號的訂單</button>

        <div>
          <button type="button" class="btn-add-custom" id="toggleCustomBtn">➕ 新增其他金額 / 補款項目</button>
          
          <div class="custom-form-box" id="customFormBox">
            <div style="font-weight:bold; color:#67c23a; margin-bottom:6px; font-size:12px;">新增自訂補款/額外金額：</div>
            <div class="custom-form-grid">
              <input type="text" id="custDate" placeholder="日期 (例: 260801)">
              <input type="text" id="custEvent" placeholder="活動名稱 (例: 周邊加購)">
              <select id="custGroup">
                <option value="">選擇團體</option>
                <option value="Stray Kids">🧭 Stray Kids</option>
                <option value="ATEEZ">🏴‍☠️ ATEEZ</option>
              </select>
              <select id="custMember" disabled><option value="">請先選擇團體</option></select>
              <input type="number" id="custPrice" min="0" placeholder="金額 ($)" style="grid-column: span 2;">
            </div>
            <div style="display:flex; gap:6px;">
              <button type="button" id="addCustomItemBtn" style="padding:6px 10px; font-size:12px; margin-top:0; background:#67c23a; width:auto;">確認加入勾選清單</button>
              <button type="button" id="closeCustomItemBtn" style="padding:6px 10px; font-size:12px; margin-top:0; background:#909399; width:auto;">取消</button>
            </div>
          </div>
        </div>

        <div class="info-row" style="margin-top:12px; padding-top:8px; border-top: 1px dashed #dcdfe6;">
          <label style="font-weight:normal; font-size:13px; margin:0; cursor:pointer; display:flex; align-items:center; gap:6px;">
            <input type="checkbox" id="useDepositChk" class="deposit-chk">
            <span>勾選折抵預存儲值金 (餘額: <b style="color:#409eff;" id="depositBalance">$0</b>)</span>
          </label>
          <b style="color:#909399;" id="depositDeduct">-</b>
        </div>

        <div class="info-row" style="margin-top:6px; padding-top:6px; border-top: 1px dashed #ebeef5;">
          <label style="font-weight:normal; font-size:13px; margin:0; cursor:pointer; display:flex; align-items:center; gap:6px;">
            <input type="checkbox" id="useCreditChk" class="credit-chk">
            <span>勾選折抵可用抵用金 (餘額: <b style="color:#67c23a;" id="creditBalance">$0</b>)</span>
          </label>
          <b style="color:#909399;" id="creditDeduct">-</b>
        </div>

        <div class="summary-right-box">
          <div class="summary-right-row">
            <span>勾選訂單小計：</span>
            <b style="color:#606266; font-size:14px;" id="pendingTotal">$0</b>
          </div>
          <div class="summary-right-row" style="margin-top:4px;">
            <span style="font-weight:bold; color:#303133; font-size:16px;">【本次應匯款總金額】：</span>
            <b style="color:#f56c6c; font-size:22px;" id="finalPayTotal">$0</b>
          </div>
        </div>
      </div>

      <div class="bank-info-box" id="bankInfoCard">
        <div class="bank-info-title">🔸匯款帳號：</div>
        <div>載入帳號資料中...</div>
      </div>

      <div class="form-group">
        <label>匯款日期 *</label>
        <input type="date" id="payDate" required>
      </div>

      <div class="form-group">
        <label>匯款到上面哪個銀行帳戶 *</label>
        <select id="bankName" required>
          <option value="">請選擇匯款帳戶</option>
        </select>
      </div>

      <div class="form-group">
        <label>匯款金額 ($) *</label>
        <input type="number" id="amount" min="0" placeholder="請輸入實際匯款金額" required>
        <div id="overpayTip" class="overpay-tip"></div>
      </div>

      <div class="form-group">
        <label>匯款帳號末 5 碼 *</label>
        <input type="text" id="last5" placeholder="例如: 12345" required>
        <div class="input-hint-box">
          ⚠️ 使用台灣Pay等轉帳時，若不確定請填寫 ①卡號末5碼 + ②帳戶末5碼，或私訊提供截圖以利對帳
        </div>
      </div>

      <div class="form-group">
        <label>備註說明</label>
        <textarea id="note" placeholder="如有特殊事項請在此註明... (按 Enter 可換行)"></textarea>
      </div>

      <button type="submit" id="submitBtn">提交對帳資料</button>
    </div>
  </form>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, addDoc, onSnapshot, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDF7QySG1Jj4gdZvXwMRaKjRmI-lFKpj7k",
      authDomain: "forsure0922.firebaseapp.com",
      databaseURL: "https://forsure0922-default-rtdb.firebaseio.com",
      projectId: "forsure0922",
      storageBucket: "forsure0922.firebasestorage.app",
      messagingSenderId: "817449290174",
      appId: "1:817449290174:web:6b4ec1d36c171ff97011ef"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const MEMBER_EMOJI_MAP = {
      '方燦': '🐺', 'Lee Know': '🐰', '彰彬': '🐷', '鉉辰': '🥟', 'HAN': '🐹', 'Felix': '🐥', '昇玟': '🐶', 'I.N': '🦊',
      '弘中': '🐿️', '星化': '🐰', '潤浩': '🐶', '呂尚': '🐥', '傘': '⛰️', '旼琦': '🐥', '友榮': '🐈‍⬛', '鍾浩': '🐻'
    };

    const GROUP_EMOJI_MAP = {
      'Stray Kids': '🧭 Stray Kids',
      'ATEEZ': '🏴‍☠️ ATEEZ'
    };

    let memberOrderMap = {};
    let customUsersSet = new Set();
    let usersDatabase = [];

    let allCredits = [];
    let allDeposits = [];
    let allOrders = [];
    let customAddedItems = [];
    let photoProgressMap = {};
    let eventSettingsMap = {};

    let extraBuyerBlocks = [];

    let currentAvailableCredit = 0;
    let currentAvailableDeposit = 0;
    let currentCalculatedFinalTotal = 0;
    let appliedCreditDeduction = 0;
    let appliedDepositDeduction = 0;

    function formatDisplayName(name) {
      if (!name) return '';
      if (customUsersSet.has(name)) return name;
      const len = name.length;
      if (len <= 6) {
        if (len <= 2) return name[0] + '*';
        return name[0] + '*'.repeat(len - 2) + name[len - 1];
      }
      return name.slice(0, 3) + '*'.repeat(len - 6) + name.slice(-3);
    }

    function extractDateScore(evName) {
      if (!evName) return 99999999;
      const match = evName.match(/\d{6}/);
      if (match) return parseInt(match[0], 10);
      return 99999999;
    }

    function loadBankInfo() {
      fetch('../json/bank_info.json')
        .then(res => res.json())
        .then(data => {
          const card = document.getElementById('bankInfoCard');
          let html = `<div class="bank-info-title">${data.title || '🔸匯款帳號：'}</div>`;
          if (data.accounts && Array.isArray(data.accounts)) {
            data.accounts.forEach(acc => { html += `<div>${acc}</div>`; });
          }
          if (data.note) { html += `<div class="bank-warning">${data.note}</div>`; }
          card.innerHTML = html;
          notifyHeight();
        })
        .catch(() => {});
    }

    function loadBankDropdown() {
      fetch('../json/banks.json')
        .then(res => res.json())
        .then(bankList => {
          const bankSel = document.getElementById('bankName');
          bankSel.innerHTML = '<option value="">請選擇匯款帳戶</option>';
          bankList.forEach(b => {
            bankSel.innerHTML += `<option value="${b}">${b}</option>`;
          });
          bankSel.innerHTML += `<option value="其他">其他</option>`;
        })
        .catch(() => {
          const bankSel = document.getElementById('bankName');
          bankSel.innerHTML = '<option value="">請選擇匯款帳戶</option><option value="其他">其他</option>';
        });
    }

    document.addEventListener('DOMContentLoaded', async () => {
      loadBankInfo();
      loadBankDropdown();

      try {
        const skzM = await fetch('../json/members_skz.json').then(r => r.json());
        const atzM = await fetch('../json/members_atz.json').then(r => r.json());
        memberOrderMap['Stray Kids'] = skzM;
        memberOrderMap['ATEEZ'] = atzM;
      } catch(e) {}

      const custGroupSel = document.getElementById('custGroup');
      const custMemberSel = document.getElementById('custMember');

      custGroupSel.addEventListener('change', () => {
        const g = custGroupSel.value;
        custMemberSel.innerHTML = '';
        if (!g) {
          custMemberSel.innerHTML = '<option value="">請先選擇團體</option>';
          custMemberSel.disabled = true;
          return;
        }
        const members = memberOrderMap[g] || [];
        custMemberSel.disabled = false;
        custMemberSel.innerHTML = '<option value="">選擇成員</option>';
        members.forEach(m => {
          const emoji = MEMBER_EMOJI_MAP[m] ? `${MEMBER_EMOJI_MAP[m]} ` : '';
          custMemberSel.innerHTML += `<option value="${m}">${emoji}${m}</option>`;
        });
      });

      onSnapshot(collection(db, "users"), snap => {
        usersDatabase = [];
        customUsersSet = new Set();
        snap.forEach(d => {
          const u = d.data();
          usersDatabase.push(u);
          if (u.name && u.type !== 'threads') {
            customUsersSet.add(u.name);
          }
        });
        updateBuyerDropdownAndDetails();
      });

      onSnapshot(collection(db, "photo_progress"), snap => {
        photoProgressMap = {};
        snap.forEach(d => {
          const data = d.data();
          const evName = (data.eventName || data.event || '').trim();
          const mem = (data.member || '').trim();
          if (evName && mem) {
            photoProgressMap[`${evName}_${mem}`] = data.status || '等圖中';
          }
        });
        updateBuyerDropdownAndDetails();
      });

      onSnapshot(collection(db, "event_settings"), snap => {
        eventSettingsMap = {};
        snap.forEach(d => {
          const data = d.data();
          const evName = (data.name || data.rawName || data.eventName || data.event || '').trim();
          const mem = (data.member || '').trim();
          const estPrice = Number(data.estimatedPrice) || Number(data.price) || 0;
          const actPrice = Number(data.actualPrice) || 0;
          const packQty = Number(data.packQty) || 1;
          const discounts = data.discounts || [];

          if (evName) {
            eventSettingsMap[`${evName}_${mem}`] = { estPrice, actPrice, packQty, discounts };
            if (data.rawName) {
              eventSettingsMap[`${data.rawName.trim()}_${mem}`] = { estPrice, actPrice, packQty, discounts };
            }
          }
        });
        updateBuyerDropdownAndDetails();
      });

      onSnapshot(collection(db, "user_credits"), snap => {
        allCredits = [];
        snap.forEach(d => allCredits.push({ id: d.id, ...d.data() }));
        renderAllBuyerDetails();
      });

      onSnapshot(collection(db, "user_deposits"), snap => {
        allDeposits = [];
        snap.forEach(d => allDeposits.push({ id: d.id, ...d.data() }));
        renderAllBuyerDetails();
      });

      onSnapshot(collection(db, "orders"), snap => {
        allOrders = [];
        snap.forEach(d => allOrders.push({ id: d.id, ...d.data() }));
        updateBuyerDropdownAndDetails();
      });

      document.getElementById('groupSelect').addEventListener('change', handleGroupChange);
      document.getElementById('buyerName').addEventListener('change', () => {
        customAddedItems = [];
        renderAllBuyerDetails();
      });

      document.getElementById('contactTypeSelect').addEventListener('change', handleContactTypeChange);

      document.getElementById('useDepositChk').addEventListener('change', calcSelectedTotal);
      document.getElementById('useCreditChk').addEventListener('change', calcSelectedTotal);

      document.getElementById('amount').addEventListener('input', checkOverpayTip);

      document.getElementById('toggleCustomBtn').addEventListener('click', () => {
        const box = document.getElementById('customFormBox');
        box.style.display = (box.style.display === 'block') ? 'none' : 'block';
        notifyHeight();
      });

      document.getElementById('closeCustomItemBtn').addEventListener('click', () => {
        document.getElementById('customFormBox').style.display = 'none';
        notifyHeight();
      });

      document.getElementById('addCustomItemBtn').addEventListener('click', addCustomItem);

      document.getElementById('addGroupBlockBtn').addEventListener('click', () => {
        const blockId = `block_${Date.now()}`;
        extraBuyerBlocks.push({ id: blockId, group: '', buyer: '' });
        renderAllBuyerDetails();
      });

      notifyHeight();
    });

    function handleGroupChange() {
      const selectedGroup = document.getElementById('groupSelect').value;
      const buyerSel = document.getElementById('buyerName');
      buyerSel.value = '';

      if (!selectedGroup) {
        buyerSel.disabled = true;
        buyerSel.innerHTML = '<option value="">請先選擇團體</option>';
      } else {
        buyerSel.disabled = false;
      }
      updateBuyerDropdownAndDetails();
    }

    function handleContactTypeChange() {
      const type = document.getElementById('contactTypeSelect').value;
      const input = document.getElementById('socialAccount');
      const lineCard = document.getElementById('lineInfoCard');

      if (type === 'Instagram' || type === 'Threads') {
        input.style.display = 'block';
        input.required = true;
        lineCard.style.display = 'none';
      } else if (type === '官方 Line') {
        input.style.display = 'none';
        input.required = false;
        input.value = '';
        lineCard.style.display = 'flex';
      } else {
        input.style.display = 'none';
        input.required = false;
        lineCard.style.display = 'none';
      }
      notifyHeight();
    }

    function checkOverpayTip() {
      const inputAmount = parseFloat(document.getElementById('amount').value);
      const tipElem = document.getElementById('overpayTip');
      
      if (!isNaN(inputAmount) && inputAmount === 0 && currentCalculatedFinalTotal === 0) {
        tipElem.textContent = `💡 應匯金額為 $0 元（已全額扣抵/免補款）🟢`;
        tipElem.style.color = '#409eff';
        tipElem.style.display = 'block';
      } else if (inputAmount > currentCalculatedFinalTotal && currentCalculatedFinalTotal >= 0) {
        const overpaid = inputAmount - currentCalculatedFinalTotal;
        tipElem.textContent = `💡 溢繳提醒：多付的 $${overpaid} 元提交後將「自動轉入預存儲值金」！🟢`;
        tipElem.style.color = '#67c23a';
        tipElem.style.display = 'block';
      } else {
        tipElem.style.display = 'none';
      }
      notifyHeight();
    }

    function getPendingBuyersForGroup(grp) {
      const pendingBuyers = new Set();
      allOrders.forEach(o => {
        if ((o.group || 'Stray Kids') === grp) {
          const name = o.user || o.buyerName || o.name || o.buyer;
          const pendingMatch = (!o.hasPaid && (o.paymentStatus === '待匯款' || o.paymentStatus === 'pending_payment' || !o.paymentStatus));
          
          const ordEvent = (o.event || o.fullEvent || o.eventName || '').trim();
          const ordMember = (o.member || '').trim();
          const isSurplusOrder = (o.orderType === '餘圖認領' || ordEvent.startsWith('【餘圖認領】'));
          const progressStatus = photoProgressMap[`${ordEvent}_${ordMember}`] || '等圖中';
          
          const allowedStatuses = ['上傳中', '已通知匯款', '已發圖', '可詢問餘圖'];
          const isUnlocked = isSurplusOrder || allowedStatuses.includes(progressStatus);

          if (name && pendingMatch && isUnlocked) {
            pendingBuyers.add(String(name));
          }
        }
      });
      return Array.from(pendingBuyers).sort((a, b) => a.localeCompare(b, 'zh-TW'));
    }

    function updateBuyerDropdownAndDetails() {
      const selectedGroup = document.getElementById('groupSelect').value;
      const buyerSel = document.getElementById('buyerName');
      const currentSelected = buyerSel.value;

      if (!selectedGroup) {
        buyerSel.innerHTML = '<option value="">請先選擇團體</option>';
        buyerSel.disabled = true;
        renderAllBuyerDetails();
        return;
      }

      const buyers = getPendingBuyersForGroup(selectedGroup);

      buyerSel.disabled = false;
      buyerSel.innerHTML = '<option value="">請選擇您的名稱</option>';
      buyers.forEach(b => {
        buyerSel.innerHTML += `<option value="${b}">${formatDisplayName(b)}</option>`;
      });

      if (currentSelected && buyers.includes(currentSelected)) {
        buyerSel.value = currentSelected;
      } else {
        buyerSel.value = '';
      }

      renderAllBuyerDetails();
    }

    function addCustomItem() {
      const dt = document.getElementById('custDate').value.trim();
      const ev = document.getElementById('custEvent').value.trim();
      const group = document.getElementById('custGroup').value;
      const mem = document.getElementById('custMember').value;
      const price = parseFloat(document.getElementById('custPrice').value);

      if (!ev || isNaN(price) || price < 0) {
        alert('請至少輸入活動名稱與有效的金額（可為 0 元）！');
        return;
      }

      const fullEvName = dt ? `${dt} ${ev}` : ev;
      const customId = `custom_${Date.now()}`;

      customAddedItems.push({
        id: customId,
        event: fullEvName,
        group: group,
        member: mem || '全體',
        price: price
      });

      document.getElementById('custDate').value = '';
      document.getElementById('custEvent').value = '';
      document.getElementById('custGroup').value = '';
      document.getElementById('custMember').value = '';
      document.getElementById('custMember').disabled = true;
      document.getElementById('custPrice').value = '';
      document.getElementById('customFormBox').style.display = 'none';

      renderAllBuyerDetails();
    }

    function sortOrdersByDateAndMember(orders) {
      return orders.sort((a, b) => {
        const evA = (a.event || a.fullEvent || a.eventName || '').trim();
        const evB = (b.event || b.fullEvent || b.eventName || '').trim();
        
        const dateA = extractDateScore(evA);
        const dateB = extractDateScore(evB);

        if (dateA !== dateB) return dateA - dateB;

        const grp = a.group || 'Stray Kids';
        const memberList = memberOrderMap[grp] || [];
        const memA = (a.member || '').trim();
        const memB = (b.member || '').trim();

        const idxA = memberList.indexOf(memA);
        const idxB = memberList.indexOf(memB);

        return (idxA === -1 ? 99 : idxA) - (idxB === -1 ? 99 : idxB);
      });
    }

    function renderAllBuyerDetails() {
      const primaryGroup = document.getElementById('groupSelect').value;
      const primaryBuyer = document.getElementById('buyerName').value;
      const formContent = document.getElementById('formContent');

      if (!primaryGroup || !primaryBuyer) {
        formContent.style.display = 'none';
        notifyHeight();
        return;
      }

      formContent.style.display = 'block';

      const targetBuyers = new Set([primaryBuyer]);
      extraBuyerBlocks.forEach(b => { if (b.buyer) targetBuyers.add(b.buyer); });

      const userCredits = allCredits.filter(c => targetBuyers.has(c.user || c.buyerName || c.name));
      currentAvailableCredit = userCredits.reduce((sum, c) => sum + ((Number(c.credit) || Number(c.amount) || 0) - (Number(c.used) || 0)), 0);
      document.getElementById('creditBalance').textContent = `$${currentAvailableCredit}`;

      const userDeposits = allDeposits.filter(d => targetBuyers.has(d.user || d.buyerName || d.name));
      currentAvailableDeposit = userDeposits.reduce((sum, d) => {
        const amt = Number(d.amount) || 0;
        return (d.type !== 'usage') ? (sum + amt) : (sum - amt);
      }, 0);
      document.getElementById('depositBalance').textContent = `$${currentAvailableDeposit}`;

      const container = document.getElementById('groupBlocksContainer');
      container.innerHTML = '';

      renderSingleOrderBlock(container, primaryGroup, primaryBuyer, 1, false);

      extraBuyerBlocks.forEach((block, idx) => {
        renderExtraDynamicBlock(container, block, idx + 2);
      });

      if (customAddedItems.length > 0) {
        const customDiv = document.createElement('div');
        customDiv.style.marginTop = '10px';
        customDiv.innerHTML = '<div style="font-weight:bold; color:#67c23a; margin-bottom:4px;">➕ 自訂加購 / 補款項目：</div>';
        
        customAddedItems.forEach(cItem => {
          customDiv.innerHTML += `
            <div class="order-item" style="background:#f0f9eb; padding:6px 8px; border-radius:6px; margin-bottom:4px;">
              <div class="order-left">
                <input type="checkbox" class="order-chk custom-chk" value="${cItem.id}" data-price="${cItem.price}" data-is-custom="true" data-event="${cItem.event}" data-group="${cItem.group}" data-member="${cItem.member}">
                <span>➕ [自訂補款] ${cItem.event} (${cItem.member})</span>
              </div>
              <div class="price-box"><span class="price-final">$${cItem.price}</span></div>
            </div>
          `;
        });
        container.appendChild(customDiv);
      }

      document.querySelectorAll('.order-chk').forEach(chk => {
        chk.addEventListener('change', calcSelectedTotal);
      });
      calcSelectedTotal();
      notifyHeight();
    }

    function renderSingleOrderBlock(container, group, buyer, blockNum, isExtra = false, blockId = '') {
      const card = document.createElement('div');
      card.className = 'group-block-card';

      const grpDisplay = GROUP_EMOJI_MAP[group] || group;
      card.innerHTML = `
        <div class="group-block-header">
          <span>📦 待匯款訂單明細 ${blockNum}（${grpDisplay} - ${formatDisplayName(buyer)}）</span>
        </div>
        <div class="orders-select-box" id="ordersList_${blockNum}">載入訂單中...</div>
      `;
      container.appendChild(card);

      const ordersBox = card.querySelector(`#ordersList_${blockNum}`);

      const userOrders = allOrders.filter(o => {
        const grpMatch = (o.group || 'Stray Kids') === group;
        const nameMatch = (o.user === buyer || o.buyerName === buyer || o.name === buyer || o.buyer === buyer);
        const pendingMatch = (!o.hasPaid && (o.paymentStatus === '待匯款' || o.paymentStatus === 'pending_payment' || !o.paymentStatus));

        const ordEvent = (o.event || o.fullEvent || o.eventName || '').trim();
        const ordMember = (o.member || '').trim();
        const isSurplusOrder = (o.orderType === '餘圖認領' || ordEvent.startsWith('【餘圖認領】'));
        const progressStatus = photoProgressMap[`${ordEvent}_${ordMember}`] || '等圖中';

        const allowedStatuses = ['上傳中', '已通知匯款', '已發圖', '可詢問餘圖'];
        const isUnlocked = isSurplusOrder || allowedStatuses.includes(progressStatus);

        return grpMatch && nameMatch && pendingMatch && isUnlocked;
      });

      if (userOrders.length === 0) {
        ordersBox.innerHTML = '<span style="color:#909399;">目前無待匯款訂單</span>';
        return;
      }

      const sortedOrders = sortOrdersByDateAndMember(userOrders);
      ordersBox.innerHTML = '';

      sortedOrders.forEach(ord => {
        const qty = Number(ord.quantity !== undefined ? ord.quantity : (ord.qty !== undefined ? ord.qty : ord.count)) || 1;
        const ordEvent = (ord.event || ord.fullEvent || ord.eventName || '').trim();
        const ordMember = (ord.member || '').trim();
        const memEmoji = MEMBER_EMOJI_MAP[ordMember] ? `${MEMBER_EMOJI_MAP[ordMember]} ` : '';
        const isSurplus = (ord.orderType === '餘圖認領' || ordEvent.startsWith('【餘圖認領】'));

        const setting = eventSettingsMap[`${ordEvent}_${ordMember}`] || {};
        const packQty = isSurplus ? 1 : (setting.packQty || 1);
        const packsCount = Math.round(qty / packQty);

        const estPrice = setting.estPrice || 0;
        const actPrice = setting.actPrice || 0;

        let baseUnitPrice = (actPrice > 0) ? actPrice : estPrice;
        if (baseUnitPrice === 0 || isSurplus) {
          baseUnitPrice = Number(ord.price) || Number(ord.unitPrice) || 0;
        }

        let calculatedFinalPrice = packsCount * baseUnitPrice;
        if (!isSurplus) {
          const discounts = setting.discounts || [];
          if (Array.isArray(discounts)) {
            const userDisc = discounts.find(d => d.targetUser === buyer);
            if (userDisc) {
              const discCount = Math.min(packsCount, Number(userDisc.count) || 0);
              const discPrice = Number(userDisc.price) || 0;
              calculatedFinalPrice = (discCount * discPrice) + ((packsCount - discCount) * baseUnitPrice);
            }
          }
        }

        const calculatedEstPrice = Math.round(packsCount * estPrice);

        let priceHtml = `<span class="price-final">$${calculatedFinalPrice}</span>`;
        if (!isSurplus && actPrice > 0 && estPrice > 0 && calculatedFinalPrice !== calculatedEstPrice) {
          priceHtml = `
            <span class="price-final">$${calculatedFinalPrice}</span>
            <span class="price-original-strike">$${calculatedEstPrice}</span>
          `;
        }

        ordersBox.innerHTML += `
          <div class="order-item">
            <div class="order-left">
              <input type="checkbox" class="order-chk" value="${ord.id}" data-price="${calculatedFinalPrice}">
              <span>📌 ${ordEvent || '未命名活動'} (${memEmoji}${ordMember || '全體'}) - ${qty} 包</span>
            </div>
            <div class="price-box">${priceHtml}</div>
          </div>
        `;
      });
    }

    function renderExtraDynamicBlock(container, block, blockNum) {
      const card = document.createElement('div');
      card.className = 'group-block-card';

      card.innerHTML = `
        <div class="group-block-header">
          <span>📦 待匯款訂單明細 ${blockNum} (合併加填)</span>
          <button type="button" style="background:#f56c6c; color:#fff; border:none; padding:3px 8px; border-radius:4px; font-size:11px; cursor:pointer; width:auto;" onclick="removeExtraBlock('${block.id}')">🗑️ 刪除此組</button>
        </div>
        <div class="group-block-inputs">
          <select class="extra-grp-select">
            <option value="">選擇合併團體</option>
            <option value="Stray Kids" ${block.group === 'Stray Kids' ? 'selected' : ''}>🧭 Stray Kids</option>
            <option value="ATEEZ" ${block.group === 'ATEEZ' ? 'selected' : ''}>🏴‍☠️ ATEEZ</option>
          </select>
          <select class="extra-buyer-select" ${block.group ? '' : 'disabled'}>
            <option value="">請先選擇團體</option>
          </select>
        </div>
        <div class="orders-select-box" id="ordersList_${blockNum}">請選擇團體與社群名稱</div>
      `;
      container.appendChild(card);

      const grpSel = card.querySelector('.extra-grp-select');
      const buyerSel = card.querySelector('.extra-buyer-select');

      if (block.group) {
        const buyers = getPendingBuyersForGroup(block.group);
        buyerSel.disabled = false;
        buyerSel.innerHTML = '<option value="">請選擇社群名稱</option>';
        buyers.forEach(b => {
          buyerSel.innerHTML += `<option value="${b}" ${b === block.buyer ? 'selected' : ''}>${formatDisplayName(b)}</option>`;
        });
      }

      grpSel.addEventListener('change', () => {
        block.group = grpSel.value;
        block.buyer = '';
        renderAllBuyerDetails();
      });

      buyerSel.addEventListener('change', () => {
        block.buyer = buyerSel.value;
        renderAllBuyerDetails();
      });

      if (block.group && block.buyer) {
        const ordersBox = card.querySelector(`#ordersList_${blockNum}`);
        const userOrders = allOrders.filter(o => {
          const grpMatch = (o.group || 'Stray Kids') === block.group;
          const nameMatch = (o.user === block.buyer || o.buyerName === block.buyer || o.name === block.buyer || o.buyer === block.buyer);
          const pendingMatch = (!o.hasPaid && (o.paymentStatus === '待匯款' || o.paymentStatus === 'pending_payment' || !o.paymentStatus));

          const ordEvent = (o.event || o.fullEvent || o.eventName || '').trim();
          const ordMember = (o.member || '').trim();
          const isSurplusOrder = (o.orderType === '餘圖認領' || ordEvent.startsWith('【餘圖認領】'));
          const progressStatus = photoProgressMap[`${ordEvent}_${ordMember}`] || '等圖中';

          const allowedStatuses = ['上傳中', '已通知匯款', '已發圖', '可詢問餘圖'];
          const isUnlocked = isSurplusOrder || allowedStatuses.includes(progressStatus);

          return grpMatch && nameMatch && pendingMatch && isUnlocked;
        });

        if (userOrders.length === 0) {
          ordersBox.innerHTML = '<span style="color:#909399;">目前無待匯款訂單</span>';
          return;
        }

        const sortedOrders = sortOrdersByDateAndMember(userOrders);
        ordersBox.innerHTML = '';

        sortedOrders.forEach(ord => {
          const qty = Number(ord.quantity !== undefined ? ord.quantity : (ord.qty !== undefined ? ord.qty : ord.count)) || 1;
          const ordEvent = (ord.event || ord.fullEvent || ord.eventName || '').trim();
          const ordMember = (ord.member || '').trim();
          const memEmoji = MEMBER_EMOJI_MAP[ordMember] ? `${MEMBER_EMOJI_MAP[ordMember]} ` : '';
          const isSurplus = (ord.orderType === '餘圖認領' || ordEvent.startsWith('【餘圖認領】'));

          const setting = eventSettingsMap[`${ordEvent}_${ordMember}`] || {};
          const packQty = isSurplus ? 1 : (setting.packQty || 1);
          const packsCount = Math.round(qty / packQty);

          const estPrice = setting.estPrice || 0;
          const actPrice = setting.actPrice || 0;

          let baseUnitPrice = (actPrice > 0) ? actPrice : estPrice;
          if (baseUnitPrice === 0 || isSurplus) {
            baseUnitPrice = Number(ord.price) || Number(ord.unitPrice) || 0;
          }

          let calculatedFinalPrice = packsCount * baseUnitPrice;
          if (!isSurplus) {
            const discounts = setting.discounts || [];
            if (Array.isArray(discounts)) {
              const userDisc = discounts.find(d => d.targetUser === block.buyer);
              if (userDisc) {
                const discCount = Math.min(packsCount, Number(userDisc.count) || 0);
                const discPrice = Number(userDisc.price) || 0;
                calculatedFinalPrice = (discCount * discPrice) + ((packsCount - discCount) * baseUnitPrice);
              }
            }
          }

          const calculatedEstPrice = Math.round(packsCount * estPrice);

          let priceHtml = `<span class="price-final">$${calculatedFinalPrice}</span>`;
          if (!isSurplus && actPrice > 0 && estPrice > 0 && calculatedFinalPrice !== calculatedEstPrice) {
            priceHtml = `
              <span class="price-final">$${calculatedFinalPrice}</span>
              <span class="price-original-strike">$${calculatedEstPrice}</span>
            `;
          }

          ordersBox.innerHTML += `
            <div class="order-item">
              <div class="order-left">
                <input type="checkbox" class="order-chk" value="${ord.id}" data-price="${calculatedFinalPrice}">
                <span>📌 ${ordEvent || '未命名活動'} (${memEmoji}${ordMember || '全體'}) - ${qty} 包</span>
              </div>
              <div class="price-box">${priceHtml}</div>
            </div>
          `;
        });
      }
    }

    window.removeExtraBlock = (blockId) => {
      extraBuyerBlocks = extraBuyerBlocks.filter(b => b.id !== blockId);
      renderAllBuyerDetails();
    };

    function calcSelectedTotal() {
      const chks = document.querySelectorAll('.order-chk:checked');
      let orderSubtotal = 0;
      chks.forEach(chk => {
        orderSubtotal += Number(chk.getAttribute('data-price')) || 0;
      });

      let remainingToPay = orderSubtotal;

      const useDeposit = document.getElementById('useDepositChk').checked;
      let depositDeduction = 0;
      if (useDeposit && currentAvailableDeposit > 0) {
        depositDeduction = Math.min(remainingToPay, currentAvailableDeposit);
        remainingToPay -= depositDeduction;
      }

      const useCredit = document.getElementById('useCreditChk').checked;
      let creditDeduction = 0;
      if (useCredit && currentAvailableCredit > 0) {
        creditDeduction = Math.min(remainingToPay, currentAvailableCredit);
        remainingToPay -= creditDeduction;
      }

      appliedDepositDeduction = depositDeduction;
      appliedCreditDeduction = creditDeduction;

      currentCalculatedFinalTotal = Math.max(0, remainingToPay);

      document.getElementById('pendingTotal').textContent = `$${orderSubtotal.toFixed(1).replace(/\.0$/, '')}`;
      
      const depositDeductElem = document.getElementById('depositDeduct');
      if (depositDeduction > 0) {
        depositDeductElem.textContent = `-$${depositDeduction.toFixed(1).replace(/\.0$/, '')}`;
        depositDeductElem.style.color = '#409eff';
      } else {
        depositDeductElem.textContent = '-';
        depositDeductElem.style.color = '#909399';
      }

      const creditDeductElem = document.getElementById('creditDeduct');
      if (creditDeduction > 0) {
        creditDeductElem.textContent = `-$${creditDeduction.toFixed(1).replace(/\.0$/, '')}`;
        creditDeductElem.style.color = '#67c23a';
      } else {
        creditDeductElem.textContent = '-';
        creditDeductElem.style.color = '#909399';
      }

      document.getElementById('finalPayTotal').textContent = `$${currentCalculatedFinalTotal.toFixed(1).replace(/\.0$/, '')}`;
      document.getElementById('submitBtn').textContent = `提交對帳資料 (總計 $${currentCalculatedFinalTotal.toFixed(1).replace(/\.0$/, '')})`;

      checkOverpayTip();
    }

    document.getElementById('paymentForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      const checkedItems = document.querySelectorAll('.order-chk:checked');
      if (checkedItems.length === 0) {
        alert('⚠️ 請至少勾選一筆要回報的訂單或自訂補款項目！');
        return;
      }

      const bankNameVal = document.getElementById('bankName').value;
      if (!bankNameVal) {
        alert('請選擇匯款帳戶！');
        return;
      }

      const contactType = document.getElementById('contactTypeSelect').value;
      const socialAcc = (contactType === '官方 Line') ? '@115oyenv' : document.getElementById('socialAccount').value.trim();

      const inputAmount = parseFloat(document.getElementById('amount').value);
      if (isNaN(inputAmount) || inputAmount < 0) {
        alert('請輸入有效的匯款金額（不可為負數）！');
        return;
      }

      const isOtherBank = (bankNameVal === '其他');
      if (!isOtherBank && inputAmount < currentCalculatedFinalTotal && currentCalculatedFinalTotal > 0) {
        alert(`⚠️ 匯款金額不足！\n\n本次應匯款總金額是：$${currentCalculatedFinalTotal}\n您填寫的金額是：$${inputAmount}\n\n請補足差額後再送出！`);
        return;
      }

      const btn = document.getElementById('submitBtn');
      btn.disabled = true;
      btn.textContent = '送出中...';

      const selectedOrderIds = [];
      const customItemsToCreate = [];

      checkedItems.forEach(cb => {
        if (cb.getAttribute('data-is-custom') === 'true') {
          customItemsToCreate.push({
            event: cb.getAttribute('data-event'),
            group: cb.getAttribute('data-group'),
            member: cb.getAttribute('data-member'),
            price: Number(cb.getAttribute('data-price')) || 0
          });
        } else {
          selectedOrderIds.push(cb.value);
        }
      });

      const selectedGroup = document.getElementById('groupSelect').value;
      const buyerNameVal = document.getElementById('buyerName').value;
      const payDateVal = document.getElementById('payDate').value;
      const last5Val = document.getElementById('last5').value.trim();

      try {
        const customCreatePromises = customItemsToCreate.map(cItem => {
          return addDoc(collection(db, "orders"), {
            buyerName: buyerNameVal,
            user: buyerNameVal,
            event: cItem.event,
            group: cItem.group,
            member: cItem.member,
            qty: 1,
            price: cItem.price,
            createdAt: new Date().toISOString(),
            paymentStatus: '待對帳',
            status: '待對帳',
            note: '買家自訂補款項目'
          }).then(docRef => docRef.id);
        });

        const createdCustomIds = await Promise.all(customCreatePromises);
        const finalAllRelatedOrderIds = [...selectedOrderIds, ...createdCustomIds];

        const useDepositChecked = document.getElementById('useDepositChk').checked;
        const useCreditChecked = document.getElementById('useCreditChk').checked;

        const data = {
          group: selectedGroup,
          buyerName: buyerNameVal,
          user: buyerNameVal,
          contactType: contactType,
          socialAccount: socialAcc,
          payDate: payDateVal,
          bankName: bankNameVal,
          bank: bankNameVal,
          amount: inputAmount,
          finalPay: inputAmount,
          last5: last5Val,
          bankLast5: last5Val,
          note: document.getElementById('note').value.trim(),
          useDeposit: useDepositChecked,
          useCredit: useCreditChecked,
          creditUsed: appliedCreditDeduction,
          depositUsed: appliedDepositDeduction,
          relatedOrderIds: finalAllRelatedOrderIds,
          createdAt: new Date().toISOString(),
          status: 'pending'
        };

        await addDoc(collection(db, "payments"), data);

        const overpaidAmount = inputAmount - currentCalculatedFinalTotal;
        let overpayAlertMsg = '';

        if (!isOtherBank && overpaidAmount > 0) {
          await addDoc(collection(db, "user_deposits"), {
            user: buyerNameVal,
            buyerName: buyerNameVal,
            payDate: payDateVal,
            bank: bankNameVal,
            amount: overpaidAmount,
            last5: last5Val,
            type: 'deposit',
            note: `匯款溢繳轉入 (應付 $${currentCalculatedFinalTotal} / 實付 $${inputAmount})`,
            createdAt: new Date().toISOString()
          });
          overpayAlertMsg = `\n\n💡 偵測到溢繳 $${overpaidAmount} 元，已自動為您轉入「預存儲值金」！`;
        }

        const updatePromises = selectedOrderIds.map(orderId => {
          return updateDoc(doc(db, "orders", orderId), {
            paymentStatus: '待對帳',
            status: '待對帳'
          });
        });
        await Promise.all(updatePromises);

        alert(`✅ 匯款回報已提交，選取的訂單已同步更新為「待對帳」，請等待管理者審核！${overpayAlertMsg}`);
        customAddedItems = [];
        extraBuyerBlocks = [];
        document.getElementById('paymentForm').reset();
        document.getElementById('formContent').style.display = 'none';
        document.getElementById('overpayTip').style.display = 'none';
        handleGroupChange();
        handleContactTypeChange();
      } catch (err) {
        alert('送出失敗：' + err.message);
      } finally {
        btn.disabled = false;
        btn.textContent = '提交對帳資料';
      }
    });

    function notifyHeight() {
      setTimeout(() => {
        window.parent.postMessage({ frameHeight: document.body.scrollHeight }, '*');
      }, 100);
    }
  </script>
</body>
</html>
