<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>匯款對帳回報</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 0; margin: 0; background: transparent; color: #333; }
    
    .payment-card {
      background: #fff;
      border: 1px solid #e4e7ed;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.02);
      max-width: 600px;
      margin: 0 auto;
    }

    .form-header { text-align: center; font-size: 20px; font-weight: bold; color: #303133; margin-bottom: 20px; }

    .form-group { margin-bottom: 18px; display: flex; flex-direction: column; gap: 6px; }
    .form-label { font-size: 14px; font-weight: bold; color: #303133; }
    
    input[type="text"], input[type="number"], input[type="date"], select, textarea {
      padding: 10px 12px;
      border: 1px solid #dcdfe6;
      border-radius: 8px;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
      width: 100%;
      box-sizing: border-box;
    }
    input:focus, select:focus, textarea:focus { border-color: #409eff; }

    .line-info-card {
      background: #fafafa;
      border: 1px solid #ebeef5;
      border-radius: 10px;
      padding: 12px 15px;
      margin-top: 4px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .line-contact-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #fff;
      border: 1px solid #e4e7ed;
      padding: 8px 12px;
      border-radius: 8px;
    }

    .line-contact-info { font-size: 13px; color: #303133; font-weight: 500; }

    .btn-copy {
      background: #f4f4f5;
      color: #606266;
      border: 1px solid #dcdfe6;
      padding: 5px 12px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.2s;
      white-space: nowrap;
    }
    .btn-copy:hover { background: #409eff; color: #fff; border-color: #409eff; }

    .line-warning-text {
      font-size: 12px;
      color: #e6a23c;
      line-height: 1.5;
      font-weight: bold;
    }

    .order-box {
      background: #f8f9fa;
      border: 1px solid #e4e7ed;
      border-radius: 10px;
      padding: 14px;
      margin-top: 4px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .order-item-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 13px;
      color: #303133;
      padding: 6px 0;
      border-bottom: 1px dashed #e4e7ed;
    }
    .order-item-row:last-child { border-bottom: none; }

    .bank-info-box {
      background: #fffbe6;
      border: 1px solid #ffe58f;
      border-radius: 8px;
      padding: 10px 12px;
      font-size: 12px;
      color: #d48806;
      line-height: 1.6;
    }

    .btn-add-extra {
      background: #67c23a;
      color: #fff;
      border: none;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: bold;
      cursor: pointer;
      align-self: flex-start;
    }

    .btn-submit {
      background: #67c23a;
      color: #fff;
      border: none;
      padding: 12px;
      border-radius: 8px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      width: 100%;
      margin-top: 10px;
      transition: background 0.2s;
    }
    .btn-submit:hover { background: #85ce61; }
  </style>
</head>
<body>

  <div class="payment-card">
    <div class="form-header">匯款對帳回報</div>

    <form id="paymentForm">
      <!-- 1. 選擇團體 -->
      <div class="form-group">
        <label class="form-label">1. 選擇團體 *</label>
        <select id="groupSelect" required onchange="handleGroupChange()">
          <option value="">請選擇團體</option>
        </select>
      </div>

      <!-- 2. 社群名稱 -->
      <div class="form-group">
        <label class="form-label">2. 社群名稱 *</label>
        <select id="buyerSelect" required disabled onchange="handleBuyerChange()">
          <option value="">請先選擇團體</option>
        </select>
      </div>

      <!-- 3. 收圖方式與聯絡帳號 -->
      <div class="form-group">
        <label class="form-label">3. 收圖方式與聯絡帳號 *</label>
        <select id="contactTypeSelect" required onchange="handleContactTypeChange()">
          <option value="">請選擇收圖方式...</option>
          <option value="Instagram">Instagram</option>
          <option value="Threads">Threads</option>
          <option value="官方 Line">官方 Line</option>
        </select>

        <!-- IG / Threads 專用輸入框 -->
        <input type="text" id="contactAccountInput" placeholder="請輸入帳號" style="display:none; margin-top:4px;">

        <!-- 官方 Line 提示卡片 -->
        <div id="lineInfoCard" class="line-info-card" style="display:none;">
          <div class="line-contact-row">
            <div class="line-contact-info">💬 <b>LINE ID :</b> @115oyenv</div>
            <button type="button" class="btn-copy" onclick="copyLineId()">📋 複製</button>
          </div>
          <div class="line-warning-text">
            ⚠️ 填完單後請主動發訊息到官方LINE 告知您的社群暱稱<br>
            否則我會無法辨識&不知道如何跟您聯絡
          </div>
        </div>
      </div>

      <!-- 4. 勾選待匯款訂單明細與金額小計區塊 -->
      <div class="form-group">
        <div class="order-box">
          <div style="font-size:13px; font-weight:bold; color:#303133;">選擇要一起匯款的訂單：</div>
          <div id="ordersListArea" style="font-size:13px; color:#909399;">目前無待匯款訂單</div>

          <button type="button" class="btn-add-extra" onclick="addExtraAmountRow()">＋ 新增其他金額 / 補款項目</button>
          <div id="extraRowsContainer"></div>

          <div style="border-top:1px dashed #dcdfe6; padding-top:8px; display:flex; flex-direction:column; gap:4px; font-size:12px;">
            <label><input type="checkbox" id="useDepositChk" onchange="calculateTotal()"> 勾選折抵預存儲值金 (餘額: $<span id="depositVal">0</span>)</label>
            <label><input type="checkbox" id="useCreditChk" onchange="calculateTotal()"> 勾選折抵可用抵用金 (餘額: $<span id="creditVal">0</span>)</label>
          </div>

          <div style="border-top:1px solid #e4e7ed; padding-top:8px; text-align:right;">
            <div style="font-size:12px; color:#606266;">勾選訂單小計：$<span id="subtotalVal">0</span></div>
            <div style="font-size:14px; font-weight:bold; color:#f56c6c; margin-top:2px;">【本次應匯款總金額】：$<span id="finalTotalVal">0</span></div>
          </div>

          <div class="bank-info-box">
            <b>• 匯款帳戶：</b><br>
            1️⃣ 臺刷(004) 012-0085-86876<br>
            2️⃣ 樂天(826) 81201-0028-03081<br>
            3️⃣ 中信(822) 7835401-30964
          </div>
        </div>
      </div>

      <!-- 5. 匯款日期 -->
      <div class="form-group">
        <label class="form-label">匯款日期 *</label>
        <input type="date" id="payDateInput" required>
      </div>

      <!-- 6. 匯款到上面哪個銀行帳戶 -->
      <div class="form-group">
        <label class="form-label">匯款到上面哪個銀行帳戶 *</label>
        <select id="bankTargetSelect" required>
          <option value="">請選擇匯款帳戶</option>
          <option value="臺灣銀行">臺灣銀行 (004)</option>
          <option value="樂天銀行">樂天銀行 (826)</option>
          <option value="中國信託">中國信託 (822)</option>
        </select>
      </div>

      <!-- 7. 匯款金額 -->
      <div class="form-group">
        <label class="form-label">匯款金額 ($) *</label>
        <input type="number" id="amountInput" placeholder="請輸入匯款金額 (選擇「其他」或 0 元均可提交)" required>
      </div>

      <!-- 8. 匯款帳號末 5 碼 -->
      <div class="form-group">
        <label class="form-label">匯款帳號末 5 碼 *</label>
        <input type="text" id="bankLast5Input" placeholder="例如: 12345 (全額折抵可填 00000)" required>
      </div>

      <!-- 9. 備註說明 -->
      <div class="form-group">
        <label class="form-label">備註說明</label>
        <textarea id="noteInput" rows="3" placeholder="如有特殊事項請在此註明.. (按 Enter 可換行)"></textarea>
      </div>

      <button type="submit" class="btn-submit">提交對帳資料</button>
    </form>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, addDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDF7QySG1Jj4gdZvXwMRaKjRmI-lFKpj7k",
      authDomain: "forsure0922.firebaseapp.com",
      databaseURL: "https://forsure0922-default-rtdb.firebaseio.com",
      projectId: "forsure0922",
      storageBucket: "forsure0922.firebasestorage.app",
      messagingSenderId: "817449290174",
      appId: "1:817449290174:web:6b4ec1d36c171ff97011ef"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let ordersCache = [];
    let groupList = [];

    document.addEventListener('DOMContentLoaded', async () => {
      document.getElementById('payDateInput').value = new Date().toISOString().split('T')[0];

      try {
        const gRes = await fetch('../json/group.json');
        groupList = await gRes.json();
        
        const gSelect = document.getElementById('groupSelect');
        groupList.forEach(g => {
          const opt = document.createElement('option');
          opt.value = g;
          opt.textContent = g;
          gSelect.appendChild(opt);
        });
      } catch(e) {}

      onSnapshot(collection(db, "orders"), snap => {
        ordersCache = [];
        snap.forEach(d => ordersCache.push({ id: d.id, ...d.data() }));
        handleGroupChange();
      });

      notifyHeight();
    });

    window.handleGroupChange = () => {
      const selectedGroup = document.getElementById('groupSelect').value;
      const buyerSelect = document.getElementById('buyerSelect');
      buyerSelect.innerHTML = '';

      if (!selectedGroup) {
        buyerSelect.disabled = true;
        buyerSelect.innerHTML = '<option value="">請先選擇團體</option>';
        resetOrderArea();
        return;
      }

      // 精準篩選「只有待匯款」訂單的買家（不剪裁原樣暱稱）
      const unpaidBuyersSet = new Set();
      ordersCache.forEach(o => {
        const grp = o.group || 'Stray Kids';
        if (grp === selectedGroup) {
          const pStatus = o.paymentStatus || o.status || '';
          const isPaidOrChecking = o.hasPaid === true || ['已對帳', '待對帳', '對帳中', '已完工', '已結束'].includes(pStatus);
          
          if (!isPaidOrChecking) {
            const rawName = o.user || o.buyerName || o.nickname || '';
            if (rawName.trim()) unpaidBuyersSet.add(rawName);
          }
        }
      });

      if (unpaidBuyersSet.size === 0) {
        buyerSelect.disabled = true;
        buyerSelect.innerHTML = '<option value="">目前尚無待匯款買家</option>';
        resetOrderArea();
      } else {
        buyerSelect.disabled = false;
        buyerSelect.innerHTML = '<option value="">請選擇買家暱稱</option>';
        Array.from(unpaidBuyersSet).sort((a,b)=>a.localeCompare(b,'zh-TW')).forEach(u => {
          const opt = document.createElement('option');
          opt.value = u;
          opt.textContent = u;
          buyerSelect.appendChild(opt);
        });
      }
      notifyHeight();
    };

    window.handleBuyerChange = () => {
      const selectedGroup = document.getElementById('groupSelect').value;
      const selectedBuyer = document.getElementById('buyerSelect').value;
      const container = document.getElementById('ordersListArea');
      container.innerHTML = '';

      if (!selectedBuyer) {
        resetOrderArea();
        return;
      }

      const buyerOrders = ordersCache.filter(o => {
        const grp = o.group || 'Stray Kids';
        const name = o.user || o.buyerName || o.nickname || '';
        const pStatus = o.paymentStatus || o.status || '';
        const isPaidOrChecking = o.hasPaid === true || ['已對帳', '待對帳', '對帳中', '已完工', '已結束'].includes(pStatus);
        
        return grp === selectedGroup && name === selectedBuyer && !isPaidOrChecking;
      });

      if (buyerOrders.length === 0) {
        container.innerHTML = '<div style="color:#909399;">目前無待匯款訂單</div>';
      } else {
        buyerOrders.forEach(ord => {
          const price = Number(ord.totalPrice || ord.price || 0);
          const ev = ord.event || ord.eventName || '活動';
          const mem = ord.member || '';
          const qty = ord.count || ord.qty || ord.quantity || '';
          const labelText = `${ev} (${mem}${qty ? ' / ' + qty + '張' : ''})`;

          const row = document.createElement('div');
          row.className = 'order-item-row';
          row.innerHTML = `
            <label style="display:flex; align-items:center; gap:6px; cursor:pointer;">
              <input type="checkbox" class="order-chk" data-price="${price}" data-id="${ord.id}" checked onchange="calculateTotal()">
              <span>${labelText}</span>
            </label>
            <span style="font-weight:bold; color:#409eff;">$${price}</span>
          `;
          container.appendChild(row);
        });
      }

      calculateTotal();
      notifyHeight();
    };

    window.handleContactTypeChange = () => {
      const type = document.getElementById('contactTypeSelect').value;
      const input = document.getElementById('contactAccountInput');
      const lineCard = document.getElementById('lineInfoCard');

      if (type === 'Instagram' || type === 'Threads') {
        input.style.display = 'block';
        input.required = true;
        lineCard.style.display = 'none';
      } else if (type === '官方 Line') {
        input.style.display = 'none';
        input.required = false;
        input.value = '';
        lineCard.style.display = 'flex';
      } else {
        input.style.display = 'none';
        input.required = false;
        lineCard.style.display = 'none';
      }
      notifyHeight();
    };

    window.copyLineId = () => {
      navigator.clipboard.writeText('@115oyenv').then(() => {
        alert('✅ 已成功複製 LINE ID: @115oyenv');
      }).catch(() => {
        alert('LINE ID: @115oyenv');
      });
    };

    window.addExtraAmountRow = () => {
      const container = document.getElementById('extraRowsContainer');
      const div = document.createElement('div');
      div.style.cssText = 'display:flex; gap:6px; margin-top:6px; align-items:center;';
      div.innerHTML = `
        <input type="text" placeholder="項目說明" class="extra-desc" style="flex:2; padding:6px 8px;">
        <input type="number" placeholder="金額" class="extra-price" style="flex:1; padding:6px 8px;" oninput="calculateTotal()">
        <button type="button" onclick="this.parentElement.remove(); calculateTotal();" style="background:#fef0f0; color:#f56c6c; border:1px solid #fde2e2; border-radius:4px; padding:4px 8px; cursor:pointer;">✕</button>
      `;
      container.appendChild(div);
      notifyHeight();
    };

    window.calculateTotal = () => {
      let subtotal = 0;
      
      document.querySelectorAll('.order-chk:checked').forEach(chk => {
        subtotal += Number(chk.dataset.price || 0);
      });

      document.querySelectorAll('.extra-price').forEach(inp => {
        subtotal += Number(inp.value || 0);
      });

      document.getElementById('subtotalVal').textContent = subtotal;

      let finalTotal = subtotal;
      const useDeposit = document.getElementById('useDepositChk').checked;
      const useCredit = document.getElementById('useCreditChk').checked;
      
      const depositVal = Number(document.getElementById('depositVal').textContent || 0);
      const creditVal = Number(document.getElementById('creditVal').textContent || 0);

      if (useDeposit) finalTotal -= depositVal;
      if (useCredit) finalTotal -= creditVal;

      if (finalTotal < 0) finalTotal = 0;

      document.getElementById('finalTotalVal').textContent = finalTotal;
      document.getElementById('amountInput').value = finalTotal;
    };

    function resetOrderArea() {
      document.getElementById('ordersListArea').innerHTML = '<div style="color:#909399;">目前無待匯款訂單</div>';
      document.getElementById('extraRowsContainer').innerHTML = '';
      document.getElementById('subtotalVal').textContent = '0';
      document.getElementById('finalTotalVal').textContent = '0';
      document.getElementById('amountInput').value = '';
    }

    document.getElementById('paymentForm').onsubmit = async (e) => {
      e.preventDefault();

      const group = document.getElementById('groupSelect').value;
      const buyerName = document.getElementById('buyerSelect').value;
      const contactType = document.getElementById('contactTypeSelect').value;
      const contactAccount = (contactType === '官方 Line') ? '@115oyenv' : document.getElementById('contactAccountInput').value.trim();
      
      const relatedOrderIds = [];
      document.querySelectorAll('.order-chk:checked').forEach(c => relatedOrderIds.push(c.dataset.id));

      const payDate = document.getElementById('payDateInput').value;
      const bankTarget = document.getElementById('bankTargetSelect').value;
      const amount = Number(document.getElementById('amountInput').value);
      const bankLast5 = document.getElementById('bankLast5Input').value.trim();
      const note = document.getElementById('noteInput').value.trim();

      const useDeposit = document.getElementById('useDepositChk').checked;
      const useCredit = document.getElementById('useCreditChk').checked;

      try {
        // 寫入 100% 對齊 Firebase payments 集合結構
        await addDoc(collection(db, "payments"), {
          group: group,
          user: buyerName,
          buyerName: buyerName,
          contactType: contactType,
          socialAccount: contactAccount,
          relatedOrderIds: relatedOrderIds,
          payDate: payDate,
          bank: bankTarget,
          bankName: bankTarget,
          finalPay: amount,
          amount: amount,
          last5: bankLast5,
          bankLast5: bankLast5,
          note: note,
          useDeposit: useDeposit,
          useCredit: useCredit,
          depositUsed: 0,
          creditUsed: 0,
          hasDeducted: false,
          status: "pending",
          createdAt: new Date().toISOString()
        });

        alert('🎉 匯款對帳單已成功提交！');
        document.getElementById('paymentForm').reset();
        document.getElementById('payDateInput').value = new Date().toISOString().split('T')[0];
        handleGroupChange();
        handleContactTypeChange();
      } catch (err) {
        alert('提交失敗: ' + err.message);
      }
    };

    function notifyHeight() {
      setTimeout(() => {
        window.parent.postMessage({ frameHeight: document.body.scrollHeight }, '*');
      }, 100);
    }
  </script>
</body>
</html>
