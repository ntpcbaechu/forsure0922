<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>匯款表單</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 0; margin: 0; background: transparent; color: #333; }
    .form-group { margin-bottom: 16px; }
    label { font-size: 14px; font-weight: bold; color: #303133; display: block; margin-bottom: 6px; }
    input, select, textarea { width: 100%; padding: 12px; border: 1px solid #dcdfe6; border-radius: 10px; font-size: 15px; box-sizing: border-box; background: #fff; font-family: inherit; }
    textarea { resize: vertical; min-height: 80px; }
    button { width: 100%; padding: 14px; background: #67c23a; color: white; border: none; border-radius: 10px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px; }
    button:disabled { background: #b3e19d; }

    .info-card { background: #f4f4f5; border-radius: 10px; padding: 12px; margin-bottom: 16px; font-size: 13px; color: #606266; border: 1px solid #e4e7ed; }
    .info-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
    .orders-select-box { background: #fff; border: 1px solid #dcdfe6; border-radius: 8px; padding: 10px; max-height: 220px; overflow-y: auto; margin-top: 6px; }
    
    .order-item { display: flex; align-items: center; justify-content: space-between; font-size: 13px; padding: 6px 0; border-bottom: 1px dashed #ebeef5; }
    .order-item:last-child { border-bottom: none; }
    .order-left { display: flex; align-items: center; gap: 8px; }
    .order-chk, .credit-chk, .deposit-chk { width: 16px; height: 16px; margin: 0; cursor: pointer; }
    
    .price-box { display: flex; align-items: center; gap: 6px; font-weight: bold; }
    .price-original-strike { text-decoration: line-through; color: #909399; font-size: 12px; }
    .price-final { color: #f56c6c; font-size: 14px; }

    .btn-add-custom { background: #67c23a; color: #fff; border: none; padding: 6px 12px; border-radius: 6px; font-size: 12px; font-weight: bold; cursor: pointer; margin-top: 8px; display: inline-flex; align-items: center; gap: 4px; }
    .btn-add-custom:hover { background: #5daf34; }
    .custom-form-box { background: #fff; border: 1px solid #67c23a; border-radius: 8px; padding: 10px; margin-top: 8px; display: none; }
    .custom-form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 8px; }
    .custom-form-grid input, .custom-form-grid select { padding: 6px 8px; font-size: 12px; border-radius: 6px; }

    .summary-right-box { text-align: right; border-top: 1px dashed #dcdfe6; padding-top: 8px; margin-top: 10px; }
    .summary-right-row { display: flex; justify-content: flex-end; gap: 12px; align-items: center; margin-bottom: 4px; }

    .bank-info-box { background: #fffbe6; border: 1px solid #ffe58f; border-radius: 10px; padding: 12px; margin-bottom: 16px; font-size: 13px; color: #595959; line-height: 1.6; }
    .bank-info-title { font-weight: bold; color: #d46b08; font-size: 14px; margin-bottom: 6px; }
    .bank-warning { color: #f56c6c; font-weight: bold; margin-top: 6px; }

    .overpay-tip { color: #67c23a; font-size: 13px; font-weight: bold; margin-top: 6px; display: none; }
  </style>
</head>
<body>

  <h3 style="margin-top:0; margin-bottom:20px; text-align:center; font-size:20px;">匯款對帳回報</h3>
  <form id="paymentForm">
    <div class="form-group">
      <label>社群名稱 *</label>
      <select id="buyerName" required><option value="">載入中...</option></select>
    </div>
	
	<div class="form-group">
	  <label>IG / Threads 帳號 *</label>
	  <input type="text" id="socialAccount" placeholder="例: ntpcbaechu" required>
	</div>

    <div id="formContent" style="display: none;">
      <div class="info-card">
        <div style="font-weight:bold; margin-bottom:6px; color:#303133;">選擇要一起匯款的訂單：</div>
        <div class="orders-select-box" id="ordersList">無待匯款訂單</div>

        <div>
          <button type="button" class="btn-add-custom" id="toggleCustomBtn">➕ 新增其他金額 / 補款項目</button>
          
          <div class="custom-form-box" id="customFormBox">
            <div style="font-weight:bold; color:#67c23a; margin-bottom:6px; font-size:12px;">新增自訂補款/額外金額：</div>
            <div class="custom-form-grid">
              <input type="text" id="custDate" placeholder="日期 (例: 260801)">
              <input type="text" id="custEvent" placeholder="活動名稱 (例: 周邊加購)">
              <select id="custMember"><option value="">選擇成員</option></select>
              <input type="number" id="custPrice" min="1" placeholder="金額 ($)">
            </div>
            <div style="display:flex; gap:6px;">
              <button type="button" id="addCustomItemBtn" style="padding:6px 10px; font-size:12px; margin-top:0; background:#67c23a;">確認加入勾選清單</button>
              <button type="button" id="closeCustomItemBtn" style="padding:6px 10px; font-size:12px; margin-top:0; background:#909399;">取消</button>
            </div>
          </div>
        </div>

        <!-- 1. 折抵預存儲值金 -->
        <div class="info-row" style="margin-top:12px; padding-top:8px; border-top: 1px dashed #dcdfe6;">
          <label style="font-weight:normal; font-size:13px; margin:0; cursor:pointer; display:flex; align-items:center; gap:6px;">
            <input type="checkbox" id="useDepositChk" class="deposit-chk">
            <span>勾選折抵預存儲值金 (餘額: <b style="color:#409eff;" id="depositBalance">$0</b>)</span>
          </label>
          <b style="color:#909399;" id="depositDeduct">-</b>
        </div>

        <!-- 2. 折抵可用抵用金 -->
        <div class="info-row" style="margin-top:6px; padding-top:6px; border-top: 1px dashed #ebeef5;">
          <label style="font-weight:normal; font-size:13px; margin:0; cursor:pointer; display:flex; align-items:center; gap:6px;">
            <input type="checkbox" id="useCreditChk" class="credit-chk">
            <span>勾選折抵可用抵用金 (餘額: <b style="color:#67c23a;" id="creditBalance">$0</b>)</span>
          </label>
          <b style="color:#909399;" id="creditDeduct">-</b>
        </div>

        <div class="summary-right-box">
          <div class="summary-right-row">
            <span>勾選訂單小計：</span>
            <b style="color:#606266; font-size:14px;" id="pendingTotal">$0</b>
          </div>
          <div class="summary-right-row" style="margin-top:4px;">
            <span style="font-weight:bold; color:#303133; font-size:15px;">【本次應匯款總金額】：</span>
            <b style="color:#f56c6c; font-size:20px;" id="finalPayTotal">$0</b>
          </div>
        </div>
      </div>

      <!-- 銀行帳號卡片：動態讀取 json/bank_info.json -->
      <div class="bank-info-box" id="bankInfoCard">
        <div class="bank-info-title">🔸匯款帳號：</div>
        <div>載入帳號資料中...</div>
      </div>

      <div class="form-group">
        <label>匯款日期 *</label>
        <input type="date" id="payDate" required>
      </div>

      <!-- 銀行選單：動態讀取 json/banks.json -->
      <div class="form-group">
        <label>匯款銀行 *</label>
        <select id="bankName" required>
          <option value="">載入銀行選項中...</option>
        </select>
      </div>

      <div class="form-group">
        <label>匯款金額 ($) *</label>
        <input type="number" id="amount" min="0" placeholder="請輸入匯款金額" required>
        <div id="overpayTip" class="overpay-tip"></div>
      </div>

      <div class="form-group">
        <label>匯款帳號末 5 碼 *</label>
        <input type="text" id="last5" maxlength="5" placeholder="例如: 12345" required>
      </div>

      <div class="form-group">
        <label>備註說明</label>
        <textarea id="note" placeholder="如有特殊事項請在此註明... (按 Enter 可換行)"></textarea>
      </div>

      <button type="submit" id="submitBtn">提交對帳資料</button>
    </div>
  </form>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, addDoc, onSnapshot, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDF7QySG1Jj4gdZvXwMRaKjRmI-lFKpj7k",
      authDomain: "forsure0922.firebaseapp.com",
      databaseURL: "https://forsure0922-default-rtdb.firebaseio.com",
      projectId: "forsure0922",
      storageBucket: "forsure0922.firebasestorage.app",
      messagingSenderId: "817449290174",
      appId: "1:817449290174:web:6b4ec1d36c171ff97011ef"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    function loadBankInfo() {
      fetch('../json/bank_info.json')
        .then(res => res.json())
        .then(data => {
          const card = document.getElementById('bankInfoCard');
          let html = `<div class="bank-info-title">${data.title || '🔸匯款帳號：'}</div>`;
          if (data.accounts && Array.isArray(data.accounts)) {
            data.accounts.forEach(acc => { html += `<div>${acc}</div>`; });
          }
          if (data.note) { html += `<div class="bank-warning">${data.note}</div>`; }
          card.innerHTML = html;
          notifyHeight();
        })
        .catch(() => {
          document.getElementById('bankInfoCard').innerHTML = `
            <div class="bank-info-title">🔸匯款帳號：</div>
            <div> 1️⃣ 台銀(004) 012-0085-86876</div>
            <div> 2️⃣ 樂天(826) 81201-0028-03081</div>
            <div> 3️⃣ 中信(822) 7835401-30964</div>
          `;
        });
    }

    function loadBankDropdown() {
      fetch('../json/banks.json')
        .then(res => res.json())
        .then(bankList => {
          const bankSel = document.getElementById('bankName');
          bankSel.innerHTML = '<option value="">請選擇匯款銀行</option>';
          bankList.forEach(b => {
            bankSel.innerHTML += `<option value="${b}">${b}</option>`;
          });
        })
        .catch(() => {
          const bankSel = document.getElementById('bankName');
          bankSel.innerHTML = `
            <option value="">請選擇匯款銀行</option>
            <option value="台銀">台銀</option>
            <option value="樂天">樂天</option>
            <option value="中信">中信</option>
            <option value="台新">台新</option>
            <option value="抵用金/儲值金">抵用金/儲值金</option>
          `;
        });
    }

    let memberOrderList = ["方燦", "Lee Know", "彰彬", "鉉辰", "HAN", "Felix", "昇玟", "I.N"];
    fetch('../json/members.json').then(r => r.json()).then(arr => { 
      memberOrderList = arr; 
      initCustMemberDropdown();
    }).catch(() => { initCustMemberDropdown(); });

    function initCustMemberDropdown() {
      const sel = document.getElementById('custMember');
      if (!sel) return;
      sel.innerHTML = '<option value="">選擇成員</option>';
      memberOrderList.forEach(m => {
        sel.innerHTML += `<option value="${m}">${m}</option>`;
      });
    }

    let allCredits = [];
    let allDeposits = [];
    let allOrders = [];
    let customAddedItems = [];
    let photoProgressMap = {};
    let eventSettingsMap = {};

    let currentAvailableCredit = 0;
    let currentAvailableDeposit = 0;
    let currentCalculatedFinalTotal = 0;

    let appliedCreditDeduction = 0;
    let appliedDepositDeduction = 0;

    document.getElementById('paymentForm').addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && e.target.tagName !== 'TEXTAREA') {
        e.preventDefault();
      }
    });

    document.addEventListener('DOMContentLoaded', () => {
      loadBankInfo();
      loadBankDropdown();

      onSnapshot(collection(db, "photo_progress"), snap => {
        photoProgressMap = {};
        snap.forEach(d => {
          const data = d.data();
          const evName = data.eventName || data.event || '';
          const mem = data.member || '';
          if (evName && mem) {
            photoProgressMap[`${evName}_${mem}`] = data.status || '等圖中';
          }
        });
        updateBuyerDropdownAndDetails();
      });

      onSnapshot(collection(db, "event_settings"), snap => {
        eventSettingsMap = {};
        snap.forEach(d => {
          const data = d.data();
          const evName = data.name || data.rawName || data.eventName || data.event || '';
          const mem = data.member || '';
          
          const estPrice = Number(data.estimatedPrice) || Number(data.price) || 0;
          const actPrice = Number(data.actualPrice) || 0;
          const packQty = Number(data.packQty) || 1;
          const discounts = data.discounts || [];

          if (evName) {
            const key = `${evName}_${mem}`;
            eventSettingsMap[key] = { estPrice, actPrice, packQty, discounts };
            if (data.rawName) {
              eventSettingsMap[`${data.rawName}_${mem}`] = { estPrice, actPrice, packQty, discounts };
            }
          }
        });
        updateBuyerDropdownAndDetails();
      });

      onSnapshot(collection(db, "user_credits"), snap => {
        allCredits = [];
        snap.forEach(d => allCredits.push({ id: d.id, ...d.data() }));
        updateBuyerDropdownAndDetails();
      });

      onSnapshot(collection(db, "user_deposits"), snap => {
        allDeposits = [];
        snap.forEach(d => allDeposits.push({ id: d.id, ...d.data() }));
        updateBuyerDropdownAndDetails();
      });

      onSnapshot(collection(db, "orders"), snap => {
        allOrders = [];
        snap.forEach(d => allOrders.push({ id: d.id, ...d.data() }));
        updateBuyerDropdownAndDetails();
      });

      document.getElementById('buyerName').addEventListener('change', () => {
        customAddedItems = [];
        renderBuyerDetails();
      });
      
      document.getElementById('useDepositChk').addEventListener('change', calcSelectedTotal);
      document.getElementById('useCreditChk').addEventListener('change', calcSelectedTotal);

      document.getElementById('amount').addEventListener('input', checkOverpayTip);

      document.getElementById('toggleCustomBtn').addEventListener('click', () => {
        const box = document.getElementById('customFormBox');
        box.style.display = (box.style.display === 'block') ? 'none' : 'block';
        notifyHeight();
      });

      document.getElementById('closeCustomItemBtn').addEventListener('click', () => {
        document.getElementById('customFormBox').style.display = 'none';
        notifyHeight();
      });

      document.getElementById('addCustomItemBtn').addEventListener('click', addCustomItem);

      notifyHeight();
    });

    function checkOverpayTip() {
      const inputAmount = parseFloat(document.getElementById('amount').value) || 0;
      const tipElem = document.getElementById('overpayTip');
      
      if (inputAmount > currentCalculatedFinalTotal && currentCalculatedFinalTotal > 0) {
        const overpaid = inputAmount - currentCalculatedFinalTotal;
        tipElem.textContent = `💡 溢繳提醒：多付的 $${overpaid} 元提交後將「自動轉為預存儲值金」！🟢`;
        tipElem.style.display = 'block';
      } else {
        tipElem.style.display = 'none';
      }
      notifyHeight();
    }

    function updateBuyerDropdownAndDetails() {
      const pendingBuyers = new Set();

      allOrders.forEach(o => {
        const name = o.user || o.buyerName || o.name || o.buyer;
        const pendingMatch = (o.paymentStatus === 'pending_payment' || o.paymentStatus === '待匯款' || o.status === 'pending_payment' || o.status === '待匯款' || !o.paymentStatus);
        
        const ordEvent = o.event || o.fullEvent || o.eventName || '';
        const ordMember = o.member || '';
        const progressStatus = photoProgressMap[`${ordEvent}_${ordMember}`];
        const isNotWaitingPhoto = progressStatus !== '等圖中';

        if (name && pendingMatch && isNotWaitingPhoto) {
          pendingBuyers.add(String(name).trim());
        }
      });

      const buyerSel = document.getElementById('buyerName');
      const currentSelected = buyerSel.value;
      buyerSel.innerHTML = '<option value="">請選擇您的名稱</option>';

      Array.from(pendingBuyers).sort((a, b) => a.localeCompare(b, 'zh-TW')).forEach(b => {
        buyerSel.innerHTML += `<option value="${b}">${b}</option>`;
      });

      if (currentSelected && pendingBuyers.has(currentSelected)) {
        buyerSel.value = currentSelected;
      } else if (currentSelected && !pendingBuyers.has(currentSelected)) {
        buyerSel.value = '';
      }

      renderBuyerDetails();
    }

    function addCustomItem() {
      const dt = document.getElementById('custDate').value.trim();
      const ev = document.getElementById('custEvent').value.trim();
      const mem = document.getElementById('custMember').value;
      const price = parseFloat(document.getElementById('custPrice').value) || 0;

      if (!ev || price <= 0) {
        alert('請至少輸入活動名稱與有效的金額！');
        return;
      }

      const fullEvName = dt ? `${dt} ${ev}` : ev;
      const customId = `custom_${Date.now()}`;

      customAddedItems.push({
        id: customId,
        event: fullEvName,
        member: mem || '全體',
        price: price
      });

      document.getElementById('custDate').value = '';
      document.getElementById('custEvent').value = '';
      document.getElementById('custMember').value = '';
      document.getElementById('custPrice').value = '';
      document.getElementById('customFormBox').style.display = 'none';

      renderBuyerDetails();
    }

    function renderBuyerDetails() {
      const selectedBuyer = document.getElementById('buyerName').value;
      const formContent = document.getElementById('formContent');

      if (!selectedBuyer) {
        formContent.style.display = 'none';
        notifyHeight();
        return;
      }

      formContent.style.display = 'block';

      const userCredits = allCredits.filter(c => (c.user === selectedBuyer || c.buyerName === selectedBuyer || c.name === selectedBuyer));
      currentAvailableCredit = userCredits.reduce((sum, c) => sum + ((Number(c.credit) || Number(c.amount) || 0) - (Number(c.used) || 0)), 0);
      document.getElementById('creditBalance').textContent = `$${currentAvailableCredit}`;
      document.getElementById('useCreditChk').checked = false;

      const userDeposits = allDeposits.filter(d => (d.user === selectedBuyer || d.buyerName === selectedBuyer || d.name === selectedBuyer));
      currentAvailableDeposit = userDeposits.reduce((sum, d) => {
        const amt = Number(d.amount) || 0;
        return (d.type !== 'usage') ? (sum + amt) : (sum - amt);
      }, 0);
      document.getElementById('depositBalance').textContent = `$${currentAvailableDeposit}`;
      document.getElementById('useDepositChk').checked = false;

      const userOrders = allOrders.filter(o => {
        const nameMatch = (o.user === selectedBuyer || o.buyerName === selectedBuyer || o.name === selectedBuyer || o.buyer === selectedBuyer);
        const pendingMatch = (o.paymentStatus === 'pending_payment' || o.paymentStatus === '待匯款' || o.status === 'pending_payment' || o.status === '待匯款' || !o.paymentStatus);
        
        const ordEvent = o.event || o.fullEvent || o.eventName || '';
        const ordMember = o.member || '';
        const progressStatus = photoProgressMap[`${ordEvent}_${ordMember}`];
        const isNotWaitingPhoto = progressStatus !== '等圖中';

        return nameMatch && pendingMatch && isNotWaitingPhoto;
      });

      userOrders.sort((a, b) => {
        const evA = a.event || a.fullEvent || a.eventName || '';
        const evB = b.event || b.fullEvent || b.eventName || '';

        const matchA = evA.match(/\d{6}/);
        const matchB = evB.match(/\d{6}/);
        const dateA = matchA ? parseInt(matchA[0], 10) : 0;
        const dateB = matchB ? parseInt(matchB[0], 10) : 0;

        if (dateA !== dateB) return dateA - dateB;

        const memA = a.member || '';
        const memB = b.member || '';
        let idxA = memberOrderList.indexOf(memA);
        let idxB = memberOrderList.indexOf(memB);
        if (idxA === -1) idxA = 99;
        if (idxB === -1) idxB = 99;

        return idxA - idxB;
      });

      const ordersList = document.getElementById('ordersList');
      ordersList.innerHTML = '';

      if (userOrders.length === 0 && customAddedItems.length === 0) {
        ordersList.innerHTML = '<span style="color:#909399;">目前無待匯款訂單</span>';
        document.getElementById('pendingTotal').textContent = '$0';
        document.getElementById('finalPayTotal').textContent = '$0';
      } else {
        userOrders.forEach(ord => {
          const qty = Number(ord.quantity !== undefined ? ord.quantity : (ord.qty !== undefined ? ord.qty : ord.count)) || 1;
          const ordEvent = ord.event || ord.fullEvent || ord.eventName || '';
          const ordMember = ord.member || '';
          
          const setting = eventSettingsMap[`${ordEvent}_${ordMember}`] || {};
          const packQty = setting.packQty || 1;
          const packsCount = Math.round(qty / packQty);

          const estPrice = setting.estPrice || 0;
          const actPrice = setting.actPrice || 0;

          let baseUnitPrice = (actPrice > 0) ? actPrice : estPrice;
          if (baseUnitPrice === 0) {
            baseUnitPrice = Number(ord.price) || Number(ord.unitPrice) || 0;
          }

          let calculatedFinalPrice = packsCount * baseUnitPrice;
          const discounts = setting.discounts || [];
          if (Array.isArray(discounts)) {
            const userDisc = discounts.find(d => d.targetUser === selectedBuyer);
            if (userDisc) {
              const discCount = Math.min(packsCount, Number(userDisc.count) || 0);
              const discPrice = Number(userDisc.price) || 0;
              calculatedFinalPrice = (discCount * discPrice) + ((packsCount - discCount) * baseUnitPrice);
            }
          }

          const calculatedEstPrice = Math.round(packsCount * estPrice);

          let priceHtml = `<span class="price-final">$${calculatedFinalPrice}</span>`;
          if (actPrice > 0 && estPrice > 0 && calculatedFinalPrice !== calculatedEstPrice) {
            priceHtml = `
              <span class="price-final">$${calculatedFinalPrice}</span>
              <span class="price-original-strike">$${calculatedEstPrice}</span>
            `;
          }

          ordersList.innerHTML += `
            <div class="order-item">
              <div class="order-left">
                <input type="checkbox" class="order-chk" value="${ord.id}" data-price="${calculatedFinalPrice}">
                <span>📌 ${ordEvent || '未命名活動'} (${ordMember || '全體'}) - ${qty} 張</span>
              </div>
              <div class="price-box">${priceHtml}</div>
            </div>
          `;
        });

        customAddedItems.forEach(cItem => {
          ordersList.innerHTML += `
            <div class="order-item" style="background:#f0f9eb; padding:6px 8px; border-radius:6px; margin-bottom:4px;">
              <div class="order-left">
                <input type="checkbox" class="order-chk custom-chk" value="${cItem.id}" data-price="${cItem.price}" data-is-custom="true" data-event="${cItem.event}" data-member="${cItem.member}" checked>
                <span>➕ [自訂補款] ${cItem.event} (${cItem.member})</span>
              </div>
              <div class="price-box"><span class="price-final">$${cItem.price}</span></div>
            </div>
          `;
        });

        document.querySelectorAll('.order-chk').forEach(chk => {
          chk.addEventListener('change', calcSelectedTotal);
        });
        calcSelectedTotal();
      }

      notifyHeight();
    }

    function calcSelectedTotal() {
      const chks = document.querySelectorAll('.order-chk:checked');
      let orderSubtotal = 0;
      chks.forEach(chk => {
        orderSubtotal += Number(chk.getAttribute('data-price')) || 0;
      });

      let remainingToPay = orderSubtotal;

      const useDeposit = document.getElementById('useDepositChk').checked;
      let depositDeduction = 0;
      if (useDeposit && currentAvailableDeposit > 0) {
        depositDeduction = Math.min(remainingToPay, currentAvailableDeposit);
        remainingToPay -= depositDeduction;
      }

      const useCredit = document.getElementById('useCreditChk').checked;
      let creditDeduction = 0;
      if (useCredit && currentAvailableCredit > 0) {
        creditDeduction = Math.min(remainingToPay, currentAvailableCredit);
        remainingToPay -= creditDeduction;
      }

      appliedDepositDeduction = depositDeduction;
      appliedCreditDeduction = creditDeduction;

      currentCalculatedFinalTotal = Math.max(0, remainingToPay);

      document.getElementById('pendingTotal').textContent = `$${orderSubtotal.toFixed(1).replace(/\.0$/, '')}`;
      
      const depositDeductElem = document.getElementById('depositDeduct');
      if (depositDeduction > 0) {
        depositDeductElem.textContent = `-$${depositDeduction.toFixed(1).replace(/\.0$/, '')}`;
        depositDeductElem.style.color = '#409eff';
      } else {
        depositDeductElem.textContent = '-';
        depositDeductElem.style.color = '#909399';
      }

      const creditDeductElem = document.getElementById('creditDeduct');
      if (creditDeduction > 0) {
        creditDeductElem.textContent = `-$${creditDeduction.toFixed(1).replace(/\.0$/, '')}`;
        creditDeductElem.style.color = '#67c23a';
      } else {
        creditDeductElem.textContent = '-';
        creditDeductElem.style.color = '#909399';
      }

      document.getElementById('finalPayTotal').textContent = `$${currentCalculatedFinalTotal.toFixed(1).replace(/\.0$/, '')}`;

      // 全額折抵 ($0) 自動帶入邏輯
      const bankSel = document.getElementById('bankName');
      const amtInput = document.getElementById('amount');
      const last5Input = document.getElementById('last5');

      if (currentCalculatedFinalTotal === 0 && orderSubtotal > 0 && (useDeposit || useCredit)) {
        if (Array.from(bankSel.options).some(o => o.value === '抵用金/儲值金')) {
          bankSel.value = '抵用金/儲值金';
        }
        amtInput.value = '0';
        last5Input.value = '00000';
      }

      checkOverpayTip();
    }

    document.getElementById('paymentForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      const bankNameVal = document.getElementById('bankName').value;
      if (!bankNameVal) {
        alert('請選擇匯款銀行！');
        return;
      }

      const inputAmount = parseFloat(document.getElementById('amount').value);
      if (isNaN(inputAmount)) {
        alert('請輸入有效的匯款金額！');
        return;
      }

      // 🔒 嚴格驗證機制：只有在應匯金額為 $0 且銀行選擇抵用金/儲值金時允許填 0
      const isFullDeduction = (currentCalculatedFinalTotal === 0) && (bankNameVal === '抵用金/儲值金');

      if (!isFullDeduction && inputAmount <= 0) {
        alert('⚠️ 請選擇『抵用金/儲值金』或輸入有效的金額（不可為 0 元）！');
        return;
      }

      if (inputAmount < currentCalculatedFinalTotal) {
        alert(`⚠️ 金額不足！\n\n本次應匯款總金額是：$${currentCalculatedFinalTotal}\n您填寫的金額是：$${inputAmount}\n\n請重新確認匯款金額！`);
        return;
      }

      const btn = document.getElementById('submitBtn');
      btn.disabled = true;
      btn.textContent = '送出中...';

      const selectedOrderIds = [];
      const customItemsToCreate = [];

      document.querySelectorAll('.order-chk:checked').forEach(cb => {
        if (cb.getAttribute('data-is-custom') === 'true') {
          customItemsToCreate.push({
            event: cb.getAttribute('data-event'),
            member: cb.getAttribute('data-member'),
            price: Number(cb.getAttribute('data-price')) || 0
          });
        } else {
          selectedOrderIds.push(cb.value);
        }
      });

      const buyerNameVal = document.getElementById('buyerName').value;
      const payDateVal = document.getElementById('payDate').value;
      const last5Val = document.getElementById('last5').value.trim();

      try {
        const customCreatePromises = customItemsToCreate.map(cItem => {
          return addDoc(collection(db, "orders"), {
            buyerName: buyerNameVal,
            user: buyerNameVal,
            event: cItem.event,
            member: cItem.member,
            qty: 1,
            price: cItem.price,
            createdAt: new Date().toISOString(),
            paymentStatus: '待對帳',
            status: '待對帳',
            note: '買家自訂補款項目'
          }).then(docRef => docRef.id);
        });

        const createdCustomIds = await Promise.all(customCreatePromises);
        const finalAllRelatedOrderIds = [...selectedOrderIds, ...createdCustomIds];

        const useDepositChecked = document.getElementById('useDepositChk').checked;
        const useCreditChecked = document.getElementById('useCreditChk').checked;

        const data = {
          buyerName: buyerNameVal,
          user: buyerNameVal,
          socialAccount: document.getElementById('socialAccount').value.trim(),
          payDate: payDateVal,
          bankName: bankNameVal,
          bank: bankNameVal,
          amount: inputAmount,
          finalPay: inputAmount,
          last5: last5Val,
          bankLast5: last5Val,
          note: document.getElementById('note').value.trim(),
          useDeposit: useDepositChecked,
          useCredit: useCreditChecked,
          creditUsed: appliedCreditDeduction,
          depositUsed: appliedDepositDeduction,
          relatedOrderIds: finalAllRelatedOrderIds,
          createdAt: new Date().toISOString(),
          status: '待對帳'
        };

        // 1. 新增匯款紀錄
        await addDoc(collection(db, "payments"), data);

        // 2. 溢繳邏輯：若實付 > 應付，將多餘金額自動寫入 user_deposits
        const overpaidAmount = inputAmount - currentCalculatedFinalTotal;
        let overpayAlertMsg = '';

        if (overpaidAmount > 0) {
          await addDoc(collection(db, "user_deposits"), {
            user: buyerNameVal,
            buyerName: buyerNameVal,
            payDate: payDateVal,
            bank: bankNameVal,
            amount: overpaidAmount,
            last5: last5Val,
            type: 'deposit',
            note: `匯款溢繳轉入 (應付 $${currentCalculatedFinalTotal} / 實付 $${inputAmount})`,
            createdAt: new Date().toISOString()
          });
          overpayAlertMsg = `\n\n💡 偵測到溢繳 $${overpaidAmount} 元，已自動為您轉入「預存儲值金」！`;
        }

        // 3. 更新勾選訂單狀態為待對帳
        const updatePromises = selectedOrderIds.map(orderId => {
          return updateDoc(doc(db, "orders", orderId), {
            paymentStatus: '待對帳',
            status: '待對帳'
          });
        });
        await Promise.all(updatePromises);

        alert(`✅ 匯款回報已提交，選取的訂單已同步更新為「待對帳」，請等待管理者審核！${overpayAlertMsg}`);
        customAddedItems = [];
        document.getElementById('paymentForm').reset();
        document.getElementById('formContent').style.display = 'none';
        document.getElementById('overpayTip').style.display = 'none';
      } catch (err) {
        alert('送出失敗：' + err.message);
      } finally {
        btn.disabled = false;
        btn.textContent = '提交對帳資料';
      }
    });

    function notifyHeight() {
      setTimeout(() => {
        window.parent.postMessage({ frameHeight: document.body.scrollHeight }, '*');
      }, 100);
    }
  </script>
</body>
</html>
