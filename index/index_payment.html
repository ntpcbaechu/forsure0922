<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>匯款對帳回報</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 0; margin: 0; background: transparent; color: #333; }
    
    .payment-card {
      background: #fff;
      border: 1px solid #e4e7ed;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.02);
      max-width: 600px;
      margin: 0 auto;
    }

    .form-header { text-align: center; font-size: 20px; font-weight: bold; color: #303133; margin-bottom: 20px; }

    .form-group { margin-bottom: 18px; display: flex; flex-direction: column; gap: 6px; }
    .form-label { font-size: 14px; font-weight: bold; color: #303133; }
    
    input[type="text"], input[type="number"], input[type="date"], select {
      padding: 10px 12px;
      border: 1px solid #dcdfe6;
      border-radius: 8px;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
      width: 100%;
      box-sizing: border-box;
    }
    input:focus, select:focus { border-color: #409eff; }

    .line-info-card {
      background: #fafafa;
      border: 1px solid #ebeef5;
      border-radius: 10px;
      padding: 12px 15px;
      margin-top: 4px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .line-contact-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #fff;
      border: 1px solid #e4e7ed;
      padding: 8px 12px;
      border-radius: 8px;
    }

    .line-contact-info { font-size: 13px; color: #303133; font-weight: 500; }

    .btn-copy {
      background: #f4f4f5;
      color: #606266;
      border: 1px solid #dcdfe6;
      padding: 5px 12px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.2s;
      white-space: nowrap;
    }
    .btn-copy:hover { background: #409eff; color: #fff; border-color: #409eff; }

    .line-warning-text {
      font-size: 12px;
      color: #e6a23c;
      line-height: 1.5;
      font-weight: bold;
    }

    .btn-submit {
      background: #409eff;
      color: #fff;
      border: none;
      padding: 12px;
      border-radius: 8px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      width: 100%;
      margin-top: 10px;
      transition: background 0.2s;
    }
    .btn-submit:hover { background: #66b1ff; }
  </style>
</head>
<body>

  <div class="payment-card">
    <div class="form-header">匯款對帳回報</div>

    <form id="paymentForm">
      <!-- 1. 選擇團體 -->
      <div class="form-group">
        <label class="form-label">1. 選擇團體 *</label>
        <select id="groupSelect" required onchange="handleGroupChange()">
          <option value="">請選擇團體</option>
        </select>
      </div>

      <!-- 2. 社群名稱 -->
      <div class="form-group">
        <label class="form-label">2. 社群名稱 *</label>
        <select id="buyerSelect" required disabled>
          <option value="">請先選擇團體</option>
        </select>
      </div>

      <!-- 3. 收圖方式與聯絡帳號 (動態切換) -->
      <div class="form-group">
        <label class="form-label">3. 收圖方式與聯絡帳號 *</label>
        <select id="contactTypeSelect" required onchange="handleContactTypeChange()">
          <option value="">請選擇收圖方式...</option>
          <option value="Instagram">Instagram</option>
          <option value="Threads">Threads</option>
          <option value="官方 Line">官方 Line</option>
        </select>

        <!-- IG / Threads 專用輸入框 -->
        <input type="text" id="contactAccountInput" placeholder="請輸入帳號" style="display:none; margin-top:4px;">

        <!-- 官方 Line 提示卡片 -->
        <div id="lineInfoCard" class="line-info-card" style="display:none;">
          <div class="line-contact-row">
            <div class="line-contact-info">💬 <b>LINE ID :</b> @115oyenv</div>
            <button type="button" class="btn-copy" onclick="copyLineId()">📋 複製</button>
          </div>
          <div class="line-warning-text">
            ⚠️ 填完單後請主動發訊息到官方LINE 告知您的社群暱稱<br>
            否則我會無法辨識&不知道如何跟您聯絡
          </div>
        </div>
      </div>

      <!-- 4. 匯款金額 -->
      <div class="form-group">
        <label class="form-label">4. 匯款金額 *</label>
        <input type="number" id="amountInput" placeholder="請輸入匯款金額" required>
      </div>

      <!-- 5. 帳號末五碼 -->
      <div class="form-group">
        <label class="form-label">5. 帳號末五碼 (或備註無卡) *</label>
        <input type="text" id="bankLast5Input" placeholder="例如: 12345 或 無卡" required>
      </div>

      <button type="submit" class="btn-submit">🚀 提交對帳表單</button>
    </form>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, addDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDF7QySG1Jj4gdZvXwMRaKjRmI-lFKpj7k",
      authDomain: "forsure0922.firebaseapp.com",
      databaseURL: "https://forsure0922-default-rtdb.firebaseio.com",
      projectId: "forsure0922",
      storageBucket: "forsure0922.firebasestorage.app",
      messagingSenderId: "817449290174",
      appId: "1:817449290174:web:6b4ec1d36c171ff97011ef"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let ordersCache = [];
    let groupList = [];

    document.addEventListener('DOMContentLoaded', async () => {
      try {
        const gRes = await fetch('../json/group.json');
        groupList = await gRes.json();
        
        const gSelect = document.getElementById('groupSelect');
        groupList.forEach(g => {
          const opt = document.createElement('option');
          opt.value = g;
          opt.textContent = g;
          gSelect.appendChild(opt);
        });
      } catch(e) {}

      onSnapshot(collection(db, "orders"), snap => {
        ordersCache = [];
        snap.forEach(d => ordersCache.push({ id: d.id, ...d.data() }));
        handleGroupChange();
      });

      notifyHeight();
    });

    window.handleGroupChange = () => {
      const selectedGroup = document.getElementById('groupSelect').value;
      const buyerSelect = document.getElementById('buyerSelect');
      buyerSelect.innerHTML = '';

      if (!selectedGroup) {
        buyerSelect.disabled = true;
        buyerSelect.innerHTML = '<option value="">請先選擇團體</option>';
        return;
      }

      const buyersSet = new Set();
      ordersCache.forEach(o => {
        if ((o.group || 'Stray Kids') === selectedGroup) {
          let rawName = o.user || o.buyerName || o.nickname || '';
          let cleanName = rawName.replace(/^[-\s]+/, '').trim();
          if (cleanName) buyersSet.add(cleanName);
        }
      });

      if (buyersSet.size === 0) {
        buyerSelect.disabled = true;
        buyerSelect.innerHTML = '<option value="">該團體目前尚無訂單買家</option>';
      } else {
        buyerSelect.disabled = false;
        buyerSelect.innerHTML = '<option value="">請選擇買家暱稱</option>';
        Array.from(buyersSet).sort((a,b)=>a.localeCompare(b,'zh-TW')).forEach(u => {
          const opt = document.createElement('option');
          opt.value = u;
          opt.textContent = u;
          buyerSelect.appendChild(opt);
        });
      }
      notifyHeight();
    };

    window.handleContactTypeChange = () => {
      const type = document.getElementById('contactTypeSelect').value;
      const input = document.getElementById('contactAccountInput');
      const lineCard = document.getElementById('lineInfoCard');

      if (type === 'Instagram' || type === 'Threads') {
        input.style.display = 'block';
        input.required = true;
        lineCard.style.display = 'none';
      } else if (type === '官方 Line') {
        input.style.display = 'none';
        input.required = false;
        input.value = '';
        lineCard.style.display = 'flex';
      } else {
        input.style.display = 'none';
        input.required = false;
        lineCard.style.display = 'none';
      }
      notifyHeight();
    };

    window.copyLineId = () => {
      navigator.clipboard.writeText('@115oyenv').then(() => {
        alert('✅ 已成功複製官方 LINE ID: @115oyenv');
      }).catch(() => {
        alert('LINE ID: @115oyenv');
      });
    };

    document.getElementById('paymentForm').onsubmit = async (e) => {
      e.preventDefault();

      const group = document.getElementById('groupSelect').value;
      const buyerName = document.getElementById('buyerSelect').value;
      const contactType = document.getElementById('contactTypeSelect').value;
      const contactAccount = (contactType === '官方 Line') ? '@115oyenv' : document.getElementById('contactAccountInput').value.trim();
      const amount = Number(document.getElementById('amountInput').value);
      const bankLast5 = document.getElementById('bankLast5Input').value.trim();

      try {
        await addDoc(collection(db, "payment_reports"), {
          group,
          buyerName,
          contactType,
          contactAccount,
          amount,
          bankLast5,
          createdAt: new Date().toISOString(),
          status: '待對帳'
        });

        alert('✅ 對帳表單已順利提交！');
        document.getElementById('paymentForm').reset();
        handleGroupChange();
        handleContactTypeChange();
      } catch (err) {
        alert('提交失敗: ' + err.message);
      }
    };

    function notifyHeight() {
      setTimeout(() => {
        window.parent.postMessage({ frameHeight: document.body.scrollHeight }, '*');
      }, 100);
    }
  </script>
</body>
</html>
