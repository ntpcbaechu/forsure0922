<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>匯款表單</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 5px; margin: 0; background: #fff; color: #333; }
    .form-group { margin-bottom: 15px; }
    label { display: block; font-weight: bold; margin-bottom: 6px; font-size: 14px; color: #303133; }
    input, select, button { width: 100%; padding: 12px; border: 1px solid #dcdfe6; border-radius: 8px; font-size: 14px; box-sizing: border-box; }
    button { background-color: #1989fa; color: white; font-weight: bold; border: none; cursor: pointer; margin-top: 10px; font-size: 16px; border-radius: 8px; }
    button:disabled { background-color: #a0cfff; cursor: not-allowed; }
    
    /* 活動多選卡片清單 */
    .unpaid-list { border: 1px solid #dcdfe6; border-radius: 8px; padding: 10px; background: #fafafa; max-height: 280px; overflow-y: auto; }
    .unpaid-item { background: #ffffff; border: 1px solid #e4e7ed; border-radius: 8px; padding: 12px; margin-bottom: 8px; display: flex; align-items: center; gap: 10px; cursor: pointer; transition: all 0.2s ease; }
    .unpaid-item:hover { border-color: #409eff; }
    .unpaid-item input[type="checkbox"] { width: 18px; height: 18px; margin: 0; cursor: pointer; }
    .unpaid-info { flex-grow: 1; font-size: 13px; color: #606266; }
    .unpaid-title { font-weight: bold; font-size: 14px; color: #303133; margin-bottom: 2px; }
    .unpaid-price { font-weight: bold; color: #f56c6c; font-size: 14px; }

    .summary-box { background: #f8f9fa; border: 1px dashed #dcdfe6; border-radius: 8px; padding: 15px; margin-top: 15px; }
    .summary-item { display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 14px; color: #606266; }
    .summary-total { display: flex; justify-content: space-between; font-weight: bold; font-size: 16px; color: #f56c6c; border-top: 1px solid #e4e7ed; padding-top: 10px; margin-top: 10px; }
    .credit-checkbox { display: flex; align-items: center; gap: 8px; font-size: 13px; color: #67c23a; margin-top: 6px; }
    .credit-checkbox input { width: auto; margin: 0; }
  </style>
</head>
<body>

  <form id="payForm">
    <div class="form-group">
      <label>社群名稱 *</label>
      <select id="payUser" required>
        <option value="" disabled selected>載入未匯款名單中...</option>
      </select>
    </div>

    <div class="form-group">
      <label>IG / Threads 帳號 *</label>
      <input type="text" id="paySocial" placeholder="例：ntpcbaechu" required>
    </div>

    <div class="form-group">
      <label>勾選欲合併匯款的已登記活動 (可複選) *</label>
      <div id="unpaidListContainer" class="unpaid-list">
        <div style="color:#909399; font-size:13px; text-align:center; padding:10px;">請先選擇社群名稱</div>
      </div>
    </div>

    <div class="summary-box">
      <div class="summary-item"><span>已選擇活動數：</span><span id="txtSelectedCount">0 筆</span></div>
      <div class="summary-item"><span>小計總金額：</span><span id="txtSubtotal">$0</span></div>
      
      <div id="creditBox" style="display:none;">
        <label class="credit-checkbox">
          <input type="checkbox" id="useCreditCheck">
          <span>使用抵用金 (可用餘額: <b id="txtCreditRem">$0</b>)</span>
        </label>
        <div class="summary-item" style="color:#67c23a; margin-top:4px;"><span>折抵金額：</span><span id="txtCreditDiscount">-$0</span></div>
      </div>

      <div class="summary-total"><span>最終應匯款金額：</span><span id="txtFinalPay">$0</span></div>
    </div>

    <div class="form-group" style="margin-top:15px;">
      <label>匯款帳號後 5 碼 *</label>
      <input type="text" id="payBankLast5" maxlength="5" placeholder="請填寫末 5 碼" required>
    </div>

    <button type="submit" id="submitBtn" disabled>送出匯款登記</button>
  </form>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, getDocs, addDoc, doc, updateDoc, query, where, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDF7QySG1Jj4gdZvXwMRaKjRmI-lFKpj7k",
      authDomain: "forsure0922.firebaseapp.com",
      databaseURL: "https://forsure0922-default-rtdb.firebaseio.com",
      projectId: "forsure0922",
      storageBucket: "forsure0922.firebasestorage.app",
      messagingSenderId: "817449290174",
      appId: "1:817449290174:web:6b4ec1d36c171ff97011ef"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let unpaidOrders = [];
    let eventPrices = {};
    let userCreditObj = null;

    let selectedOrders = [];
    let totalSubtotal = 0;
    let creditUsed = 0;
    let finalPay = 0;

    initData();

    async function initData() {
      // 1. 抓取活動單價
      const evSnap = await getDocs(collection(db, "event_settings"));
      evSnap.forEach(doc => {
        const data = doc.data();
        eventPrices[data.name] = parseFloat(data.price) || 0;
      });

      // 2. 抓取「未對帳/未匯款 (hasPaid != true)」的訂單紀錄
      const ordersSnap = await getDocs(collection(db, "orders"));
      unpaidOrders = [];
      const userSet = new Set();

      ordersSnap.forEach(doc => {
        const d = doc.data();
        if (!d.hasPaid) {
          const eName = d.eventName || d.event || d.fullEvent || '未命名活動';
          const quantity = d.qty !== undefined ? d.qty : (d.quantity !== undefined ? d.quantity : (d.count || 0));
          unpaidOrders.push({ id: doc.id, ...d, eventName: eName, qty: quantity });
          userSet.add(d.user);
        }
      });

      // 3. 渲染社群名稱下拉選單
      const userSelect = document.getElementById('payUser');
      userSelect.innerHTML = '<option value="" disabled selected>請選擇社群名稱</option>';

      if (userSet.size === 0) {
        userSelect.innerHTML = '<option value="" disabled selected>🎉 目前沒有待匯款的社群暱稱</option>';
      } else {
        Array.from(userSet).sort().forEach(u => {
          const opt = document.createElement('option');
          opt.value = u;
          opt.textContent = u;
          userSelect.appendChild(opt);
        });
      }

      notifyHeight();
    }

    // 當選擇社群名稱時，帶出該使用者的多選清單與抵用金
    document.getElementById('payUser').addEventListener('change', async (e) => {
      const selectedUser = e.target.value;
      const listContainer = document.getElementById('unpaidListContainer');
      listContainer.innerHTML = '';

      const myOrders = unpaidOrders.filter(o => o.user === selectedUser);

      if (myOrders.length === 0) {
        listContainer.innerHTML = '<div style="color:#909399; font-size:13px; text-align:center; padding:10px;">該使用者目前沒有未匯款項目。</div>';
        return;
      }

      // 渲染多選清單
      myOrders.forEach(o => {
        const uPrice = eventPrices[o.eventName] || 0;
        const itemSubtotal = o.qty * uPrice;

        const itemDiv = document.createElement('div');
        itemDiv.className = 'unpaid-item';
        itemDiv.innerHTML = `
          <input type="checkbox" class="order-chk" value="${o.id}" data-subtotal="${itemSubtotal}" data-qty="${o.qty}" data-price="${uPrice}">
          <div class="unpaid-info">
            <div class="unpaid-title">${o.eventName} (成員: ${o.member || '全體'})</div>
            <div>登記張數：${o.qty} 張 (單價 $${uPrice})</div>
          </div>
          <div class="unpaid-price">$${itemSubtotal}</div>
        `;

        // 點擊整列皆可勾選
        itemDiv.addEventListener('click', (evt) => {
          if (evt.target.tagName !== 'INPUT') {
            const chk = itemDiv.querySelector('.order-chk');
            chk.checked = !chk.checked;
          }
          calculateTotal();
        });

        listContainer.appendChild(itemDiv);
      });

      // 查詢抵用金
      userCreditObj = null;
      document.getElementById('creditBox').style.display = 'none';
      document.getElementById('useCreditCheck').checked = false;

      const creditSnap = await getDocs(query(collection(db, "user_credits"), where("user", "==", selectedUser)));
      if (!creditSnap.empty) {
        creditSnap.forEach(d => {
          const c = d.data();
          const rem = c.remaining !== undefined ? c.remaining : (c.credit - (c.used || 0));
          if (rem > 0) {
            userCreditObj = { id: d.id, ...c, remaining: rem };
          }
        });
      }

      if (userCreditObj) {
        document.getElementById('creditBox').style.display = 'block';
        document.getElementById('txtCreditRem').textContent = `$${userCreditObj.remaining}`;
      }

      calculateTotal();
      notifyHeight();
    });

    document.getElementById('useCreditCheck').addEventListener('change', calculateTotal);

    function calculateTotal() {
      const chks = document.querySelectorAll('.order-chk:checked');
      selectedOrders = [];
      totalSubtotal = 0;

      chks.forEach(chk => {
        const sub = parseFloat(chk.getAttribute('data-subtotal')) || 0;
        totalSubtotal += sub;
        selectedOrders.push({
          orderId: chk.value,
          subtotal: sub,
          qty: parseInt(chk.getAttribute('data-qty')) || 0,
          price: parseFloat(chk.getAttribute('data-price')) || 0
        });
      });

      const isUseCredit = document.getElementById('useCreditCheck').checked;
      let availCredit = userCreditObj ? userCreditObj.remaining : 0;

      if (isUseCredit && availCredit > 0) {
        creditUsed = Math.min(totalSubtotal, availCredit);
      } else {
        creditUsed = 0;
      }

      finalPay = Math.max(0, totalSubtotal - creditUsed);

      document.getElementById('txtSelectedCount').textContent = `${selectedOrders.length} 筆`;
      document.getElementById('txtSubtotal').textContent = `$${totalSubtotal}`;
      document.getElementById('txtCreditDiscount').textContent = `-$${creditUsed}`;
      document.getElementById('txtFinalPay').textContent = `$${finalPay}`;

      document.getElementById('submitBtn').disabled = selectedOrders.length === 0;
    }

    // 提交多選匯款單
    document.getElementById('payForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      if (selectedOrders.length === 0) return alert('請至少勾選一項要匯款的活動！');

      const btn = document.getElementById('submitBtn');
      btn.disabled = true;
      btn.textContent = '提交中...';

      try {
        const user = document.getElementById('payUser').value;
        const social = document.getElementById('paySocial').value.trim();
        const bankLast5 = document.getElementById('payBankLast5').value.trim();

        // 均分折抵的抵用金給每一筆訂單
        let remCreditUsed = creditUsed;

        for (let i = 0; i < selectedOrders.length; i++) {
          const item = selectedOrders[i];
          const order = unpaidOrders.find(o => o.id === item.orderId);
          
          let itemCreditDiscount = 0;
          if (creditUsed > 0 && totalSubtotal > 0) {
            if (i === selectedOrders.length - 1) {
              itemCreditDiscount = remCreditUsed;
            } else {
              itemCreditDiscount = Math.round((item.subtotal / totalSubtotal) * creditUsed);
              remCreditUsed -= itemCreditDiscount;
            }
          }

          const itemFinalPay = Math.max(0, item.subtotal - itemCreditDiscount);

          // 1. 批次新增 payments 紀錄
          await addDoc(collection(db, "payments"), {
            user,
            social,
            orderId: item.orderId,
            eventName: `${order.eventName} (${order.member || '全體'})`,
            qty: item.qty,
            unitPrice: item.price,
            subtotal: item.subtotal,
            creditUsed: itemCreditDiscount,
            finalPay: itemFinalPay,
            bankLast5,
            status: 'pending',
            createdAt: serverTimestamp()
          });

          // 2. 標記該筆訂單為已登記匯款
          await updateDoc(doc(db, "orders", item.orderId), { hasPaid: true });
        }

        // 3. 更新使用者抵用金紀錄
        if (creditUsed > 0 && userCreditObj) {
          const newUsed = (userCreditObj.used || 0) + creditUsed;
          const newRem = userCreditObj.credit - newUsed;
          await updateDoc(doc(db, "user_credits", userCreditObj.id), {
            used: newUsed,
            remaining: newRem
          });
        }

        alert(`✅ 已成功送出 ${selectedOrders.length} 筆活動的匯款登記！`);
        location.reload();
      } catch (err) {
        alert('提交失敗: ' + err.message);
        btn.disabled = false;
        btn.textContent = '送出匯款登記';
      }
    });

    function notifyHeight() {
      setTimeout(() => {
        window.parent.postMessage({ frameHeight: document.body.scrollHeight }, '*');
      }, 100);
    }
  </script>

</body>
</html>
