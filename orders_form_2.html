<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>團員登記填單</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 15px; margin: 0; background: #fff; color: #333; }
    
    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .form-group { margin-bottom: 10px; }
    .form-group.full-width { grid-column: span 2; }

    label { font-size: 13px; font-weight: bold; color: #303133; display: block; margin-bottom: 4px; }
    
    input, select, textarea { 
      width: 100%; 
      padding: 8px 10px; 
      border: 1px solid #dcdfe6; 
      border-radius: 8px; 
      font-size: 13px; 
      box-sizing: border-box; 
      background: #fff; 
      outline: none; 
      transition: border-color 0.2s; 
      font-family: inherit;
    }
    input:focus, select:focus, textarea:focus { border-color: #409eff; }
    select:disabled { background: #f5f7fa; color: #c0c4cc; cursor: not-allowed; }
    
    textarea { height: 75px; resize: vertical; line-height: 1.4; }

    button { width: 100%; padding: 10px; background: #409eff; color: white; border: none; border-radius: 8px; font-size: 14px; font-weight: bold; cursor: pointer; margin-top: 6px; transition: background 0.2s; }
    button:disabled { background: #a0cfff; }
    
    .qty-header-row { display: flex; justify-content: space-between; align-items: center; }
    .dynamic-tip { font-size: 12px; color: #67c23a; font-weight: bold; }

    @media (max-width: 500px) {
      .form-grid { grid-template-columns: 1fr; }
      .form-group.full-width { grid-column: span 1; }
    }
  </style>
</head>
<body>

  <h3 style="margin-top:0; margin-bottom:12px; font-size:18px;">團員登記填單</h3>
  <form id="orderForm">
    <div class="form-grid">
      
      <div class="form-group">
        <label>社群名稱 *</label>
        <select id="buyerName" required><option value="">載入中...</option></select>
      </div>

      <div class="form-group">
        <label>訂單類別</label>
        <select id="orderType">
          <option value="一般">一般 (預設)</option>
          <option value="追加">追加</option>
        </select>
      </div>

      <div class="form-group">
        <label>活動名稱 *</label>
        <select id="eventName" required><option value="">載入中...</option></select>
      </div>

      <div class="form-group">
        <label>團體 *</label>
        <select id="group" required disabled><option value="">請先選擇活動</option></select>
      </div>

      <div class="form-group full-width">
        <label>成員 *</label>
        <select id="member" required disabled><option value="">請先選擇團體</option></select>
      </div>

      <div class="form-group full-width">
        <div class="qty-header-row">
          <label style="margin-bottom:0;">數量 / 包 *</label>
          <span id="qtyTip" class="dynamic-tip"></span>
        </div>
        <input type="number" id="qty" min="1" step="1" placeholder="請輸入包數 (例如: 1, 2...)" style="margin-top:4px;" required>
      </div>

      <div class="form-group full-width">
        <label>備註欄位</label>
        <textarea id="note" placeholder="如有特殊需求請在此註明..."></textarea>
      </div>

    </div>

    <button type="submit" id="submitBtn">提交訂單</button>
  </form>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, addDoc, onSnapshot, getDocs, query, where } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDF7QySG1Jj4gdZvXwMRaKjRmI-lFKpj7k",
      authDomain: "forsure0922.firebaseapp.com",
      databaseURL: "https://forsure0922-default-rtdb.firebaseio.com",
      projectId: "forsure0922",
      storageBucket: "forsure0922.firebasestorage.app",
      messagingSenderId: "817449290174",
      appId: "1:817449290174:web:6b4ec1d36c171ff97011ef"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let activeEventSettings = [];
    let eventPricesMap = {};

    document.addEventListener('DOMContentLoaded', async () => {
      try {
        const buyersRes = await fetch('json/users.json');
        const buyers = await buyersRes.json();
        const buyerSel = document.getElementById('buyerName');
        buyerSel.innerHTML = '<option value="">請選擇您的名稱</option>';
        buyers.forEach(b => { buyerSel.innerHTML += '<option value="' + b + '">' + b + '</option>'; });
      } catch (e) {}

      const eventSel = document.getElementById('eventName');
      const groupSel = document.getElementById('group');
      const memberSel = document.getElementById('member');
      const qtyInput = document.getElementById('qty');

      onSnapshot(collection(db, "event_settings"), snap => {
        activeEventSettings = [];
        eventPricesMap = {};
        const uniqueEvents = new Set();

        snap.forEach(d => {
          const data = d.data();
          if (!data.isClosed && data.name) {
            activeEventSettings.push(data);
            uniqueEvents.add(data.name.trim());
            const key = data.name.trim() + '_' + (data.member || '');
            eventPricesMap[key] = {
              price: Number(data.actualPrice || data.price || data.estimatedPrice || data.unitPrice) || 0,
              packQty: Number(data.packQty) || 1
            };
          }
        });

        const selectedEv = eventSel.value;
        eventSel.innerHTML = '<option value="">請選擇活動</option>';
        Array.from(uniqueEvents).sort().forEach(eName => {
          eventSel.innerHTML += '<option value="' + eName + '">' + eName + '</option>';
        });

        if (selectedEv && uniqueEvents.has(selectedEv)) {
          eventSel.value = selectedEv;
        } else {
          groupSel.innerHTML = '<option value="">請先選擇活動</option>';
          groupSel.disabled = true;
          memberSel.innerHTML = '<option value="">請先選擇團體</option>';
          memberSel.disabled = true;
        }

        updateQtyTip();
        notifyHeight();
      });

      eventSel.addEventListener('change', () => {
        const chosenEvent = eventSel.value;
        groupSel.innerHTML = '';
        memberSel.innerHTML = '<option value="">請先選擇團體</option>';
        memberSel.disabled = true;

        if (!chosenEvent) {
          groupSel.innerHTML = '<option value="">請先選擇活動</option>';
          groupSel.disabled = true;
          updateQtyTip();
          return;
        }

        const availableGroups = new Set();
        activeEventSettings.forEach(s => {
          if ((s.name || '').trim() === chosenEvent && s.group) {
            availableGroups.add(s.group.trim());
          }
        });

        if (availableGroups.size === 0) {
          availableGroups.add('Stray Kids');
        }

        groupSel.disabled = false;
        groupSel.innerHTML = '<option value="">請選擇團體</option>';
        Array.from(availableGroups).forEach(g => {
          groupSel.innerHTML += `<option value="${g}">${g}</option>`;
        });
        updateQtyTip();
      });

      groupSel.addEventListener('change', () => {
        const chosenEvent = eventSel.value;
        const chosenGroup = groupSel.value;
        memberSel.innerHTML = '';

        if (!chosenGroup) {
          memberSel.innerHTML = '<option value="">請先選擇團體</option>';
          memberSel.disabled = true;
          updateQtyTip();
          return;
        }

        const file = (chosenGroup === 'Stray Kids') ? 'members_skz.json' : (chosenGroup === 'ATEEZ' ? 'members_atz.json' : '');
        if (file) {
          fetch(`json/${file}`).then(res => res.json()).then(members => {
            const availableMembers = new Set();
            activeEventSettings.forEach(s => {
              if ((s.name || '').trim() === chosenEvent && s.member) {
                if (members.includes(s.member.trim())) {
                  availableMembers.add(s.member.trim());
                }
              }
            });

            const sortedMembers = Array.from(availableMembers);
            if (sortedMembers.length === 0) {
              memberSel.innerHTML = '<option value="">該團體尚無開放成員</option>';
              memberSel.disabled = true;
            } else {
              memberSel.disabled = false;
              memberSel.innerHTML = '<option value="">請選擇成員</option>';
              sortedMembers.forEach(m => memberSel.innerHTML += `<option value="${m}">${m}</option>`);
            }
            updateQtyTip();
          });
        }
      });

      memberSel.addEventListener('change', updateQtyTip);
      qtyInput.addEventListener('input', updateQtyTip);
    });

    function updateQtyTip() {
      const evName = document.getElementById('eventName').value;
      const memName = document.getElementById('member').value;
      const qtyVal = document.getElementById('qty').value;
      const packs = parseInt(qtyVal, 10);
      const tipElem = document.getElementById('qtyTip');

      if (!evName || !memName || isNaN(packs) || packs <= 0) {
        tipElem.textContent = '';
        return;
      }

      const setting = eventPricesMap[evName + '_' + memName] || {};
      const packQty = setting.packQty || 1;
      const unitPrice = setting.price || 0;
      const totalCards = packs * packQty;
      const totalCost = packs * unitPrice;

      tipElem.textContent = `(共 ${totalCards} 張 / $${totalCost.toLocaleString()} 元)`;
    }

    document.getElementById('orderForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const buyerVal = document.getElementById('buyerName').value;
      const eventVal = document.getElementById('eventName').value;
      const groupVal = document.getElementById('group').value;
      const memberVal = document.getElementById('member').value;
      const rawQty = document.getElementById('qty').value.trim();
      const packs = Number(rawQty);

      if (!rawQty || isNaN(packs) || !Number.isInteger(packs) || packs <= 0) {
        alert('⚠️ 請輸入有效的正整數包數！');
        return;
      }

      const orderTypeVal = document.getElementById('orderType').value;
      const setting = eventPricesMap[eventVal + '_' + memberVal] || {};
      const packQty = setting.packQty || 1;
      const actualCardsQty = packs * packQty;

      const btn = document.getElementById('submitBtn');
      btn.disabled = true;
      btn.textContent = '提交中...';

      const data = {
        buyerName: buyerVal,
        user: buyerVal,
        event: eventVal,
        eventName: eventVal,
        group: groupVal,
        member: memberVal,
        qty: actualCardsQty,
        quantity: actualCardsQty,
        orderType: orderTypeVal,
        note: document.getElementById('note').value.trim(),
        createdAt: new Date().toISOString(),
        paymentStatus: '待匯款',
        status: '待匯款',
        hasPaid: false
      };

      try {
        await addDoc(collection(db, "orders"), data);
        alert('🎉 登記成功！');
        document.getElementById('orderForm').reset();
        document.getElementById('group').innerHTML = '<option value="">請先選擇活動</option>';
        document.getElementById('group').disabled = true;
        document.getElementById('member').innerHTML = '<option value="">請先選擇團體</option>';
        document.getElementById('member').disabled = true;
        document.getElementById('qtyTip').textContent = '';
      } catch (err) {
        alert('提交失敗：' + err.message);
      } finally {
        btn.disabled = false;
        btn.textContent = '提交訂單';
      }
    });

    function notifyHeight() {
      setTimeout(() => {
        window.parent.postMessage({ frameHeight: document.body.scrollHeight }, '*');
      }, 100);
    }
  </script>
</body>
</html>
