<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>發圖進度</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 5px; margin: 0; background: #fff; color: #333; }
    .progress-item { border: 1px solid #e4e7ed; border-radius: 12px; padding: 16px; margin-bottom: 12px; background: #fff; display: flex; justify-content: space-between; align-items: center; }
    .status-badge { padding: 4px 10px; border-radius: 6px; font-size: 12px; font-weight: bold; }
    .status-reserved { background: #f3e5f5; color: #8e24aa; }
    .status-waiting { background: #f4f4f5; color: #909399; }
    .status-sorting { background: #fdf6ec; color: #e6a23c; }
    .status-uploading { background: #ecf5ff; color: #409eff; }
    .status-done { background: #f0f9eb; color: #67c23a; }
    .status-closed { background: #e9e9eb; color: #909399; }
  </style>
</head>
<body>

  <h3 style="font-size: 16px; margin-top:0;">目前開團與飯拍發放進度</h3>
  <div id="progressList">載入進度中...</div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDF7QySG1Jj4gdZvXwMRaKjRmI-lFKpj7k",
      authDomain: "forsure0922.firebaseapp.com",
      databaseURL: "https://forsure0922-default-rtdb.firebaseio.com",
      projectId: "forsure0922",
      storageBucket: "forsure0922.firebasestorage.app",
      messagingSenderId: "817449290174",
      appId: "1:817449290174:web:6b4ec1d36c171ff97011ef"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // 依據 updatedAt (最後修改時間) 倒序排列，確保最新編輯的永遠在最上面
    onSnapshot(query(collection(db, "photo_progress"), orderBy("updatedAt", "desc")), (snapshot) => {
      const container = document.getElementById('progressList');
      container.innerHTML = '';
      if (snapshot.empty) {
        container.innerHTML = '<div style="text-align:center; padding:20px; color:#909399;">目前尚無開團進度。</div>';
        notifyHeight();
        return;
      }
      
      let itemsList = [];
      snapshot.forEach(doc => { itemsList.push(doc.data()); });

      // 自動對應與轉譯每個活動下的代拍為：代拍 1, 代拍 2...
      const sellerMapping = {};

      itemsList.forEach(item => {
        const eventName = item.eventName;
        const realSeller = item.seller || 'default';

        if (!sellerMapping[eventName]) { sellerMapping[eventName] = []; }
        if (!sellerMapping[eventName].includes(realSeller)) {
          sellerMapping[eventName].push(realSeller);
        }

        const sellerIndex = sellerMapping[eventName].indexOf(realSeller) + 1;
        const anonLabel = sellerMapping[eventName].length > 1 || realSeller !== 'default' ? ` (代拍 ${sellerIndex})` : '';

        const status = item.status || '等圖中';
        
        let badgeClass = 'status-waiting';
        if (status === '已預約') badgeClass = 'status-reserved';
        else if (status === '分圖中') badgeClass = 'status-sorting';
        else if (status === '上傳中') badgeClass = 'status-uploading';
        else if (status === '已發圖') badgeClass = 'status-done';
        else if (status === '已結束') badgeClass = 'status-closed';

        const displayMember = `${item.member}${anonLabel}`;

        const div = document.createElement('div');
        div.className = 'progress-item';
        div.innerHTML = `
          <div>
            <div style="font-weight:bold; font-size:15px; margin-bottom:4px;">${item.eventName}</div>
            <div style="font-size:13px; color:#909399;">成員：${displayMember}</div>
          </div>
          <span class="status-badge ${badgeClass}">${status}</span>
        `;
        container.appendChild(div);
      });
      notifyHeight();
    });

    function notifyHeight() {
      setTimeout(() => { window.parent.postMessage({ frameHeight: document.body.scrollHeight }, '*'); }, 100);
    }
  </script>

</body>
</html>
