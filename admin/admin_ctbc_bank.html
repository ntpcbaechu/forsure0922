    let currentTypeFilter = 'all';

    function renderTable() {
      const tbody = document.getElementById('bankTable');
      const searchVal = document.getElementById('searchInput').value.toLowerCase();
      tbody.innerHTML = '';

      let totalInc = 0;
      let count = 0;

      transactions.forEach(t => {
        const isIncome = t.inc !== "";
        const isExpense = t.exp !== "";

        if (currentTypeFilter === 'income' && !isIncome) return;
        if (currentTypeFilter === 'expense' && !isExpense) return;

        const matchSearch = t.date.toLowerCase().includes(searchVal) ||
                            t.inc.toLowerCase().includes(searchVal) ||
                            t.exp.toLowerCase().includes(searchVal) ||
                            t.acc.toLowerCase().includes(searchVal);

        if (matchSearch) {
          count++;
          if (isIncome) totalInc += parseInt(t.inc.replace(/,/g, '')) || 0;

          const row = document.createElement('tr');
          row.innerHTML = `
            <td>${t.date}</td>
            <td class="expense">${t.exp ? '-' + t.exp : ''}</td>
            <td class="income">${t.inc ? '+' + t.inc : ''}</td>
            <td>$${t.bal}</td>
            <td>${t.acc ? `<span class="account-code">${t.acc}</span>` : '-'}</td>
          `;
          tbody.appendChild(row);
        }
      });

      document.getElementById('statsText').innerHTML = 
        `顯示 ${count} 筆符合條件交易 | 搜尋結果存入總額: <span id="totalIncome">$${totalInc.toLocaleString()}</span>`;
    }

      renderTable();
    }

      currentTypeFilter = type;
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderTable();
    }
