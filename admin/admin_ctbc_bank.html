<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>中國信託 存款交易明細對帳系統</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 15px; margin: 0; background: #f8fafc; color: #334155; }
    h2 { margin: 0 0 10px 0; font-size: 20px; color: #0f172a; }
    .meta-info { font-size: 12px; color: #64748b; margin-bottom: 15px; }

    .card { background: #ffffff; padding: 16px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); margin-bottom: 16px; border: 1px solid #e2e8f0; }
    .card h3 { margin-top: 0; margin-bottom: 12px; font-size: 15px; color: #1e293b; border-bottom: 1px solid #f1f5f9; padding-bottom: 6px; }

    .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; }
    .form-group { display: flex; flex-direction: column; }
    .form-group label { font-size: 12px; font-weight: bold; margin-bottom: 4px; color: #475569; }
    .form-group input, .form-group select { padding: 8px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 13px; outline: none; }
    .form-group input:focus, .form-group select:focus { border-color: #3b82f6; }

    .btn-submit { grid-column: 1 / -1; background: #2563eb; color: #fff; border: none; padding: 10px; border-radius: 6px; font-weight: bold; cursor: pointer; margin-top: 6px; }
    .btn-submit:hover { background: #1d4ed8; }

    .search-bar { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; align-items: center; }
    .search-bar input { flex: 1; min-width: 220px; padding: 8px 12px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 13px; }
    .btn-filter { padding: 6px 12px; border: 1px solid #cbd5e1; background: #fff; border-radius: 6px; font-size: 12px; cursor: pointer; font-weight: bold; color: #475569; }
    .btn-filter.active { background: #0284c7; color: white; border-color: #0284c7; }

    table { width: 100%; border-collapse: collapse; font-size: 12px; background: #fff; border-radius: 8px; overflow: hidden; }
    th { background: #f1f5f9; color: #334155; text-align: left; padding: 10px; border-bottom: 2px solid #e2e8f0; white-space: nowrap; }
    td { padding: 10px; border-bottom: 1px solid #e2e8f0; }
    
    /* 已對帳反灰樣式 */
    tr.completed { background-color: #f1f5f9 !important; color: #94a3b8 !important; }
    tr.completed td { text-decoration: line-through; }
    tr.completed select, tr.completed input { opacity: 0.5; pointer-events: none; }
    tr.completed .no-strike { text-decoration: none !important; display: inline-block; }

    .income { color: #16a34a; font-weight: bold; }
    .expense { color: #dc2626; font-weight: bold; }
    .account-code { font-family: monospace; font-weight: bold; background: #eff6ff; color: #1d4ed8; padding: 2px 6px; border-radius: 4px; }
  </style>
</head>
<body>

  <h2>🏦 中國信託 存款交易明細對帳系統</h2>
  <div class="meta-info">帳號: 783540130964 | 幣別: TWD | 區間: 2026/01/01 - 2026/07/28</div>

  <!-- 區塊 1：團員匯款登記填單 -->
  <div class="card">
    <h3>📝 1. 團員匯款登記填單</h3>
    <form id="orderForm" class="form-grid">
      <div class="form-group">
        <label>1. 社群暱稱</label>
        <select id="userSelect"><option value="">載入中...</option></select>
      </div>
      <div class="form-group">
        <label>2. 場次</label>
        <select id="eventSelect" onchange="toggleCustomEvent(this)">
          <option value="260328 D1">260328 D1</option>
          <option value="260329 D2">260329 D2</option>
          <option value="260404 D3">260404 D3</option>
          <option value="260405 D4">260405 D4</option>
          <option value="other">其他 (自訂)</option>
        </select>
      </div>
      <div class="form-group" id="customEventGroup" style="display:none;">
        <label>自訂場次名稱</label>
        <input type="text" id="customEventInput" placeholder="請輸入場次">
      </div>
      <div class="form-group">
        <label>4. 成員</label>
        <select id="memberSelect"><option value="">載入中...</option></select>
      </div>
      <div class="form-group">
        <label>5. 張數</label>
        <input type="number" id="qtyInput" value="1" min="1">
      </div>
      <div class="form-group">
        <label>6. 金額</label>
        <input type="number" id="amountInput" placeholder="請輸入金額">
      </div>
      <div class="form-group">
        <label>7. 匯款日期</label>
        <input type="date" id="payDateInput">
      </div>
      <div class="form-group">
        <label>8. 匯款金額</label>
        <input type="number" id="payAmountInput" placeholder="實際匯款金額">
      </div>
      <div class="form-group">
        <label>9. 匯款後5碼</label>
        <input type="text" id="payLast5Input" maxlength="5" placeholder="例如: 86876">
      </div>
      <button type="button" class="btn-submit" onclick="addOrderRecord()">＋ 新增登記填單</button>
    </form>
  </div>

  <!-- 區塊 2：對帳審核區 -->
  <div class="card">
    <h3>🔍 2. 對帳審核區</h3>
    <div class="form-grid">
      <div class="form-group" style="grid-column: 1 / -1;">
        <label>4. 中信對應筆數</label>
        <select id="ctbcSelect" onchange="autoFillAuditInfo(this)">
          <option value="">-- 請選擇對應的中信交易筆數 --</option>
        </select>
      </div>
      <div class="form-group">
        <label>1. 對帳日期</label>
        <input type="text" id="auditDate" readonly style="background:#f1f5f9;">
      </div>
      <div class="form-group">
        <label>2. 對帳金額</label>
        <input type="text" id="auditAmount" readonly style="background:#f1f5f9;">
      </div>
      <div class="form-group">
        <label>3. 後五碼</label>
        <input type="text" id="auditLast5" readonly style="background:#f1f5f9;">
      </div>
    </div>
  </div>

  <!-- 搜尋與過濾條 -->
  <div class="search-bar">
    <input type="text" id="searchInput" placeholder="🔍 搜尋日期、金額、後五碼..." onkeyup="renderTable()">
    <button class="btn-filter active" onclick="setFilter('all', this)">全部</button>
    <button class="btn-filter" onclick="setFilter('income', this)">僅看存入 (+)</button>
    <label style="font-size:12px; cursor:pointer; margin-left:auto;">
      <input type="checkbox" id="hideCompleted" onchange="renderTable()"> 隱藏已對帳(打勾)項目
    </label>
  </div>

  <!-- 區塊 3：中信流水對帳表 -->
  <div style="overflow-x:auto;">
    <table>
      <thead>
        <tr>
          <th>交易日期時間</th>
          <th>支出 / 存入</th>
          <th>對方帳號 / 備註</th>
          <th>匹配團員填單 (下拉選單)</th>
          <th>對帳狀態</th>
        </tr>
      </thead>
      <tbody id="bankTable"></tbody>
    </table>
  </div>

  <script>
    // 中信歷史交易資料
    const transactions = [
      { id: 1, date: "2026/07/28 19:10:28", exp: "", inc: "500", acc: "-" },
      { id: 2, date: "2026/07/27 21:35:15", exp: "4,900", inc: "", acc: "822/0000289540184401" },
      { id: 3, date: "2026/07/27 21:33:37", exp: "", inc: "4,266", acc: "004/000001200**86876" },
      { id: 4, date: "2026/07/27 16:56:50", exp: "", inc: "580", acc: "824/000011100**29556" },
      { id: 5, date: "2026/07/16 18:38:43", exp: "", inc: "32", acc: "5023000010315521" },
      { id: 6, date: "2026/07/10 11:11:46", exp: "", inc: "718", acc: "004/000001200**86876" }
    ];

    // 暫存團員填單紀錄
    let orderRecords = [
      { id: 101, name: "🐶小明", event: "260328 D1", member: "成員A", amount: "4266", last5: "86876" },
      { id: 102, name: "🐱小華", event: "260329 D2", member: "成員B", amount: "580", last5: "29556" }
    ];

    let auditState = {}; // 紀錄各比交易對帳狀態
    let currentFilter = 'all';

    // 載入 JSON 資料
    async function loadJsonData() {
      try {
        const uRes = await fetch('/json/users.json');
        const users = await uRes.json();
        document.getElementById('userSelect').innerHTML = users.map(u => `<option value="${u}">${u}</option>`).join('');
      } catch(e) {
        document.getElementById('userSelect').innerHTML = '<option value="預設使用者">預設使用者</option>';
      }

      try {
        const mRes = await fetch('/json/members.json');
        const members = await mRes.json();
        document.getElementById('memberSelect').innerHTML = members.map(m => `<option value="${m}">${m}</option>`).join('');
      } catch(e) {
        document.getElementById('memberSelect').innerHTML = '<option value="預設成員">預設成員</option>';
      }
    }

    function toggleCustomEvent(sel) {
      document.getElementById('customEventGroup').style.display = sel.value === 'other' ? 'flex' : 'none';
    }

    function addOrderRecord() {
      const name = document.getElementById('userSelect').value;
      const eventSel = document.getElementById('eventSelect').value;
      const event = eventSel === 'other' ? document.getElementById('customEventInput').value : eventSel;
      const member = document.getElementById('memberSelect').value;
      const amount = document.getElementById('payAmountInput').value || document.getElementById('amountInput').value;
      const last5 = document.getElementById('payLast5Input').value;

      if(!amount || !last5) {
        alert("請填寫金額與後5碼！");
        return;
      }

      const newRecord = { id: Date.now(), name, event, member, amount, last5 };
      orderRecords.push(newRecord);
      alert("新增填單成功！");
      updateOrderDropdowns();
    }

    function initCtbcDropdown() {
      const select = document.getElementById('ctbcSelect');
      select.innerHTML = '<option value="">-- 請選擇對應的中信交易筆數 --</option>' + 
        transactions.map(t => {
          const amt = t.inc ? `+${t.inc}` : `-${t.exp}`;
          return `<option value="${t.id}" data-date="${t.date}" data-amount="${amt}" data-acc="${t.acc}">${t.date} | ${amt} | ${t.acc}</option>`;
        }).join('');
    }

    function autoFillAuditInfo(sel) {
      const opt = sel.options[sel.selectedIndex];
      if(!sel.value) {
        document.getElementById('auditDate').value = '';
        document.getElementById('auditAmount').value = '';
        document.getElementById('auditLast5').value = '';
        return;
      }
      document.getElementById('auditDate').value = opt.getAttribute('data-date');
      document.getElementById('auditAmount').value = opt.getAttribute('data-amount');
      const acc = opt.getAttribute('data-acc');
      const last5Match = acc.match(/\d{5}$/);
      document.getElementById('auditLast5').value = last5Match ? last5Match[0] : acc;
    }

    function updateOrderDropdowns() {
      renderTable();
    }

    function renderTable() {
      const tbody = document.getElementById('bankTable');
      const searchVal = document.getElementById('searchInput').value.toLowerCase();
      const hideComp = document.getElementById('hideCompleted').checked;
      tbody.innerHTML = '';

      transactions.forEach(t => {
        const isComp = auditState[t.id] || false;
        if(hideComp && isComp) return;

        const isInc = t.inc !== "";
        if(currentFilter === 'income' && !isInc) return;

        const matchSearch = t.date.includes(searchVal) || t.acc.includes(searchVal) || (t.inc && t.inc.includes(searchVal));
        if(!matchSearch) return;

        const tr = document.createElement('tr');
        if(isComp) tr.classList.add('completed');

        const orderOpts = orderRecords.map(o => `<option value="${o.id}">${o.event} | ${o.name} | $${o.amount} (後5碼:${o.last5})</option>`).join('');

        tr.innerHTML = `
          <td>${t.date}</td>
          <td>${t.inc ? `<span class="income">+${t.inc}</span>` : `<span class="expense">-${t.exp}</span>`}</td>
          <td><span class="account-code">${t.acc}</span></td>
          <td>
            <select style="width:100%; font-size:12px;">
              <option value="">-- 選擇配對的填單 --</option>
              ${orderOpts}
            </select>
          </td>
          <td>
            <label class="no-strike" style="cursor:pointer; font-weight:bold;">
              <input type="checkbox" ${isComp ? 'checked' : ''} onchange="toggleAudit(${t.id}, this.checked)">
              ${isComp ? '✅ 已對帳' : '未對帳'}
            </label>
          </td>
        `;
        tbody.appendChild(tr);
      });
    }

    function toggleAudit(id, checked) {
      auditState[id] = checked;
      renderTable();
    }

    function setFilter(type, btn) {
      currentFilter = type;
      document.querySelectorAll('.btn-filter').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderTable();
    }

    // 初始化執行
    loadJsonData();
    initCtbcDropdown();
    renderTable();
  </script>
</body>
</html>
