<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>中國信託 存款交易明細對帳系統</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 12px; margin: 0; background: #f8fafc; color: #334155; }
    h2 { margin: 0 0 4px 0; font-size: 18px; color: #0f172a; }
    .meta-info { font-size: 11px; color: #64748b; margin-bottom: 10px; }

    .card { background: #ffffff; padding: 12px 16px; border-radius: 10px; box-shadow: 0 2px 6px rgba(0,0,0,0.04); margin-bottom: 12px; border: 1px solid #e2e8f0; }
    .card h3 { margin-top: 0; margin-bottom: 10px; font-size: 14px; color: #1e293b; border-bottom: 1px solid #f1f5f9; padding-bottom: 4px; }

    .compact-form { display: flex; flex-wrap: wrap; gap: 8px 10px; align-items: flex-end; }
    .form-group { display: flex; flex-direction: column; }
    .form-group label { font-size: 11px; font-weight: bold; margin-bottom: 3px; color: #475569; white-space: nowrap; }
    .form-group label.required::after { content: " *"; color: #ef4444; }
    .form-group label.optional::after { content: " (選填)"; color: #94a3b8; font-weight: normal; }
    
    .form-group input, .form-group select { padding: 6px 8px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 12px; outline: none; box-sizing: border-box; }
    .form-group input:focus, .form-group select:focus { border-color: #3b82f6; }

    .w-status { width: 100px; }
    .w-user { width: 130px; }
    .w-event { width: 130px; }
    .w-member { width: 110px; }
    .w-qty { width: 70px; }
    .w-amount { width: 110px; }
    .w-date { width: 135px; }
    .w-last5 { width: 100px; }
    .w-full { width: 100%; }

    .btn-submit { background: #2563eb; color: #fff; border: none; padding: 7px 16px; border-radius: 6px; font-size: 12px; font-weight: bold; cursor: pointer; height: 31px; white-space: nowrap; }
    .btn-submit:hover { background: #1d4ed8; }

    .search-bar { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; align-items: center; }
    .search-bar input { flex: 1; min-width: 200px; padding: 6px 10px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 12px; }
    .btn-filter { padding: 5px 10px; border: 1px solid #cbd5e1; background: #fff; border-radius: 6px; font-size: 12px; cursor: pointer; font-weight: bold; color: #475569; }
    .btn-filter.active { background: #0284c7; color: white; border-color: #0284c7; }

    .stats-info { font-size: 12px; font-weight: bold; color: #0f172a; margin-bottom: 8px; }
    .stats-info span { color: #16a34a; }

    table { width: 100%; border-collapse: collapse; font-size: 12px; background: #fff; border-radius: 8px; overflow: hidden; }
    th { background: #f1f5f9; color: #334155; text-align: left; padding: 8px 10px; border-bottom: 2px solid #e2e8f0; white-space: nowrap; }
    td { padding: 8px 10px; border-bottom: 1px solid #e2e8f0; }
    
    tr.completed { background-color: #f1f5f9 !important; color: #94a3b8 !important; }
    tr.completed td { text-decoration: line-through; }
    tr.completed select, tr.completed input { opacity: 0.5; pointer-events: none; }
    tr.completed .no-strike { text-decoration: none !important; display: inline-block; }

    .income { color: #16a34a; font-weight: bold; }
    .expense { color: #dc2626; font-weight: bold; }
    .account-code { font-family: monospace; font-weight: bold; background: #eff6ff; color: #1d4ed8; padding: 2px 6px; border-radius: 4px; }

    .pagination { display: flex; justify-content: center; align-items: center; gap: 5px; margin-top: 12px; flex-wrap: wrap; }
    .page-btn { padding: 4px 8px; border: 1px solid #cbd5e1; background: #fff; border-radius: 4px; font-size: 12px; cursor: pointer; color: #334155; }
    .page-btn.active { background: #2563eb; color: #fff; border-color: #2563eb; font-weight: bold; }
    .page-btn:disabled { opacity: 0.5; cursor: not-allowed; }
  </style>
</head>
<body>

  <h2>🏦 中國信託 存款交易明細對帳系統</h2>
  <div class="meta-info">帳號: 783540130964 | 幣別: TWD | 區間: 2026/01/01 - 2026/07/28</div>

  <!-- 區塊 1：團員匯款登記填單 -->
  <div class="card">
    <h3>📝 1. 團員匯款登記填單</h3>
    <form id="orderForm" class="compact-form">
      <div class="form-group w-status">
        <label class="required">匯款狀態</label>
        <select id="payStatusSelect">
          <option value="已匯款">已匯款</option>
          <option value="未匯款">未匯款</option>
          <option value="不確定">不確定</option>
        </select>
      </div>
      <div class="form-group w-user">
        <label class="required">1. 社群暱稱</label>
        <select id="userSelect" required><option value="">載入中...</option></select>
      </div>
      <div class="form-group w-event">
        <label class="required">2. 場次</label>
        <select id="eventSelect" onchange="toggleCustomEvent(this)">
          <option value="260328 D1">260328 D1</option>
          <option value="260329 D2">260329 D2</option>
          <option value="260404 D3">260404 D3</option>
          <option value="260405 D4">260405 D4</option>
          <option value="other">其他 (自訂)</option>
        </select>
      </div>
      <div class="form-group w-event" id="customEventGroup" style="display:none;">
        <label class="required">自訂場次</label>
        <input type="text" id="customEventInput" placeholder="請輸入場次">
      </div>
      <div class="form-group w-member">
        <label class="required">4. 成員</label>
        <select id="memberSelect" required><option value="">載入中...</option></select>
      </div>
      <div class="form-group w-qty">
        <label class="required">5. 張數</label>
        <input type="number" id="qtyInput" value="1" min="1" required>
      </div>
      <div class="form-group w-amount">
        <label class="required">6. 金額</label>
        <input type="number" id="amountInput" placeholder="金額" required>
      </div>
      <div class="form-group w-date">
        <label class="optional">7. 匯款日期</label>
        <input type="date" id="payDateInput">
      </div>
      <div class="form-group w-amount">
        <label class="optional">8. 匯款金額</label>
        <input type="number" id="payAmountInput" placeholder="實際匯款">
      </div>
      <div class="form-group w-last5">
        <label class="optional">9. 後5碼</label>
        <input type="text" id="payLast5Input" maxlength="5" placeholder="86876">
      </div>
      <button type="button" class="btn-submit" onclick="addOrderRecord()">＋ 新增登記填單</button>
    </form>
  </div>

  <!-- 區塊 2：對帳審核區 -->
  <div class="card">
    <h3>🔍 2. 對帳審核區</h3>
    <div class="compact-form">
      <div class="form-group" style="flex: 1; min-width: 280px;">
        <label>4. 中信對應筆數</label>
        <select id="ctbcSelect" class="w-full" onchange="autoFillAuditInfo(this)">
          <option value="">-- 請選擇對應的中信交易筆數 --</option>
        </select>
      </div>
      <div class="form-group w-date">
        <label>1. 對帳日期</label>
        <input type="text" id="auditDate" readonly style="background:#f1f5f9;">
      </div>
      <div class="form-group w-amount">
        <label>2. 對帳金額</label>
        <input type="text" id="auditAmount" readonly style="background:#f1f5f9;">
      </div>
      <div class="form-group w-last5">
        <label>3. 後五碼</label>
        <input type="text" id="auditLast5" readonly style="background:#f1f5f9;">
      </div>
    </div>
  </div>

  <!-- 搜尋與過濾條 -->
  <div class="search-bar">
    <input type="text" id="searchInput" placeholder="🔍 搜尋日期、金額、後五碼、備註..." onkeyup="onSearchChange()">
    <button class="btn-filter active" onclick="setFilter('all', this)">全部</button>
    <button class="btn-filter" onclick="setFilter('income', this)">僅看存入 (+)</button>
    <label style="font-size:12px; cursor:pointer; margin-left:auto;">
      <input type="checkbox" id="hideCompleted" onchange="onSearchChange()"> 隱藏已對帳(打勾)項目
    </label>
  </div>

  <div class="stats-info" id="statsInfo">載入中...</div>

  <!-- 區塊 3：中信流水對帳表 -->
  <div style="overflow-x:auto;">
    <table>
      <thead>
        <tr>
          <th>ID</th>
          <th>交易日期時間</th>
          <th>支出 / 存入</th>
          <th>對方帳號 / 備註</th>
          <th>匹配團員填單 (下拉選單)</th>
          <th>對帳狀態</th>
        </tr>
      </thead>
      <tbody id="bankTable"></tbody>
    </table>
  </div>

  <!-- 分頁控制元件 -->
  <div class="pagination" id="pagination"></div>

  <script>
    let rawTransactions = [file-tag: code-generated-file-b880da6b-9430-4969-b315-f47770135819];
    let transactions = rawTransactions.filter(d => d.date !== '日期');

    let orderRecords = [
      { id: 101, status: "已匯款", name: "🐶小明", event: "260328 D1", member: "成員A", amount: "4266", last5: "86876" },
      { id: 102, status: "已匯款", name: "🐱小華", event: "260329 D2", member: "成員B", amount: "580", last5: "29556" }
    ];

    let auditState = {};
    let currentFilter = 'all';
    let currentPage = 1;
    const pageSize = 50;

    async function loadAllData() {
      try {
        const uRes = await fetch('../json/users.json');
        const users = await uRes.json();
        document.getElementById('userSelect').innerHTML = users.map(u => `<option value="${u}">${u}</option>`).join('');
      } catch(e) {
        document.getElementById('userSelect').innerHTML = '<option value="白菜">白菜</option>';
      }

      try {
        const mRes = await fetch('../json/members.json');
        const members = await mRes.json();
        document.getElementById('memberSelect').innerHTML = members.map(m => `<option value="${m}">${m}</option>`).join('');
      } catch(e) {
        document.getElementById('memberSelect').innerHTML = '<option value="方燦">方燦</option>';
      }

      initCtbcDropdown();
      renderTable();
    }

    function toggleCustomEvent(sel) {
      document.getElementById('customEventGroup').style.display = sel.value === 'other' ? 'flex' : 'none';
    }

    function addOrderRecord() {
      const payStatus = document.getElementById('payStatusSelect').value;
      const name = document.getElementById('userSelect').value;
      const eventSel = document.getElementById('eventSelect').value;
      const event = eventSel === 'other' ? document.getElementById('customEventInput').value : eventSel;
      const member = document.getElementById('memberSelect').value;
      const qty = document.getElementById('qtyInput').value;
      const amount = document.getElementById('amountInput').value;
      const payDate = document.getElementById('payDateInput').value;
      const payAmount = document.getElementById('payAmountInput').value;
      const last5 = document.getElementById('payLast5Input').value;

      if(!name || !event || !member || !qty || !amount) {
        alert("請填寫所有必填欄位（暱稱、場次、成員、張數、金額）！");
        return;
      }

      const newRecord = { 
        id: Date.now(), 
        status: payStatus, 
        name, 
        event, 
        member, 
        qty, 
        amount, 
        payDate: payDate || '-', 
        payAmount: payAmount || '-', 
        last5: last5 || '-' 
      };

      orderRecords.push(newRecord);
      alert("新增填單成功！");
      
      document.getElementById('payDateInput').value = '';
      document.getElementById('payAmountInput').value = '';
      document.getElementById('payLast5Input').value = '';

      renderTable();
    }

    function initCtbcDropdown() {
      const select = document.getElementById('ctbcSelect');
      select.innerHTML = `<option value="">-- 請選擇對應的中信交易筆數 (共 ${transactions.length} 筆) --</option>` + 
        transactions.map(t => {
          const amt = t.inc ? `+${t.inc}` : `-${t.exp}`;
          return `<option value="${t.id}" data-date="${t.date}" data-amount="${amt}" data-acc="${t.acc}">${t.date} | ${amt} | ${t.acc}</option>`;
        }).join('');
    }

    function autoFillAuditInfo(sel) {
      const opt = sel.options[sel.selectedIndex];
      if(!sel.value) {
        document.getElementById('auditDate').value = '';
        document.getElementById('auditAmount').value = '';
        document.getElementById('auditLast5').value = '';
        return;
      }
      document.getElementById('auditDate').value = opt.getAttribute('data-date');
      document.getElementById('auditAmount').value = opt.getAttribute('data-amount');
      const acc = opt.getAttribute('data-acc');
      const last5Match = acc.match(/\d{5}/);
      document.getElementById('auditLast5').value = last5Match ? last5Match[0] : acc;
    }

    function getFilteredTransactions() {
      const searchVal = document.getElementById('searchInput').value.toLowerCase();
      const hideComp = document.getElementById('hideCompleted').checked;

      return transactions.filter(t => {
        const isComp = auditState[t.id] || false;
        if(hideComp && isComp) return false;

        const isInc = t.inc !== "";
        if(currentFilter === 'income' && !isInc) return false;

        const matchSearch = t.date.toLowerCase().includes(searchVal) || 
                            t.acc.toLowerCase().includes(searchVal) || 
                            (t.inc && t.inc.includes(searchVal)) ||
                            (t.exp && t.exp.includes(searchVal));
        return matchSearch;
      });
    }

    function onSearchChange() {
      currentPage = 1;
      renderTable();
    }

    function renderTable() {
      const tbody = document.getElementById('bankTable');
      tbody.innerHTML = '';

      const filteredList = getFilteredTransactions();
      const totalPages = Math.ceil(filteredList.length / pageSize) || 1;
      if (currentPage > totalPages) currentPage = totalPages;

      const startIndex = (currentPage - 1) * pageSize;
      const pageData = filteredList.slice(startIndex, startIndex + pageSize);

      let totalInc = 0;
      filteredList.forEach(t => {
        if(t.inc) totalInc += parseInt(t.inc.replace(/,/g, '')) || 0;
      });

      pageData.forEach(t => {
        const isComp = auditState[t.id] || false;
        const tr = document.createElement('tr');
        if(isComp) tr.classList.add('completed');

        const orderOpts = orderRecords.map(o => {
          const last5Display = o.last5 !== '-' ? `後5碼:${o.last5}` : '未填後5碼';
          return `<option value="${o.id}">[${o.status}] ${o.event} | ${o.name} | $${o.amount} (${last5Display})</option>`;
        }).join('');

        tr.innerHTML = `
          <td>${t.id}</td>
          <td>${t.date}</td>
          <td>${t.inc ? `<span class="income">+${t.inc}</span>` : `<span class="expense">-${t.exp}</span>`}</td>
          <td><span class="account-code">${t.acc}</span></td>
          <td>
            <select style="width:100%; font-size:12px;">
              <option value="">-- 選擇配對的填單 --</option>
              ${orderOpts}
            </select>
          </td>
          <td>
            <label class="no-strike" style="cursor:pointer; font-weight:bold;">
              <input type="checkbox" ${isComp ? 'checked' : ''} onchange="toggleAudit(${t.id}, this.checked)">
              ${isComp ? '✅ 已對帳' : '未對帳'}
            </label>
          </td>
        `;
        tbody.appendChild(tr);
      });

      document.getElementById('statsInfo').innerHTML = 
        `符合條件: ${filteredList.length} / 全部 ${transactions.length} 筆 (第 ${currentPage} / ${totalPages} 頁，每頁 50 筆) | 存入總金額: <span id="totalIncome">$${totalInc.toLocaleString()}</span>`;

      renderPagination(totalPages);
    }

    function renderPagination(totalPages) {
      const pContainer = document.getElementById('pagination');
      pContainer.innerHTML = '';

      if (totalPages <= 1) return;

      const prevBtn = document.createElement('button');
      prevBtn.className = 'page-btn';
      prevBtn.innerText = '上一頁';
      prevBtn.disabled = currentPage === 1;
      prevBtn.onclick = () => { currentPage--; renderTable(); };
      pContainer.appendChild(prevBtn);

      for(let i = 1; i <= totalPages; i++) {
        if (totalPages > 10 && Math.abs(i - currentPage) > 3 && i !== 1 && i !== totalPages) {
          if (i === 2 || i === totalPages - 1) {
            const dots = document.createElement('span');
            dots.innerText = '...';
            dots.style.fontSize = '12px';
            pContainer.appendChild(dots);
          }
          continue;
        }

        const btn = document.createElement('button');
        btn.className = `page-btn ${i === currentPage ? 'active' : ''}`;
        btn.innerText = i;
        btn.onclick = () => { currentPage = i; renderTable(); };
        pContainer.appendChild(btn);
      }

      const nextBtn = document.createElement('button');
      nextBtn.className = 'page-btn';
      nextBtn.innerText = '下一頁';
      nextBtn.disabled = currentPage === totalPages;
      nextBtn.onclick = () => { currentPage++; renderTable(); };
      pContainer.appendChild(nextBtn);
    }

    function toggleAudit(id, checked) {
      auditState[id] = checked;
      renderTable();
    }

    function setFilter(type, btn) {
      currentFilter = type;
      document.querySelectorAll('.btn-filter').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentPage = 1;
      renderTable();
    }

    loadAllData();
  </script>
</body>
</html>
