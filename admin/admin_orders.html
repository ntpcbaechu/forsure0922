<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>團員登記與管理</title>
  <style>
    body { margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: transparent; display: flex; flex-direction: column; gap: 15px; }
    iframe { width: 100%; border: none; min-height: 500px; background: transparent; }
  </style>
</head>
<body>

  <!-- 上層：登記表單 -->
  <iframe id="formFrame" src="orders/orders_form.html"></iframe>

  <!-- 下層：管理與明細列表 -->
  <iframe id="manageFrame" src="orders/orders_manage.html"></iframe>

  <script>
    window.addEventListener('message', (e) => {
      if (e.data && e.data.frameHeight && e.source) {
        const iframes = document.querySelectorAll('iframe');
        iframes.forEach(f => {
          if (f.contentWindow === e.source) {
            f.style.height = (e.data.frameHeight + 20) + 'px';
          }
        });
      }
    });
  </script>
</body>
</html>
