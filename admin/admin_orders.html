<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>團員登記管理</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 15px; margin: 0; background: #fff; color: #333; }
    h3 { margin-top: 0; margin-bottom: 15px; font-size: 18px; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; background: #fff; }
    th, td { padding: 10px 8px; border-bottom: 1px solid #e4e7ed; text-align: left; font-size: 13px; vertical-align: middle; }
    th { background: #f8f9fa; color: #606266; font-weight: bold; white-space: nowrap; }
    input[type="text"], input[type="number"], select { padding: 6px 8px; border: 1px solid #dcdfe6; border-radius: 4px; font-size: 13px; outline: none; }
    input:focus, select:focus { border-color: #409eff; }
    .btn-edit { background-color: #e6a23c; color: white; padding: 4px 8px; font-size: 12px; border-radius: 4px; border: none; cursor: pointer; }
    .btn-danger { background-color: #f56c6c; color: white; padding: 4px 8px; font-size: 12px; border-radius: 4px; border: none; cursor: pointer; }
    .btn-save { background-color: #67c23a; color: white; padding: 4px 8px; font-size: 12px; border-radius: 4px; border: none; cursor: pointer; }
    .btn-photo { background-color: #409eff; color: white; padding: 4px 8px; font-size: 12px; border-radius: 4px; border: none; cursor: pointer; font-weight: bold; }
    .filter-bar { display: flex; gap: 10px; margin-bottom: 15px; flex-wrap: wrap; background: #f8f9fa; padding: 10px; border-radius: 8px; border: 1px solid #ebeef5; align-items: center; }
  </style>
</head>
<body>

  <h3>團員登記管理與一鍵發圖</h3>

  <div class="filter-bar">
    <input type="text" id="orderSearchInput" placeholder="🔍 搜尋買家暱稱、活動、成員..." onkeyup="renderOrdersTable()" style="width:250px;">
    <span style="font-size:12px; color:#909399; margin-left:auto;">💡 可直接在後台針對未匯款訂單一鍵設為已發圖，自動帶入 8 天下載期限。</span>
  </div>

  <table>
    <thead>
      <tr>
        <th style="width: 15%;">買家暱稱</th>
        <th style="width: 25%;">活動與成員 (數量)</th>
        <th style="width: 15%;">金額 / 狀態</th>
        <th style="width: 20%;">發圖與下載期限狀態</th>
        <th style="width: 25%;">操作</th>
      </tr>
    </thead>
    <tbody id="ordersTableBody">
      <tr><td colspan="5" style="text-align:center; color:#909399; padding:20px;">載入中...</td></tr>
    </tbody>
  </table>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, doc, deleteDoc, updateDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDF7QySG1Jj4gdZvXwMRaKjRmI-lFKpj7k",
      authDomain: "forsure0922.firebaseapp.com",
      databaseURL: "https://forsure0922-default-rtdb.firebaseio.com",
      projectId: "forsure0922",
      storageBucket: "forsure0922.firebasestorage.app",
      messagingSenderId: "817449290174",
      appId: "1:817449290174:web:6b4ec1d36c171ff97011ef"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let ordersMap = {};
    let editingRows = new Set();

    onSnapshot(collection(db, "orders"), snap => {
      ordersMap = {};
      snap.forEach(d => { ordersMap[d.id] = { id: d.id, ...d.data() }; });
      renderOrdersTable();
    });

    window.renderOrdersTable = () => {
      const tb = document.getElementById('ordersTableBody');
      tb.innerHTML = '';

      const kw = document.getElementById('orderSearchInput').value.toLowerCase().trim();
      let list = Object.values(ordersMap);

      if (kw) {
        list = list.filter(o => `${o.user || ''} ${o.buyerName || ''} ${o.event || ''} ${o.eventName || ''} ${o.member || ''}`.toLowerCase().includes(kw));
      }

      if (list.length === 0) {
        tb.innerHTML = '<tr><td colspan="5" style="text-align:center; color:#909399; padding:30px;">目前尚無符合的訂單紀錄</td></tr>';
        notifyHeight();
        return;
      }

      list.sort((a, b) => new Date(b.createdAt || 0).getTime() - new Date(a.createdAt || 0).getTime());

      list.forEach(o => {
        const docId = o.id;
        const isEditing = editingRows.has(docId);
        const uName = o.user || o.buyerName || '-';
        const ev = o.event || o.eventName || '-';
        const mem = o.member || '-';
        const qty = o.qty !== undefined ? o.qty : (o.quantity || 1);
        const amt = o.total !== undefined ? o.total : (o.amount || 0);
        const payStatus = o.paymentStatus || o.status || '待匯款';
        const isPhotoSent = o.isPhotoSent === true;
        const sentAt = o.photoSentAt || '-';
        const expireAt = o.photoExpireAt || '-';

        const tr = document.createElement('tr');

        if (!isEditing) {
          tr.innerHTML = `
            <td><b>${uName}</b></td>
            <td><b>${ev}</b><br><small style="color:#606266;">成員: ${mem} (數量: ${qty}張)</small></td>
            <td>$${amt}<br><span style="font-size:11px; color:#e6a23c; font-weight:bold;">${payStatus}</span></td>
            <td>
              ${isPhotoSent ? `<b style="color:#409eff;">🟢 已發圖</b><br><small style="color:#909399;">發圖: ${sentAt}<br>刪除: <span style="color:#f56c6c;">${expireAt}</span></small>` : `<span style="color:#909399;">尚未發圖</span>`}
            </td>
            <td>
              ${isPhotoSent 
                ? `<button class="btn-danger" onclick="toggleOrderPhoto('${docId}', false)" style="margin-bottom:4px;">取消發圖狀態</button>`
                : `<button class="btn-photo" onclick="toggleOrderPhoto('${docId}', true)" style="margin-bottom:4px;">📷 設為已發圖</button>`
              }<br>
              <button class="btn-edit" onclick="toggleEdit('${docId}', true)">✏️ 編輯</button>
              <button class="btn-danger" onclick="deleteOrder('${docId}')">🗑️ 刪除</button>
            </td>
          `;
        } else {
          tr.innerHTML = `
            <td><input type="text" id="edit-user-${docId}" value="${uName}" style="width:100%;"></td>
            <td>
              活動: <input type="text" id="edit-ev-${docId}" value="${ev}" style="width:100%; margin-bottom:4px;"><br>
              成員: <input type="text" id="edit-mem-${docId}" value="${mem}" style="width:45%;" placeholder="成員"> 
              數量: <input type="number" id="edit-qty-${docId}" value="${qty}" style="width:45%;" placeholder="數量">
            </td>
            <td>金額: <input type="number" id="edit-amt-${docId}" value="${amt}" style="width:80px;"></td>
            <td>編輯中</td>
            <td>
              <button class="btn-save" onclick="saveOrderEdit('${docId}')">💾 儲存</button>
              <button class="btn-danger" onclick="toggleEdit('${docId}', false)">❌ 取消</button>
            </td>
          `;
        }
        tb.appendChild(tr);
      });

      notifyHeight();
    };

    window.toggleEdit = (docId, isEdit) => {
      if (isEdit) editingRows.add(docId);
      else editingRows.delete(docId);
      renderOrdersTable();
    };

    window.saveOrderEdit = async (docId) => {
      const user = document.getElementById(`edit-user-${docId}`).value.trim();
      const event = document.getElementById(`edit-ev-${docId}`).value.trim();
      const member = document.getElementById(`edit-mem-${docId}`).value.trim();
      const qty = parseInt(document.getElementById(`edit-qty-${docId}`).value) || 1;
      const total = parseFloat(document.getElementById(`edit-amt-${docId}`).value) || 0;

      try {
        await updateDoc(doc(db, "orders", docId), { user, buyerName: user, event, eventName: event, member, qty, quantity: qty, total, amount: total });
        editingRows.delete(docId);
        alert('✅ 訂單修改成功！');
      } catch (err) { alert('儲存失敗: ' + err.message); }
    };

    window.toggleOrderPhoto = async (docId, shouldSend) => {
      const todayObj = new Date();
      const todayStr = todayObj.toISOString().slice(0,10);
      const expireObj = new Date(todayObj.getTime() + 8 * 24 * 60 * 60 * 1000);
      const expireStr = expireObj.toISOString().slice(0,10);

      try {
        await updateDoc(doc(db, "orders", docId), {
          isPhotoSent: shouldSend,
          photoSentAt: shouldSend ? todayStr : '',
          photoExpireAt: shouldSend ? expireStr : ''
        });
        alert(shouldSend ? '✅ 已成功設為已發圖 (自動帶入 8 天刪除期限)' : '✅ 已取消發圖狀態');
      } catch (err) { alert('更新發圖狀態失敗: ' + err.message); }
    };

    window.deleteOrder = async (docId) => {
      if (confirm('確定要刪除這筆訂單嗎？')) {
        try { await deleteDoc(doc(db, "orders", docId)); } catch (err) { alert('刪除失敗: ' + err.message); }
      }
    };

    function notifyHeight() {
      setTimeout(() => { window.parent.postMessage({ frameHeight: document.body.scrollHeight }, '*'); }, 100);
    }
  </script>
</body>
</html>
