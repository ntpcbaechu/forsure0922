<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>團員登記管理</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 15px; margin: 0; background: #fff; color: #333; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    th, td { padding: 8px 10px; border-bottom: 1px solid #e4e7ed; text-align: left; font-size: 13px; vertical-align: middle; }
    th { background: #f8f9fa; white-space: nowrap; }
    
    input[type="text"], input[type="number"], select {
      width: 100%;
      padding: 6px 8px;
      border: 1px solid #dcdfe6;
      border-radius: 4px;
      font-size: 13px;
      box-sizing: border-box;
      background-color: #fff;
    }
    input:focus, select:focus {
      border-color: #409eff;
      outline: none;
    }

    .btn-save { background-color: #67c23a; color: white; padding: 6px 12px; font-size: 12px; border-radius: 4px; border: none; cursor: pointer; margin-right: 4px; }
    .btn-save:hover { background-color: #5daf34; }
    .btn-danger { background-color: #f56c6c; color: white; padding: 6px 12px; font-size: 12px; border-radius: 4px; border: none; cursor: pointer; }
    .btn-danger:hover { background-color: #e64242; }
    
    .status-select { font-weight: bold; }
    .status-pending { color: #e6a23c; }
    .status-paid { color: #67c23a; }
  </style>
</head>
<body>

  <h3>團員填單紀錄管理</h3>
  <div style="margin-bottom:12px; display:flex; gap:10px;">
    <input type="text" id="searchOrderInput" placeholder="搜尋社群名稱或活動/成員..." style="max-width:300px;">
  </div>

  <table>
    <thead>
      <tr>
        <th style="width: 15%;">社群暱稱</th>
        <th style="width: 20%;">活動名稱</th>
        <th style="width: 15%;">登記成員</th>
        <th style="width: 10%;">登記張數</th>
        <th style="width: 18%;">登記時間</th>
        <th style="width: 12%;">匯款狀態</th>
        <th style="width: 10%;">操作</th>
      </tr>
    </thead>
    <tbody id="ordersAdminTable"></tbody>
  </table>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, doc, deleteDoc, updateDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDF7QySG1Jj4gdZvXwMRaKjRmI-lFKpj7k",
      authDomain: "forsure0922.firebaseapp.com",
      databaseURL: "https://forsure0922-default-rtdb.firebaseio.com",
      projectId: "forsure0922",
      storageBucket: "forsure0922.firebasestorage.app",
      messagingSenderId: "817449290174",
      appId: "1:817449290174:web:6b4ec1d36c171ff97011ef"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    onSnapshot(collection(db, "orders"), snap => {
      const tb = document.getElementById('ordersAdminTable');
      
      // 避免編輯到一半被即時監聽刷新，只在沒人在輸入時重繪
      if (document.activeElement && document.activeElement.tagName === 'INPUT') return;

      tb.innerHTML = '';

      snap.forEach(d => {
        const item = d.data();
        const docId = d.id;
        
        // 修正：優先抓取前台表單存入的 buyerName，其次才是 user 或 nickname
        const user = item.buyerName || item.user || item.nickname || '';

        // 修正：活動名稱與成員
        const eName = item.event || item.eventName || '';
        const member = item.member || '';
        const qty = item.qty !== undefined ? item.qty : (item.quantity !== undefined ? item.quantity : 0);
        
        // 修正：精準解析 ISO 時間格式（解決 Invalid Date）
        let timeStr = item.time || '';
        if (!timeStr && item.createdAt) {
          try {
            let dateObj;
            if (typeof item.createdAt === 'string') {
              dateObj = new Date(item.createdAt);
            } else if (item.createdAt.seconds) {
              dateObj = new Date(item.createdAt.seconds * 1000);
            }
            
            if (dateObj && !isNaN(dateObj.getTime())) {
              timeStr = dateObj.toLocaleString('zh-TW', { 
                month: 'numeric', 
                day: 'numeric', 
                hour: '2-digit', 
                minute: '2-digit', 
                hour12: false 
              });
            }
          } catch(e) { timeStr = ''; }
        }

        // 判斷匯款狀態
        const isPaid = item.hasPaid || item.paymentStatus === '已對帳' || item.status === '已對帳';

        const tr = document.createElement('tr');
        tr.id = `row-${docId}`;
        tr.innerHTML = `
          <td><input type="text" value="${user}" placeholder="手動補上暱稱" id="user-${docId}"></td>
          <td><input type="text" value="${eName}" placeholder="活動名稱" id="event-${docId}"></td>
          <td><input type="text" value="${member}" placeholder="成員" id="member-${docId}" style="color:#409eff; font-weight:bold;"></td>
          <td><input type="number" value="${qty}" id="qty-${docId}" style="width:70px;"></td>
          <td><input type="text" value="${timeStr}" placeholder="如 7/27 02:15" id="time-${docId}"></td>
          <td>
            <select id="status-${docId}" class="status-select ${isPaid ? 'status-paid' : 'status-pending'}">
              <option value="pending" ${!isPaid ? 'selected' : ''}>⏳ 待匯款</option>
              <option value="paid" ${isPaid ? 'selected' : ''}>🟢 已匯款</option>
            </select>
          </td>
          <td>
            <button class="btn-save" onclick="saveOrder('${docId}')">儲存</button>
            <button class="btn-danger" onclick="deleteUserOrder('${docId}')">刪除</button>
          </td>
        `;
        tb.appendChild(tr);
      });
      notifyHeight();
    });

    // 儲存整列單筆資料（雙向相容寫入 buyerName 與 user，確保前後台都讀得到）
    window.saveOrder = async (docId) => {
      const user = document.getElementById(`user-${docId}`).value.trim();
      const eventName = document.getElementById(`event-${docId}`).value.trim();
      const member = document.getElementById(`member-${docId}`).value.trim();
      const qty = parseInt(document.getElementById(`qty-${docId}`).value) || 0;
      const timeStr = document.getElementById(`time-${docId}`).value.trim();
      const statusVal = document.getElementById(`status-${docId}`).value;
      const isPaid = statusVal === 'paid';

      try {
        await updateDoc(doc(db, "orders", docId), {
          buyerName: user,
          user: user,
          event: eventName,
          eventName: eventName,
          member: member,
          qty: qty,
          quantity: qty,
          time: timeStr,
          hasPaid: isPaid,
          paymentStatus: isPaid ? '已對帳' : '待匯款',
          status: isPaid ? '已對帳' : '待匯款'
        });
        alert('✅ 更新成功！');
      } catch (err) {
        alert('儲存失敗: ' + err.message);
      }
    };

    window.deleteUserOrder = async (docId) => {
      if (confirm('確定要刪除這筆紀錄嗎？')) {
        try {
          await deleteDoc(doc(db, "orders", docId));
          alert('已成功刪除。');
        } catch (err) {
          alert('刪除失敗: ' + err.message);
        }
      }
    };

    // 搜尋過濾
    document.getElementById('searchOrderInput').addEventListener('input', (e) => {
      const kw = e.target.value.toLowerCase();
      const rows = document.querySelectorAll('#ordersAdminTable tr');
      rows.forEach(r => {
        const inputs = r.querySelectorAll('input');
        let textMatch = false;
        inputs.forEach(input => {
          if (input.value.toLowerCase().includes(kw)) textMatch = true;
        });
        r.style.display = textMatch ? '' : 'none';
      });
    });

    function notifyHeight() {
      setTimeout(() => {
        window.parent.postMessage({ frameHeight: document.body.scrollHeight }, '*');
      }, 100);
    }
  </script>

</body>
</html>
