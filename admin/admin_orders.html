<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>團員登記與管理總覽專區</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 15px; margin: 0; background: #fff; color: #333; }
    h3 { margin-top: 0; margin-bottom: 15px; font-size: 18px; }
    .iframe-card { background: #fff; border: 1px solid #e4e7ed; border-radius: 12px; padding: 10px; margin-bottom: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.02); }
    iframe { width: 100%; border: none; min-height: 250px; }
  </style>
</head>
<body>

  <h3>📄 團員登記與管理總覽專區</h3>

  <div class="iframe-card">
    <iframe id="formFrame" src="orders/orders_form.html"></iframe>
  </div>

  <div class="iframe-card">
    <iframe id="manageFrame" src="orders/orders_manage.html"></iframe>
  </div>

  <script>
    window.addEventListener('message', (e) => {
      if (e.data && e.data.frameHeight) {
        const frames = document.querySelectorAll('iframe');
        frames.forEach(f => {
          try {
            if (f.contentWindow === e.source) {
              f.style.height = (e.data.frameHeight + 20) + 'px';
            }
          } catch(err) {}
        });
      }
    });
  </script>
</body>
</html>
