<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>團員登記管理</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 15px; margin: 0; background: #fff; color: #333; }
    
    .filter-card { background: #f8f9fa; border: 1px solid #e4e7ed; border-radius: 10px; padding: 12px 14px; margin-bottom: 15px; }
    .filter-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .filter-title { font-size: 13px; font-weight: bold; color: #303133; white-space: nowrap; }

    select, input[type="text"], input[type="number"] {
      padding: 6px 10px;
      border: 1px solid #dcdfe6;
      border-radius: 6px;
      font-size: 13px;
      background-color: #fff;
      outline: none;
    }
    select:focus, input:focus { border-color: #409eff; }

    .capsule-bar { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
    .capsule-btn { background: #fff; color: #409eff; border: 1px solid #d9ecff; padding: 4px 12px; border-radius: 16px; font-size: 12px; font-weight: bold; cursor: pointer; transition: all 0.2s; }
    .capsule-btn:hover, .capsule-btn.active { background: #409eff; color: #fff; border-color: #409eff; }

    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    th, td { padding: 10px 8px; border-bottom: 1px solid #e4e7ed; text-align: left; font-size: 13px; vertical-align: middle; }
    th { background: #f8f9fa; color: #606266; font-weight: bold; white-space: nowrap; }
    
    .btn-edit { background-color: #e6a23c; color: white; padding: 5px 10px; font-size: 12px; border-radius: 4px; border: none; cursor: pointer; margin-right: 4px; }
    .btn-save { background-color: #67c23a; color: white; padding: 5px 10px; font-size: 12px; border-radius: 4px; border: none; cursor: pointer; margin-right: 4px; }
    .btn-cancel { background-color: #909399; color: white; padding: 5px 10px; font-size: 12px; border-radius: 4px; border: none; cursor: pointer; margin-right: 4px; }
    .btn-danger { background-color: #f56c6c; color: white; padding: 5px 10px; font-size: 12px; border-radius: 4px; border: none; cursor: pointer; }
    
    .status-select { font-weight: bold; border-radius: 4px; padding: 4px; }
    .status-pending { color: #e6a23c; border-color: #fbe3b5; }
    .status-paid { color: #67c23a; border-color: #c2e7b0; }
    .type-badge { font-size: 11px; padding: 2px 6px; border-radius: 4px; background: #f4f4f5; color: #909399; }
    .type-add { background: #fdf6ec; color: #e6a23c; }
  </style>
</head>
<body>

  <h3>團員填單紀錄管理</h3>

  <!-- 仿照 index_records 的篩選面板 -->
  <div class="filter-card">
    <div class="filter-row">
      <span class="filter-title">🔍 篩選模式：</span>
      <select id="modeSelect">
        <option value="ALL">全部顯示</option>
        <option value="user">依社群暱稱</option>
        <option value="event">依活動名稱</option>
      </select>
      <input type="text" id="searchOrderInput" placeholder="直接關鍵字搜尋..." style="flex:1; min-width:180px;">
    </div>
    <div id="capsuleContainer" class="capsule-bar"></div>
  </div>

  <table>
    <thead>
      <tr>
        <th style="width: 15%;">社群暱稱</th>
        <th style="width: 20%;">活動名稱</th>
        <th style="width: 12%;">登記成員</th>
        <th style="width: 10%;">類別</th>
        <th style="width: 8%;">張數</th>
        <th style="width: 15%;">登記時間</th>
        <th style="width: 10%;">匯款狀態</th>
        <th style="width: 10%;">操作</th>
      </tr>
    </thead>
    <tbody id="ordersAdminTable"></tbody>
  </table>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, doc, deleteDoc, updateDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDF7QySG1Jj4gdZvXwMRaKjRmI-lFKpj7k",
      authDomain: "forsure0922.firebaseapp.com",
      databaseURL: "https://forsure0922-default-rtdb.firebaseio.com",
      projectId: "forsure0922",
      storageBucket: "forsure0922.firebasestorage.app",
      messagingSenderId: "817449290174",
      appId: "1:817449290174:web:6b4ec1d36c171ff97011ef"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let usersList = [];
    let membersList = [];
    let eventList = [];
    let ordersCache = {};
    let editingRows = new Set();
    let activeFilterValue = 'ALL';

    document.addEventListener('DOMContentLoaded', async () => {
      const [uRes, mRes] = await Promise.all([
        fetch('../json/users.json'),
        fetch('../json/members.json')
      ]);
      usersList = await uRes.json();
      membersList = await mRes.json();

      onSnapshot(collection(db, "event_settings"), snap => {
        const eventsSet = new Set();
        snap.forEach(d => {
          const name = d.data().name || d.data().rawName;
          if (name) eventsSet.add(name.trim());
        });
        eventList = Array.from(eventsSet).sort();
      });
    });

    document.getElementById('modeSelect').addEventListener('change', () => {
      activeFilterValue = 'ALL';
      renderCapsulesAndTable();
    });

    document.getElementById('searchOrderInput').addEventListener('input', () => {
      renderTableContent();
    });

    onSnapshot(collection(db, "orders"), snap => {
      ordersCache = {};
      snap.forEach(d => { ordersCache[d.id] = { id: d.id, ...d.data() }; });
      renderCapsulesAndTable();
    });

    function renderCapsulesAndTable() {
      const mode = document.getElementById('modeSelect').value;
      const container = document.getElementById('capsuleContainer');
      container.innerHTML = '';

      const allOrders = Object.values(ordersCache);

      if (mode === 'user') {
        const usersSet = new Set();
        allOrders.forEach(o => {
          const name = o.buyerName || o.user || o.nickname;
          if (name) usersSet.add(name);
        });
        const sortedUsers = Array.from(usersSet).sort((a, b) => a.localeCompare(b, 'zh-TW'));

        const allBtn = document.createElement('button');
        allBtn.className = `capsule-btn ${activeFilterValue === 'ALL' ? 'active' : ''}`;
        allBtn.textContent = '👤 全部';
        allBtn.onclick = () => { activeFilterValue = 'ALL'; renderCapsulesAndTable(); };
        container.appendChild(allBtn);

        sortedUsers.forEach(userName => {
          const btn = document.createElement('button');
          btn.className = `capsule-btn ${activeFilterValue === userName ? 'active' : ''}`;
          btn.textContent = `👤 ${userName}`;
          btn.onclick = () => { activeFilterValue = userName; renderCapsulesAndTable(); };
          container.appendChild(btn);
        });
      } else if (mode === 'event') {
        const eventsSet = new Set();
        allOrders.forEach(o => {
          const ev = o.event || o.eventName || '未分類活動';
          if (ev) eventsSet.add(ev);
        });
        const sortedEvents = Array.from(eventsSet).sort((a, b) => {
          const matchA = a.match(/\d{6}/); const matchB = b.match(/\d{6}/);
          const dateA = matchA ? parseInt(matchA[0], 10) : 0;
          const dateB = matchB ? parseInt(matchB[0], 10) : 0;
          if (dateA !== dateB) return dateA - dateB;
          return a.localeCompare(b, 'zh-TW');
        });

        const allBtn = document.createElement('button');
        allBtn.className = `capsule-btn ${activeFilterValue === 'ALL' ? 'active' : ''}`;
        allBtn.textContent = '📍 全部';
        allBtn.onclick = () => { activeFilterValue = 'ALL'; renderCapsulesAndTable(); };
        container.appendChild(allBtn);

        sortedEvents.forEach(evTitle => {
          const btn = document.createElement('button');
          btn.className = `capsule-btn ${activeFilterValue === evTitle ? 'active' : ''}`;
          btn.textContent = `📍 ${evTitle}`;
          btn.onclick = () => { activeFilterValue = evTitle; renderCapsulesAndTable(); };
          container.appendChild(btn);
        });
      }

      renderTableContent();
    }

    function renderTableContent() {
      const tb = document.getElementById('ordersAdminTable');
      tb.innerHTML = '';

      const mode = document.getElementById('modeSelect').value;
      const kw = document.getElementById('searchOrderInput').value.toLowerCase();
      const allOrders = Object.values(ordersCache);

      const filtered = allOrders.filter(item => {
        const user = String(item.buyerName || item.user || item.nickname || '');
        const eName = String(item.event || item.eventName || '');

        // 膠囊篩選判斷
        if (mode === 'user' && activeFilterValue !== 'ALL' && user !== activeFilterValue) return false;
        if (mode === 'event' && activeFilterValue !== 'ALL' && eName !== activeFilterValue) return false;

        // 文字搜尋框判斷
        if (kw) {
          const rowText = `${user} ${eName} ${item.member || ''} ${item.orderType || ''}`.toLowerCase();
          if (!rowText.includes(kw)) return false;
        }
        return true;
      });

      filtered.forEach(item => {
        const docId = item.id;
        const isEditing = editingRows.has(docId);

        const user = item.buyerName || item.user || item.nickname || '';
        const eName = item.event || item.eventName || '';
        const member = item.member || '';
        const orderType = item.orderType || '一般';
        const qty = item.qty !== undefined ? item.qty : (item.quantity !== undefined ? item.quantity : 0);
        
        let timeStr = item.time || '';
        if (!timeStr && item.createdAt) {
          try {
            let dateObj = (typeof item.createdAt === 'string') ? new Date(item.createdAt) : new Date(item.createdAt.seconds * 1000);
            if (dateObj && !isNaN(dateObj.getTime())) {
              timeStr = dateObj.toLocaleString('zh-TW', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit', hour12: false });
            }
          } catch(e) { timeStr = ''; }
        }

        const isPaid = item.hasPaid || item.paymentStatus === '已對帳' || item.status === '已對帳';

        const tr = document.createElement('tr');
        tr.id = `row-${docId}`;

        if (!isEditing) {
          const typeBadge = orderType === '追加' ? '<span class="type-badge type-add">追加</span>' : '<span class="type-badge">一般</span>';
          tr.innerHTML = `
            <td><b>${user}</b></td>
            <td>${eName}</td>
            <td style="color:#409eff; font-weight:bold;">${member}</td>
            <td>${typeBadge}</td>
            <td><b>${qty}</b></td>
            <td style="color:#909399; font-size:12px;">${timeStr}</td>
            <td>
              <select class="status-select ${isPaid ? 'status-paid' : 'status-pending'}" onchange="quickUpdateStatus('${docId}', this.value)">
                <option value="pending" ${!isPaid ? 'selected' : ''}>⏳ 待匯款</option>
                <option value="paid" ${isPaid ? 'selected' : ''}>🟢 已對帳</option>
              </select>
            </td>
            <td>
              <button class="btn-edit" onclick="toggleEdit('${docId}', true)">✏️ 編輯</button>
              <button class="btn-danger" onclick="deleteUserOrder('${docId}')">🗑️ 刪除</button>
            </td>
          `;
        } else {
          let userOptions = usersList.map(u => `<option value="${u}" ${u === user ? 'selected' : ''}>${u}</option>`).join('');
          if (user && !usersList.includes(user)) userOptions = `<option value="${user}" selected>${user}</option>` + userOptions;

          let eventOptions = eventList.map(e => `<option value="${e}" ${e === eName ? 'selected' : ''}>${e}</option>`).join('');
          if (eName && !eventList.includes(eName)) eventOptions = `<option value="${eName}" selected>${eName}</option>` + eventOptions;

          let memberOptions = membersList.map(m => `<option value="${m}" ${m === member ? 'selected' : ''}>${m}</option>`).join('');

          tr.innerHTML = `
            <td><select id="user-${docId}">${userOptions}</select></td>
            <td><select id="event-${docId}">${eventOptions}</select></td>
            <td><select id="member-${docId}">${memberOptions}</select></td>
            <td>
              <select id="type-${docId}">
                <option value="一般" ${orderType === '一般' ? 'selected' : ''}>一般</option>
                <option value="追加" ${orderType === '追加' ? 'selected' : ''}>追加</option>
              </select>
            </td>
            <td><input type="number" value="${qty}" id="qty-${docId}"></td>
            <td><input type="text" value="${timeStr}" id="time-${docId}"></td>
            <td>
              <select id="status-${docId}" class="status-select ${isPaid ? 'status-paid' : 'status-pending'}">
                <option value="pending" ${!isPaid ? 'selected' : ''}>⏳ 待匯款</option>
                <option value="paid" ${isPaid ? 'selected' : ''}>🟢 已對帳</option>
              </select>
            </td>
            <td>
              <button class="btn-save" onclick="saveOrder('${docId}')">💾 儲存</button>
              <button class="btn-cancel" onclick="toggleEdit('${docId}', false)">❌ 取消</button>
            </td>
          `;
        }

        tb.appendChild(tr);
      });
      notifyHeight();
    }

    window.toggleEdit = (docId, isEdit) => {
      if (isEdit) editingRows.add(docId);
      else editingRows.delete(docId);
      renderTableContent();
    };

    window.quickUpdateStatus = async (docId, statusVal) => {
      const isPaid = statusVal === 'paid';
      try {
        await updateDoc(doc(db, "orders", docId), {
          hasPaid: isPaid,
          paymentStatus: isPaid ? '已對帳' : '待匯款',
          status: isPaid ? '已對帳' : '待匯款'
        });
      } catch (err) { alert('更新狀態失敗: ' + err.message); }
    };

    window.saveOrder = async (docId) => {
      const user = document.getElementById(`user-${docId}`).value;
      const eventName = document.getElementById(`event-${docId}`).value;
      const member = document.getElementById(`member-${docId}`).value;
      const orderType = document.getElementById(`type-${docId}`).value;
      const qty = parseInt(document.getElementById(`qty-${docId}`).value) || 0;
      const timeStr = document.getElementById(`time-${docId}`).value.trim();
      const isPaid = document.getElementById(`status-${docId}`).value === 'paid';

      try {
        await updateDoc(doc(db, "orders", docId), {
          buyerName: user, user: user,
          event: eventName, eventName: eventName,
          member: member, orderType: orderType,
          qty: qty, quantity: qty, time: timeStr,
          hasPaid: isPaid, paymentStatus: isPaid ? '已對帳' : '待匯款', status: isPaid ? '已對帳' : '待匯款'
        });
        editingRows.delete(docId);
        alert('✅ 更新成功！');
      } catch (err) { alert('儲存失敗: ' + err.message); }
    };

    window.deleteUserOrder = async (docId) => {
      if (confirm('確定要刪除這筆紀錄嗎？')) {
        try {
          await deleteDoc(doc(db, "orders", docId));
        } catch (err) { alert('刪除失敗: ' + err.message); }
      }
    };

    function notifyHeight() {
      setTimeout(() => {
        window.parent.postMessage({ frameHeight: document.body.scrollHeight }, '*');
      }, 100);
    }
  </script>
</body>
</html>
