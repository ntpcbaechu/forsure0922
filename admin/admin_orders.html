<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>團員登記與管理總覽</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 20px; margin: 0; background: #f5f7fa; color: #333; }
    .card { background: #fff; border-radius: 12px; padding: 16px 20px; margin-bottom: 20px; box-shadow: 0 2px 12px rgba(0,0,0,0.04); border: 1px solid #e4e7ed; }
    h2 { margin-top: 0; font-size: 20px; color: #303133; display: flex; align-items: center; gap: 8px; border-bottom: 1px solid #ebeef5; padding-bottom: 10px; }
    iframe { width: 100%; border: none; overflow: hidden; background: transparent; }
  </style>
</head>
<body>

  <h2>📑 團員登記與管理總覽專區</h2>

  <div class="card">
    <iframe id="iframeForm" src="orders/orders_form.html" scrolling="no"></iframe>
  </div>

  <div class="card">
    <iframe id="iframeManage" src="orders/orders_manage.html" scrolling="no"></iframe>
  </div>

  <script>
    window.addEventListener('message', (e) => {
      if (e.data && e.data.frameHeight) {
        if (e.source === document.getElementById('iframeForm').contentWindow) {
          document.getElementById('iframeForm').style.height = e.data.frameHeight + 'px';
        } else if (e.source === document.getElementById('iframeManage').contentWindow) {
          document.getElementById('iframeManage').style.height = e.data.frameHeight + 'px';
        }
      }
    });
  </script>
</body>
</html>
