<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>團員登記管理</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 15px; margin: 0; background: #fff; color: #333; }
    
    .filter-card { background: #f8f9fa; border: 1px solid #e4e7ed; border-radius: 10px; padding: 12px 14px; margin-bottom: 15px; }
    .filter-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .filter-title { font-size: 13px; font-weight: bold; color: #303133; white-space: nowrap; }

    select, input[type="text"], input[type="number"] {
      padding: 6px 10px;
      border: 1px solid #dcdfe6;
      border-radius: 6px;
      font-size: 13px;
      background-color: #fff;
      outline: none;
    }
    select:focus, input:focus { border-color: #409eff; }

    .capsule-bar { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
    .capsule-btn { background: #fff; color: #409eff; border: 1px solid #d9ecff; padding: 4px 12px; border-radius: 16px; font-size: 12px; font-weight: bold; cursor: pointer; transition: all 0.2s; }
    .capsule-btn:hover, .capsule-btn.active { background: #409eff; color: #fff; border-color: #409eff; }

    .event-section { background: #fff; border: 1px solid #e4e7ed; border-radius: 12px; padding: 14px; margin-bottom: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.02); }
    .event-header { font-size: 15px; font-weight: bold; color: #303133; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
    .event-meta { font-size: 12px; color: #409eff; background: #ecf5ff; padding: 4px 8px; border-radius: 6px; }

    .cards-list { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-top: 8px; }
    @media (max-width: 768px) { .cards-list { grid-template-columns: 1fr; } }

    .order-card { background: #fafafa; border: 1px solid #ebeef5; border-radius: 8px; padding: 12px 14px; font-size: 13px; display: flex; flex-direction: column; justify-content: space-between; position: relative; }
    .order-top { display: flex; justify-content: space-between; align-items: flex-start; font-weight: bold; margin-bottom: 6px; }
    
    .order-info { display: flex; flex-direction: column; gap: 4px; color: #606266; font-size: 12px; }
    .order-bottom-row { display: flex; justify-content: space-between; align-items: flex-end; margin-top: 6px; padding-top: 6px; border-top: 1px dashed #ebeef5; }

    .status-badges-container { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
    .status-badge { padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: bold; display: inline-block; }
    .status-paid { background: #f0f9eb; color: #67c23a; }
    .status-checking { background: #fdf6ec; color: #e6a23c; border: 1px solid #faebd7; }
    .status-pending { background: #fef0f0; color: #f56c6c; }
    .status-issue { background: #fef0f0; color: #f56c6c; border: 1px solid #fde2e2; }

    .photo-badge-pending { background: #f4f4f5; color: #909399; }
    .photo-badge-sent { background: #ecf5ff; color: #409eff; border: 1px solid #b3d8ff; }

    .btn-edit { background-color: #e6a23c; color: white; padding: 4px 8px; font-size: 11px; border-radius: 4px; border: none; cursor: pointer; }
    .btn-save { background-color: #67c23a; color: white; padding: 4px 8px; font-size: 11px; border-radius: 4px; border: none; cursor: pointer; }
    .btn-cancel { background-color: #909399; color: white; padding: 4px 8px; font-size: 11px; border-radius: 4px; border: none; cursor: pointer; }
    .btn-danger { background-color: #f56c6c; color: white; padding: 4px 8px; font-size: 11px; border-radius: 4px; border: none; cursor: pointer; }

    .type-badge { font-size: 10px; padding: 1px 4px; border-radius: 4px; background: #f4f4f5; color: #909399; margin-left: 4px; }
    .type-add { background: #fdf6ec; color: #e6a23c; border: 1px solid #faebd7; }

    .edit-box { background: #fff; border: 1px solid #409eff; padding: 10px; border-radius: 6px; margin-top: 6px; }
    .edit-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 8px; }
  </style>
</head>
<body>

  <h3>團員填單紀錄管理</h3>

  <div class="filter-card">
    <div class="filter-row">
      <span class="filter-title">🔍 篩選模式：</span>
      <select id="modeSelect">
        <option value="ALL">全部顯示</option>
        <option value="user">依社群暱稱</option>
        <option value="event">依活動與成員</option>
      </select>
      <input type="text" id="searchOrderInput" placeholder="直接關鍵字搜尋..." style="flex:1; min-width:180px;">
    </div>
    <div id="capsuleContainer" class="capsule-bar"></div>
  </div>

  <div id="ordersContainer">載入中...</div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, doc, deleteDoc, updateDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDF7QySG1Jj4gdZvXwMRaKjRmI-lFKpj7k",
      authDomain: "forsure0922.firebaseapp.com",
      databaseURL: "https://forsure0922-default-rtdb.firebaseio.com",
      projectId: "forsure0922",
      storageBucket: "forsure0922.firebasestorage.app",
      messagingSenderId: "817449290174",
      appId: "1:817449290174:web:6b4ec1d36c171ff97011ef"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let usersList = [];
    let membersList = ["方燦", "Lee Know", "彰彬", "鉉辰", "HAN", "Felix", "昇玟", "I.N"];
    let eventList = [];
    let ordersCache = {};
    let eventPricesMap = {};
    let editingRows = new Set();
    let activeFilterValue = 'ALL';

    document.addEventListener('DOMContentLoaded', async () => {
      try {
        const [uRes, mRes] = await Promise.all([
          fetch('../json/users.json'),
          fetch('../json/members.json')
        ]);
        usersList = await uRes.json();
        membersList = await mRes.json();
      } catch(e) {}

      onSnapshot(collection(db, "event_settings"), snap => {
        const eventsSet = new Set();
        eventPricesMap = {};
        snap.forEach(d => {
          const data = d.data();
          const name = data.name || data.rawName;
          if (name) {
            eventsSet.add(name.trim());
            const key = name.trim() + '_' + (data.member || '');
            eventPricesMap[key] = {
              price: Number(data.actualPrice || data.price || data.estimatedPrice || data.unitPrice) || 0,
              packQty: Number(data.packQty) || 1
            };
          }
        });
        eventList = Array.from(eventsSet).sort();
        renderCapsulesAndTable();
      });

      onSnapshot(collection(db, "orders"), snap => {
        ordersCache = {};
        snap.forEach(d => { ordersCache[d.id] = { id: d.id, ...d.data() }; });
        renderCapsulesAndTable();
      });
    });

    document.getElementById('modeSelect').addEventListener('change', () => {
      activeFilterValue = 'ALL';
      renderCapsulesAndTable();
    });

    document.getElementById('searchOrderInput').addEventListener('input', () => {
      renderTableContent();
    });

    function renderCapsulesAndTable() {
      const mode = document.getElementById('modeSelect').value;
      const container = document.getElementById('capsuleContainer');
      container.innerHTML = '';

      const allOrders = Object.values(ordersCache);

      if (mode === 'user') {
        const usersSet = new Set();
        allOrders.forEach(o => {
          const name = o.buyerName || o.user || o.nickname;
          if (name) usersSet.add(name);
        });
        const sortedUsers = Array.from(usersSet).sort((a, b) => a.localeCompare(b, 'zh-TW'));

        const allBtn = document.createElement('button');
        allBtn.className = `capsule-btn ${activeFilterValue === 'ALL' ? 'active' : ''}`;
        allBtn.textContent = '👤 全部';
        allBtn.onclick = () => { activeFilterValue = 'ALL'; renderCapsulesAndTable(); };
        container.appendChild(allBtn);

        sortedUsers.forEach(userName => {
          const btn = document.createElement('button');
          btn.className = `capsule-btn ${activeFilterValue === userName ? 'active' : ''}`;
          btn.textContent = `👤 ${userName}`;
          btn.onclick = () => { activeFilterValue = userName; renderCapsulesAndTable(); };
          container.appendChild(btn);
        });
      } else if (mode === 'event') {
        const eventMemberSet = new Set();
        allOrders.forEach(o => {
          const ev = o.event || o.eventName || '未分類活動';
          const mem = o.member || '全體';
          if (ev) eventMemberSet.add(`${ev}__${mem}`);
        });

        const sortedEventMembers = Array.from(eventMemberSet).sort((a, b) => {
          const [evA, memA] = a.split('__');
          const [evB, memB] = b.split('__');

          const matchA = evA.match(/\d{6}/); const matchB = evB.match(/\d{6}/);
          const dateA = matchA ? parseInt(matchA[0], 10) : 0;
          const dateB = matchB ? parseInt(matchB[0], 10) : 0;
          if (dateA !== dateB) return dateA - dateB;
          if (evA !== evB) return evA.localeCompare(evB, 'zh-TW');

          let idxA = membersList.indexOf(memA);
          let idxB = membersList.indexOf(memB);
          if (idxA === -1) idxA = 99;
          if (idxB === -1) idxB = 99;
          return idxA - idxB;
        });

        const allBtn = document.createElement('button');
        allBtn.className = `capsule-btn ${activeFilterValue === 'ALL' ? 'active' : ''}`;
        allBtn.textContent = '📍 全部';
        allBtn.onclick = () => { activeFilterValue = 'ALL'; renderCapsulesAndTable(); };
        container.appendChild(allBtn);

        sortedEventMembers.forEach(key => {
          const [evTitle, memName] = key.split('__');
          const btn = document.createElement('button');
          btn.className = `capsule-btn ${activeFilterValue === key ? 'active' : ''}`;
          btn.textContent = `📍 ${evTitle} - ${memName}`;
          btn.onclick = () => { activeFilterValue = key; renderCapsulesAndTable(); };
          container.appendChild(btn);
        });
      }

      renderTableContent();
    }

    function renderTableContent() {
      const container = document.getElementById('ordersContainer');
      container.innerHTML = '';

      const mode = document.getElementById('modeSelect').value;
      const kw = document.getElementById('searchOrderInput').value.toLowerCase();
      const allOrders = Object.values(ordersCache);

      const filtered = allOrders.filter(item => {
        const user = String(item.buyerName || item.user || item.nickname || '');
        const eName = String(item.event || item.eventName || '');
        const member = String(item.member || '');

        if (mode === 'user' && activeFilterValue !== 'ALL' && user !== activeFilterValue) return false;
        if (mode === 'event' && activeFilterValue !== 'ALL') {
          const targetKey = `${eName}__${member}`;
          if (targetKey !== activeFilterValue) return false;
        }

        if (kw) {
          const rowText = `${user} ${eName} ${member} ${item.orderType || ''}`.toLowerCase();
          if (!rowText.includes(kw)) return false;
        }
        return true;
      });

      if (filtered.length === 0) {
        container.innerHTML = '<div style="text-align:center; color:#909399; padding:30px;">查無符合條件的登記紀錄</div>';
        notifyHeight();
        return;
      }

      // 分組渲染
      const groups = {};
      filtered.forEach(o => {
        const key = (o.event || o.eventName || '未分類活動') + (o.member ? ' - ' + o.member : '');
        if (!groups[key]) groups[key] = [];
        groups[key].push(o);
      });

      const sortedKeys = Object.keys(groups).sort((a, b) => {
        const matchA = a.match(/\d{6}/); const matchB = b.match(/\d{6}/);
        const dateA = matchA ? parseInt(matchA[0], 10) : 0;
        const dateB = matchB ? parseInt(matchB[0], 10) : 0;
        if (dateA !== dateB) return dateA - dateB;
        return a.localeCompare(b, 'zh-TW');
      });

      for (const title of sortedKeys) {
        const list = groups[title];
        // 依時間排序 (舊到新)
        list.sort((a, b) => {
          const tA = a.createdAt ? new Date(a.createdAt).getTime() : 0;
          const tB = b.createdAt ? new Date(b.createdAt).getTime() : 0;
          return tA - tB;
        });

        const totalPacks = list.reduce((sum, item) => sum + (Number(item.quantity) || Number(item.qty) || 1), 0);

        let cardsHtml = '';
        list.forEach((ord, idx) => {
          const docId = ord.id;
          const isEditing = editingRows.has(docId);

          const user = ord.buyerName || ord.user || ord.nickname || '未知';
          const eName = ord.event || ord.eventName || '';
          const member = ord.member || '';
          const orderType = ord.orderType || '一般';
          const qty = Number(ord.qty !== undefined ? ord.qty : (ord.quantity !== undefined ? ord.quantity : 1));
          
          let fullTimeStr = '-';
          if (ord.createdAt) {
            try {
              let dateObj = (typeof ord.createdAt === 'string') ? new Date(ord.createdAt) : new Date(ord.createdAt.seconds * 1000);
              if (dateObj && !isNaN(dateObj.getTime())) {
                fullTimeStr = dateObj.toLocaleString('zh-TW', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit', hour12: false });
              }
            } catch(e) {}
          } else if (ord.time) {
            fullTimeStr = ord.time;
          }

          const status = ord.paymentStatus || ord.status || (ord.hasPaid ? '已對帳' : '待匯款');
          let payBadgeHtml = '<span class="status-badge status-pending">⏳ 待匯款</span>';
          if (status === '已對帳') {
            payBadgeHtml = '<span class="status-badge status-paid">🟢 已對帳</span>';
          } else if (status === '待對帳' || status === '對帳中') {
            payBadgeHtml = '<span class="status-badge status-checking">⏳ 待對帳</span>';
          } else if (status === '對帳有問題' || status === '有問題') {
            payBadgeHtml = `<span class="status-badge status-issue">⚠️ 有問題</span>`;
          }

          const isPhotoSent = ord.isPhotoSent === true || status === '已發圖';
          const photoBadgeHtml = isPhotoSent ? '<span class="status-badge photo-badge-sent">🔵 已發圖</span>' : '<span class="status-badge photo-badge-pending">📷 待發圖</span>';

          const setting = eventPricesMap[eName + '_' + member] || {};
          const unitPrice = setting.price || Number(ord.price) || 0;
          const packQty = setting.packQty || 1;
          const packs = Math.round(qty / packQty);
          const totalPrice = packs * unitPrice;

          const typeBadge = (orderType === '追加') ? '<span class="type-badge type-add">追加</span>' : '<span class="type-badge">一般</span>';

          if (!isEditing) {
            cardsHtml += `
              <div class="order-card">
                <div class="order-top">
                  <span>#${idx + 1} <b>${user}</b> ${typeBadge}</span>
                  <div class="status-badges-container">
                    ${payBadgeHtml}
                    ${photoBadgeHtml}
                  </div>
                </div>
                <div class="order-info">
                  <span>⏱️ 登記時間：<b>${fullTimeStr}</b></span>
                  <span>喊單內容：<b>${packs} 包 / ${qty} 張</b> (${member})</span>
                </div>
                <div class="order-bottom-row">
                  <span style="font-weight:bold; color:#409eff;">總金額：$${totalPrice.toLocaleString()} ($${unitPrice}/包)</span>
                  <div>
                    <button class="btn-edit" onclick="toggleEdit('${docId}', true)">✏️ 編輯</button>
                    <button class="btn-danger" onclick="deleteUserOrder('${docId}', '${user}', '${eName}', '${member}', '${fullTimeStr}')">🗑️ 刪除</button>
                  </div>
                </div>
              </div>
            `;
          } else {
            let userOptions = usersList.map(u => `<option value="${u}" ${u === user ? 'selected' : ''}>${u}</option>`).join('');
            if (user && !usersList.includes(user)) userOptions = `<option value="${user}" selected>${user}</option>` + userOptions;

            let eventOptions = eventList.map(e => `<option value="${e}" ${e === eName ? 'selected' : ''}>${e}</option>`).join('');
            let memberOptions = membersList.map(m => `<option value="${m}" ${m === member ? 'selected' : ''}>${m}</option>`).join('');

            cardsHtml += `
              <div class="order-card edit-box">
                <div style="font-weight:bold; color:#409eff; margin-bottom:6px;">✏️ 編輯紀錄 #${idx+1}</div>
                <div class="edit-grid">
                  <div>社群: <select id="user-${docId}">${userOptions}</select></div>
                  <div>類別: <select id="type-${docId}"><option value="一般" ${orderType === '一般' ? 'selected' : ''}>一般</option><option value="追加" ${orderType === '追加' ? 'selected' : ''}>追加</option></select></div>
                  <div>活動: <select id="event-${docId}">${eventOptions}</select></div>
                  <div>成員: <select id="member-${docId}">${memberOptions}</select></div>
                  <div>張數: <input type="number" id="qty-${docId}" value="${qty}" style="width:60px;"></div>
                  <div>狀態: 
                    <select id="status-${docId}">
                      <option value="pending" ${status === '待匯款' ? 'selected' : ''}>⏳ 待匯款</option>
                      <option value="checking" ${status === '待對帳' ? 'selected' : ''}>⏳ 待對帳</option>
                      <option value="paid" ${status === '已對帳' ? 'selected' : ''}>🟢 已對帳</option>
                    </select>
                  </div>
                </div>
                <div style="text-align:right;">
                  <button class="btn-save" onclick="saveOrder('${docId}')">💾 儲存</button>
                  <button class="btn-cancel" onclick="toggleEdit('${docId}', false)">❌ 取消</button>
                </div>
              </div>
            `;
          }
        });

        container.innerHTML += `
          <div class="event-section">
            <div class="event-header">
              <span>📌 ${title}</span>
              <span class="event-meta">共 ${list.length} 筆 / ${totalPacks} 張</span>
            </div>
            <div class="cards-list">${cardsHtml}</div>
          </div>
        `;
      }

      notifyHeight();
    }

    window.toggleEdit = (docId, isEdit) => {
      if (isEdit) editingRows.add(docId);
      else editingRows.delete(docId);
      renderTableContent();
    };

    window.saveOrder = async (docId) => {
      const user = document.getElementById(`user-${docId}`).value;
      const eventName = document.getElementById(`event-${docId}`).value;
      const member = document.getElementById(`member-${docId}`).value;
      const orderType = document.getElementById(`type-${docId}`).value;
      const qty = parseInt(document.getElementById(`qty-${docId}`).value) || 0;
      const statusVal = document.getElementById(`status-${docId}`).value;

      let paymentStatusStr = '待匯款';
      let hasPaid = false;
      if (statusVal === 'paid') { paymentStatusStr = '已對帳'; hasPaid = true; }
      else if (statusVal === 'checking') { paymentStatusStr = '待對帳'; }

      try {
        await updateDoc(doc(db, "orders", docId), {
          buyerName: user, user: user,
          event: eventName, eventName: eventName,
          member: member, orderType: orderType,
          qty: qty, quantity: qty,
          hasPaid: hasPaid, paymentStatus: paymentStatusStr, status: paymentStatusStr
        });
        editingRows.delete(docId);
        alert('✅ 更新成功！');
      } catch (err) { alert('儲存失敗: ' + err.message); }
    };

    window.deleteUserOrder = async (docId, user, eName, member, timeStr) => {
      const confirmMsg = `⚠️ 確定要刪除以下這筆登記紀錄嗎？\n\n👤 買家：${user}\n📌 活動：${eName} - ${member}\n⏱️ 登記時間：${timeStr}`;
      if (confirm(confirmMsg)) {
        try {
          await deleteDoc(doc(db, "orders", docId));
          alert('已成功刪除！');
        } catch (err) { alert('刪除失敗: ' + err.message); }
      }
    };

    function notifyHeight() {
      setTimeout(() => {
        window.parent.postMessage({ frameHeight: document.body.scrollHeight }, '*');
      }, 100);
    }
  </script>
</body>
</html>
