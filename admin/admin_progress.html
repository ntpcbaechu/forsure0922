<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>發圖進度更新</title>
  <style>
    html, body { min-height: 500px !important; background: #fff; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 15px; margin: 0; color: #333; }
    
    .filter-bar { background: #f8f9fa; border: 1px solid #e4e7ed; border-radius: 8px; padding: 8px 12px; margin-bottom: 12px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    
    .progress-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-top: 10px; }
    @media (max-width: 768px) {
      .progress-grid { grid-template-columns: 1fr; }
    }

    .progress-card {
      background: #f8f9fa;
      border: 1px solid #e4e7ed;
      border-radius: 10px;
      padding: 12px 15px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.02);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .progress-card-title {
      font-size: 15px;
      font-weight: bold;
      color: #409eff;
      margin-bottom: 8px;
      padding-bottom: 6px;
      border-bottom: 1px dashed #dcdfe6;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    table.card-table { width: 100%; border-collapse: collapse; background: transparent; }
    table.card-table th, table.card-table td { padding: 6px 4px; border-bottom: 1px solid #ebeef5; text-align: left; font-size: 12px; vertical-align: middle; }
    table.card-table tr:last-child td { border-bottom: none; }
    table.card-table th { background: #edf2fc; color: #606266; font-weight: bold; }

    select, button, input { padding: 8px 10px; border: 1px solid #dcdfe6; border-radius: 6px; font-size: 13px; box-sizing: border-box; outline: none; }
    select:focus, input:focus { border-color: #409eff; }
    
    button { background-color: #409eff; color: white; border: none; font-weight: bold; cursor: pointer; }
    .btn-danger { background-color: #f56c6c; color: white; padding: 3px 6px; font-size: 11px; border-radius: 4px; border: none; cursor: pointer; }
    .btn-edit { background-color: #e6a23c; color: white; padding: 3px 6px; font-size: 11px; border-radius: 4px; border: none; cursor: pointer; margin-right: 4px; }
    .form-row { display: flex; flex-direction: column; gap: 12px; margin-bottom: 15px; background: #f8f9fa; padding: 15px; border-radius: 8px; border: 1px solid #ebeef5; }
    
    .form-selects { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }

    .status-picker-container { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .status-picker-label { font-size: 13px; font-weight: bold; color: #606266; }
    .status-options { display: flex; flex-wrap: wrap; gap: 6px; }
    .status-chip {
      padding: 5px 12px;
      border-radius: 16px;
      border: 1px solid #dcdfe6;
      background: #fff;
      color: #606266;
      font-size: 12px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.2s ease;
      user-select: none;
    }
    .status-chip:hover, .status-chip.selected { border-color: #409eff; color: #409eff; background: #ecf5ff; }

    .badge-status { display: inline-block; padding: 2px 8px; border-radius: 12px; font-size: 11px; font-weight: bold; }
    .badge-status[data-val="已預約"] { background: #f4f4f5; color: #909399; }
    .badge-status[data-val="等圖中"] { background: #fdf6ec; color: #e6a23c; border: 1px solid #faebd7; }
    .badge-status[data-val="分圖中"] { background: #eef2ff; color: #4f46e5; border: 1px solid #c7d2fe; }
    .badge-status[data-val="上傳中"] { background: #eef2ff; color: #4f46e5; border: 1px solid #c7d2fe; }
    .badge-status[data-val="已通知匯款"] { background: #eef2ff; color: #4f46e5; border: 1px solid #c7d2fe; }
    .badge-status[data-val="已發圖"] { background: #f4f4f5; color: #909399; }
    .badge-status[data-val="到期/已刪除"] { background: #f4f4f5; color: #909399; }
  </style>
</head>
<body>

  <h3>發佈與更新發圖進度</h3>

  <form id="progressForm" class="form-row">
    <input type="hidden" id="editProgressId">
    
    <div class="form-selects">
      <select id="eventSelect" required style="min-width: 180px;">
        <option value="">請選擇活動</option>
      </select>

      <select id="memberSelect" required style="min-width: 130px;">
        <option value="">請先選擇活動</option>
      </select>

      <select id="sellerSelect" required style="min-width: 140px;">
        <option value="">請選擇代拍</option>
      </select>
    </div>

    <div class="status-picker-container">
      <span class="status-picker-label">進度狀態：</span>
      <input type="hidden" id="statusSelect" required>
      <div class="status-options" id="statusChips">
        <div class="status-chip" data-val="已預約">📅 已預約</div>
        <div class="status-chip" data-val="等圖中">⏳ 等圖中</div>
        <div class="status-chip" data-val="分圖中">✂️ 分圖中</div>
        <div class="status-chip" data-val="上傳中">☁️ 上傳中</div>
        <div class="status-chip" data-val="已通知匯款">📢 已通知匯款</div>
        <div class="status-chip" data-val="已發圖">⚪ 已發圖</div>
        <div class="status-chip" data-val="到期/已刪除">🗑️ 到期/已刪除</div>
      </div>
    </div>

    <div style="margin-top: 5px;">
      <button type="submit" id="saveProgressBtn">發佈進度</button>
      <button type="button" id="cancelBtn" style="background:#909399; display:none;" onclick="resetForm()">取消</button>
    </div>
  </form>

  <div class="filter-bar">
    <span style="font-size:13px; font-weight:bold; color:#606266;">🔍 快速篩選成員：</span>
    <div id="progressMemberCapsules" style="display:flex; gap:6px; flex-wrap:wrap;">
      <button type="button" class="status-chip selected" onclick="filterProgressMember('ALL', this)">顯示全部</button>
    </div>
  </div>

  <div class="progress-grid" id="progressContainer">
    <p style="text-align:center; color:#909399; grid-column: span 2;">資料載入中...</p>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, doc, setDoc, deleteDoc, updateDoc, onSnapshot, getDocs, query, where } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDF7QySG1Jj4gdZvXwMRaKjRmI-lFKpj7k",
      authDomain: "forsure0922.firebaseapp.com",
      databaseURL: "https://forsure0922-default-rtdb.firebaseio.com",
      projectId: "forsure0922",
      storageBucket: "forsure0922.firebasestorage.app",
      messagingSenderId: "817449290174",
      appId: "1:817449290174:web:6b4ec1d36c171ff97011ef"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let rawEventSettings = [];
    let progressMap = {};
    let memberOrderList = ["方燦", "Lee Know", "彰彬", "鉉辰", "HAN", "Felix", "昇玟", "I.N"];
    let activeMemberFilter = 'ALL';

    fetch('../json/members_skz.json').then(r => r.json()).then(arr => { 
      memberOrderList = arr; 
      initMemberFilterCapsules();
    }).catch(() => { initMemberFilterCapsules(); });

    function initMemberFilterCapsules() {
      const box = document.getElementById('progressMemberCapsules');
      box.innerHTML = `<button type="button" class="status-chip ${activeMemberFilter === 'ALL' ? 'selected' : ''}" onclick="filterProgressMember('ALL', this)">顯示全部</button>`;
      memberOrderList.forEach(m => {
        box.innerHTML += `<button type="button" class="status-chip ${activeMemberFilter === m ? 'selected' : ''}" onclick="filterProgressMember('${m}', this)">${m}</button>`;
      });
    }

    window.filterProgressMember = (mName, btnElem) => {
      activeMemberFilter = mName;
      btnElem.parentElement.querySelectorAll('.status-chip').forEach(b => b.classList.remove('selected'));
      btnElem.classList.add('selected');
      renderProgressCards();
    };

    const evSel = document.getElementById('eventSelect');
    const memSel = document.getElementById('memberSelect');
    const sellerSel = document.getElementById('sellerSelect');
    const statusInput = document.getElementById('statusSelect');

    document.querySelectorAll('.status-options .status-chip').forEach(chip => {
      chip.addEventListener('click', () => {
        document.querySelectorAll('.status-options .status-chip').forEach(c => c.classList.remove('selected'));
        chip.classList.add('selected');
        statusInput.value = chip.getAttribute('data-val');
      });
    });

    function setStatusChipValue(val) {
      statusInput.value = val;
      document.querySelectorAll('.status-options .status-chip').forEach(chip => {
        if (chip.getAttribute('data-val') === val) {
          chip.classList.add('selected');
        } else {
          chip.classList.remove('selected');
        }
      });
    }

    onSnapshot(collection(db, "event_settings"), snap => {
      rawEventSettings = [];
      snap.forEach(d => rawEventSettings.push(d.data()));

      const eventsSet = new Set();
      rawEventSettings.forEach(s => {
        const eName = s.name;
        if (eName) eventsSet.add(eName.trim());
      });

      evSel.innerHTML = '<option value="">請選擇活動</option>';
      Array.from(eventsSet).sort().forEach(e => {
        evSel.innerHTML += '<option value="' + e + '">' + e + '</option>';
      });
    });

    evSel.addEventListener('change', () => {
      const selectedEvent = evSel.value;
      memSel.innerHTML = '<option value="">請選擇成員</option>';
      sellerSel.innerHTML = '<option value="">請選擇代拍</option>';

      if (!selectedEvent) return;

      const membersSet = new Set();
      rawEventSettings.forEach(s => {
        const eName = s.name;
        if (eName === selectedEvent && s.member) {
          membersSet.add(s.member.trim());
        }
      });

      const sortedMembers = Array.from(membersSet).sort((a, b) => {
        let idxA = memberOrderList.indexOf(a);
        let idxB = memberOrderList.indexOf(b);
        if (idxA === -1) idxA = 99;
        if (idxB === -1) idxB = 99;
        return idxA - idxB;
      });

      sortedMembers.forEach(m => {
        memSel.innerHTML += '<option value="' + m + '">' + m + '</option>';
      });
    });

    memSel.addEventListener('change', () => {
      const selectedEvent = evSel.value;
      const selectedMember = memSel.value;
      sellerSel.innerHTML = '<option value="">請選擇代拍</option>';

      if (!selectedEvent || !selectedMember) return;

      const sellerSet = new Set();
      rawEventSettings.forEach(s => {
        const eName = s.name;
        if (eName === selectedEvent && s.member === selectedMember && s.seller) {
          sellerSet.add(s.seller.trim());
        }
      });

      const sellers = Array.from(sellerSet).sort((a, b) => a.localeCompare(b, 'zh-TW'));
      if (sellers.length === 0) {
        sellerSel.innerHTML = '<option value="代拍1">代拍1 (預設)</option>';
      } else {
        sellerSel.innerHTML = '<option value="">請選擇代拍</option>';
        sellers.forEach(p => {
          sellerSel.innerHTML += '<option value="' + p + '">' + p + '</option>';
        });
      }
    });

    let lastProgressList = [];
    onSnapshot(collection(db, "photo_progress"), snap => {
      progressMap = {};
      lastProgressList = [];
      snap.forEach(d => {
        const item = { id: d.id, ...d.data() };
        progressMap[d.id] = item;
        lastProgressList.push(item);
      });
      renderProgressCards();
    });

    function renderProgressCards() {
      const container = document.getElementById('progressContainer');
      container.innerHTML = '';

      let list = [...lastProgressList];
      if (activeMemberFilter !== 'ALL') {
        list = list.filter(i => i.member === activeMemberFilter);
      }

      if (list.length === 0) {
        container.innerHTML = '<p style="text-align:center; color:#909399; grid-column: span 2;">目前無符合條件的發圖進度紀錄。</p>';
        notifyHeight();
        return;
      }

      list.sort((a, b) => {
        const eA = a.eventName || a.event || '';
        const eB = b.eventName || b.event || '';
        if (eA !== eB) return eA.localeCompare(eB);

        const mA = a.member || '';
        const mB = b.member || '';
        let idxA = memberOrderList.indexOf(mA);
        let idxB = memberOrderList.indexOf(mB);
        if (idxA === -1) idxA = 99;
        if (idxB === -1) idxB = 99;
        return idxA - idxB;
      });

      const eventGroups = {};
      list.forEach(item => {
        const eName = item.eventName || item.event || '未命名活動';
        if (!eventGroups[eName]) eventGroups[eName] = [];
        eventGroups[eName].push(item);
      });

      for (const [eventName, items] of Object.entries(eventGroups)) {
        const card = document.createElement('div');
        card.className = 'progress-card';

        let tableHtml = '<div class="progress-card-title">🗓️ ' + eventName + '</div>' +
          '<table class="card-table"><thead><tr>' +
            '<th style="width: 25%;">成員</th>' +
            '<th style="width: 30%;">代拍名稱</th>' +
            '<th style="width: 25%;">目前狀態</th>' +
            '<th style="width: 20%;">操作</th>' +
          '</tr></thead><tbody>';

        const memberGroups = {};
        const memberKeys = [];
        items.forEach(item => {
          const mName = item.member || '全體';
          if (!memberGroups[mName]) {
            memberGroups[mName] = [];
            memberKeys.push(mName);
          }
          memberGroups[mName].push(item);
        });

        memberKeys.forEach(mName => {
          const mItems = memberGroups[mName];
          const mRowCount = mItems.length;

          mItems.forEach((item, idx) => {
            const sellerName = item.seller || '代拍1';
            const statusText = item.status || '-';

            let memberCell = '';
            if (idx === 0) {
              memberCell = '<td rowspan="' + mRowCount + '" style="vertical-align:middle; font-weight:bold;">' + mName + '</td>';
            }

            tableHtml += '<tr>' +
              memberCell +
              '<td>' + sellerName + '</td>' +
              '<td><span class="badge-status" data-val="' + statusText + '">' + statusText + '</span></td>' +
              '<td>' +
                '<button class="btn-edit" onclick="editProgress(\'' + item.id + '\')">編輯</button>' +
                '<button class="btn-danger" onclick="deleteProgress(\'' + item.id + '\')">刪除</button>' +
              '</td>' +
            '</tr>';
          });
        });

        tableHtml += '</tbody></table>';
        card.innerHTML = tableHtml;
        container.appendChild(card);
      }
      notifyHeight();
    }

    document.getElementById('progressForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const status = statusInput.value;
      if (!status) {
        alert('請選擇進度狀態！');
        return;
      }

      const saveBtn = document.getElementById('saveProgressBtn');
      saveBtn.disabled = true;

      const eventName = document.getElementById('eventSelect').value;
      const member = document.getElementById('memberSelect').value;
      const seller = document.getElementById('sellerSelect').value;

      const cleanSeller = seller ? seller.trim() : '代拍1';
      const docId = eventName + '_' + member + '_' + cleanSeller;

      try {
        await setDoc(doc(db, "photo_progress", docId), {
          eventName: eventName,
          member: member,
          seller: cleanSeller,
          status: status,
          updatedAt: new Date()
        }, { merge: true });

        if (status === '分圖中') {
          await triggerOrdersToPendingPayment(eventName, member);
        }

        alert('✅ 進度發佈成功！');
        resetForm();
      } catch (err) {
        alert('儲存失敗：' + err.message);
      } finally {
        saveBtn.disabled = false;
      }
    });

    async function triggerOrdersToPendingPayment(eventName, member) {
      try {
        const q = query(collection(db, "orders"), where("event", "==", eventName), where("member", "==", member));
        const snap = await getDocs(q);
        const updatePromises = [];
        snap.forEach(d => {
          const ord = d.data();
          if (!ord.hasPaid && ord.status !== '已對帳') {
            updatePromises.push(updateDoc(doc(db, "orders", d.id), {
              paymentStatus: '待匯款',
              status: '待匯款'
            }));
          }
        });
        if (updatePromises.length > 0) {
          await Promise.all(updatePromises);
        }
      } catch (err) {
        console.error('連動更新待匯款失敗:', err);
      }
    }

    window.editProgress = (docId) => {
      const item = progressMap[docId];
      if (!item) return;

      document.getElementById('editProgressId').value = docId;
      
      const evSel = document.getElementById('eventSelect');
      evSel.value = item.eventName || item.event || '';
      evSel.dispatchEvent(new Event('change'));

      setTimeout(() => {
        const memSel = document.getElementById('memberSelect');
        memSel.value = item.member || '';
        memSel.dispatchEvent(new Event('change'));

        setTimeout(() => {
          document.getElementById('sellerSelect').value = item.seller || '';
        }, 50);
      }, 50);

      setStatusChipValue(item.status || '');

      document.getElementById('saveProgressBtn').textContent = '更新進度';
      document.getElementById('cancelBtn').style.display = 'inline-block';
    };

    window.deleteProgress = async (docId) => {
      if (confirm('確定要刪除這筆進度紀錄嗎？')) {
        await deleteDoc(doc(db, "photo_progress", docId));
      }
    };

    window.resetForm = () => {
      document.getElementById('progressForm').reset();
      document.getElementById('editProgressId').value = '';
      document.getElementById('memberSelect').innerHTML = '<option value="">請先選擇活動</option>';
      document.getElementById('sellerSelect').innerHTML = '<option value="">請選擇代拍</option>';
      setStatusChipValue('');
      document.getElementById('saveProgressBtn').textContent = '發佈進度';
      document.getElementById('cancelBtn').style.display = 'none';
    };

    function notifyHeight() {
      setTimeout(() => {
        const h = Math.max(document.body.scrollHeight, 600);
        window.parent.postMessage({ frameHeight: h }, '*');
      }, 100);
    }
  </script>
</body>
</html>
