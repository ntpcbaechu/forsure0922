<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>發圖進度更新</title>
  <style>
    html, body { min-height: 500px !important; background: #f0f2f5; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 15px; margin: 0; color: #333; }
    
    .filter-card { background: #fff; border: 1px solid #e4e7ed; border-radius: 12px; padding: 14px 16px; margin-bottom: 16px; display: flex; flex-direction: column; gap: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.02); }
    .filter-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .filter-label { font-size: 13px; font-weight: bold; color: #606266; min-width: 80px; }

    .capsule-group { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
    .capsule-filter-btn { background: #f4f4f5; color: #606266; border: 1px solid #dcdfe6; padding: 5px 14px; border-radius: 20px; font-size: 12px; font-weight: bold; cursor: pointer; transition: all 0.2s; outline: none; }
    .capsule-filter-btn:hover { background: #ecf5ff; color: #409eff; border-color: #c6e2ff; }
    .capsule-filter-btn.active { background: #409eff; color: #fff; border-color: #409eff; box-shadow: 0 2px 6px rgba(64,158,255,0.25); }
    .capsule-filter-btn.sub-active { background: #67c23a; color: #fff; border-color: #67c23a; box-shadow: 0 2px 6px rgba(103,194,58,0.25); }

    .form-row { display: flex; flex-direction: column; gap: 12px; margin-bottom: 16px; background: #fff; padding: 16px; border-radius: 12px; border: 1px solid #e4e7ed; box-shadow: 0 2px 8px rgba(0,0,0,0.02); }
    .form-selects { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }

    select, button, input { padding: 9px 12px; border: 1px solid #dcdfe6; border-radius: 8px; font-size: 13px; box-sizing: border-box; outline: none; background: #fff; transition: border-color 0.2s; }
    select:focus, input:focus { border-color: #409eff; }
    
    button { background-color: #409eff; color: white; border: none; font-weight: bold; cursor: pointer; transition: background 0.2s; }
    button:hover { background-color: #66b1ff; }

    .sellers-check-box { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; background: #f8f9fa; padding: 6px 10px; border: 1px solid #ebeef5; border-radius: 8px; min-height: 38px; }
    .seller-label { font-size: 13px; color: #606266; display: inline-flex; align-items: center; gap: 4px; cursor: pointer; margin: 0; font-weight: bold; }

    .progress-list-container { display: flex; flex-direction: column; gap: 16px; margin-top: 10px; }

    .event-group-card { background: #fff; border: 1px solid #e4e7ed; border-radius: 12px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.02); display: flex; flex-direction: column; }
    .event-group-card.archived-card { opacity: 0.65; background: #f8f9fa; filter: grayscale(0.85); box-shadow: none; }
    
    .event-group-header { background: #eef5fe; border-left: 4px solid #409eff; color: #1a252f; font-size: 15px; font-weight: bold; padding: 10px 14px; display: flex; align-items: center; gap: 6px; justify-content: space-between; }
    .event-group-header.header-ateez { background: #f3e8ff; border-left: 4px solid #7e22ce; color: #581c87; }

    .progress-list-box { padding: 12px 14px; display: grid; grid-template-columns: repeat(auto-fill, minmax(360px, 1fr)); gap: 12px; }
    
    .member-block { display: flex; flex-direction: column; gap: 6px; }

    .member-box-card { background: #f8f9fa; border: 1px solid #e4e7ed; border-radius: 8px; padding: 12px; display: flex; flex-direction: column; gap: 8px; transition: background 0.2s; }
    .member-box-card:hover { background: #fff; border-color: #c0c4cc; box-shadow: 0 2px 8px rgba(0,0,0,0.03); }

    .member-header-row { display: flex; justify-content: space-between; align-items: flex-start; font-size: 14px; font-weight: bold; color: #303133; flex-wrap: wrap; gap: 10px; }
    .member-info-left { display: flex; flex-direction: column; gap: 4px; }
    .member-title-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    
    .status-badge { padding: 3px 10px; border-radius: 20px; font-size: 11px; font-weight: bold; white-space: nowrap; border: 1px solid transparent; display: inline-block; }
    .status-st-unopened { background: #f4f4f5; color: #909399; border-color: #e4e7ed; }
    .status-sorting     { background: #fff7ed; color: #d97706; border-color: #ffedd5; }
    .status-done        { background: #f0f9eb; color: #67c23a; border-color: #e1f3d8; }
    .status-stock-open  { background: #e8f5e9; color: #2e7d32; border-color: #a5d6a7; font-weight: 800; }
    .status-waiting     { background: #fef0f0; color: #f56c6c; border-color: #fde2e2; }

    .btn-action-col { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; width: 100%; margin-top: 4px; padding-top: 8px; border-top: 1px dashed #ebeef5; }
    .btn-action { padding: 5px 10px; border-radius: 6px; font-size: 11px; font-weight: bold; cursor: pointer; border: none; transition: opacity 0.2s; white-space: nowrap; }
    .btn-action:hover { opacity: 0.85; }
    .btn-edit { background: #e6a23c; color: #fff; }
    .btn-del { background: #f56c6c; color: #fff; }
    .btn-notify { background: #409eff; color: #fff; box-shadow: 0 2px 4px rgba(64,158,255,0.2); }
    .btn-toggle-eye { background: #909399; color: #fff; }
    .btn-toggle-eye.is-hidden { background: #67c23a; }

    .buyer-issue-tags-container { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 2px; }
    .buyer-issue-tag { padding: 4px 8px; border-radius: 6px; font-size: 11px; font-weight: bold; border: 1px solid transparent; }
    .buyer-tag-pending { background: #fef0f0; color: #f56c6c; border-color: #fde2e2; }
    .buyer-tag-issue { background: #fdf6ec; color: #e6a23c; border-color: #faebd7; }
    .buyer-tag-waitphoto { background: #ecf5ff; color: #409eff; border-color: #d9ecff; }
    .buyer-tag-ok { background: #f0f9eb; color: #67c23a; border-color: #e1f3d8; }
    .buyer-tag-hidden { background: #f4f4f5; color: #909399; border-color: #dcdfe6; }

    .archive-toggle-bar { display: flex; justify-content: center; margin: 30px 0 20px 0; }
    .btn-toggle-archive { background: #fff; border: 1px solid #dcdfe6; color: #606266; padding: 8px 24px; border-radius: 20px; font-size: 13px; font-weight: bold; cursor: pointer; display: flex; align-items: center; gap: 8px; box-shadow: 0 2px 6px rgba(0,0,0,0.02); transition: all 0.2s; }
    .btn-toggle-archive:hover { background: #f8f9fa; color: #409eff; border-color: #c6e2ff; }
  </style>
</head>
<body>

  <h3 style="margin-top:0;">發佈與更新發圖進度</h3>

  <form id="progressForm" class="form-row">
    <input type="hidden" id="editProgressId">
    
    <div class="form-selects">
      <select id="eventSelect" required style="min-width: 180px;">
        <option value="">請選擇活動</option>
      </select>

      <select id="batchSelect" style="min-width: 110px; font-weight: bold;">
        <option value="批次 1">批次 1</option>
        <option value="批次 2">批次 2</option>
        <option value="批次 3">批次 3</option>
        <option value="批次 4">批次 4</option>
        <option value="批次 5">批次 5</option>
      </select>

      <select id="groupSelect" style="min-width: 130px;">
        <option value="">請選擇團體</option>
      </select>

      <select id="memberSelect" required disabled style="min-width: 130px;">
        <option value="">請先選擇團體</option>
      </select>

      <div class="sellers-check-box" id="sellersCheckContainer">
        <span style="font-size:12px; color:#909399;">請先選擇活動</span>
      </div>

      <select id="statusSelect" required style="min-width: 140px; font-weight: bold; color: #409eff;">
        <option value="">請選擇進度狀態 *</option>
        <option value="未開放">🔒 未開放</option>
        <option value="已預約">📅 已預約</option>
        <option value="等圖中">⏳ 等圖中</option>
        <option value="分圖中">✂️ 分圖中</option>
        <option value="上傳中">☁️ 上傳中</option>
        <option value="已通知匯款">📢 已通知匯款</option>
        <option value="已發圖">⚪ 已發圖</option>
        <option value="可詢問餘圖">🟢 可詢問餘圖</option>
        <option value="已結束">🏁 已結束</option>
        <option value="到期/已刪除">🗑️ 到期/已刪除</option>
      </select>

      <button type="submit" id="saveProgressBtn" style="padding:9px 16px; border-radius:8px;">發佈進度</button>
      <button type="button" id="cancelBtn" style="background:#909399; padding:9px 16px; border-radius:8px; display:none;" onclick="resetForm()">取消</button>
    </div>
  </form>

  <div class="filter-card">
    <div class="filter-row">
      <span class="filter-label">1. 團體：</span>
      <div id="groupCapsules" class="capsule-group"></div>
    </div>

    <div class="filter-row">
      <span class="filter-label">2. 檢視模式：</span>
      <div id="modeCapsules" class="capsule-group">
        <button class="capsule-filter-btn active" onclick="setModeFilter('event', this)">🗓️ 依活動</button>
        <button class="capsule-filter-btn" onclick="setModeFilter('member', this)">👥 依成員</button>
      </div>
    </div>

    <div class="filter-row">
      <span class="filter-label">3. 細項篩選：</span>
      <div id="detailCapsules" class="capsule-group"></div>
    </div>

    <div class="filter-row">
      <span class="filter-label">4. 狀態篩選：</span>
      <div id="statusCapsules" class="capsule-group"></div>
    </div>
  </div>

  <div id="progressDisplayArea">
    <div class="progress-list-container" id="activeProgressContainer">
      <p style="text-align:center; color:#909399; padding: 20px;">資料載入中...</p>
    </div>

    <div id="archivedDividerBlock" style="display:none;">
      <div class="archive-toggle-bar">
        <button class="btn-toggle-archive" id="toggleArchiveBtn" onclick="toggleArchiveSection()">
          <span>🏁 展開已結束 / 到期封存紀錄</span>
          <span id="archiveCountBadge" style="background:#f4f4f5; padding:2px 8px; border-radius:10px; font-size:11px;">0</span>
        </button>
      </div>
      <div class="progress-list-container" id="archivedProgressContainer" style="display:none;"></div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, doc, setDoc, deleteDoc, updateDoc, onSnapshot, getDocs, query, where } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDF7QySG1Jj4gdZvXwMRaKjRmI-lFKpj7k",
      authDomain: "forsure0922.firebaseapp.com",
      databaseURL: "https://forsure0922-default-rtdb.firebaseio.com",
      projectId: "forsure0922",
      storageBucket: "forsure0922.firebasestorage.app",
      messagingSenderId: "817449290174",
      appId: "1:817449290174:web:6b4ec1d36c171ff97011ef"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let rawEventSettings = [];
    let rawStockPhotos = [];
    let progressMap = {};
    let lastProgressList = [];
    let ordersCache = {};

    let virtualProgressMap = {};
    let cachedCombinedList = [];

    let activeGroup = 'ALL';
    let activeMode = 'event'; 
    let activeDetail = 'ALL';
    let activeStatus = 'ALL';

    let groupList = [];
    let memberMap = {};

    const allStatuses = ['未開放', '已預約', '等圖中', '分圖中', '上傳中', '已通知匯款', '已發圖', '可詢問餘圖', '已結束', '到期/已刪除'];

    const evSel = document.getElementById('eventSelect');
    const batchSel = document.getElementById('batchSelect');
    const groupSel = document.getElementById('groupSelect');
    const memSel = document.getElementById('memberSelect');
    const sellersCheckContainer = document.getElementById('sellersCheckContainer');
    const statusSelect = document.getElementById('statusSelect');

    const MEMBER_EMOJI_MAP = {
      '方燦': '🐺', 'Lee Know': '🐰', '彰彬': '🐷', '鉉辰': '🥟', 'HAN': '🐹', 'Felix': '🐥', '昇玟': '🐶', 'I.N': '🦊',
      '弘中': '🐿️', '星化': '🐰', '潤浩': '🐶', '呂尚': '🐥', '傘': '⛰️', '旼琦': '🐥', '友榮': '🐈‍⬛', '鍾浩': '🐻'
    };

    document.addEventListener('DOMContentLoaded', async () => {
      try {
        const gRes = await fetch('../json/group.json');
        groupList = await gRes.json();

        for (const g of groupList) {
          const file = (g === 'Stray Kids') ? 'members_skz.json' : (g === 'ATEEZ' ? 'members_atz.json' : '');
          if (file) {
            const mRes = await fetch(`../json/${file}`);
            memberMap[g] = await mRes.json();
          }
        }
      } catch(e) {}

      renderGroupCapsules();
      updateDetailCapsules();
      updateStatusCapsules();

      groupSel.innerHTML = '<option value="">請選擇團體</option>';
      groupList.forEach(g => groupSel.innerHTML += `<option value="${g}">${g}</option>`);

      groupSel.addEventListener('change', () => {
        const g = groupSel.value;
        memSel.innerHTML = '';
        if (!g) {
          memSel.innerHTML = '<option value="">請先選擇團體</option>';
          memSel.disabled = true;
          return;
        }
        const members = memberMap[g] || [];
        memSel.disabled = false;
        memSel.innerHTML = '<option value="">請選擇成員</option>';
        members.forEach(m => memSel.innerHTML += `<option value="${m}">${m}</option>`);
      });
    });

    window.toggleArchiveSection = () => {
      const container = document.getElementById('archivedProgressContainer');
      const btnSpan = document.querySelector('#toggleArchiveBtn span:first-child');
      if (container.style.display === 'none') {
        container.style.display = 'flex';
        btnSpan.textContent = '收合已結束 / 到期封存紀錄';
      } else {
        container.style.display = 'none';
        btnSpan.textContent = '🏁 展開已結束 / 到期封存紀錄';
      }
      notifyHeight();
    };

    function refreshCombinedList() {
      virtualProgressMap = {};
      cachedCombinedList = [...lastProgressList];

      const existingKeys = new Set(lastProgressList.map(p => `${p.group}_${p.eventName || p.event}_${p.member}_${p.batch}`));

      rawEventSettings.forEach(s => {
        const eName = s.name || s.rawName;
        const eMem = s.member || '全體/無';
        const batch = '批次 1';
        const grp = s.group || 'Stray Kids';
        const key = `${grp}_${eName}_${eMem}_${batch}`;
        
        if (!existingKeys.has(key)) {
          const docId = key.replace(/[\/\s#?]/g, '_');
          const vItem = {
            id: docId,
            isVirtual: true,
            eventName: eName,
            batch: batch,
            group: grp,
            member: eMem,
            seller: s.seller || '未指定',
            status: '未開放'
          };
          virtualProgressMap[docId] = vItem;
          cachedCombinedList.push(vItem);
          existingKeys.add(key);
        }
      });

      rawStockPhotos.forEach(s => {
        const eName = `【餘圖認領】${s.eventName}`;
        const eMem = s.member || '全體/無';
        const batch = '批次 1';
        const grp = s.group || 'Stray Kids';
        const key = `${grp}_${eName}_${eMem}_${batch}`;
        
        if (!existingKeys.has(key)) {
          const docId = key.replace(/[\/\s#?]/g, '_');
          const vItem = {
            id: docId,
            isVirtual: true,
            eventName: eName,
            batch: batch,
            group: grp,
            member: eMem,
            seller: '未指定',
            status: '未開放'
          };
          virtualProgressMap[docId] = vItem;
          cachedCombinedList.push(vItem);
          existingKeys.add(key);
        }
      });

      updateDetailCapsules();
      renderProgressCards();
    }

    function renderGroupCapsules() {
      const container = document.getElementById('groupCapsules');
      container.innerHTML = '';

      const allBtn = document.createElement('button');
      allBtn.className = `capsule-filter-btn ${activeGroup === 'ALL' ? 'active' : ''}`;
      allBtn.textContent = '全部團體';
      allBtn.onclick = () => {
        activeGroup = 'ALL';
        document.querySelectorAll('#groupCapsules .capsule-filter-btn').forEach(b => b.classList.remove('active'));
        allBtn.classList.add('active');
        activeDetail = 'ALL';
        activeStatus = 'ALL';
        updateDetailCapsules();
        updateStatusCapsules();
        renderProgressCards();
      };
      container.appendChild(allBtn);

      groupList.forEach(g => {
        const btn = document.createElement('button');
        btn.className = `capsule-filter-btn ${activeGroup === g ? 'active' : ''}`;
        btn.textContent = g;
        btn.onclick = () => {
          activeGroup = g;
          document.querySelectorAll('#groupCapsules .capsule-filter-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          activeDetail = 'ALL';
          activeStatus = 'ALL';
          updateDetailCapsules();
          updateStatusCapsules();
          renderProgressCards();
        };
        container.appendChild(btn);
      });

      const unclassifiedBtn = document.createElement('button');
      unclassifiedBtn.className = `capsule-filter-btn ${activeGroup === 'UNCLASSIFIED' ? 'active' : ''}`;
      unclassifiedBtn.textContent = '未分類';
      unclassifiedBtn.onclick = () => {
        activeGroup = 'UNCLASSIFIED';
        document.querySelectorAll('#groupCapsules .capsule-filter-btn').forEach(b => b.classList.remove('active'));
        unclassifiedBtn.classList.add('active');
        activeDetail = 'ALL';
        activeStatus = 'ALL';
        updateDetailCapsules();
        updateStatusCapsules();
        renderProgressCards();
      };
      container.appendChild(unclassifiedBtn);
    }

    window.setModeFilter = (mode, btn) => {
      activeMode = mode;
      document.querySelectorAll('#modeCapsules .capsule-filter-btn').forEach(b => b.classList.remove('active'));
      if(btn) btn.classList.add('active');
      activeDetail = 'ALL';
      updateDetailCapsules();
      renderProgressCards();
    };

    function updateDetailCapsules() {
      const container = document.getElementById('detailCapsules');
      container.innerHTML = '';

      const allBtn = document.createElement('button');
      allBtn.className = `capsule-filter-btn ${activeDetail === 'ALL' ? 'sub-active' : ''}`;
      allBtn.textContent = '全部顯示';
      allBtn.onclick = () => {
        activeDetail = 'ALL';
        document.querySelectorAll('#detailCapsules .capsule-filter-btn').forEach(b => b.classList.remove('sub-active'));
        allBtn.classList.add('sub-active');
        renderProgressCards();
      };
      container.appendChild(allBtn);

      let list = cachedCombinedList;
      if (activeGroup === 'UNCLASSIFIED') {
        list = list.filter(i => !i.group || i.group === '未分類');
      } else if (activeGroup !== 'ALL') {
        list = list.filter(i => i.group === activeGroup);
      }

      if (activeMode === 'member') {
        let membersInJson = [];
        if (activeGroup === 'ALL') {
          Object.values(memberMap).forEach(l => membersInJson.push(...l));
        } else {
          membersInJson = memberMap[activeGroup] || [];
        }

        const activeMembersWithData = new Set(list.map(i => i.member).filter(Boolean));
        membersInJson.forEach(m => {
          if (activeMembersWithData.has(m)) {
            const btn = document.createElement('button');
            btn.className = `capsule-filter-btn ${activeDetail === m ? 'sub-active' : ''}`;
            btn.textContent = m;
            btn.onclick = () => {
              activeDetail = m;
              document.querySelectorAll('#detailCapsules .capsule-filter-btn').forEach(b => b.classList.remove('sub-active'));
              btn.classList.add('sub-active');
              renderProgressCards();
            };
            container.appendChild(btn);
          }
        });
      } else if (activeMode === 'event') {
        const eventsSet = new Set();
        list.forEach(i => {
          const ev = i.eventName || i.event;
          if (ev) eventsSet.add(ev);
        });
        Array.from(eventsSet).sort().forEach(ev => {
          const btn = document.createElement('button');
          btn.className = `capsule-filter-btn ${activeDetail === ev ? 'sub-active' : ''}`;
          btn.textContent = ev;
          btn.onclick = () => {
            activeDetail = ev;
            document.querySelectorAll('#detailCapsules .capsule-filter-btn').forEach(b => b.classList.remove('sub-active'));
            btn.classList.add('sub-active');
            renderProgressCards();
          };
          container.appendChild(btn);
        });
      }
    }

    function updateStatusCapsules() {
      const container = document.getElementById('statusCapsules');
      container.innerHTML = '';

      const allBtn = document.createElement('button');
      allBtn.className = `capsule-filter-btn ${activeStatus === 'ALL' ? 'sub-active' : ''}`;
      allBtn.textContent = '全部顯示';
      allBtn.onclick = () => {
        activeStatus = 'ALL';
        document.querySelectorAll('#statusCapsules .capsule-filter-btn').forEach(b => b.classList.remove('sub-active'));
        allBtn.classList.add('sub-active');
        renderProgressCards();
      };
      container.appendChild(allBtn);

      allStatuses.forEach(st => {
        const btn = document.createElement('button');
        btn.className = `capsule-filter-btn ${activeStatus === st ? 'sub-active' : ''}`;
        btn.textContent = st;
        btn.onclick = () => {
          activeStatus = st;
          document.querySelectorAll('#statusCapsules .capsule-filter-btn').forEach(b => b.classList.remove('sub-active'));
          btn.classList.add('sub-active');
          renderProgressCards();
        };
        container.appendChild(btn);
      });
    }

    function refreshEventSelectDropdown() {
      const eventsSet = new Set();
      rawEventSettings.forEach(s => {
        const eName = s.name;
        if (eName) eventsSet.add(eName.trim());
      });

      rawStockPhotos.forEach(s => {
        if (s.eventName) {
          eventsSet.add(`【餘圖認領】${s.eventName.trim()}`);
        }
      });

      const allEvents = Array.from(eventsSet).sort();

      const currentVal = evSel.value;
      evSel.innerHTML = '<option value="">請選擇活動</option>';
      allEvents.forEach(e => {
        evSel.innerHTML += '<option value="' + e + '">' + e + '</option>';
      });
      if (currentVal && allEvents.includes(currentVal)) {
        evSel.value = currentVal;
      }
    }

    onSnapshot(collection(db, "event_settings"), snap => {
      rawEventSettings = [];
      snap.forEach(d => rawEventSettings.push(d.data()));
      refreshEventSelectDropdown();
      refreshCombinedList();
    });

    onSnapshot(collection(db, "stock_photos"), snap => {
      rawStockPhotos = [];
      snap.forEach(d => rawStockPhotos.push(d.data()));
      refreshEventSelectDropdown();
      refreshCombinedList();
    });

    evSel.addEventListener('change', () => {
      const selectedEvent = evSel.value;
      sellersCheckContainer.innerHTML = '';
      if (!selectedEvent) {
        sellersCheckContainer.innerHTML = '<span style="font-size:12px; color:#909399;">請先選擇活動</span>';
        return;
      }

      const isSurplus = selectedEvent.startsWith('【餘圖認領】');
      const cleanEvent = selectedEvent.replace('【餘圖認領】', '').trim();

      const sellerSet = new Set();
      rawEventSettings.forEach(s => {
        if ((s.name === selectedEvent || s.name === cleanEvent) && s.seller) {
          sellerSet.add(s.seller.trim());
        }
      });

      const sellers = Array.from(sellerSet).sort((a, b) => a.localeCompare(b, 'zh-TW'));
      if (sellers.length === 0) {
        sellersCheckContainer.innerHTML = '<label class="seller-label"><input type="checkbox" value="代拍1" checked> 代拍1</label>';
      } else {
        sellers.forEach((p, idx) => {
          sellersCheckContainer.innerHTML += `<label class="seller-label"><input type="checkbox" value="${p}" ${idx===0?'checked':''}> ${p}</label>`;
        });
      }

      if (isSurplus) {
        const matchedStock = rawStockPhotos.find(s => s.eventName === cleanEvent);
        if (matchedStock && matchedStock.group) {
          groupSel.value = matchedStock.group;
          groupSel.dispatchEvent(new Event('change'));
          setTimeout(() => {
            if (matchedStock.member) memSel.value = matchedStock.member;
          }, 100);
        }
      }
    });

    onSnapshot(collection(db, "orders"), snap => {
      ordersCache = {};
      snap.forEach(d => { ordersCache[d.id] = d.data(); });
      renderProgressCards();
    });

    onSnapshot(collection(db, "photo_progress"), snap => {
      progressMap = {};
      lastProgressList = [];
      snap.forEach(d => {
        const item = { id: d.id, ...d.data() };
        progressMap[d.id] = item;
        lastProgressList.push(item);
      });
      refreshCombinedList();
    });

    function extractDateScore(evName) {
      if (!evName) return 99999999;
      const match = evName.match(/\d{6}/);
      if (match) return parseInt(match[0], 10);
      return 99999999;
    }

    function getBuyerIssueSummary(eventName, member, isHide) {
      if (isHide) {
        return '<span class="buyer-issue-tag buyer-tag-hidden">👁️ (買家名單已隱藏)</span>';
      }

      const isSurplus = eventName.startsWith('【餘圖認領】');
      const cleanEvent = eventName.replace('【餘圖認領】', '').trim();

      const matchedOrders = Object.values(ordersCache).filter(o => {
        const ev = (o.event || o.eventName || '').trim();
        const mem = (o.member || '').trim();
        if (isSurplus) {
          return (ev === eventName || (o.orderType === '餘圖認領' && ev.includes(cleanEvent))) && mem === member;
        } else {
          return ev === eventName && mem === member;
        }
      });

      if (matchedOrders.length === 0) {
        return '<span class="buyer-issue-tag" style="color:#909399; border: 1px solid #dcdfe6; background: #fff;">(無買家登記)</span>';
      }

      let pendingUsers = [];
      let issueUsers = [];
      let waitPhotoUsers = [];

      matchedOrders.forEach(o => {
        const u = o.user || o.buyerName || '未知';
        const paySt = o.paymentStatus || o.status || (o.hasPaid ? '已對帳' : '待匯款');
        const isPaid = (paySt === '已對帳' || o.hasPaid);
        const isPhotoSent = (o.isPhotoSent === true || o.status === '已發圖');

        if (!isPaid) {
          if (paySt === '對帳有問題' || paySt === '有問題') {
            if (!issueUsers.includes(u)) issueUsers.push(u);
          } else {
            if (!pendingUsers.includes(u)) pendingUsers.push(u);
          }
        } else if (!isPhotoSent) {
          if (!waitPhotoUsers.includes(u)) waitPhotoUsers.push(u);
        }
      });

      let html = '';
      if (pendingUsers.length > 0) html += `<span class="buyer-issue-tag buyer-tag-pending">🚨 待匯款: ${pendingUsers.join(', ')}</span>`;
      if (issueUsers.length > 0) html += `<span class="buyer-issue-tag buyer-tag-issue">⚠️ 帳有問題: ${issueUsers.join(', ')}</span>`;
      if (waitPhotoUsers.length > 0) html += `<span class="buyer-issue-tag buyer-tag-waitphoto">📷 待發圖: ${waitPhotoUsers.join(', ')}</span>`;

      if (!html) html = '<span class="buyer-issue-tag buyer-tag-ok">🟢 全員完成 (可結案)</span>';
      
      return html;
    }

    function renderProgressCards() {
      const activeContainer = document.getElementById('activeProgressContainer');
      const archivedContainer = document.getElementById('archivedProgressContainer');
      const archivedBlock = document.getElementById('archivedDividerBlock');
      const badgeCount = document.getElementById('archiveCountBadge');
      
      activeContainer.innerHTML = '';
      archivedContainer.innerHTML = '';

      let list = cachedCombinedList;

      if (activeGroup === 'UNCLASSIFIED') {
        list = list.filter(i => !i.group || i.group === '未分類');
      } else if (activeGroup !== 'ALL') {
        list = list.filter(i => i.group === activeGroup);
      }

      if (activeDetail !== 'ALL') {
        if (activeMode === 'member') list = list.filter(i => i.member === activeDetail);
        else if (activeMode === 'event') list = list.filter(i => (i.eventName || i.event) === activeDetail);
      }

      if (activeStatus !== 'ALL') {
        list = list.filter(i => i.status === activeStatus);
      }

      if (list.length === 0) {
        activeContainer.innerHTML = '<p style="text-align:center; color:#909399; grid-column: 1 / -1; padding: 20px;">目前無符合條件的發圖進度紀錄。</p>';
        archivedBlock.style.display = 'none';
        notifyHeight();
        return;
      }

      const activeList = [];
      const archivedList = [];

      list.forEach(i => {
        if (i.status === '已結束' || i.status === '到期/已刪除') {
          archivedList.push(i);
        } else {
          activeList.push(i);
        }
      });

      renderGroupedCardsInto(activeList, activeContainer, false);

      if (archivedList.length > 0) {
        archivedBlock.style.display = 'block';
        badgeCount.textContent = archivedList.length;
        renderGroupedCardsInto(archivedList, archivedContainer, true);
      } else {
        archivedBlock.style.display = 'none';
        badgeCount.textContent = '0';
      }

      notifyHeight();
    }

    function renderGroupedCardsInto(itemList, targetContainer, isArchived) {
      if (itemList.length === 0) return;

      const groups = {};

      if (activeMode === 'event') {
        itemList.forEach(item => {
          const grp = item.group || 'Stray Kids';
          const eName = item.eventName || item.event || '未命名活動';
          const groupKey = `${grp}___${eName}`;
          if (!groups[groupKey]) groups[groupKey] = [];
          groups[groupKey].push(item);
        });

        const sortedGroupKeys = Object.keys(groups).sort((a, b) => {
          const [grpA, evA] = a.split('___');
          const [grpB, evB] = b.split('___');
          const dateA = extractDateScore(evA);
          const dateB = extractDateScore(evB);
          if (dateA !== dateB) return dateA - dateB;
          if (grpA !== grpB) return grpA.localeCompare(grpB, 'zh-TW');
          return a.localeCompare(b, 'zh-TW');
        });

        sortedGroupKeys.forEach(groupKey => {
          const items = groups[groupKey];
          const [grpName, eventName] = groupKey.split('___');
          const isAteez = (grpName === 'ATEEZ');
          const headerClass = isAteez ? 'event-group-header header-ateez' : 'event-group-header';
          
          const card = document.createElement('div');
          card.className = `event-group-card ${isArchived ? 'archived-card' : ''}`;
          
          let html = `<div class="${headerClass}">📅 [${grpName}] ${eventName}</div>`;
          html += `<div class="progress-list-box">`;

          items.sort((a, b) => {
            const mList = memberMap[grpName] || [];
            const idxA = mList.indexOf(a.member || '');
            const idxB = mList.indexOf(b.member || '');
            return (idxA === -1 ? 99 : idxA) - (idxB === -1 ? 99 : idxB);
          });

          items.forEach((item) => {
            const mName = item.member || '全體';
            const batchName = item.batch || '批次 1';
            const sellerName = item.seller || '代拍1';
            const statusText = item.status || '-';
            const badgeText = item.isVirtual ? '未開放 (自動)' : statusText;
            const ev = item.eventName || item.event;
            const isHidden = (item.isHideBuyers === true);
            const buyerSummary = getBuyerIssueSummary(ev, mName, isHidden);
            
            let badgeClass = 'status-st-unopened';
            if (statusText === '可詢問餘圖') badgeClass = 'status-stock-open';
            else if (['已通知匯款', '整理中', '修圖中', '上傳中'].includes(statusText)) badgeClass = 'status-sorting';
            else if (['已完工', '已發圖', '已結束', '已預約'].includes(statusText)) badgeClass = 'status-done';
            else if (['已通知匯款'].includes(statusText)) badgeClass = 'status-waiting';

            const memEmoji = MEMBER_EMOJI_MAP[mName] || '👤';

            html += `
              <div class="member-block">
                <div class="member-box-card">
                  <div class="member-header-row">
                    <div class="member-info-left">
                      <div class="member-title-row">
                        <span>${memEmoji} ${mName} <span style="font-size:11px; font-weight:normal; color:#909399;">(${batchName} / 📷 ${sellerName})</span></span>
                        <span class="status-badge ${badgeClass}">${badgeText}</span>
                      </div>
                    </div>
                  </div>
                  <div class="buyer-issue-tags-container">${buyerSummary}</div>
                  <div class="btn-action-col">
                    <button class="btn-action btn-notify" onclick="triggerManualPayment('${ev}', '${mName}', '${item.id}')">📢 發起匯款</button>
                    <button class="btn-action btn-toggle-eye ${isHidden ? 'is-hidden' : ''}" onclick="toggleHideBuyers('${item.id}', ${isHidden})">${isHidden ? '👁️ 顯示' : '👁️ 隱藏'}</button>
                    <button class="btn-action btn-edit" onclick="editProgress('${item.id}')">✏️ 編輯</button>
                    <button class="btn-action btn-del" onclick="deleteProgress('${item.id}')">🗑️ 刪除</button>
                  </div>
                </div>
              </div>
            `;
          });
          html += `</div>`;
          card.innerHTML = html;
          targetContainer.appendChild(card);
        });
      } else {
        itemList.forEach(item => {
          const grp = item.group || 'Stray Kids';
          const mName = item.member || '全體';
          const groupKey = `${grp}___${mName}`;
          if (!groups[groupKey]) groups[groupKey] = [];
          groups[groupKey].push(item);
        });

        const sortedGroupKeys = Object.keys(groups).sort((a, b) => {
          const [grpA, memA] = a.split('___');
          const [grpB, memB] = b.split('___');
          if (grpA !== grpB) return grpA.localeCompare(grpB, 'zh-TW');
          
          const mList = memberMap[grpA] || [];
          const idxA = mList.indexOf(memA);
          const idxB = mList.indexOf(memB);
          return (idxA === -1 ? 99 : idxA) - (idxB === -1 ? 99 : idxB);
        });

        sortedGroupKeys.forEach(groupKey => {
          const items = groups[groupKey];
          const [grpName, memberName] = groupKey.split('___');
          const isAteez = (grpName === 'ATEEZ');
          const headerClass = isAteez ? 'event-group-header header-ateez' : 'event-group-header';
          const memEmoji = MEMBER_EMOJI_MAP[memberName] || '👤';
          
          const card = document.createElement('div');
          card.className = `event-group-card ${isArchived ? 'archived-card' : ''}`;
          
          let html = `<div class="${headerClass}">${memEmoji} [${grpName}] ${memberName}</div>`;
          html += `<div class="progress-list-box">`;

          items.sort((a, b) => {
            const evA = a.eventName || a.event || '';
            const evB = b.eventName || b.event || '';
            const dateA = extractDateScore(evA);
            const dateB = extractDateScore(evB);
            if (dateA !== dateB) return dateA - dateB;
            return evA.localeCompare(evB, 'zh-TW');
          });

          items.forEach((item) => {
            const batchName = item.batch || '批次 1';
            const sellerName = item.seller || '代拍1';
            const statusText = item.status || '-';
            const badgeText = item.isVirtual ? '未開放 (自動)' : statusText;
            const ev = item.eventName || item.event;
            const isHidden = (item.isHideBuyers === true);
            const buyerSummary = getBuyerIssueSummary(ev, memberName, isHidden);

            let badgeClass = 'status-st-unopened';
            if (statusText === '可詢問餘圖') badgeClass = 'status-stock-open';
            else if (['已通知匯款', '整理中', '修圖中', '上傳中'].includes(statusText)) badgeClass = 'status-sorting';
            else if (['已完工', '已發圖', '已結束', '已預約'].includes(statusText)) badgeClass = 'status-done';
            else if (['已通知匯款'].includes(statusText)) badgeClass = 'status-waiting';

            html += `
              <div class="member-block">
                <div class="member-box-card">
                  <div class="member-header-row">
                    <div class="member-info-left">
                      <div class="member-title-row">
                        <span>🗓️ ${ev} <span style="font-size:12px; font-weight:normal; color:#909399;">(${batchName} / 📷 ${sellerName})</span></span>
                        <span class="status-badge ${badgeClass}">${badgeText}</span>
                      </div>
                    </div>
                  </div>
                  <div class="buyer-issue-tags-container">${buyerSummary}</div>
                  <div class="btn-action-col">
                    <button class="btn-action btn-notify" onclick="triggerManualPayment('${ev}', '${memberName}', '${item.id}')">📢 發起匯款</button>
                    <button class="btn-action btn-toggle-eye ${isHidden ? 'is-hidden' : ''}" onclick="toggleHideBuyers('${item.id}', ${isHidden})">${isHidden ? '👁️ 顯示' : '👁️ 隱藏'}</button>
                    <button class="btn-action btn-edit" onclick="editProgress('${item.id}')">✏️ 編輯</button>
                    <button class="btn-action btn-del" onclick="deleteProgress('${item.id}')">🗑️ 刪除</button>
                  </div>
                </div>
              </div>
            `;
          });
          html += `</div>`;
          card.innerHTML = html;
          targetContainer.appendChild(card);
        });
      }
    }

    window.toggleHideBuyers = async (docId, currentHidden) => {
      try {
        const vItem = virtualProgressMap[docId];
        if (vItem) {
          await setDoc(doc(db, "photo_progress", docId), {
            eventName: vItem.eventName,
            batch: vItem.batch,
            group: vItem.group,
            member: vItem.member,
            seller: vItem.seller,
            status: vItem.status,
            isHideBuyers: !currentHidden,
            updatedAt: new Date()
          });
        } else {
          await updateDoc(doc(db, "photo_progress", docId), {
            isHideBuyers: !currentHidden,
            updatedAt: new Date()
          });
        }
      } catch (err) {
        alert('更新失敗: ' + err.message);
      }
    };

    window.triggerManualPayment = async (eventName, member, docId) => {
      if (confirm(`確定要向 [${eventName}] - ${member} 的所有喊單買家發起匯款通知嗎？\n（該場次未付款訂單將自動改為「待匯款」）`)) {
        try {
          const now = new Date();
          const formattedMD = (now.getMonth() + 1) + '/' + now.getDate();

          const vItem = virtualProgressMap[docId];
          if (vItem) {
            await setDoc(doc(db, "photo_progress", docId), {
              eventName: vItem.eventName,
              batch: vItem.batch,
              group: vItem.group,
              member: vItem.member,
              seller: vItem.seller,
              status: '已通知匯款',
              notifyPaymentAt: formattedMD,
              updatedAt: new Date()
            });
          } else {
            await updateDoc(doc(db, "photo_progress", docId), {
              status: '已通知匯款',
              notifyPaymentAt: formattedMD,
              updatedAt: new Date()
            });
          }

          await triggerOrdersToPendingPayment(eventName, member);
          alert('✅ 已成功發起匯款通知！相關訂單已改為「待匯款」。');
        } catch (err) {
          alert('觸發失敗：' + err.message);
        }
      }
    };

    document.getElementById('progressForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const status = statusSelect.value;
      if (!status) {
        alert('請選擇進度狀態！');
        return;
      }

      const checkedSellers = Array.from(sellersCheckContainer.querySelectorAll('input[type="checkbox"]:checked')).map(cb => cb.value.trim());
      if (checkedSellers.length === 0) {
        alert('請至少勾選一個代拍！');
        return;
      }

      const saveBtn = document.getElementById('saveProgressBtn');
      saveBtn.disabled = true;

      const eventName = evSel.value;
      const batch = batchSel.value || '批次 1';
      const group = groupSel.value;
      const member = memSel.value;
      const seller = checkedSellers.join(', ');

      const docId = (eventName + '_' + member + '_' + batch).replace(/[\/\s#?]/g, '_');

      const updateData = {
        eventName: eventName,
        batch: batch,
        group: group,
        member: member,
        seller: seller,
        status: status,
        updatedAt: new Date()
      };

      try {
        await setDoc(doc(db, "photo_progress", docId), updateData, { merge: true });
        alert('✅ 進度發佈成功！');
        resetForm();
        window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
      } catch (err) {
        alert('儲存失敗：' + err.message);
      } finally {
        saveBtn.disabled = false;
      }
    });

    async function triggerOrdersToPendingPayment(eventName, member) {
      try {
        const isSurplus = eventName.startsWith('【餘圖認領】');
        const cleanEvent = eventName.replace('【餘圖認領】', '').trim();

        const q = query(collection(db, "orders"), where("member", "==", member));
        const snap = await getDocs(q);
        const updatePromises = [];

        snap.forEach(d => {
          const ord = d.data();
          const ev = (ord.event || ord.eventName || '').trim();
          const isMatch = isSurplus ? (ev === eventName || (ord.orderType === '餘圖認領' && ev.includes(cleanEvent))) : (ev === eventName);

          if (isMatch && !ord.hasPaid && ord.status !== '已對帳') {
            updatePromises.push(updateDoc(doc(db, "orders", d.id), {
              paymentStatus: '待匯款',
              status: '待匯款'
            }));
          }
        });

        if (updatePromises.length > 0) {
          await Promise.all(updatePromises);
        }
      } catch (err) {
        console.error('連動更新待匯款失敗:', err);
      }
    }

    window.editProgress = (docId) => {
      const item = progressMap[docId] || virtualProgressMap[docId];
      if (!item) return;

      document.getElementById('editProgressId').value = docId;
      evSel.value = item.eventName || item.event || '';
      evSel.dispatchEvent(new Event('change'));
      batchSel.value = item.batch || '批次 1';
      
      if (item.group) {
        groupSel.value = item.group;
        groupSel.dispatchEvent(new Event('change'));
      }

      setTimeout(() => {
        memSel.value = item.member || '';
        statusSelect.value = item.isVirtual ? '未開放' : (item.status || '');

        const currentSellers = (item.seller || '').split(',').map(s => s.trim());
        sellersCheckContainer.querySelectorAll('input[type="checkbox"]').forEach(cb => {
          cb.checked = currentSellers.includes(cb.value);
        });
      }, 100);

      document.getElementById('saveProgressBtn').textContent = '更新進度';
      document.getElementById('cancelBtn').style.display = 'inline-block';
      window.scrollTo({ top: 0, behavior: 'smooth' });
    };

    window.deleteProgress = async (docId) => {
      if (virtualProgressMap[docId]) {
        alert('⚠️ 這筆是系統自動從活動帶入的，尚未正式建檔，無法單獨刪除。\n(若要移除，請至「活動」或「餘圖」管理刪除原始資料)');
        return;
      }
      if (confirm('確定要刪除這筆進度紀錄嗎？')) {
        await deleteDoc(doc(db, "photo_progress", docId));
      }
    };

    window.resetForm = () => {
      document.getElementById('progressForm').reset();
      document.getElementById('editProgressId').value = '';
      batchSel.value = '批次 1';
      memSel.innerHTML = '<option value="">請先選擇團體</option>';
      memSel.disabled = true;
      sellersCheckContainer.innerHTML = '<span style="font-size:12px; color:#909399;">請先選擇活動</span>';
      statusSelect.value = '';
      document.getElementById('saveProgressBtn').textContent = '發佈進度';
      document.getElementById('cancelBtn').style.display = 'none';
    };

    function notifyHeight() {
      setTimeout(() => {
        const h = Math.max(document.body.scrollHeight, 600);
        window.parent.postMessage({ frameHeight: document.body.scrollHeight }, '*');
      }, 100);
    }
  </script>
</body>
</html>
