<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>發圖進度更新</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 15px; margin: 0; background: #fff; color: #333; }
    table { width: 100%; border-collapse: collapse; margin-top: 15px; }
    th, td { padding: 10px 8px; border-bottom: 1px solid #e4e7ed; text-align: left; font-size: 13px; vertical-align: middle; }
    th { background: #f8f9fa; color: #606266; font-weight: bold; white-space: nowrap; }
    select, button, input { padding: 8px 10px; border: 1px solid #dcdfe6; border-radius: 6px; font-size: 13px; box-sizing: border-box; }
    button { background-color: #409eff; color: white; border: none; font-weight: bold; cursor: pointer; }
    .btn-danger { background-color: #f56c6c; color: white; padding: 4px 8px; font-size: 12px; border-radius: 4px; border: none; cursor: pointer; }
    .btn-edit { background-color: #e6a23c; color: white; padding: 4px 8px; font-size: 12px; border-radius: 4px; border: none; cursor: pointer; margin-right: 4px; }
    .form-row { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 15px; align-items: center; background: #f8f9fa; padding: 12px; border-radius: 8px; }
  </style>
</head>
<body>

  <h3>發佈與更新發圖進度</h3>

  <form id="progressForm" class="form-row">
    <input type="hidden" id="editProgressId">
    
    <select id="eventSelect" required style="min-width: 180px;">
      <option value="">請選擇活動</option>
    </select>

    <select id="memberSelect" required style="min-width: 120px;">
      <option value="">請選擇成員</option>
    </select>

    <select id="photographerSelect" style="min-width: 140px;">
      <option value="">請選擇代拍</option>
    </select>

    <select id="statusSelect" required style="min-width: 120px;">
      <option value="">請選擇進度</option>
      <option value="等圖中">等圖中</option>
      <option value="分圖中">分圖中</option>
      <option value="整理中">整理中</option>
      <option value="已完工">已完工</option>
    </select>

    <button type="submit" id="saveProgressBtn">發佈進度</button>
    <button type="button" id="cancelBtn" style="background:#909399; display:none;" onclick="resetForm()">取消</button>
  </form>

  <table>
    <thead>
      <tr>
        <th style="width: 25%;">活動名稱</th>
        <th style="width: 15%;">成員</th>
        <th style="width: 20%;">代拍</th>
        <th style="width: 20%;">目前狀態</th>
        <th style="width: 20%;">操作</th>
      </tr>
    </thead>
    <tbody id="progressTable"></tbody>
  </table>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, doc, setDoc, deleteDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDF7QySG1Jj4gdZvXwMRaKjRmI-lFKpj7k",
      authDomain: "forsure0922.firebaseapp.com",
      databaseURL: "https://forsure0922-default-rtdb.firebaseio.com",
      projectId: "forsure0922",
      storageBucket: "forsure0922.firebasestorage.app",
      messagingSenderId: "817449290174",
      appId: "1:817449290174:web:6b4ec1d36c171ff97011ef"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let progressMap = {};

    document.addEventListener('DOMContentLoaded', async () => {
      // 載入成員 json
      const mRes = await fetch('../json/members.json');
      const members = await mRes.json();
      const memSel = document.getElementById('memberSelect');
      memSel.innerHTML = '<option value="">請選擇成員</option>';
      members.forEach(m => { memSel.innerHTML += `<option value="${m}">${m}</option>`; });

      // 載入 event_settings (去重過濾)
      onSnapshot(collection(db, "event_settings"), snap => {
        const evSel = document.getElementById('eventSelect');
        const photoSel = document.getElementById('photographerSelect');
        
        evSel.innerHTML = '<option value="">請選擇活動</option>';
        photoSel.innerHTML = '<option value="">請選擇代拍</option>';

        const uniqueEvents = new Set();
        const uniquePhotographers = new Set();

        snap.forEach(d => {
          const data = d.data();
          const eName = data.name || data.rawName;
          if (eName) uniqueEvents.add(eName.trim());
          if (data.photographer) uniquePhotographers.add(data.photographer.trim());
        });

        // 填入去重後的活動名稱
        Array.from(uniqueEvents).sort().forEach(eName => {
          evSel.innerHTML += `<option value="${eName}">${eName}</option>`;
        });

        // 填入去重後的代拍清單
        Array.from(uniquePhotographers).sort().forEach(pName => {
          photoSel.innerHTML += `<option value="${pName}">${pName}</option>`;
        });
      });
    });

    onSnapshot(collection(db, "progress_list"), snap => {
      const tb = document.getElementById('progressTable');
      tb.innerHTML = '';
      progressMap = {};

      snap.forEach(d => {
        const item = { id: d.id, ...d.data() };
        progressMap[d.id] = item;

        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td><b>${item.event || '-'}</b></td>
          <td>${item.member || '-'}</td>
          <td>${item.photographer || '-'}</td>
          <td><b>${item.status || '-'}</b></td>
          <td>
            <button class="btn-edit" onclick="editProgress('${item.id}')">編輯</button>
            <button class="btn-danger" onclick="deleteProgress('${item.id}')">刪除</button>
          </td>
        `;
        tb.appendChild(tr);
      });
      notifyHeight();
    });

    document.getElementById('progressForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const saveBtn = document.getElementById('saveProgressBtn');
      saveBtn.disabled = true;

      const editId = document.getElementById('editProgressId').value;
      const event = document.getElementById('eventSelect').value;
      const member = document.getElementById('memberSelect').value;
      const photographer = document.getElementById('photographerSelect').value;
      const status = document.getElementById('statusSelect').value;

      const docId = editId || `prog_${Date.now()}`;

      try {
        await setDoc(doc(db, "progress_list", docId), {
          event, member, photographer, status,
          updatedAt: new Date()
        }, { merge: true });

        alert('✅ 進度發佈成功！');
        resetForm();
      } catch (err) {
        alert('儲存失敗：' + err.message);
      } finally {
        saveBtn.disabled = false;
      }
    });

    window.editProgress = (docId) => {
      const item = progressMap[docId];
      if (!item) return;

      document.getElementById('editProgressId').value = docId;
      document.getElementById('eventSelect').value = item.event || '';
      document.getElementById('memberSelect').value = item.member || '';
      document.getElementById('photographerSelect').value = item.photographer || '';
      document.getElementById('statusSelect').value = item.status || '';

      document.getElementById('saveProgressBtn').textContent = '更新進度';
      document.getElementById('cancelBtn').style.display = 'inline-block';
    };

    window.deleteProgress = async (docId) => {
      if (confirm('確定要刪除這筆進度紀錄嗎？')) {
        await deleteDoc(doc(db, "progress_list", docId));
      }
    };

    window.resetForm = () => {
      document.getElementById('progressForm').reset();
      document.getElementById('editProgressId').value = '';
      document.getElementById('saveProgressBtn').textContent = '發佈進度';
      document.getElementById('cancelBtn').style.display = 'none';
    };

    function notifyHeight() {
      setTimeout(() => {
        window.parent.postMessage({ frameHeight: document.body.scrollHeight }, '*');
      }, 100);
    }
  </script>
</body>
</html>
