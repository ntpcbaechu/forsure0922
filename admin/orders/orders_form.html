<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>團員登記填單</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 15px; margin: 0; background: #fff; color: #333; }
    
    .form-container {
      max-width: 420px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .form-group { display: flex; flex-direction: column; gap: 4px; }

    label { font-size: 13px; font-weight: bold; color: #303133; }
    
    input, select, textarea { 
      width: 100%; 
      padding: 8px 10px; 
      border: 1px solid #dcdfe6; 
      border-radius: 8px; 
      font-size: 13px; 
      box-sizing: border-box; 
      background: #fff; 
      outline: none; 
      transition: border-color 0.2s; 
      font-family: inherit;
    }
    input:focus, select:focus, textarea:focus { border-color: #409eff; }
    select:disabled { background: #f5f7fa; color: #c0c4cc; cursor: not-allowed; }
    
    textarea { height: 75px; resize: vertical; line-height: 1.4; }

    button { width: 100%; padding: 10px; background: #409eff; color: white; border: none; border-radius: 8px; font-size: 14px; font-weight: bold; cursor: pointer; margin-top: 6px; transition: background 0.2s; }
    button:disabled { background: #a0cfff; }
    
    .qty-header-row { display: flex; justify-content: space-between; align-items: center; }
    .dynamic-tip { font-size: 12px; color: #67c23a; font-weight: bold; }
  </style>
</head>
<body>

  <div class="form-container">
    <h3 style="margin-top:0; margin-bottom:4px; font-size:18px; text-align:center;">團員登記填單</h3>
    
    <form id="orderForm" style="display:flex; flex-direction:column; gap:10px;">
      
      <!-- 1. 選擇團體 -->
      <div class="form-group">
        <label>1. 選擇團體 *</label>
        <select id="groupSelect" required>
          <option value="">請選擇團體</option>
          <option value="Stray Kids">Stray Kids</option>
          <option value="ATEEZ">ATEEZ</option>
        </select>
      </div>

      <!-- 2. 社群名稱 -->
      <div class="form-group">
        <label>2. 社群名稱 *</label>
        <select id="buyerName" required disabled>
          <option value="">請先選擇團體</option>
        </select>
        <input type="text" id="customBuyerInput" placeholder="請輸入新社群暱稱..." style="display:none; margin-top:4px;">
      </div>

      <!-- 3. 訂單類別 -->
      <div class="form-group">
        <label>3. 訂單類別</label>
        <select id="orderType">
          <option value="一般">一般 (預設)</option>
          <option value="追加">追加</option>
        </select>
      </div>

      <!-- 4. 請選擇活動 -->
      <div class="form-group">
        <label>4. 請選擇活動 *</label>
        <select id="eventName" required disabled>
          <option value="">請先選擇團體</option>
        </select>
      </div>

      <!-- 5. 請選擇成員 -->
      <div class="form-group">
        <label>5. 請選擇成員 *</label>
        <select id="member" required disabled>
          <option value="">請先選擇活動</option>
        </select>
      </div>

      <!-- 6. 數量 / 包 -->
      <div class="form-group">
        <div class="qty-header-row">
          <label>6. 數量 / 包 *</label>
          <span id="qtyTip" class="dynamic-tip"></span>
        </div>
        <input type="number" id="qty" min="1" step="1" placeholder="請輸入包數 (例如: 1, 2...)" required>
      </div>

      <!-- 7. 備註欄位 (選填) -->
      <div class="form-group">
        <label>7. 備註欄位 (選填)</label>
        <textarea id="note" placeholder="如有特殊需求請在此註明..."></textarea>
      </div>

      <button type="submit" id="submitBtn">提交訂單</button>
    </form>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, addDoc, onSnapshot, getDocs, query, where } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDF7QySG1Jj4gdZvXwMRaKjRmI-lFKpj7k",
      authDomain: "forsure0922.firebaseapp.com",
      databaseURL: "https://forsure0922-default-rtdb.firebaseio.com",
      projectId: "forsure0922",
      storageBucket: "forsure0922.firebasestorage.app",
      messagingSenderId: "817449290174",
      appId: "1:817449290174:web:6b4ec1d36c171ff97011ef"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let activeEventSettings = [];
    let eventPricesMap = {};
    let memberOrderMap = {};

    const groupSel = document.getElementById('groupSelect');
    const buyerSel = document.getElementById('buyerName');
    const customBuyerInput = document.getElementById('customBuyerInput');
    const eventSel = document.getElementById('eventName');
    const memberSel = document.getElementById('member');
    const qtyInput = document.getElementById('qty');

    document.addEventListener('DOMContentLoaded', async () => {
      try {
        const skzM = await fetch('../../json/members_skz.json').then(r => r.json());
        const atzM = await fetch('../../json/members_atz.json').then(r => r.json());
        memberOrderMap['Stray Kids'] = skzM;
        memberOrderMap['ATEEZ'] = atzM;
      } catch(e) {}

      // 監聽 Firestore 活動資料
      onSnapshot(collection(db, "event_settings"), snap => {
        activeEventSettings = [];
        eventPricesMap = {};

        snap.forEach(d => {
          const data = d.data();
          if (!data.isClosed && data.name) {
            activeEventSettings.push(data);
            const key = (data.group || '') + '_' + data.name.trim() + '_' + (data.member || '');
            eventPricesMap[key] = {
              price: Number(data.actualPrice || data.price || data.estimatedPrice || data.unitPrice) || 0,
              packQty: Number(data.packQty) || 1
            };
          }
        });

        updateEventsDropdown();
      });

      // 1. 團體切換
      groupSel.addEventListener('change', async () => {
        const chosenGroup = groupSel.value;
        customBuyerInput.style.display = 'none';
        customBuyerInput.value = '';

        if (!chosenGroup) {
          buyerSel.innerHTML = '<option value="">請先選擇團體</option>';
          buyerSel.disabled = true;
          eventSel.innerHTML = '<option value="">請先選擇團體</option>';
          eventSel.disabled = true;
          memberSel.innerHTML = '<option value="">請先選擇活動</option>';
          memberSel.disabled = true;
          updateQtyTip();
          return;
        }

        // 2. 載入動態社群名稱 (json + localStorage)
        buyerSel.disabled = false;
        const file = (chosenGroup === 'Stray Kids') ? 'users_skz.json' : 'users_atz.json';
        let jsonBuyers = [];
        try {
          jsonBuyers = await fetch(`../../json/${file}`).then(r => r.json());
        } catch(e){}

        const localKey = `custom_users_${chosenGroup}`;
        const localBuyers = JSON.parse(localStorage.getItem(localKey) || '[]');
        const combinedBuyers = Array.from(new Set([...jsonBuyers, ...localBuyers])).sort((a,b)=>a.localeCompare(b,'zh-TW'));

        buyerSel.innerHTML = '<option value="">請選擇您的名稱</option>';
        combinedBuyers.forEach(b => {
          buyerSel.innerHTML += `<option value="${b}">${b}</option>`;
        });
        buyerSel.innerHTML += '<option value="CUSTOM">➕ 其他 (手動輸入)...</option>';

        // 更新活動下拉選單
        updateEventsDropdown();
      });

      // 2. 社群名稱選擇「其他」顯示輸入框
      buyerSel.addEventListener('change', () => {
        if (buyerSel.value === 'CUSTOM') {
          customBuyerInput.style.display = 'block';
          customBuyerInput.required = true;
        } else {
          customBuyerInput.style.display = 'none';
          customBuyerInput.required = false;
        }
      });

      // 4. 活動切換連動成員
      eventSel.addEventListener('change', () => {
        const chosenGroup = groupSel.value;
        const chosenEvent = eventSel.value;
        memberSel.innerHTML = '';

        if (!chosenEvent) {
          memberSel.innerHTML = '<option value="">請先選擇活動</option>';
          memberSel.disabled = true;
          updateQtyTip();
          return;
        }

        const availableMembers = new Set();
        activeEventSettings.forEach(s => {
          if ((s.group || '') === chosenGroup && (s.name || '').trim() === chosenEvent && s.member) {
            availableMembers.add(s.member.trim());
          }
        });

        const orderList = memberOrderMap[chosenGroup] || [];
        const sortedMembers = Array.from(availableMembers).sort((a, b) => {
          let idxA = orderList.indexOf(a);
          let idxB = orderList.indexOf(b);
          return (idxA === -1 ? 99 : idxA) - (idxB === -1 ? 99 : idxB);
        });

        if (sortedMembers.length === 0) {
          memberSel.innerHTML = '<option value="">該活動尚無開放成員</option>';
          memberSel.disabled = true;
        } else {
          memberSel.disabled = false;
          memberSel.innerHTML = '<option value="">請選擇成員</option>';
          sortedMembers.forEach(m => {
            memberSel.innerHTML += `<option value="${m}">${m}</option>`;
          });

          if (sortedMembers.length === 1) {
            memberSel.value = sortedMembers[0];
          }
        }
        updateQtyTip();
      });

      memberSel.addEventListener('change', updateQtyTip);
      qtyInput.addEventListener('input', updateQtyTip);
    });

    function updateEventsDropdown() {
      const chosenGroup = groupSel.value;
      if (!chosenGroup) return;

      const uniqueEvents = new Set();
      activeEventSettings.forEach(s => {
        if ((s.group || '') === chosenGroup && s.name) {
          uniqueEvents.add(s.name.trim());
        }
      });

      const currentEv = eventSel.value;
      eventSel.disabled = false;
      eventSel.innerHTML = '<option value="">請選擇活動</option>';

      Array.from(uniqueEvents).sort().forEach(eName => {
        eventSel.innerHTML += `<option value="${eName}">${eName}</option>`;
      });

      if (currentEv && uniqueEvents.has(currentEv)) {
        eventSel.value = currentEv;
      } else {
        memberSel.innerHTML = '<option value="">請先選擇活動</option>';
        memberSel.disabled = true;
      }
      updateQtyTip();
      notifyHeight();
    }

    function updateQtyTip() {
      const groupVal = groupSel.value;
      const evName = eventSel.value;
      const memName = memberSel.value;
      const qtyVal = qtyInput.value;
      const packs = parseInt(qtyVal, 10);
      const tipElem = document.getElementById('qtyTip');

      if (!groupVal || !evName || !memName || isNaN(packs) || packs <= 0) {
        tipElem.textContent = '';
        return;
      }

      const setting = eventPricesMap[`${groupVal}_${evName}_${memName}`] || {};
      const packQty = setting.packQty || 1;
      const unitPrice = setting.price || 0;
      const totalCards = packs * packQty;
      const totalCost = packs * unitPrice;

      tipElem.textContent = `(共 ${totalCards} 張 / $${totalCost.toLocaleString()} 元)`;
    }

    document.getElementById('orderForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const groupVal = groupSel.value;
      let buyerVal = buyerSel.value;
      
      if (buyerVal === 'CUSTOM') {
        buyerVal = customBuyerInput.value.trim();
        if (!buyerVal) {
          alert('請輸入自訂的社群暱稱！');
          customBuyerInput.focus();
          return;
        }
        // 儲存新暱稱至對應團體的 localStorage
        const localKey = `custom_users_${groupVal}`;
        const localBuyers = JSON.parse(localStorage.getItem(localKey) || '[]');
        if (!localBuyers.includes(buyerVal)) {
          localBuyers.push(buyerVal);
          localStorage.setItem(localKey, JSON.stringify(localBuyers));
        }
      }

      const eventVal = eventSel.value;
      const memberVal = memberSel.value;
      const rawQty = qtyInput.value.trim();
      const packs = Number(rawQty);

      if (!rawQty || isNaN(packs) || !Number.isInteger(packs) || packs <= 0) {
        alert('⚠️ 請輸入有效的正整數包數（例如：1, 2, 3...）！');
        qtyInput.focus();
        return;
      }

      const orderTypeVal = document.getElementById('orderType').value;

      const setting = eventPricesMap[`${groupVal}_${eventVal}_${memberVal}`] || {};
      const packQty = setting.packQty || 1;
      const actualCardsQty = packs * packQty;

      const qDup = query(
        collection(db, "orders"),
        where("user", "==", buyerVal),
        where("group", "==", groupVal),
        where("event", "==", eventVal),
        where("member", "==", memberVal)
      );

      try {
        const dupSnap = await getDocs(qDup);
        if (!dupSnap.empty) {
          const confirmDup = confirm(
            `⚠️ 重複登記提醒：\n\n偵測到您（${buyerVal}）先前已經登記過【${groupVal} - ${eventVal} - ${memberVal}】囉！\n\n請確認是否要再次加喊？`
          );
          if (!confirmDup) return;
        }
      } catch(err) {
        console.error("檢查重複單失敗:", err);
      }

      const btn = document.getElementById('submitBtn');
      btn.disabled = true;
      btn.textContent = '提交中...';

      const data = {
        group: groupVal,
        buyerName: buyerVal,
        user: buyerVal,
        event: eventVal,
        eventName: eventVal,
        member: memberVal,
        qty: actualCardsQty,
        quantity: actualCardsQty,
        orderType: orderTypeVal,
        note: document.getElementById('note').value.trim(),
        createdAt: new Date().toISOString(),
        paymentStatus: '待匯款',
        status: '待匯款',
        hasPaid: false
      };

      try {
        await addDoc(collection(db, "orders"), data);
        alert('🎉 登記成功！');
        document.getElementById('orderForm').reset();
        customBuyerInput.style.display = 'none';
        buyerSel.innerHTML = '<option value="">請先選擇團體</option>';
        buyerSel.disabled = true;
        eventSel.innerHTML = '<option value="">請先選擇團體</option>';
        eventSel.disabled = true;
        memberSel.innerHTML = '<option value="">請先選擇活動</option>';
        memberSel.disabled = true;
        document.getElementById('qtyTip').textContent = '';
      } catch (err) {
        alert('提交失敗：' + err.message);
      } finally {
        btn.disabled = false;
        btn.textContent = '提交訂單';
      }
    });

    function notifyHeight() {
      setTimeout(() => {
        window.parent.postMessage({ frameHeight: document.body.scrollHeight }, '*');
      }, 100);
    }
  </script>
</body>
</html>
