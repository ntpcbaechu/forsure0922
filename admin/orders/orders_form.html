<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>團員登記填單</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 15px; margin: 0; background: #fff; color: #333; }
    h3 { margin-top: 0; margin-bottom: 12px; font-size: 16px; }
    .form-grid { display: grid; grid-template-columns: repeat(4, 1fr) auto; gap: 10px; align-items: end; background: #f8f9fa; padding: 12px; border-radius: 8px; border: 1px solid #ebeef5; }
    @media (max-width: 900px) { .form-grid { grid-template-columns: 1fr 1fr; } }
    .form-group { display: flex; flex-direction: column; gap: 4px; }
    label { font-size: 12px; font-weight: bold; color: #606266; }
    input, select { padding: 7px 10px; border: 1px solid #dcdfe6; border-radius: 6px; font-size: 13px; outline: none; }
    input:focus, select:focus { border-color: #409eff; }
    .btn-submit { background: #409eff; color: white; border: none; padding: 8px 16px; border-radius: 6px; font-weight: bold; cursor: pointer; height: 35px; }
    .btn-submit:hover { background: #66b1ff; }
  </style>
</head>
<body>

  <h3>➕ 新增團員登記 (後台代填)</h3>
  <form id="adminOrderForm" class="form-grid">
    <div class="form-group">
      <label>社群名稱 *</label>
      <select id="admUser" required><option value="">請選擇</option></select>
    </div>
    <div class="form-group">
      <label>活動名稱 *</label>
      <input type="text" id="admEvent" placeholder="例: 0801 演唱會" required>
    </div>
    <div class="form-group">
      <label>成員 *</label>
      <input type="text" id="admMember" placeholder="例: 成員A" required>
    </div>
    <div class="form-group">
      <label>數量 / 金額 *</label>
      <div style="display:flex; gap:6px;">
        <input type="number" id="admQty" min="1" placeholder="張數" required style="width:50%;">
        <input type="number" id="admAmt" min="0" placeholder="金額$" required style="width:50%;">
      </div>
    </div>
    <div>
      <button type="submit" class="btn-submit">確認新增</button>
    </div>
  </form>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDF7QySG1Jj4gdZvXwMRaKjRmI-lFKpj7k",
      authDomain: "forsure0922.firebaseapp.com",
      databaseURL: "https://forsure0922-default-rtdb.firebaseio.com",
      projectId: "forsure0922",
      storageBucket: "forsure0922.firebasestorage.app",
      messagingSenderId: "817449290174",
      appId: "1:817449290174:web:6b4ec1d36c171ff97011ef"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    document.addEventListener('DOMContentLoaded', async () => {
      try {
        const res = await fetch('../../json/users.json');
        const users = await res.json();
        const sel = document.getElementById('admUser');
        users.sort((a, b) => a.localeCompare(b, 'zh-TW')).forEach(u => {
          sel.innerHTML += `<option value="${u}">${u}</option>`;
        });
      } catch (e) {}

      document.getElementById('adminOrderForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const user = document.getElementById('admUser').value;
        const event = document.getElementById('admEvent').value.trim();
        const member = document.getElementById('admMember').value.trim();
        const qty = parseInt(document.getElementById('admQty').value) || 1;
        const total = parseFloat(document.getElementById('admAmt').value) || 0;

        try {
          await addDoc(collection(db, "orders"), {
            user,
            buyerName: user,
            event,
            eventName: event,
            member,
            qty,
            quantity: qty,
            total,
            amount: total,
            paymentStatus: '待匯款',
            isPhotoSent: false,
            createdAt: new Date().toISOString()
          });
          alert('✅ 團員登記新增成功！');
          document.getElementById('adminOrderForm').reset();
        } catch (err) {
          alert('新增失敗: ' + err.message);
        }
      });
    });
  </script>
</body>
</html>
