<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>代拍名單管理</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 15px; margin: 0; background: #fff; color: #333; }
    .form-row { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 15px; background: #f8f9fa; padding: 15px; border-radius: 8px; border: 1px solid #ebeef5; align-items: center; }
    input, button { padding: 8px 10px; border: 1px solid #dcdfe6; border-radius: 6px; font-size: 13px; outline: none; }
    input:focus { border-color: #409eff; }
    button { background-color: #409eff; color: white; border: none; font-weight: bold; cursor: pointer; border-radius: 6px; }
    .btn-danger { background-color: #f56c6c; color: white; padding: 3px 8px; font-size: 11px; border-radius: 4px; border: none; cursor: pointer; }

    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    th, td { padding: 8px 10px; border-bottom: 1px solid #ebeef5; text-align: left; font-size: 13px; }
    th { background: #edf2fc; color: #606266; font-weight: bold; }
    .count-badge { font-size: 12px; color: #909399; margin-left: auto; }
    .header-bar { display: flex; align-items: center; margin-bottom: 12px; }
  </style>
</head>
<body>

  <div class="header-bar">
    <h3 style="margin:0; font-size:18px;">📷 代拍名單管理</h3>
    <span id="sellerCountTip" class="count-badge"></span>
  </div>

  <form id="sellerForm" class="form-row">
    <input type="text" id="sellerName" placeholder="輸入代拍名稱 / 推特推主名稱 *" required style="min-width: 260px;">
    <button type="submit" id="saveSellerBtn">➕ 新增代拍</button>
  </form>

  <table>
    <thead>
      <tr>
        <th style="width: 70%;">代拍名稱</th>
        <th style="width: 30%;">操作</th>
      </tr>
    </thead>
    <tbody id="sellerTableBody">
      <tr><td colspan="2" style="text-align:center; color:#909399; padding:20px;">載入中...</td></tr>
    </tbody>
  </table>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, doc, setDoc, deleteDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDF7QySG1Jj4gdZvXwMRaKjRmI-lFKpj7k",
      authDomain: "forsure0922.firebaseapp.com",
      databaseURL: "https://forsure0922-default-rtdb.firebaseio.com",
      projectId: "forsure0922",
      storageBucket: "forsure0922.firebasestorage.app",
      messagingSenderId: "817449290174",
      appId: "1:817449290174:web:6b4ec1d36c171ff97011ef"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let sellersList = [];

    onSnapshot(collection(db, "sellers"), snap => {
      sellersList = [];
      snap.forEach(d => {
        sellersList.push({ id: d.id, ...d.data() });
      });
      renderTable();
    });

    function renderTable() {
      const tb = document.getElementById('sellerTableBody');
      tb.innerHTML = '';

      document.getElementById('sellerCountTip').textContent = `共 ${sellersList.length} 位代拍`;

      if (sellersList.length === 0) {
        tb.innerHTML = '<tr><td colspan="2" style="text-align:center; color:#909399; padding:20px;">尚無代拍資料</td></tr>';
        notifyHeight();
        return;
      }

      sellersList.sort((a,b) => (a.name || a.id).localeCompare(b.name || b.id, 'zh-TW')).forEach(s => {
        const sName = s.name || s.id;
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td><b>📷 ${sName}</b></td>
          <td>
            <button class="btn-danger" onclick="deleteSeller('${s.id}')">刪除</button>
          </td>
        `;
        tb.appendChild(tr);
      });
      notifyHeight();
    }

    document.getElementById('sellerForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const saveBtn = document.getElementById('saveSellerBtn');
      saveBtn.disabled = true;

      const name = document.getElementById('sellerName').value.trim();
      if (!name) return;

      try {
        await setDoc(doc(db, "sellers", name), {
          name,
          updatedAt: new Date().toISOString()
        }, { merge: true });

        alert('✅ 代拍已成功加入資料庫！');
        document.getElementById('sellerName').value = '';
      } catch(err) {
        alert('儲存失敗: ' + err.message);
      } finally {
        saveBtn.disabled = false;
      }
    });

    window.deleteSeller = async (id) => {
      if (confirm(`確定要刪除代拍「${id}」嗎？`)) {
        await deleteDoc(doc(db, "sellers", id));
      }
    };

    function notifyHeight() {
      setTimeout(() => {
        window.parent.postMessage({ frameHeight: document.body.scrollHeight }, '*');
      }, 100);
    }
  </script>
</body>
</html>
