<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>餘圖庫存管理</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 0; margin: 0; background: #fff; color: #333; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    th, td { padding: 10px 8px; border-bottom: 1px solid #e4e7ed; text-align: left; font-size: 13px; vertical-align: middle; }
    th { background: #f8f9fa; color: #606266; font-weight: bold; white-space: nowrap; }
    
    .filter-card { background: #f8f9fa; border: 1px solid #ebeef5; border-radius: 10px; padding: 12px 15px; margin: 10px 0 15px 0; display: flex; flex-direction: column; gap: 8px; }
    .filter-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .filter-label { font-size: 12px; font-weight: bold; color: #606266; min-width: 80px; }

    .capsule-group { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
    .capsule-filter-btn { background: #fff; color: #606266; border: 1px solid #dcdfe6; padding: 4px 12px; border-radius: 16px; font-size: 12px; font-weight: bold; cursor: pointer; transition: all 0.2s; outline: none; }
    .capsule-filter-btn:hover { background: #ecf5ff; color: #409eff; border-color: #c6e2ff; }
    .capsule-filter-btn.active { background: #409eff; color: #fff; border-color: #409eff; box-shadow: 0 2px 6px rgba(64,158,255,0.25); }
    .capsule-filter-btn.sub-active { background: #67c23a; color: #fff; border-color: #67c23a; box-shadow: 0 2px 6px rgba(103,194,58,0.25); }

    .stock-badge { padding: 3px 8px; border-radius: 12px; font-size: 12px; font-weight: bold; }
    .stock-positive { background: #f0f9eb; color: #67c23a; border: 1px solid #e1f3d8; }
    .stock-zero { background: #f4f4f5; color: #909399; border: 1px solid #e4e7ed; }
    .stock-negative { background: #fef0f0; color: #f56c6c; border: 1px solid #fde2e2; }
  </style>
</head>
<body>

  <h3 style="margin-top:0; margin-bottom:10px; font-size:18px;">📦 餘圖庫存管理</h3>

  <div class="filter-card">
    <div class="filter-row">
      <span class="filter-label">1. 團體：</span>
      <div id="groupCapsules" class="capsule-group"></div>
    </div>

    <div class="filter-row">
      <span class="filter-label">2. 檢視模式：</span>
      <div id="modeCapsules" class="capsule-group">
        <button class="capsule-filter-btn active" onclick="setModeFilter('member', this)">👥 依成員</button>
        <button class="capsule-filter-btn" onclick="setModeFilter('event', this)">🗓️ 依活動</button>
      </div>
    </div>

    <div class="filter-row">
      <span class="filter-label">3. 細項篩選：</span>
      <div id="detailCapsules" class="capsule-group"></div>
    </div>
  </div>

  <table>
    <thead>
      <tr>
        <th style="width: 25%;">活動名稱</th>
        <th style="width: 15%;">團體與成員</th>
        <th style="width: 15%;">每包規格</th>
        <th style="width: 15%;">總拆包數</th>
        <th style="width: 15%;">已登記包數</th>
        <th style="width: 15%;">剩餘庫存 (包 / 張)</th>
      </tr>
    </thead>
    <tbody id="stockTableBody">
      <tr><td colspan="6" style="text-align:center; color:#909399; padding:20px;">載入庫存數據中...</td></tr>
    </tbody>
  </table>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDF7QySG1Jj4gdZvXwMRaKjRmI-lFKpj7k",
      authDomain: "forsure0922.firebaseapp.com",
      databaseURL: "https://forsure0922-default-rtdb.firebaseio.com",
      projectId: "forsure0922",
      storageBucket: "forsure0922.firebasestorage.app",
      messagingSenderId: "817449290174",
      appId: "1:817449290174:web:6b4ec1d36c171ff97011ef"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const MEMBER_EMOJI_MAP = {
      '方燦': '🐺', 'Lee Know': '🐰', '彰彬': '🐷', '鉉辰': '🥟', 'HAN': '🐹', 'Felix': '🐥', '昇玟': '🐶', 'I.N': '🦊',
      '弘中': '🐿️', '星化': '🐰', '潤浩': '🐶', '呂尚': '🐥', '傘': '⛰️', '旼琦': '🐥', '友榮': '🐈‍⬛', '鍾浩': '🐻'
    };

    const GROUP_EMOJI_MAP = {
      'Stray Kids': '🧭 Stray Kids',
      'ATEEZ': '🏴‍☠️ ATEEZ'
    };

    let eventSettings = [];
    let ordersList = [];

    let activeGroup = 'ALL';
    let activeMode = 'member';
    let activeDetail = 'ALL';

    let groupList = ['Stray Kids', 'ATEEZ'];
    let memberMap = {};

    document.addEventListener('DOMContentLoaded', async () => {
      try {
        const skzM = await fetch('../json/members_skz.json').then(r => r.json());
        const atzM = await fetch('../json/members_atz.json').then(r => r.json());
        memberMap['Stray Kids'] = skzM;
        memberMap['ATEEZ'] = atzM;
      } catch(e) {}

      renderGroupCapsules();

      onSnapshot(collection(db, "event_settings"), snap => {
        eventSettings = [];
        snap.forEach(d => eventSettings.push({ id: d.id, ...d.data() }));
        updateDetailCapsules();
        renderTable();
      });

      onSnapshot(collection(db, "orders"), snap => {
        ordersList = [];
        snap.forEach(d => ordersList.push(d.data()));
        renderTable();
      });
    });

    function renderGroupCapsules() {
      const container = document.getElementById('groupCapsules');
      container.innerHTML = '';

      const allBtn = document.createElement('button');
      allBtn.className = `capsule-filter-btn ${activeGroup === 'ALL' ? 'active' : ''}`;
      allBtn.textContent = '全部團體';
      allBtn.onclick = () => {
        activeGroup = 'ALL';
        document.querySelectorAll('#groupCapsules .capsule-filter-btn').forEach(b => b.classList.remove('active'));
        allBtn.classList.add('active');
        activeDetail = 'ALL';
        updateDetailCapsules();
        renderTable();
      };
      container.appendChild(allBtn);

      groupList.forEach(g => {
        const btn = document.createElement('button');
        btn.className = `capsule-filter-btn ${activeGroup === g ? 'active' : ''}`;
        btn.textContent = GROUP_EMOJI_MAP[g] || g;
        btn.onclick = () => {
          activeGroup = g;
          document.querySelectorAll('#groupCapsules .capsule-filter-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          activeDetail = 'ALL';
          updateDetailCapsules();
          renderTable();
        };
        container.appendChild(btn);
      });
    }

    window.setModeFilter = (mode, btn) => {
      activeMode = mode;
      document.querySelectorAll('#modeCapsules .capsule-filter-btn').forEach(b => b.classList.remove('active'));
      if(btn) btn.classList.add('active');
      activeDetail = 'ALL';
      updateDetailCapsules();
      renderTable();
    };

    function updateDetailCapsules() {
      const container = document.getElementById('detailCapsules');
      container.innerHTML = '';

      const allBtn = document.createElement('button');
      allBtn.className = `capsule-filter-btn ${activeDetail === 'ALL' ? 'sub-active' : ''}`;
      allBtn.textContent = '全部顯示';
      allBtn.onclick = () => {
        activeDetail = 'ALL';
        document.querySelectorAll('#detailCapsules .capsule-filter-btn').forEach(b => b.classList.remove('sub-active'));
        allBtn.classList.add('sub-active');
        renderTable();
      };
      container.appendChild(allBtn);

      let filtered = eventSettings;
      if (activeGroup !== 'ALL') filtered = filtered.filter(e => e.group === activeGroup);

      if (activeMode === 'member') {
        const membersInJson = (activeGroup !== 'ALL') ? (memberMap[activeGroup] || []) : Object.values(memberMap).flat();
        const activeMembersWithData = new Set(filtered.map(e => e.member).filter(Boolean));

        membersInJson.forEach(m => {
          if (activeMembersWithData.has(m)) {
            const btn = document.createElement('button');
            btn.className = `capsule-filter-btn ${activeDetail === m ? 'sub-active' : ''}`;
            btn.textContent = (MEMBER_EMOJI_MAP[m] ? `${MEMBER_EMOJI_MAP[m]} ` : '') + m;
            btn.onclick = () => {
              activeDetail = m;
              document.querySelectorAll('#detailCapsules .capsule-filter-btn').forEach(b => b.classList.remove('sub-active'));
              btn.classList.add('sub-active');
              renderTable();
            };
            container.appendChild(btn);
          }
        });
      } else if (activeMode === 'event') {
        const eventsSet = new Set();
        filtered.forEach(e => {
          if (e.name || e.rawName) eventsSet.add(e.rawName || e.name);
        });
        Array.from(eventsSet).sort().forEach(ev => {
          const btn = document.createElement('button');
          btn.className = `capsule-filter-btn ${activeDetail === ev ? 'sub-active' : ''}`;
          btn.textContent = ev;
          btn.onclick = () => {
            activeDetail = ev;
            document.querySelectorAll('#detailCapsules .capsule-filter-btn').forEach(b => b.classList.remove('sub-active'));
            btn.classList.add('sub-active');
            renderTable();
          };
          container.appendChild(btn);
        });
      }
    }

    function renderTable() {
      const tb = document.getElementById('stockTableBody');
      tb.innerHTML = '';

      let list = eventSettings;
      if (activeGroup !== 'ALL') list = list.filter(e => e.group === activeGroup);
      if (activeDetail !== 'ALL') {
        if (activeMode === 'member') list = list.filter(e => e.member === activeDetail);
        else if (activeMode === 'event') list = list.filter(e => (e.rawName || e.name) === activeDetail);
      }

      if (list.length === 0) {
        tb.innerHTML = '<tr><td colspan="6" style="text-align:center; color:#909399; padding:20px;">尚無符合條件的活動設定資料</td></tr>';
        notifyHeight();
        return;
      }

      list.sort((a, b) => (a.name || '').localeCompare(b.name || ''));

      list.forEach(ev => {
        const grp = ev.group || 'Stray Kids';
        const grpDisplay = GROUP_EMOJI_MAP[grp] || grp;
        const mem = ev.member || '全體';
        const memDisplay = (MEMBER_EMOJI_MAP[mem] ? `${MEMBER_EMOJI_MAP[mem]} ` : '') + mem;
        const unit = ev.unit || '包';
        const packQty = Number(ev.packQty) || 1;
        const totalPacks = Number(ev.packsCount) || 0;

        const matchedOrders = ordersList.filter(o => {
          const mEv = (o.event === ev.name || o.eventName === ev.name);
          const mMem = (!ev.member || o.member === ev.member);
          const mGrp = (!ev.group || o.group === ev.group);
          return mEv && mMem && mGrp;
        });

        const orderedCards = matchedOrders.reduce((sum, o) => {
          return sum + (Number(o.qty !== undefined ? o.qty : (o.quantity !== undefined ? o.quantity : o.count)) || 0);
        }, 0);

        const orderedPacks = packQty > 0 ? (orderedCards / packQty) : 0;
        const remainingPacks = totalPacks - orderedPacks;
        const remainingCards = remainingPacks * packQty;

        let badgeClass = 'stock-positive';
        if (remainingPacks === 0) badgeClass = 'stock-zero';
        else if (remainingPacks < 0) badgeClass = 'stock-negative';

        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td><b>📅 ${ev.name}</b></td>
          <td><b>${grpDisplay}</b><br><span style="color:#409eff;">${memDisplay}</span></td>
          <td>${packQty} 張/${unit}</td>
          <td><b>${totalPacks} ${unit}</b></td>
          <td>${orderedCards} 張 (${orderedPacks.toFixed(1).replace(/\.0$/, '')} ${unit})</td>
          <td>
            <span class="stock-badge ${badgeClass}">
              ${remainingPacks.toFixed(1).replace(/\.0$/, '')} ${unit} / ${remainingCards.toFixed(0)} 張
            </span>
          </td>
        `;
        tb.appendChild(tr);
      });

      notifyHeight();
    }

    function notifyHeight() {
      setTimeout(() => {
        window.parent.postMessage({ frameHeight: document.body.scrollHeight }, '*');
      }, 100);
    }
  </script>
</body>
</html>
