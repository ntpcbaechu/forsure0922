<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>全部對帳紀錄</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 5px; margin: 0; background: #fff; color: #333; }
    .group-card { border: 1px solid #dcdfe6; border-radius: 8px; margin-bottom: 15px; background: #fff; box-shadow: 0 2px 8px rgba(0,0,0,0.04); overflow: hidden; }
    .group-header { padding: 10px 15px; font-size: 14px; font-weight: bold; display: flex; align-items: center; justify-content: space-between; background: #f4f4f5; color: #303133; border-bottom: 1px solid #dcdfe6; }

    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 10px 8px; border-bottom: 1px solid #e4e7ed; text-align: left; font-size: 13px; vertical-align: top; }
    th { background: #f8f9fa; color: #606266; font-weight: bold; white-space: nowrap; }
    tr:last-child td { border-bottom: none; }
    
    input[type="text"], input[type="number"], input[type="date"], select, textarea { padding: 4px 6px; border: 1px solid #dcdfe6; border-radius: 4px; font-size: 12px; box-sizing: border-box; outline: none; }
    input:focus, select:focus, textarea:focus { border-color: #409eff; }

    .item-list { margin: 0; padding-left: 0; list-style: none; font-size: 12px; color: #606266; }
    .item-list li { margin-bottom: 4px; }
    .meta-box { margin-top: 6px; padding-top: 6px; border-top: 1px dashed #ebeef5; font-size: 11px; color: #909399; }
    .note-text { color: #e6a23c; word-break: break-all; margin-top: 4px; white-space: pre-wrap; line-height: 1.4; }

    .bank-check-card { margin-top: 10px; background: #fdfdfd; border: 1px solid #e4e7ed; border-radius: 6px; padding: 10px; }
    .bank-check-header { font-weight: bold; font-size: 12px; color: #409eff; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
    .bank-input-row { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; background: #fff; border: 1px solid #ebeef5; padding: 6px 8px; border-radius: 4px; margin-bottom: 6px; }

    .status-badge-inline { padding: 2px 8px; border-radius: 12px; font-size: 11px; font-weight: bold; display: inline-block; margin-bottom: 4px; }
    .badge-pending { background: #fdf6ec; color: #e6a23c; border: 1px solid #faecd8; }
    .badge-error { background: #fef0f0; color: #f56c6c; border: 1px solid #fde2e2; }
    .badge-ok { background: #f0f9eb; color: #67c23a; border: 1px solid #e1f3d8; }
    .badge-sent { background: #ecf5ff; color: #409eff; border: 1px solid #d9ecff; }

    .btn-edit { background-color: #e6a23c; color: white; padding: 4px 8px; font-size: 12px; border-radius: 4px; border: none; cursor: pointer; margin-bottom: 4px; width: 100%; display: block; text-align: center; }
    .btn-save { background-color: #67c23a; color: white; padding: 4px 8px; font-size: 12px; border-radius: 4px; border: none; cursor: pointer; margin-bottom: 4px; width: 100%; display: block; text-align: center; }
    .btn-cancel { background-color: #909399; color: white; padding: 4px 8px; font-size: 12px; border-radius: 4px; border: none; cursor: pointer; margin-bottom: 4px; width: 100%; display: block; text-align: center; }
    .btn-danger { background-color: #f56c6c; color: white; padding: 4px 8px; font-size: 12px; border-radius: 4px; border: none; cursor: pointer; width: 100%; display: block; text-align: center; }
  </style>
</head>
<body>

  <div id="groupContainer">載入中...</div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, doc, deleteDoc, updateDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDF7QySG1Jj4gdZvXwMRaKjRmI-lFKpj7k",
      authDomain: "forsure0922.firebaseapp.com",
      databaseURL: "https://forsure0922-default-rtdb.firebaseio.com",
      projectId: "forsure0922",
      storageBucket: "forsure0922.firebasestorage.app",
      messagingSenderId: "817449290174",
      appId: "1:817449290174:web:6b4ec1d36c171ff97011ef"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const BANK_OPTIONS = ['台銀', '樂天', '中信', '台新', '其他'];

    let currentCapsuleFilter = { group: 'Stray Kids', mode: 'member', detail: 'ALL', user: 'ALL' };
    let memberMap = {};

    async function loadMembers() {
      try {
        const skzM = await fetch('../../json/members_skz.json').then(r=>r.json()).catch(()=>[]);
        const atzM = await fetch('../../json/members_atz.json').then(r=>r.json()).catch(()=>[]);
        memberMap['Stray Kids'] = skzM;
        memberMap['ATEEZ'] = atzM;
      } catch(e) {}
    }
    loadMembers();

    function extractDateScore(evName) {
      if (!evName) return 99999999;
      const match = evName.match(/\d{6}/);
      if (match) return parseInt(match[0], 10);
      return 99999999;
    }

    window.addEventListener('message', (e) => {
      if (e.data && e.data.type === 'PAYMENT_CAPSULE_FILTER') {
        currentCapsuleFilter = {
          group: e.data.group || 'Stray Kids',
          mode: e.data.mode || 'member',
          detail: e.data.detail || 'ALL',
          user: e.data.user || 'ALL'
        };
        renderTable();
      }
    });

    window.parent.postMessage({ type: 'IFRAME_READY' }, '*');

    let paymentDataMap = {};
    let editingRows = new Set();
    let ordersCache = {};

    onSnapshot(collection(db, "orders"), snap => {
      ordersCache = {};
      snap.forEach(d => { ordersCache[d.id] = d.data(); });
      renderTable();
    });

    onSnapshot(collection(db, "payments"), snap => {
      paymentDataMap = {};
      snap.forEach(d => { paymentDataMap[d.id] = { id: d.id, ...d.data() }; });
      renderTable();
    });

    function formatSocialDisplay(p) {
      const type = p.contactType || '';
      const acc = p.socialAccount || p.social || '';
      
      if (type === '官方 Line' || acc.includes('@115oyenv')) {
        return '💬 官方 Line';
      }
      if (type === 'Instagram') {
        return `[IG] ${acc}`;
      }
      if (type === 'Threads') {
        return `[Threads] ${acc}`;
      }
      if (type && acc) {
        return `[${type}] ${acc}`;
      }
      return acc || '-';
    }

    window.renderTable = () => {
      const container = document.getElementById('groupContainer');
      container.innerHTML = '';

      const kwElem = document.getElementById('paymentSearchInput');
      const kw = kwElem ? kwElem.value.toLowerCase().trim() : '';

      let list = Object.values(paymentDataMap);

      if (currentCapsuleFilter.user !== 'ALL') {
        list = list.filter(p => (p.user || p.buyerName) === currentCapsuleFilter.user);
      }

      if (currentCapsuleFilter.detail !== 'ALL') {
        if (currentCapsuleFilter.mode === 'member') {
          list = list.filter(p => {
            const relatedIds = p.relatedOrderIds || [];
            if (relatedIds.length > 0) {
              return relatedIds.some(id => ordersCache[id] && ordersCache[id].member === currentCapsuleFilter.detail);
            }
            return p.member === currentCapsuleFilter.detail;
          });
        } else if (currentCapsuleFilter.mode === 'event') {
          list = list.filter(p => {
            const relatedIds = p.relatedOrderIds || [];
            if (relatedIds.length > 0) {
              return relatedIds.some(id => ordersCache[id] && (ordersCache[id].event || ordersCache[id].eventName) === currentCapsuleFilter.detail);
            }
            return (p.event || p.eventName) === currentCapsuleFilter.detail;
          });
        }
      }

      if (kw) {
        list = list.filter(p => `${p.user || ''} ${p.buyerName || ''} ${p.bankLast5 || ''} ${p.last5 || ''} ${p.contactType || ''}`.toLowerCase().includes(kw));
      }

      if (list.length === 0) {
        container.innerHTML = '<div style="text-align:center; color:#909399; padding:30px;">目前尚無對帳紀錄</div>';
        notifyHeight();
        return;
      }

      list.sort((a, b) => {
        const tA = a.createdAt ? new Date(a.createdAt).getTime() : 0;
        const tB = b.createdAt ? new Date(b.createdAt).getTime() : 0;
        return tB - tA;
      });

      const card = document.createElement('div');
      card.className = 'group-card';
      card.innerHTML = '<div class="group-header">' +
        '<span>📋 全部對帳紀錄 (共 ' + list.length + ' 筆)</span>' +
        '<input type="text" id="paymentSearchInput" value="' + kw + '" placeholder="🔍 搜尋暱稱 / 後五碼..." onkeyup="renderTable()" style="padding:4px 8px; border:1px solid #cbd5e1; border-radius:6px; font-size:12px; width:180px;">' +
      '</div>' +
      '<table><thead><tr><th style="width:15%;">社群名稱</th><th style="width:45%;">買家勾選與明細 & 銀行實際對帳輸入</th><th style="width:15%;">買家填寫資料</th><th style="width:13%;">對帳狀態</th><th style="width:12%;">操作</th></tr></thead><tbody></tbody></table>';

      const tb = card.querySelector('tbody');
      list.forEach(p => tb.appendChild(renderPaymentRow(p)));
      container.appendChild(card);

      notifyHeight();
    };

    function renderPaymentRow(p) {
      const docId = p.id;
      const isEditing = editingRows.has(docId);

      const userName = p.user || p.buyerName || '-';
      const socialDisplay = formatSocialDisplay(p);
      
      const expectedAmt = p.finalPay !== undefined ? p.finalPay : (p.amount || 0);
      const expectedLast5 = String(p.bankLast5 || p.last5 || '').trim();
      const buyerBank = p.bankName || p.bank || '';

      let statusBadge = '<span class="status-badge-inline badge-pending">🟡 未對帳</span>';
      const st = String(p.status || '').toLowerCase();
      if (p.isPhotoSent === true || st === 'photo_sent') {
        statusBadge = '<span class="status-badge-inline badge-sent">🔵 已發圖</span>';
      } else if (st === 'ok' || st === '已對帳') {
        statusBadge = '<span class="status-badge-inline badge-ok">🟢 已對帳</span>';
      } else if (st === 'error' || st === '對帳有問題' || st === '有問題') {
        statusBadge = '<span class="status-badge-inline badge-error">🔴 有問題</span>';
      }

      let inputs = p.bankInputs || [];
      if (inputs.length === 0) {
        inputs = [{ amt: p.inputAmt || '', last5: p.inputLast5 || '', bank: buyerBank, date: p.checkDate || '' }];
      }

      let timeStr = '-';
      if (p.createdAt) {
        try {
          let dateObj = (typeof p.createdAt === 'string') ? new Date(p.createdAt) : new Date(p.createdAt.seconds * 1000);
          if (dateObj && !isNaN(dateObj.getTime())) {
            timeStr = dateObj.toLocaleString('zh-TW', { year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', hour12: false });
          }
        } catch(e) {}
      }

      const buyerNote = p.note || p.userNote || '';

      let itemsHtml = '';
      const relatedIds = p.relatedOrderIds || [];
      if (relatedIds.length > 0) {
        let sortedOrders = relatedIds.map(oId => ordersCache[oId]).filter(Boolean);

        sortedOrders.sort((a, b) => {
          const evA = a.event || a.eventName || '';
          const evB = b.event || b.eventName || '';
          const dateScoreA = extractDateScore(evA);
          const dateScoreB = extractDateScore(evB);

          if (dateScoreA !== dateScoreB) {
            return dateScoreA - dateScoreB;
          }

          const grp = a.group || b.group || 'Stray Kids';
          const memberList = memberMap[grp] || memberMap['Stray Kids'] || [];

          let idxA = memberList.indexOf(a.member || '');
          let idxB = memberList.indexOf(b.member || '');

          if (idxA === -1) idxA = 99;
          if (idxB === -1) idxB = 99;

          return idxA - idxB;
        });

        itemsHtml += '<ul class="item-list">';
        sortedOrders.forEach(o => {
          const ev = o.event || o.eventName || '活動';
          const mem = o.member || '全體';
          const qty = o.qty !== undefined ? o.qty : (o.quantity || 0);
          itemsHtml += '<li>• <b>' + ev + '</b> (' + mem + ' / ' + qty + '張)</li>';
        });
        itemsHtml += '</ul>';
      } else {
        const ev = p.eventName || p.event || '多筆關聯訂單';
        const qtyInfo = p.qty !== undefined ? p.qty + ' 張' : '';
        itemsHtml = '<div>' + ev + ' ' + qtyInfo + '</div>';
      }

      let totalInputAmt = 0;
      inputs.forEach(inp => {
        if (inp.amt !== '' && !isNaN(parseFloat(inp.amt))) totalInputAmt += parseFloat(inp.amt);
      });

      let bankInputsHtml = '<div class="bank-check-card"><div class="bank-check-header"><span>🏦 銀行實際對帳紀錄</span></div>';
      inputs.forEach((inp, idx) => {
        let bankOptionsStr = '<option value="">請選擇銀行</option>' + BANK_OPTIONS.map(b => '<option value="' + b + '" ' + (inp.bank === b ? 'selected' : '') + '>' + b + '</option>').join('');
        bankInputsHtml += '<div class="bank-input-row">' +
          '<span style="font-weight:bold; color:#909399; font-size:11px;">#' + (idx+1) + '</span> ' +
          '金額: <input type="number" style="width:70px;" value="' + inp.amt + '" disabled> ' +
          '後五碼: <input type="text" style="width:65px;" value="' + inp.last5 + '" disabled> ' +
          '銀行: <select disabled>' + bankOptionsStr + '</select> ' +
          '日期: <input type="date" value="' + (inp.date || '') + '" disabled>' +
        '</div>';
      });

      bankInputsHtml += '</div>';

      const tr = document.createElement('tr');

      if (!isEditing) {
        tr.innerHTML = '<td><b>' + userName + '</b><br><small style="color:#409eff; font-weight:bold;">' + socialDisplay + '</small></td>' +
          '<td>' +
            itemsHtml +
            '<div class="meta-box">' +
              '<div>⏱️ <b>匯款時間：</b>' + timeStr + '</div>' +
              (buyerNote ? '<div class="note-text">📝 <b>買家備註：</b>\n' + buyerNote + '</div>' : '') +
            '</div>' +
            bankInputsHtml +
          '</td>' +
          '<td>' +
            '<b style="color:#f56c6c; font-size:14px;">$' + expectedAmt + '</b><br>' +
            '<small style="color:#606266;">買家填寫: <b>' + (buyerBank || '未選') + ' (' + (expectedLast5 || '-') + ')</b></small>' +
          '</td>' +
          '<td>' + statusBadge + '</td>' +
          '<td>' +
            '<button class="btn-edit" onclick="toggleEdit(\'' + docId + '\', true)">✏️ 編輯</button>' +
            '<button class="btn-danger" onclick="deletePayment(\'' + docId + '\')">🗑️ 刪除</button>' +
          '</td>';
      } else {
        tr.innerHTML = '<td>' +
            '<input type="text" id="edit-user-' + docId + '" value="' + userName + '" style="width:100%; margin-bottom:4px;" placeholder="社群暱稱">' +
            '<input type="text" id="edit-social-' + docId + '" value="' + (p.socialAccount || p.social || '') + '" style="width:100%;" placeholder="社群帳號">' +
          '</td>' +
          '<td>' +
            itemsHtml +
            '<div style="margin-top:6px;">' +
              '<textarea id="edit-note-' + docId + '" style="width:100%; height:55px;" placeholder="編輯買家備註">' + buyerNote + '</textarea>' +
            '</div>' +
          '</td>' +
          '<td>' +
            '應匯: <input type="number" id="edit-amt-' + docId + '" value="' + expectedAmt + '" style="width:70px; margin-bottom:4px;"><br>' +
            '後五碼: <input type="text" id="edit-last5-' + docId + '" value="' + expectedLast5 + '" style="width:70px;">' +
          '</td>' +
          '<td><span style="font-size:12px; color:#909399;">編輯模式中</span></td>' +
          '<td>' +
            '<button class="btn-save" onclick="savePaymentEdit(\'' + docId + '\')">💾 儲存</button>' +
            '<button class="btn-cancel" onclick="toggleEdit(\'' + docId + '\', false)">❌ 取消</button>' +
          '</td>';
      }

      return tr;
    }

    window.toggleEdit = (docId, isEdit) => {
      if (isEdit) editingRows.add(docId);
      else editingRows.delete(docId);
      renderTable();
    };

    window.savePaymentEdit = async (docId) => {
      const user = document.getElementById('edit-user-' + docId).value.trim();
      const social = document.getElementById('edit-social-' + docId).value.trim();
      const note = document.getElementById('edit-note-' + docId).value.trim();
      const finalPay = parseFloat(document.getElementById('edit-amt-' + docId).value) || 0;
      const bankLast5 = document.getElementById('edit-last5-' + docId).value.trim();
      try {
        await updateDoc(doc(db, "payments", docId), {
          user: user, buyerName: user,
          social: social, socialAccount: social,
          note: note, userNote: note,
          finalPay: finalPay, amount: finalPay,
          bankLast5: bankLast5, last5: bankLast5
        });
        editingRows.delete(docId);
        alert('✅ 匯款紀錄修改成功！');
      } catch (err) { alert('儲存失敗: ' + err.message); }
    };

    window.deletePayment = async (docId) => {
      if (confirm('確定要刪除這筆匯款審核紀錄嗎？')) { 
        try {
          await deleteDoc(doc(db, "payments", docId));
        } catch (err) { alert('刪除失敗: ' + err.message); }
      }
    };

    function notifyHeight() {
      setTimeout(() => { window.parent.postMessage({ frameHeight: document.body.scrollHeight }, '*'); }, 100);
    }
  </script>
</body>
</html>
