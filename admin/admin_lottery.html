<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>抽獎活動管理</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 15px; margin: 0; background: #fff; color: #333; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    th, td { padding: 10px 8px; border-bottom: 1px solid #e4e7ed; text-align: left; font-size: 13px; vertical-align: middle; }
    th { background: #f8f9fa; color: #606266; font-weight: bold; white-space: nowrap; }
    input, select, button, textarea { padding: 8px 10px; border: 1px solid #dcdfe6; border-radius: 6px; font-size: 13px; box-sizing: border-box; transition: border-color 0.2s; outline: none; }
    input:focus, select:focus, textarea:focus { border-color: #409eff; }
    
    button { background-color: #409eff; color: white; border: none; font-weight: bold; cursor: pointer; }
    .btn-danger { background-color: #f56c6c; color: white; padding: 4px 8px; font-size: 12px; border-radius: 4px; border: none; cursor: pointer; }
    .btn-edit { background-color: #e6a23c; color: white; padding: 4px 8px; font-size: 12px; border-radius: 4px; border: none; cursor: pointer; margin-right: 4px; }

    .form-section { background: #f8f9fa; border: 1px solid #ebeef5; border-radius: 8px; padding: 14px; margin-bottom: 12px; }
    .form-row { display: grid; gap: 10px; margin-bottom: 8px; align-items: end; }
    .row-2 { grid-template-columns: 1fr 1fr; }
    .row-3 { grid-template-columns: 1fr 1fr 1.2fr; }
    .dynamic-row { display: flex; align-items: center; gap: 8px; margin-top: 6px; }

    .auto-textarea { width: 100%; min-height: 50px; resize: none; overflow-y: hidden; line-height: 1.5; }
    .info-rule-box { background: #ecf5ff; border-left: 4px solid #409eff; padding: 10px; border-radius: 0 6px 6px 0; font-size: 12px; color: #606266; line-height: 1.6; margin-bottom: 10px; }
    
    .status-badge { padding: 3px 8px; border-radius: 12px; font-size: 11px; font-weight: bold; display: inline-block; }
    .badge-sent { background: #ecf5ff; color: #409eff; border: 1px solid #b3d8ff; }
    .badge-pending { background: #f4f4f5; color: #909399; border: 1px solid #e4e7ed; }

    @media (max-width: 768px) {
      .row-2, .row-3 { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <h3>🎁 抽獎活動管理與發圖進度</h3>

  <form id="lotteryForm" style="margin-bottom:20px;">
    <input type="hidden" id="editLotteryId">

    <div class="form-section">
      <div style="margin-bottom:10px;">
        <label style="font-size:13px; font-weight:bold; color:#409eff;">📌 選擇連動開團或自訂抽獎：</label>
        <div style="margin-top:6px; display:flex; gap:15px; align-items:center;">
          <label style="font-size:13px; cursor:pointer;"><input type="radio" name="modeType" value="auto" checked> 選擇開團活動</label>
          <label style="font-size:13px; cursor:pointer;"><input type="radio" name="modeType" value="custom"> 完全自訂抽獎</label>
        </div>
      </div>

      <div id="autoSection" style="background:#eef5fe; padding:10px; border-radius:6px; margin-bottom:10px;">
        <label style="font-size:12px; font-weight:bold;">選擇活動場次與成員：</label>
        <div style="display:flex; gap:8px; margin-top:4px;">
          <select id="eventSelect" style="flex:1;"><option value="">載入中...</option></select>
          <button type="button" id="importBtn" style="background:#67c23a; padding:8px 14px;">⚡ 自動抓取名單與籤數</button>
        </div>
      </div>

      <div class="form-row row-2">
        <div>
          <label style="font-size:12px; font-weight:bold;">抽獎活動標題 *</label>
          <input type="text" id="lotteryTitle" required style="width:100%;">
        </div>
        <div>
          <label style="font-size:12px; font-weight:bold;">抽獎對應成員</label>
          <select id="lotteryMember" style="width:100%;"><option value="">請選擇成員</option></select>
        </div>
      </div>

      <!-- 新增：發圖狀態與日期設定 -->
      <div class="form-row row-3" style="margin-top:10px; padding-top:10px; border-top:1px dashed #dcdfe6;">
        <div>
          <label style="font-size:12px; font-weight:bold;">📷 發圖狀態 *</label>
          <select id="photoStatus" style="width:100%;">
            <option value="待發圖">📷 待發圖</option>
            <option value="已發圖">🔵 已發圖</option>
          </select>
        </div>
        <div id="sentDateBox" style="display:none;">
          <label style="font-size:12px; font-weight:bold;">📅 發圖日期</label>
          <input type="date" id="photoSentAt" style="width:100%;">
        </div>
        <div id="expireDateBox" style="display:none;">
          <label style="font-size:12px; font-weight:bold; color:#f56c6c;">⏳ 刪除日期 (+8天)</label>
          <input type="date" id="photoExpireAt" readonly style="width:100%; background:#f5f7fa;">
        </div>
      </div>
    </div>

    <!-- 動態獎項與中獎者列表 (同原本邏輯) -->
    <div class="form-section">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;">
        <label style="font-size:12px; font-weight:bold; color:#409eff;">🎁 獎項列表設定</label>
        <button type="button" id="addPrizeBtn" style="background:#67c23a; font-size:12px; padding:4px 8px;">+ 新增獎項列</button>
      </div>
      <div id="prizesContainer"></div>
    </div>

    <div class="form-section">
      <label style="font-size:12px; font-weight:bold;">👥 參與名單與籤數 (逗號分隔)</label>
      <textarea id="lotteryParticipants" class="auto-textarea" style="margin-top:4px;"></textarea>
    </div>

    <div class="form-section">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;">
        <label style="font-size:12px; font-weight:bold; color:#67c23a;">🎉 中獎結果設定</label>
        <button type="button" id="addWinnerBtn" style="background:#67c23a; font-size:12px; padding:4px 8px;">+ 新增中獎者</button>
      </div>
      <div id="winnersContainer"></div>
    </div>

    <button type="submit" id="saveLotteryBtn" style="width:100%; padding:10px; font-size:15px;">儲存並發佈抽獎公告</button>
    <button type="button" id="cancelLotteryBtn" style="background:#909399; width:100%; padding:10px; margin-top:5px; display:none;" onclick="resetLotteryForm()">取消編輯</button>
  </form>

  <!-- 歷史清單列表 -->
  <h3>📜 歷史抽獎公告列表</h3>
  <table>
    <thead>
      <tr>
        <th style="width:15%;">發佈時間</th>
        <th style="width:28%;">抽獎活動標題</th>
        <th style="width:10%;">成員</th>
        <th style="width:18%;">發圖狀態 / 日期</th>
        <th style="width:15%;">參與籤數 / 中獎</th>
        <th style="width:14%;">操作</th>
      </tr>
    </thead>
    <tbody id="lotteryTable"></tbody>
  </table>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, doc, setDoc, deleteDoc, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDF7QySG1Jj4gdZvXwMRaKjRmI-lFKpj7k",
      authDomain: "forsure0922.firebaseapp.com",
      databaseURL: "https://forsure0922-default-rtdb.firebaseio.com",
      projectId: "forsure0922",
      storageBucket: "forsure0922.firebasestorage.app",
      messagingSenderId: "817449290174",
      appId: "1:817449290174:web:6b4ec1d36c171ff97011ef"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let lotteryMap = {};

    // 發圖狀態連動顯示日期
    document.getElementById('photoStatus').addEventListener('change', (e) => {
      const isSent = e.target.value === '已發圖';
      document.getElementById('sentDateBox').style.display = isSent ? 'block' : 'none';
      document.getElementById('expireDateBox').style.display = isSent ? 'block' : 'none';

      if (isSent && !document.getElementById('photoSentAt').value) {
        const todayStr = new Date().toISOString().slice(0,10);
        document.getElementById('photoSentAt').value = todayStr;
        calcExpireDate(todayStr);
      }
    });

    // 手動選發圖日 -> 自動連動 +8天 刪圖日
    document.getElementById('photoSentAt').addEventListener('change', (e) => {
      calcExpireDate(e.target.value);
    });

    function calcExpireDate(sentDateStr) {
      if (!sentDateStr) return;
      const dateObj = new Date(sentDateStr);
      const expireObj = new Date(dateObj.getTime() + 8 * 24 * 60 * 60 * 1000);
      document.getElementById('photoExpireAt').value = expireObj.toISOString().slice(0,10);
    }

    // 歷史清單監聽與渲染
    onSnapshot(collection(db, "lottery_events"), snap => {
      const tb = document.getElementById('lotteryTable');
      tb.innerHTML = '';
      lotteryMap = {};

      let list = [];
      snap.forEach(d => {
        const item = { id: d.id, ...d.data() };
        list.push(item);
        lotteryMap[d.id] = item;
      });

      list.sort((a,b) => (b.createdAt?.seconds || 0) - (a.createdAt?.seconds || 0));

      list.forEach(item => {
        let dateStr = '-';
        if (item.createdAt) {
          const dt = item.createdAt.seconds ? new Date(item.createdAt.seconds * 1000) : new Date(item.createdAt);
          dateStr = dt.toLocaleDateString('zh-TW');
        }

        const isSent = item.photoStatus === '已發圖';
        let statusHtml = '<span class="status-badge badge-pending">📷 待發圖</span>';
        if (isSent) {
          statusHtml = `<span class="status-badge badge-sent">🔵 已發圖</span>
            <div style="font-size:11px; color:#606266; margin-top:2px;">
              發：${item.photoSentAt || '-'}<br>刪：<b style="color:#f56c6c;">${item.photoExpireAt || '-'}</b>
            </div>`;
        }

        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>${dateStr}</td>
          <td><b>${item.title}</b></td>
          <td>${item.member || '-'}</td>
          <td>${statusHtml}</td>
          <td>${item.participants?.length || 0} 籤 / ${item.winners?.length || 0} 人</td>
          <td>
            <button class="btn-edit" onclick="editLottery('${item.id}')">編輯</button>
            <button class="btn-danger" onclick="deleteLottery('${item.id}')">刪除</button>
          </td>
        `;
        tb.appendChild(tr);
      });
    });

    // 儲存表單與編輯邏輯... (其餘邏輯同原本)
  </script>
</body>
</html>
