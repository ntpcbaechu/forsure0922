<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>匯款對帳審核 - 主控台</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 15px; margin: 0; background: #fff; color: #333; }
    h3 { margin-top: 0; margin-bottom: 15px; font-size: 18px; }
    
    .filter-container { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 15px; }
    .filter-btn { padding: 6px 14px; border-radius: 20px; border: 1px solid #e8f4ff; background-color: #e8f4ff; color: #409eff; font-size: 13px; font-weight: bold; cursor: pointer; transition: all 0.2s ease; outline: none; }
    .filter-btn:hover { background-color: #d0e7ff; }
    .filter-btn.active { background-color: #409eff; color: #ffffff; border-color: #409eff; }

    .sub-page-frame { width: 100%; border: none; min-height: 500px; overflow: hidden; }
  </style>
</head>
<body>

  <h3>匯款登記與對帳管理</h3>

  <div class="filter-container">
    <button class="filter-btn active" onclick="switchTab('pending', this)">📌 未對帳</button>
    <button class="filter-btn" onclick="switchTab('error', this)">📌 帳有問題</button>
    <button class="filter-btn" onclick="switchTab('ok', this)">📌 已對帳 (未發圖)</button>
    <button class="filter-btn" onclick="switchTab('photosent', this)">📌 已發圖專區</button>
  </div>

  <iframe id="subPageFrame" class="sub-page-frame" src="payment/payment_pending.html"></iframe>

  <script>
    window.switchTab = (tabName, btnElem) => {
      document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
      if (btnElem) btnElem.classList.add('active');
      
      const frame = document.getElementById('subPageFrame');
      if (tabName === 'pending') frame.src = 'payment/payment_pending.html';
      else if (tabName === 'error') frame.src = 'payment/payment_error.html';
      else if (tabName === 'ok') frame.src = 'payment/payment_ok.html';
      else if (tabName === 'photosent') frame.src = 'payment/payment_photosent.html';
    };

    window.addEventListener('message', (e) => {
      if (e.data && e.data.frameHeight) {
        document.getElementById('subPageFrame').style.height = (e.data.frameHeight + 30) + 'px';
      }
    });
  </script>
</body>
</html>
