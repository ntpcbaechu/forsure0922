<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>匯款對帳審核</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 15px; margin: 0; background: #fff; color: #333; }
    h3 { margin-top: 0; margin-bottom: 15px; font-size: 18px; }
    
    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    th, td { padding: 10px 8px; border-bottom: 1px solid #e4e7ed; text-align: left; font-size: 13px; vertical-align: top; }
    th { background: #f8f9fa; color: #606266; font-weight: bold; white-space: nowrap; }
    
    input[type="text"], input[type="number"], input[type="date"], textarea {
      padding: 5px 8px;
      border: 1px solid #dcdfe6;
      border-radius: 4px;
      font-size: 12px;
      box-sizing: border-box;
      outline: none;
    }
    input:focus, textarea:focus { border-color: #409eff; }

    .item-list { margin: 0; padding-left: 0; list-style: none; font-size: 12px; color: #606266; }
    .item-list li { margin-bottom: 4px; }
    
    .meta-box { margin-top: 6px; padding-top: 6px; border-top: 1px dashed #ebeef5; font-size: 11px; color: #909399; }
    .note-text { color: #e6a23c; word-break: break-all; margin-top: 4px; white-space: pre-wrap; line-height: 1.4; }

    .status-warning { color: #f56c6c; font-size: 11px; font-weight: bold; margin-top: 4px; display: block; }
    .status-ok-msg { color: #67c23a; font-size: 11px; font-weight: bold; margin-top: 4px; display: block; }

    .btn-toggle { padding: 5px 10px; border-radius: 4px; font-size: 12px; cursor: pointer; border: 1px solid #dcdfe6; background: #fff; transition: all 0.2s; }
    .btn-toggle:disabled { cursor: not-allowed; opacity: 0.5; }
    .btn-toggle.ok-active { background: #e1f3d8; color: #67c23a; border-color: #67c23a; font-weight: bold; }
    .btn-toggle.err-active { background: #fef0f0; color: #f56c6c; border-color: #f56c6c; font-weight: bold; }
    
    .btn-edit { background-color: #e6a23c; color: white; padding: 4px 8px; font-size: 12px; border-radius: 4px; border: none; cursor: pointer; margin-bottom: 4px; width: 100%; display: block; text-align: center; }
    .btn-save { background-color: #67c23a; color: white; padding: 4px 8px; font-size: 12px; border-radius: 4px; border: none; cursor: pointer; margin-bottom: 4px; width: 100%; display: block; text-align: center; }
    .btn-cancel { background-color: #909399; color: white; padding: 4px 8px; font-size: 12px; border-radius: 4px; border: none; cursor: pointer; margin-bottom: 4px; width: 100%; display: block; text-align: center; }
    .btn-danger { background-color: #f56c6c; color: white; padding: 4px 8px; font-size: 12px; border-radius: 4px; border: none; cursor: pointer; width: 100%; display: block; text-align: center; }
    
    .status-err-note { color: #f56c6c; font-weight: bold; cursor: pointer; text-decoration: underline; margin-top: 4px; font-size: 11px; }
  </style>
</head>
<body>

  <h3>匯款登記與對帳管理</h3>
  <table>
    <thead>
      <tr>
        <th style="width: 12%;">社群名稱</th>
        <th style="width: 25%;">買家勾選與明細</th>
        <th style="width: 13%;">買家填寫資料</th>
        <th style="width: 18%;">銀行實際對帳輸入</th>
        <th style="width: 12%;">對帳日期</th>
        <th style="width: 12%;">對帳狀態</th>
        <th style="width: 8%;">操作</th>
      </tr>
    </thead>
    <tbody id="payTable"></tbody>
  </table>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, doc, deleteDoc, updateDoc, onSnapshot, getDocs, query, where, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDF7QySG1Jj4gdZvXwMRaKjRmI-lFKpj7k",
      authDomain: "forsure0922.firebaseapp.com",
      databaseURL: "https://forsure0922-default-rtdb.firebaseio.com",
      projectId: "forsure0922",
      storageBucket: "forsure0922.firebasestorage.app",
      messagingSenderId: "817449290174",
      appId: "1:817449290174:web:6b4ec1d36c171ff97011ef"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let paymentDataMap = {};
    let editingRows = new Set();
    let ordersCache = {};

    onSnapshot(collection(db, "orders"), snap => {
      ordersCache = {};
      snap.forEach(d => { ordersCache[d.id] = d.data(); });
      renderTable();
    });

    onSnapshot(collection(db, "payments"), snap => {
      paymentDataMap = {};
      snap.forEach(d => { paymentDataMap[d.id] = { id: d.id, ...d.data() }; });
      renderTable();
    });

    function renderTable() {
      const tb = document.getElementById('payTable');
      tb.innerHTML = '';

      const list = Object.values(paymentDataMap);
      if (list.length === 0) {
        tb.innerHTML = '<tr><td colspan="7" style="text-align:center; color:#909399; padding:20px;">目前尚無匯款對帳紀錄</td></tr>';
        notifyHeight();
        return;
      }

      // 排序邏輯：依填單時間由舊到新 (tA - tB)，最早填單的排在最上方
      list.sort((a, b) => {
        const tA = a.createdAt ? new Date(a.createdAt).getTime() : 0;
        const tB = b.createdAt ? new Date(b.createdAt).getTime() : 0;
        return tA - tB;
      });

      list.forEach(p => {
        const docId = p.id;
        const isEditing = editingRows.has(docId);

        const userName = p.user || p.buyerName || '-';
        const socialName = p.social || p.socialAccount || '-';
        const status = p.status || 'pending';
        const noteErr = p.errorNote || '';
        const checkDate = p.checkDate || '';
        
        const expectedAmt = p.finalPay !== undefined ? p.finalPay : (p.amount || 0);
        const expectedLast5 = String(p.bankLast5 || p.last5 || '').trim();

        const inputAmt = p.inputAmt !== undefined ? p.inputAmt : '';
        const inputLast5 = p.inputLast5 !== undefined ? p.inputLast5 : '';

        let timeStr = '-';
        if (p.createdAt) {
          try {
            let dateObj = (typeof p.createdAt === 'string') ? new Date(p.createdAt) : new Date(p.createdAt.seconds * 1000);
            if (dateObj && !isNaN(dateObj.getTime())) {
              timeStr = dateObj.toLocaleString('zh-TW', { year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', hour12: false });
            }
          } catch(e) {}
        }

        const buyerNote = p.note || p.userNote || '';

        let itemsHtml = '';
        const relatedIds = p.relatedOrderIds || [];
        if (relatedIds.length > 0) {
          itemsHtml += '<ul class="item-list">';
          relatedIds.forEach(oId => {
            const o = ordersCache[oId];
            if (o) {
              const ev = o.event || o.eventName || '活動';
              const mem = o.member || '全體';
              const qty = o.qty !== undefined ? o.qty : (o.quantity || 0);
              itemsHtml += `<li>• <b>${ev}</b> (${mem} / ${qty}張)</li>`;
            }
          });
          itemsHtml += '</ul>';
        } else {
          const ev = p.eventName || p.event || '多筆關聯訂單';
          const qtyInfo = p.qty !== undefined ? `${p.qty} 張` : '';
          itemsHtml = `<div>${ev} ${qtyInfo}</div>`;
        }

        // 買家備註：加上 white-space: pre-wrap 讓多行內容在冒號下方自動換行
        itemsHtml += `
          <div class="meta-box">
            <div>⏱️ <b>匯款時間：</b>${timeStr}</div>
            ${buyerNote ? `<div class="note-text">📝 <b>買家備註：</b>\n${buyerNote}</div>` : ''}
          </div>
        `;

        let isMatch = false;
        let diffMsg = '';

        if (String(inputAmt).trim() === '' && String(inputLast5).trim() === '') {
          diffMsg = '⚠️ 請輸入銀行實際對帳資料';
        } else {
          const numInputAmt = parseFloat(inputAmt);
          const strInputLast5 = String(inputLast5).trim();
          
          let amtOk = (numInputAmt === parseFloat(expectedAmt));
          let last5Ok = (strInputLast5 === expectedLast5);

          if (amtOk && last5Ok) {
            isMatch = true;
            diffMsg = '🟢 比對完全吻合';
          } else {
            let errs = [];
            if (!amtOk) errs.push('金額不符');
            if (!last5Ok) errs.push('後五碼不符');
            diffMsg = `❌ 比對不一致 (${errs.join('、')})`;
          }
        }

        const tr = document.createElement('tr');
        tr.id = `pay-row-${docId}`;

        if (!isEditing) {
          tr.innerHTML = `
            <td><b>${userName}</b><br><small style="color:#909399;">${socialName}</small></td>
            <td>${itemsHtml}</td>
            <td>
              <b style="color:#f56c6c;">$${expectedAmt}</b><br>
              <small style="color:#606266;">後五碼: <b>${expectedLast5 || '-'}</b></small>
              ${p.creditUsed > 0 ? `<br><small style="color:#67c23a;">(折抵$${p.creditUsed})</small>` : ''}
            </td>
            <td>
              <div style="margin-bottom:4px;">
                金額: <input type="number" style="width:75px;" placeholder="空白" value="${inputAmt}" onchange="updatePayField('${docId}', 'inputAmt', this.value === '' ? '' : parseFloat(this.value))">
              </div>
              <div>
                後五碼: <input type="text" style="width:75px;" placeholder="空白" value="${inputLast5}" onchange="updatePayField('${docId}', 'inputLast5', this.value.trim())">
              </div>
              <span class="${isMatch ? 'status-ok-msg' : 'status-warning'}">${diffMsg}</span>
            </td>
            <td>
              <input type="date" value="${checkDate}" onchange="updatePayField('${docId}', 'checkDate', this.value)">
            </td>
            <td>
              <button class="btn-toggle ${status === 'ok' ? 'ok-active' : ''}" 
                      ${!isMatch && status !== 'ok' ? 'disabled title="金額或後五碼不一致，無法設為已對帳"' : ''} 
                      onclick="setPayStatus('${docId}', 'ok')">🟢 已對帳</button>
              <button class="btn-toggle ${status === 'error' ? 'err-active' : ''}" 
                      onclick="setPayStatus('${docId}', 'error')" style="margin-top:4px;">🔴 有問題</button>
              ${status === 'error' ? `<div class="status-err-note" onclick="editErrorNote('${docId}', '${noteErr}')">原因: ${noteErr || '點擊填寫'}</div>` : ''}
            </td>
            <td>
              <button class="btn-edit" onclick="toggleEdit('${docId}', true)">✏️ 編輯</button>
              <button class="btn-danger" onclick="deletePayment('${docId}')">🗑️ 刪除</button>
            </td>
          `;
        } else {
          tr.innerHTML = `
            <td>
              <input type="text" id="edit-user-${docId}" value="${userName}" style="width:100%; margin-bottom:4px;" placeholder="社群暱稱">
              <input type="text" id="edit-social-${docId}" value="${socialName}" style="width:100%;" placeholder="社群帳號">
            </td>
            <td>
              ${itemsHtml}
              <div style="margin-top:6px;">
                <textarea id="edit-note-${docId}" style="width:100%; height:55px;" placeholder="編輯買家備註">${buyerNote}</textarea>
              </div>
            </td>
            <td>
              應匯: <input type="number" id="edit-amt-${docId}" value="${expectedAmt}" style="width:70px; margin-bottom:4px;"><br>
              後五碼: <input type="text" id="edit-last5-${docId}" value="${expectedLast5}" style="width:70px;">
            </td>
            <td>
              金額: <input type="number" id="edit-in-amt-${docId}" value="${inputAmt}" style="width:70px; margin-bottom:4px;"><br>
              後五碼: <input type="text" id="edit-in-last5-${docId}" value="${inputLast5}" style="width:70px;">
            </td>
            <td>
              <input type="date" id="edit-date-${docId}" value="${checkDate}" style="width:100%;">
            </td>
            <td>
              <span style="font-size:12px; color:#909399;">編輯模式中</span>
            </td>
            <td>
              <button class="btn-save" onclick="savePaymentEdit('${docId}')">💾 儲存</button>
              <button class="btn-cancel" onclick="toggleEdit('${docId}', false)">❌ 取消</button>
            </td>
          `;
        }

        tb.appendChild(tr);
      });

      notifyHeight();
    }

    window.toggleEdit = (docId, isEdit) => {
      if (isEdit) editingRows.add(docId);
      else editingRows.delete(docId);
      renderTable();
    };

    window.savePaymentEdit = async (docId) => {
      const user = document.getElementById(`edit-user-${docId}`).value.trim();
      const social = document.getElementById(`edit-social-${docId}`).value.trim();
      const note = document.getElementById(`edit-note-${docId}`).value.trim();
      const finalPay = parseFloat(document.getElementById(`edit-amt-${docId}`).value) || 0;
      const bankLast5 = document.getElementById(`edit-last5-${docId}`).value.trim();
      const inAmtVal = document.getElementById(`edit-in-amt-${docId}`).value;
      const inputAmt = inAmtVal === '' ? '' : parseFloat(inAmtVal);
      const inputLast5 = document.getElementById(`edit-in-last5-${docId}`).value.trim();
      const checkDate = document.getElementById(`edit-date-${docId}`).value;

      try {
        await updateDoc(doc(db, "payments", docId), {
          user: user, buyerName: user,
          social: social, socialAccount: social,
          note: note, userNote: note,
          finalPay: finalPay, amount: finalPay,
          bankLast5: bankLast5, last5: bankLast5,
          inputAmt: inputAmt,
          inputLast5: inputLast5,
          checkDate: checkDate
        });
        editingRows.delete(docId);
        alert('✅ 匯款紀錄修改成功！');
      } catch (err) {
        alert('儲存失敗: ' + err.message);
      }
    };

    window.updatePayField = async (docId, field, val) => {
      try {
        await updateDoc(doc(db, "payments", docId), { [field]: val });
      } catch (err) {
        alert('更新失敗: ' + err.message);
      }
    };

    window.setPayStatus = async (docId, newStatus) => {
      const today = new Date().toISOString().slice(0,10);
      const pData = paymentDataMap[docId] || {};
      const relatedIds = pData.relatedOrderIds || [];
      const buyerName = pData.user || pData.buyerName;

      try {
        if (newStatus === 'error') {
          const reason = prompt("請輸入對帳問題原因：");
          if (reason !== null) { 
            await updateDoc(doc(db, "payments", docId), { status: 'error', errorNote: reason, checkDate: today });
            await syncOrdersStatus(relatedIds, buyerName, false, '對帳有問題', reason);
          }
        } else {
          await updateDoc(doc(db, "payments", docId), { status: 'ok', errorNote: '', checkDate: today });
          await syncOrdersStatus(relatedIds, buyerName, true, '已對帳', '');
        }
      } catch (err) {
        alert('更新失敗: ' + err.message);
      }
    };

    window.editErrorNote = async (docId, oldNote) => {
      const reason = prompt("修改問題原因：", oldNote);
      if (reason !== null) { 
        await updateDoc(doc(db, "payments", docId), { errorNote: reason });
        const pData = paymentDataMap[docId] || {};
        await syncOrdersStatus(pData.relatedOrderIds || [], pData.user || pData.buyerName, false, '對帳有問題', reason);
      }
    };

    window.deletePayment = async (docId) => {
      if (confirm('確定要刪除這筆匯款審核紀錄嗎？刪除後對應訂單將還原為待匯款。')) { 
        const pData = paymentDataMap[docId] || {};
        const relatedIds = pData.relatedOrderIds || [];
        const buyerName = pData.user || pData.buyerName;

        try {
          await deleteDoc(doc(db, "payments", docId));
          await syncOrdersStatus(relatedIds, buyerName, false, '待匯款', '');
          alert('已刪除審核紀錄並還原訂單狀態。');
        } catch (err) {
          alert('刪除失敗: ' + err.message);
        }
      }
    };

    async function syncOrdersStatus(relatedIds, buyerName, isPaid, statusText, errorNote = '') {
      const updateData = {
        hasPaid: isPaid,
        paymentStatus: statusText,
        status: statusText,
        errorNote: errorNote
      };

      if (relatedIds && relatedIds.length > 0) {
        const updatePromises = relatedIds.map(id => updateDoc(doc(db, "orders", id), updateData));
        await Promise.all(updatePromises);
      } else if (buyerName) {
        const q = query(collection(db, "orders"), where("user", "==", buyerName));
        const snap = await getDocs(q);
        const updatePromises = [];
        snap.forEach(d => {
          updatePromises.push(updateDoc(doc(db, "orders", d.id), updateData));
        });
        await Promise.all(updatePromises);
      }
    }

    function notifyHeight() {
      setTimeout(() => {
        window.parent.postMessage({ frameHeight: document.body.scrollHeight }, '*');
      }, 100);
    }
  </script>
</body>
</html>
