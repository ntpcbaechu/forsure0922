<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>匯款對帳審核</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 0; margin: 0; background: #fff; color: #333; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    th, td { padding: 10px; border-bottom: 1px solid #e4e7ed; text-align: left; font-size: 13px; }
    th { background: #f8f9fa; }
    input { padding: 4px 6px; border: 1px solid #dcdfe6; border-radius: 4px; font-size: 13px; }
    .status-err { color: #f56c6c; font-weight: bold; cursor: pointer; text-decoration: underline; margin-top: 4px; }
    .btn-toggle { padding: 4px 8px; border-radius: 4px; font-size: 12px; cursor: pointer; border: 1px solid #dcdfe6; background: #fff; }
    .btn-toggle.ok-active { background: #e1f3d8; color: #67c23a; border-color: #67c23a; font-weight: bold; }
    .btn-toggle.err-active { background: #fef0f0; color: #f56c6c; border-color: #f56c6c; font-weight: bold; }
    .btn-danger { background-color: #f56c6c; color: white; padding: 4px 8px; font-size: 12px; border-radius: 4px; border: none; cursor: pointer; }
    .btn-edit-pay { background: none; border: none; color: #409eff; cursor: pointer; font-size: 12px; text-decoration: underline; padding: 0; margin-left: 4px; }
  </style>
</head>
<body>

  <h3>匯款登記與對帳管理</h3>
  <table>
    <thead>
      <tr>
        <th>社群名稱</th>
        <th>活動/張數</th>
        <th>應匯金額 (可修正)</th>
        <th>後五碼</th>
        <th>對帳金額</th>
        <th>對帳日期</th>
        <th>對帳狀態</th>
        <th>操作</th>
      </tr>
    </thead>
    <tbody id="payTable"></tbody>
  </table>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, doc, deleteDoc, updateDoc, onSnapshot, getDocs, query, where } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDF7QySG1Jj4gdZvXwMRaKjRmI-lFKpj7k",
      authDomain: "forsure0922.firebaseapp.com",
      databaseURL: "https://forsure0922-default-rtdb.firebaseio.com",
      projectId: "forsure0922",
      storageBucket: "forsure0922.firebasestorage.app",
      messagingSenderId: "817449290174",
      appId: "1:817449290174:web:6b4ec1d36c171ff97011ef"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let paymentDataMap = {}; // 快取 payments 資料

    onSnapshot(collection(db, "payments"), snap => {
      const tb = document.getElementById('payTable');
      tb.innerHTML = '';
      paymentDataMap = {};

      snap.forEach(d => {
        const p = d.data();
        const docId = d.id;
        paymentDataMap[docId] = p;

        const status = p.status || 'pending';
        const noteErr = p.errorNote || '';
        const checkDate = p.checkDate || '';
        const actualAmt = p.actualAmt !== undefined ? p.actualAmt : (p.finalPay || p.amount || 0);

        const userName = p.user || p.buyerName || '-';
        const socialName = p.social || p.socialAccount || '-';
        const eventInfo = p.eventName || p.event || '多筆關聯訂單';
        const qtyInfo = p.qty !== undefined ? `${p.qty} 張` : '';
        const finalPayAmt = p.finalPay !== undefined ? p.finalPay : (p.amount || 0);

        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td><b>${userName}</b><br><small style="color:#909399;">${socialName}</small></td>
          <td>${eventInfo}<br>${qtyInfo}</td>
          <td>
            <b style="color:#f56c6c;">$${finalPayAmt}</b>
            <button class="btn-edit-pay" onclick="editFinalPay('${docId}', ${finalPayAmt})">✏️修正</button>
            ${p.creditUsed > 0 ? `<br><small style="color:#67c23a;">(折抵$${p.creditUsed})</small>` : ''}
          </td>
          <td><b>${p.bankLast5 || p.last5 || '-'}</b></td>
          <td><input type="number" style="width:70px;" value="${actualAmt}" onchange="updatePayField('${docId}', 'actualAmt', parseInt(this.value))"></td>
          <td><input type="date" value="${checkDate}" onchange="updatePayField('${docId}', 'checkDate', this.value)"></td>
          <td>
            <button class="btn-toggle ${status === 'ok' ? 'ok-active' : ''}" onclick="setPayStatus('${docId}', 'ok')">🟢 已對帳</button>
            <button class="btn-toggle ${status === 'error' ? 'err-active' : ''}" onclick="setPayStatus('${docId}', 'error')">🔴 有問題</button>
            ${status === 'error' ? `<div class="status-err" onclick="editErrorNote('${docId}', '${noteErr}')">原因: ${noteErr || '點擊填寫'}</div>` : ''}
          </td>
          <td><button class="btn-danger" onclick="deletePayment('${docId}')">刪除</button></td>
        `;
        tb.appendChild(tr);
      });
      notifyHeight();
    });

    // 修正團員填錯的應匯金額
    window.editFinalPay = async (docId, currentPay) => {
      const newPayStr = prompt(`請輸入修正後的正確應匯金額（目前為 $${currentPay}）：`, currentPay);
      if (newPayStr === null || newPayStr.trim() === '') return;
      const newPay = parseFloat(newPayStr) || 0;

      try {
        await updateDoc(doc(db, "payments", docId), {
          finalPay: newPay,
          amount: newPay,
          actualAmt: newPay
        });
        alert('✅ 應匯金額已成功修正！');
      } catch (err) {
        alert('修正失敗: ' + err.message);
      }
    };

    window.updatePayField = async (docId, field, val) => { await updateDoc(doc(db, "payments", docId), { [field]: val }); };

    // 關鍵修復：改對帳狀態時同步更新 orders 集合！
    window.setPayStatus = async (docId, newStatus) => {
      const today = new Date().toISOString().slice(0,10);
      const pData = paymentDataMap[docId] || {};
      const relatedIds = pData.relatedOrderIds || [];
      const buyerName = pData.user || pData.buyerName;

      try {
        if (newStatus === 'error') {
          const reason = prompt("請輸入對帳問題原因：");
          if (reason !== null) { 
            await updateDoc(doc(db, "payments", docId), { status: 'error', errorNote: reason, checkDate: today });
            await syncOrdersStatus(relatedIds, buyerName, false, 'pending_payment');
          }
        } else {
          await updateDoc(doc(db, "payments", docId), { status: 'ok', errorNote: '', checkDate: today });
          await syncOrdersStatus(relatedIds, buyerName, true, '已對帳');
        }
      } catch (err) {
        alert('更新失敗: ' + err.message);
      }
    };

    window.editErrorNote = async (docId, oldNote) => {
      const reason = prompt("修改問題原因：", oldNote);
      if (reason !== null) { await updateDoc(doc(db, "payments", docId), { errorNote: reason }); }
    };

    // 關鍵修復：刪除審核紀錄時，同步將 orders 集合還原為待匯款！
    window.deletePayment = async (docId) => {
      if (confirm('確定要刪除這筆匯款審核紀錄嗎？刪除後對應訂單將還原為待匯款。')) { 
        const pData = paymentDataMap[docId] || {};
        const relatedIds = pData.relatedOrderIds || [];
        const buyerName = pData.user || pData.buyerName;

        try {
          await deleteDoc(doc(db, "payments", docId));
          await syncOrdersStatus(relatedIds, buyerName, false, 'pending_payment');
          alert('已刪除審核紀錄並還原訂單狀態。');
        } catch (err) {
          alert('刪除失敗: ' + err.message);
        }
      }
    };

    // 同步 orders 資料庫狀態的輔助函式
    async function syncOrdersStatus(relatedIds, buyerName, isPaid, statusText) {
      if (relatedIds && relatedIds.length > 0) {
        // 若有明確關聯的 order ID，直接更新
        const updatePromises = relatedIds.map(id => updateDoc(doc(db, "orders", id), {
          hasPaid: isPaid,
          paymentStatus: statusText,
          status: statusText
        }));
        await Promise.all(updatePromises);
      } else if (buyerName) {
        // 若無 ID，依照 buyerName 搜尋更新
        const q = query(collection(db, "orders"), where("user", "==", buyerName));
        const snap = await getDocs(q);
        const updatePromises = [];
        snap.forEach(d => {
          updatePromises.push(updateDoc(doc(db, "orders", d.id), {
            hasPaid: isPaid,
            paymentStatus: statusText,
            status: statusText
          }));
        });
        await Promise.all(updatePromises);
      }
    }

    function notifyHeight() {
      setTimeout(() => {
        window.parent.postMessage({ frameHeight: document.body.scrollHeight }, '*');
      }, 100);
    }
  </script>

</body>
</html>
