<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>活動單價與成本設定</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 0; margin: 0; background: #fff; color: #333; }
    table { width: 100%; border-collapse: collapse; margin-top: 15px; }
    th, td { padding: 10px 8px; border-bottom: 1px solid #e4e7ed; text-align: left; font-size: 13px; vertical-align: top; }
    th { background: #f8f9fa; color: #606266; font-weight: bold; white-space: nowrap; }
    input, select, button, textarea { padding: 8px 10px; border: 1px solid #dcdfe6; border-radius: 6px; font-size: 13px; box-sizing: border-box; transition: border-color 0.2s; }
    input:focus, select:focus, textarea:focus { border-color: #409eff; outline: none; }
    button { background-color: #409eff; color: white; border: none; font-weight: bold; cursor: pointer; }
    .btn-danger { background-color: #f56c6c; color: white; padding: 4px 8px; font-size: 12px; border-radius: 4px; border: none; cursor: pointer; }
    .btn-edit { background-color: #e6a23c; color: white; padding: 4px 8px; font-size: 12px; border-radius: 4px; border: none; cursor: pointer; margin-right: 4px; }

    /* 表單卡片分區美化 */
    .form-section { background: #f8f9fa; border: 1px solid #ebeef5; border-radius: 8px; padding: 12px 15px; margin-bottom: 10px; }
    .form-section-title { font-size: 13px; font-weight: bold; color: #409eff; margin-bottom: 8px; display: flex; align-items: center; justify-content: space-between; }
    .form-row { display: grid; gap: 10px; margin-bottom: 8px; }
    .row-5 { grid-template-columns: 1fr 1.5fr 1.5fr 1.5fr 1.5fr; }
    .row-3 { grid-template-columns: 1fr 1fr 1fr; }
    .row-discount { display: flex; align-items: center; gap: 8px; margin-top: 6px; }

    /* 方案二新增：活動場次開頭標籤列 (區分活動起點) */
    .event-group-header {
      background: #eef5fe;
      border-left: 4px solid #409eff;
      color: #2c3e50;
      font-size: 14px;
      font-weight: bold;
      padding: 10px 12px;
      margin-top: 25px;
      border-radius: 0 6px 6px 0;
    }

    /* 美化標籤與表格文字 */
    .tag-qty { background: #f4f4f5; color: #909399; padding: 1px 5px; border-radius: 4px; font-size: 11px; display: inline-block; margin-bottom: 2px; }
    .tag-discount { background: #fdf6ec; color: #e6a23c; border: 1px solid #faebd7; padding: 1px 5px; border-radius: 4px; font-size: 11px; display: inline-block; }
    .sub-info { font-size: 12px; color: #606266; line-height: 1.4; }
    .divider-line { border-top: 1px dashed #dcdfe6; margin: 3px 0; }
    .closed-tag { background: #f4f4f5; color: #909399; padding: 2px 6px; border-radius: 4px; font-size: 11px; margin-left: 6px; }

    /* 備註框：標題第一行，內容第二行縮排 */
    .minimal-note-box { 
      border-left: 3px solid #e6a23c; 
      padding: 6px 12px; 
      font-size: 13px; 
      color: #606266; 
      margin: 6px 0 12px 0; 
      line-height: 1.6; 
      background: #fdf6ec;
      border-radius: 0 6px 6px 0;
    }
    .minimal-note-title { font-weight: bold; color: #e6a23c; margin-bottom: 2px; }
    .minimal-note-content { white-space: pre-wrap; word-break: break-all; }

    /* 自動高 textarea 樣式 */
    .auto-textarea { width: 100%; min-height: 70px; resize: none; overflow-y: hidden; line-height: 1.5; }

    /* 結算卡片：移除混淆底部綠線，拉大下留白 (50px) 區隔下一場 */
    .summary-card { 
      background: #f0f9eb; 
      border: 1px solid #e1f3d8; 
      border-radius: 8px; 
      padding: 14px; 
      font-size: 13px; 
      margin: 8px 0 50px 0; 
      box-shadow: 0 2px 8px rgba(0,0,0,0.02);
    }
    .summary-title { font-weight: bold; color: #67c23a; margin-bottom: 10px; font-size: 14px; }
    .summary-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 15px; border-top: 1px dashed #c0c4cc; padding-top: 10px; }
    .summary-col { display: flex; flex-direction: column; gap: 4px; }

    @media (max-width: 768px) {
      .row-5, .row-3 { grid-template-columns: 1fr; }
      .summary-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <h3>設定活動單價與利潤分析</h3>
  <form id="eventForm" style="margin-bottom:15px;">
    <input type="hidden" id="editEventId">

    <!-- 卡片 1: 基本資料 -->
    <div class="form-section">
      <div class="form-section-title">📝 1. 活動與代拍基本資料</div>
      <div class="form-row row-5">
        <div><label style="font-size:12px;">日期 (例: 260725)</label><input type="text" id="evDate" placeholder="260725" style="width:100%;"></div>
        <div><label style="font-size:12px;">活動名稱 (例: RUN IT)</label><input type="text" id="evName" placeholder="RUN IT (Day1)" required style="width:100%;"></div>
        <div>
          <label style="font-size:12px;">成員</label>
          <select id="evMember" required style="width:100%;">
            <option value="">載入成員中...</option>
          </select>
        </div>
        <div><label style="font-size:12px;">代拍 (例: 站姐A)</label><input type="text" id="evSeller" placeholder="代拍名稱" style="width:100%;"></div>
        <div><label style="font-size:12px;">單筆備註</label><input type="text" id="evNote" placeholder="單筆備註..." style="width:100%;"></div>
      </div>
      <div>
        <label style="font-size:12px;">備註 / 特別注意事項</label>
        <textarea id="evBigNote" class="auto-textarea" placeholder="在此輸入備註 (打字或換行時框框會自動向下展延)..."></textarea>
      </div>
    </div>

    <!-- 卡片 2: 販售規格與折扣設定 -->
    <div class="form-section">
      <div class="form-section-title">
        <span>🏷️ 2. 販售規格與折扣售價設定</span>
        <button type="button" id="addDiscountBtn" style="background:#67c23a; font-size:12px; padding:4px 8px;">+ 新增折扣售價</button>
      </div>
      <div class="form-row row-3">
        <div><label style="font-size:12px;">每包數量(張)</label><input type="number" id="evPackQty" placeholder="張數" style="width:100%;"></div>
        <div><label style="font-size:12px;">每包原價 ($)</label><input type="number" step="0.1" min="0" id="evPrice" placeholder="單價" style="width:100%;"></div>
        <div><label style="font-size:12px;">總拆包數</label><input type="number" id="evPacksCount" placeholder="包數" style="width:100%;"></div>
      </div>
      <div id="discountContainer"></div>
    </div>

    <!-- 卡片 3: 購入成本與收到檔案 -->
    <div class="form-section">
      <div class="form-section-title">💸 3. 購入成本與收到檔案</div>
      <div class="form-row row-3">
        <div><label style="font-size:12px;">購入訂金 ($)</label><input type="number" id="evDeposit" placeholder="訂金" style="width:100%;"></div>
        <div><label style="font-size:12px;">購入尾款 ($)</label><input type="number" id="evBalance" placeholder="尾款" style="width:100%;"></div>
        <div><label style="font-size:12px;">購入總金額 ($)</label><input type="number" id="evCost" placeholder="自動計算" style="width:100%;"></div>
      </div>
      <div class="form-row row-3" style="margin-bottom:0; align-items:center;">
        <div><label style="font-size:12px;">收到照片(張)</label><input type="number" id="evActPhoto" placeholder="照片張數" style="width:100%;"></div>
        <div><label style="font-size:12px;">收到影片(檔/張)</label><input type="number" id="evActVideo" placeholder="影片張數" style="width:100%;"></div>
        <div style="display:flex; align-items:center; gap:6px; margin-top:12px;">
          <input type="checkbox" id="evIsClosed" style="width:auto; margin:0;">
          <label for="evIsClosed" style="font-size:13px; font-weight:bold; color:#f56c6c; cursor:pointer;">關閉/結團 (隱藏選單)</label>
        </div>
      </div>
    </div>

    <button type="submit" id="saveEventBtn" style="width:100%; padding:10px; font-size:15px;">儲存活動設定</button>
    <button type="button" id="cancelEditBtn" style="background:#909399; width:100%; padding:10px; margin-top:5px; display:none;" onclick="resetEventForm()">取消編輯</button>
  </form>

  <table>
    <thead>
      <tr>
        <th>活動全名</th>
        <th>成員</th>
        <th>代拍/備註</th>
        <th>每包與折扣規格</th>
        <th>已登記</th>
        <th>預估銷售與利潤</th>
        <th>購入成本</th>
        <th>實際收到</th>
        <th>操作</th>
      </tr>
    </thead>
    <tbody id="eventTable"></tbody>
  </table>

  <div id="eventSummaryBox"></div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, doc, setDoc, deleteDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDF7QySG1Jj4gdZvXwMRaKjRmI-lFKpj7k",
      authDomain: "forsure0922.firebaseapp.com",
      databaseURL: "https://forsure0922-default-rtdb.firebaseio.com",
      projectId: "forsure0922",
      storageBucket: "forsure0922.firebasestorage.app",
      messagingSenderId: "817449290174",
      appId: "1:817449290174:web:6b4ec1d36c171ff97011ef"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const MEMBER_ORDER = ["方燦", "Lee Know", "彰彬", "鉉辰", "HAN", "Felix", "昇玟", "I.N"];

    let ordersList = [];
    let eventsDataMap = {};

    const bigNoteArea = document.getElementById('evBigNote');
    function adjustTextareaHeight(el) {
      el.style.height = 'auto';
      el.style.height = (el.scrollHeight < 70 ? 70 : el.scrollHeight + 4) + 'px';
      notifyHeight();
    }
    bigNoteArea.addEventListener('input', () => adjustTextareaHeight(bigNoteArea));

    const depositEl = document.getElementById('evDeposit');
    const balanceEl = document.getElementById('evBalance');
    const costEl = document.getElementById('evCost');
    function calcTotalCost() {
      const dep = Number(depositEl.value) || 0;
      const bal = Number(balanceEl.value) || 0;
      if (depositEl.value !== '' || balanceEl.value !== '') {
        costEl.value = dep + bal;
      }
    }
    depositEl.addEventListener('input', calcTotalCost);
    balanceEl.addEventListener('input', calcTotalCost);

    const discountContainer = document.getElementById('discountContainer');
    document.getElementById('addDiscountBtn').addEventListener('click', () => {
      addDiscountRow();
    });

    function addDiscountRow(count = '', price = '') {
      const div = document.createElement('div');
      div.className = 'row-discount';
      div.innerHTML = `
        <span style="font-size:12px; color:#e6a23c; font-weight:bold;">折扣階梯:</span>
        <input type="number" class="disc-count" placeholder="折扣包數" value="${count}" style="width:110px;"> 包 ×
        <input type="number" step="0.1" class="disc-price" placeholder="折扣單價" value="${price}" style="width:110px;"> 元
        <button type="button" class="btn-danger" style="padding:3px 8px;" onclick="this.parentElement.remove()">移除</button>
      `;
      discountContainer.appendChild(div);
    }

    document.addEventListener('DOMContentLoaded', () => {
      fetch('../json/members.json').then(res => res.json()).then(members => {
        const evMemberSel = document.getElementById('evMember');
        evMemberSel.innerHTML = '<option value="">請選擇成員</option>';
        members.forEach(m => {
          const opt = document.createElement('option');
          opt.value = m;
          opt.textContent = m;
          evMemberSel.appendChild(opt);
        });
      });
    });

    onSnapshot(collection(db, "orders"), snap => {
      ordersList = [];
      snap.forEach(d => ordersList.push(d.data()));
      loadEvents();
    });

    function loadEvents() {
      onSnapshot(collection(db, "event_settings"), snap => {
        const tb = document.getElementById('eventTable');
        tb.innerHTML = '';

        eventsDataMap = {};
        let eventsList = [];
        snap.forEach(d => {
          const data = { id: d.id, ...d.data() };
          eventsList.push(data);
          eventsDataMap[d.id] = data;
        });

        eventsList.sort((a, b) => {
          const nameA = a.rawDate || a.name;
          const nameB = b.rawDate || b.name;
          if (nameA !== nameB) return nameA.localeCompare(nameB);

          const idxA = MEMBER_ORDER.indexOf(a.member);
          const idxB = MEMBER_ORDER.indexOf(b.member);
          return (idxA === -1 ? 99 : idxA) - (idxB === -1 ? 99 : idxB);
        });

        const groupedEvents = {};
        eventsList.forEach(ev => {
          const mName = ev.member || '全體/無';
          const groupKey = `${ev.name}__${mName}`;
          if (!groupedEvents[groupKey]) {
            groupedEvents[groupKey] = [];
          }
          groupedEvents[groupKey].push(ev);
        });

        for (const [groupKey, evArray] of Object.entries(groupedEvents)) {
          let memberTotalCost = 0;
          let memberTotalActPhoto = 0;
          let memberTotalActVideo = 0;
          let memberTotalActQty = 0;
          const eventName = evArray[0].name;
          const memberName = evArray[0].member || '全體/無';
          const isClosed = evArray.some(e => e.isClosed);

          // 1. 在活動起點插入「活動場次標籤 Header」
          const headerTr = document.createElement('tr');
          headerTr.innerHTML = `
            <td colspan="9" style="padding:0; border-bottom:none;">
              <div class="event-group-header">
                🗓️ 活動場次：${eventName} - <span style="color:#409eff;">${memberName}</span> (${evArray.length} 筆代拍紀錄)
              </div>
            </td>
          `;
          tb.appendChild(headerTr);

          const sampleEv = evArray[0];
          const matchedOrders = ordersList.filter(o => {
            const matchEvent = (o.event === sampleEv.name || o.event === sampleEv.rawName || o.fullEvent === sampleEv.name);
            const matchMember = !sampleEv.member || o.member === sampleEv.member;
            return matchEvent && matchMember;
          });

          const totalOrderedCards = matchedOrders.reduce((sum, o) => {
            const qty = Number(o.qty !== undefined ? o.qty : (o.quantity !== undefined ? o.quantity : o.count)) || 0;
            return sum + qty;
          }, 0);

          const packSize = sampleEv.packQty && sampleEv.packQty > 0 ? sampleEv.packQty : 1;
          const totalOrderedPacks = totalOrderedCards / packSize;

          let realTotalRevenue = 0;
          let remainingPacks = totalOrderedPacks;
          const discounts = sampleEv.discounts || [];

          let discountTextList = [];
          discounts.forEach(d => {
            const dCount = Math.min(remainingPacks, Number(d.count) || 0);
            if (dCount > 0) {
              realTotalRevenue += dCount * (Number(d.price) || 0);
              remainingPacks -= dCount;
              discountTextList.push(`折扣:${d.count}包($${d.price})`);
            }
          });
          if (remainingPacks > 0) {
            realTotalRevenue += remainingPacks * (sampleEv.price || 0);
          }

          const latestBigNote = evArray.map(e => e.bigNote).filter(Boolean).pop() || '';

          evArray.forEach((ev, idx) => {
            const docId = ev.id;
            const closedBadge = ev.isClosed ? '<span class="closed-tag">🚫 已關閉</span>' : '';
            const mName = ev.member || '全體/無';

            const estRevenue = realTotalRevenue;

            const totalCost = (ev.deposit !== undefined || ev.balance !== undefined)
              ? ((ev.deposit || 0) + (ev.balance || 0))
              : (ev.cost || 0);

            const singleProfit = estRevenue - totalCost;
            const profitColor = singleProfit >= 0 ? '#67c23a' : '#f56c6c';

            const actPhoto = ev.actPhoto || 0;
            const actVideo = ev.actVideo || 0;
            const totalAct = (ev.actPhoto !== undefined || ev.actVideo !== undefined)
              ? (actPhoto + actVideo)
              : (ev.actQty || 0);

            memberTotalCost += totalCost;
            memberTotalActPhoto += actPhoto;
            memberTotalActVideo += actVideo;
            memberTotalActQty += totalAct;

            const discountDisplay = discountTextList.length > 0
              ? `<div class="tag-discount">${discountTextList.join(' · ')}</div>`
              : '';

            const tr = document.createElement('tr');
            tr.innerHTML = `
              <td><b>${ev.name}</b>${closedBadge}</td>
              <td><b>${mName}</b></td>
              <td>
                <div><b>${ev.seller || '未填寫'}</b></div>
                <div class="sub-info">${ev.note ? '單筆: ' + ev.note : '-'}</div>
              </td>
              <td>
                <span class="tag-qty">${ev.packQty || 0}張/包</span>
                <div class="sub-info">原價: $${ev.price || 0}/包 (拆${ev.packsCount || 0}包)</div>
                ${discountDisplay}
              </td>
              <td>
                <div style="font-weight:bold;">${totalOrderedCards} 張</div>
                <div class="sub-info">(${totalOrderedPacks.toFixed(1).replace(/\.0$/, '')} 包)</div>
              </td>
              <td>
                <div>銷售: <b style="color:#409eff;">$${estRevenue.toFixed(1).replace(/\.0$/, '')}</b></div>
                <div>利潤: <b style="color:${profitColor};">$${singleProfit.toFixed(1).replace(/\.0$/, '')}</b></div>
              </td>
              <td>
                <div class="sub-info">訂: $${ev.deposit || 0} &nbsp; 尾: $${ev.balance || 0}</div>
                <div class="divider-line"></div>
                <div><b>總價: $${totalCost}</b></div>
              </td>
              <td>
                <div class="sub-info">📷 ${actPhoto} 照 &nbsp; 🎬 ${actVideo} 影</div>
                <div class="divider-line"></div>
                <div><b>總計: ${totalAct} 張</b></div>
              </td>
              <td>
                <button class="btn-edit" data-id="${docId}">編輯</button>
                <button class="btn-danger" data-id="${docId}">刪除</button>
              </td>
            `;

            tr.querySelector('.btn-edit').onclick = () => editEventById(docId);
            tr.querySelector('.btn-danger').onclick = () => deleteEvent(docId);
            tb.appendChild(tr);

            // 2. 備註對齊調整：第一行獨立標題，第二行內容換行
            if (idx === evArray.length - 1 && latestBigNote) {
              const noteTr = document.createElement('tr');
              noteTr.innerHTML = `
                <td colspan="9" style="padding: 2px 0 6px 0; border-bottom: none;">
                  <div class="minimal-note-box">
                    <div class="minimal-note-title">📌 備註：</div>
                    <div class="minimal-note-content">${latestBigNote}</div>
                  </div>
                </td>
              `;
              tb.appendChild(noteTr);
            }
          });

          // 3. 結算卡片（綠框）：移除底部綠線，加大 margin-bottom 留白 50px
          const estProfit = realTotalRevenue - memberTotalCost;

          const summaryTr = document.createElement('tr');
          summaryTr.innerHTML = `
            <td colspan="9" style="padding: 0; border-bottom: none;">
              <div class="summary-card">
                <div class="summary-title">📊 成員活動總結算：${eventName} - <span style="color:#409eff;">${memberName}</span> (${evArray.length} 筆代拍紀錄)${isClosed ? ' [已結團關閉]' : ''}</div>
                <div class="summary-grid">
                  <div class="summary-col">
                    <div style="font-weight:bold; color:#409eff;">🛍️ 銷售數據</div>
                    <div>登記總量：<b>${totalOrderedCards} 張 (${totalOrderedPacks.toFixed(1).replace(/\.0$/, '')} 包)</b></div>
                    <div>預估總銷售額：<b>$${realTotalRevenue.toFixed(1).replace(/\.0$/, '')}</b></div>
                  </div>
                  <div class="summary-col">
                    <div style="font-weight:bold; color:#e6a23c;">💸 成本與真實利潤</div>
                    <div>總購入成本：<b>$${memberTotalCost}</b></div>
                    <div>🔥 預估全團利潤：<b style="color:${estProfit >= 0 ? '#67c23a' : '#f56c6c'};">$${estProfit.toFixed(1).replace(/\.0$/, '')}</b></div>
                  </div>
                  <div class="summary-col">
                    <div style="font-weight:bold; color:#67c23a;">📁 收到檔案資料</div>
                    <div>收到照片：<b>${memberTotalActPhoto} 張</b></div>
                    <div>收到影片：<b>${memberTotalActVideo} 檔 (共 ${memberTotalActQty} 張)</b></div>
                  </div>
                </div>
              </div>
            </td>
          `;
          tb.appendChild(summaryTr);
        }

        notifyHeight();
      });
    }

    document.getElementById('eventForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const saveBtn = document.getElementById('saveEventBtn');
      saveBtn.disabled = true;
      saveBtn.textContent = '儲存中...';

      try {
        const evDate = document.getElementById('evDate').value.trim();
        const evNameRaw = document.getElementById('evName').value.trim();
        const member = document.getElementById('evMember').value;
        const seller = document.getElementById('evSeller').value.trim();
        const note = document.getElementById('evNote').value.trim();
        const bigNote = document.getElementById('evBigNote').value.trim();

        const packQty = parseInt(document.getElementById('evPackQty').value) || 0;
        const price = parseFloat(document.getElementById('evPrice').value) || 0;
        const packsCount = parseInt(document.getElementById('evPacksCount').value) || 0;

        const discCounts = document.querySelectorAll('.disc-count');
        const discPrices = document.querySelectorAll('.disc-price');
        let discounts = [];
        discCounts.forEach((el, i) => {
          const count = parseInt(el.value) || 0;
          const p = parseFloat(discPrices[i].value) || 0;
          if (count > 0) {
            discounts.push({ count, price: p });
          }
        });

        const deposit = parseFloat(document.getElementById('evDeposit').value) || 0;
        const balance = parseFloat(document.getElementById('evBalance').value) || 0;
        const inputCost = parseFloat(document.getElementById('evCost').value);
        const cost = !isNaN(inputCost) ? inputCost : (deposit + balance);

        const actPhoto = parseInt(document.getElementById('evActPhoto').value) || 0;
        const actVideo = parseInt(document.getElementById('evActVideo').value) || 0;
        const actQty = actPhoto + actVideo;

        const isClosed = document.getElementById('evIsClosed').checked;

        const fullName = evDate ? `${evDate} ${evNameRaw}` : evNameRaw;
        const editId = document.getElementById('editEventId').value;
        const docId = editId ? editId : `${fullName}_${member || 'all'}_${seller || 'default'}_${Date.now()}`;

        await setDoc(doc(db, "event_settings", docId), {
          name: fullName, rawDate: evDate, rawName: evNameRaw, member, seller, note, bigNote,
          packQty, price, packsCount, discounts, deposit, balance, cost, actPhoto, actVideo, actQty, isClosed
        });

        alert('✅ 活動設定與金額張數已成功更新！');
        resetEventForm();
      } catch (err) {
        alert('儲存失敗：' + err.message);
      } finally {
        saveBtn.disabled = false;
        saveBtn.textContent = '儲存活動設定';
      }
    });

    window.resetEventForm = () => {
      document.getElementById('eventForm').reset();
      document.getElementById('editEventId').value = '';
      discountContainer.innerHTML = '';
      document.getElementById('evIsClosed').checked = false;
      document.getElementById('cancelEditBtn').style.display = 'none';
      document.getElementById('saveEventBtn').textContent = '儲存活動設定';
      adjustTextareaHeight(bigNoteArea);
    };

    function editEventById(docId) {
      const ev = eventsDataMap[docId];
      if (!ev) return alert('找不到該筆活動資料！');

      document.getElementById('editEventId').value = docId;
      document.getElementById('evDate').value = ev.rawDate || '';
      document.getElementById('evName').value = ev.rawName || ev.name;
      document.getElementById('evMember').value = ev.member || '';
      document.getElementById('evSeller').value = ev.seller || '';
      document.getElementById('evNote').value = ev.note || '';
      document.getElementById('evBigNote').value = ev.bigNote || '';
      adjustTextareaHeight(bigNoteArea);

      document.getElementById('evPackQty').value = ev.packQty !== undefined ? ev.packQty : '';
      document.getElementById('evPrice').value = ev.price !== undefined ? ev.price : '';
      document.getElementById('evPacksCount').value = ev.packsCount !== undefined ? ev.packsCount : '';

      discountContainer.innerHTML = '';
      if (ev.discounts && Array.isArray(ev.discounts)) {
        ev.discounts.forEach(d => addDiscountRow(d.count, d.price));
      }

      document.getElementById('evDeposit').value = ev.deposit !== undefined ? ev.deposit : '';
      document.getElementById('evBalance').value = ev.balance !== undefined ? ev.balance : '';
      document.getElementById('evCost').value = ev.cost !== undefined ? ev.cost : '';

      document.getElementById('evActPhoto').value = ev.actPhoto !== undefined ? ev.actPhoto : '';
      document.getElementById('evActVideo').value = ev.actVideo !== undefined ? ev.actVideo : '';

      document.getElementById('evIsClosed').checked = (ev.isClosed === true);

      document.getElementById('cancelEditBtn').style.display = 'inline-block';
      document.getElementById('saveEventBtn').textContent = '更新此活動設定';

      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    async function deleteEvent(docId) {
      if (confirm(`確定要刪除這筆活動設定嗎？`)) {
        await deleteDoc(doc(db, "event_settings", docId));
        alert('已刪除');
      }
    }

    function notifyHeight() {
      setTimeout(() => {
        window.parent.postMessage({ frameHeight: document.body.scrollHeight }, '*');
      }, 100);
    }
  </script>

</body>
</html>
