<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>對帳審核管理</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 15px; margin: 0; background: #fff; color: #333; }
    h3 { margin-top: 0; margin-bottom: 15px; font-size: 18px; }
    
    .capsule-bar { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 15px; background: #f8f9fa; padding: 10px; border-radius: 8px; border: 1px solid #ebeef5; }
    .capsule-btn { background: #ecf5ff; color: #409eff; border: 1px solid #d9ecff; padding: 5px 12px; border-radius: 16px; font-size: 12px; font-weight: bold; cursor: pointer; transition: all 0.2s; }
    .capsule-btn:hover, .capsule-btn.active { background: #409eff; color: #fff; border-color: #409eff; }

    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 10px 8px; border-bottom: 1px solid #e4e7ed; text-align: left; font-size: 13px; vertical-align: top; }
    th { background: #f8f9fa; color: #606266; font-weight: bold; white-space: nowrap; }

    .btn-pass { background-color: #67c23a; color: white; border: none; padding: 5px 10px; font-size: 12px; border-radius: 4px; cursor: pointer; font-weight: bold; }
    .btn-danger { background-color: #f56c6c; color: white; border: none; padding: 5px 10px; font-size: 12px; border-radius: 4px; cursor: pointer; }

    .bank-check-card { margin-top: 6px; background: #fdfdfd; border: 1px solid #e4e7ed; border-radius: 6px; padding: 8px 10px; }
    .bank-input-row { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; background: #fff; border: 1px solid #ebeef5; padding: 4px 6px; border-radius: 4px; margin-bottom: 4px; }
    .btn-add-bank { background: #ecf5ff; color: #409eff; border: 1px solid #b3d8ff; padding: 2px 6px; border-radius: 4px; font-size: 11px; cursor: pointer; font-weight: bold; margin-top: 4px; }
    .btn-del-bank { background: #fef0f0; color: #f56c6c; border: 1px solid #fde2e2; border-radius: 4px; padding: 1px 5px; cursor: pointer; font-size: 11px; }

    .status-warning { color: #f56c6c; font-size: 11px; font-weight: bold; margin-top: 4px; display: block; }
    .status-ok-msg { color: #67c23a; font-size: 11px; font-weight: bold; margin-top: 4px; display: block; }
  </style>
</head>
<body>

  <h3>買家對帳紀錄與對帳管理 (Payments)</h3>

  <div class="capsule-bar" id="buyerCapsules">
    <button class="capsule-btn active" onclick="filterByUser('ALL', this)">👤 顯示全部買家</button>
  </div>

  <table>
    <thead>
      <tr>
        <th style="width: 15%;">買家社群暱稱</th>
        <th style="width: 48%;">申報資料與銀行對帳核對</th>
        <th style="width: 15%;">申報總金額</th>
        <th style="width: 12%;">狀態</th>
        <th style="width: 10%;">操作</th>
      </tr>
    </thead>
    <tbody id="paymentTableBody">
      <tr><td colspan="5" style="text-align:center; color:#909399; padding:20px;">載入對帳資料中...</td></tr>
    </tbody>
  </table>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, doc, updateDoc, deleteDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDF7QySG1Jj4gdZvXwMRaKjRmI-lFKpj7k",
      authDomain: "forsure0922.firebaseapp.com",
      databaseURL: "https://forsure0922-default-rtdb.firebaseio.com",
      projectId: "forsure0922",
      storageBucket: "forsure0922.firebasestorage.app",
      messagingSenderId: "817449290174",
      appId: "1:817449290174:web:6b4ec1d36c171ff97011ef"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let bankOptions = ['台銀', '樂天', '中信', '台新', '抵用金/儲值金'];
    let paymentsMap = {};
    let activeFilterUser = 'ALL';

    fetch('../json/banks.json')
      .then(res => res.json())
      .then(list => {
        bankOptions = list;
        renderTable();
      })
      .catch(() => { renderTable(); });

    document.addEventListener('DOMContentLoaded', () => {
      onSnapshot(collection(db, "payments"), snap => {
        paymentsMap = {};
        snap.forEach(d => {
          paymentsMap[d.id] = { id: d.id, ...d.data() };
        });
        updateUserCapsules();
        renderTable();
      });
    });

    function updateUserCapsules() {
      const activeUsers = new Set();
      Object.values(paymentsMap).forEach(p => {
        const u = p.user || p.buyerName;
        if (u) activeUsers.add(u);
      });

      const sortedUsers = Array.from(activeUsers).sort((a, b) => a.localeCompare(b, 'zh-TW'));
      const capsuleBox = document.getElementById('buyerCapsules');
      capsuleBox.innerHTML = `<button class="capsule-btn ${activeFilterUser === 'ALL' ? 'active' : ''}" onclick="filterByUser('ALL', this)">👤 顯示全部買家</button>`;
      
      sortedUsers.forEach(u => {
        capsuleBox.innerHTML += `<button class="capsule-btn ${activeFilterUser === u ? 'active' : ''}" onclick="filterByUser('${u}', this)">👤 ${u}</button>`;
      });
    }

    window.filterByUser = (uName, btnElem) => {
      activeFilterUser = uName;
      document.querySelectorAll('.capsule-btn').forEach(b => b.classList.remove('active'));
      if (btnElem) btnElem.classList.add('active');
      renderTable();
    };

    function renderTable() {
      const tb = document.getElementById('paymentTableBody');
      tb.innerHTML = '';

      let list = Object.values(paymentsMap);
      if (activeFilterUser !== 'ALL') {
        list = list.filter(p => (p.user === activeFilterUser || p.buyerName === activeFilterUser));
      }

      if (list.length === 0) {
        tb.innerHTML = '<tr><td colspan="5" style="text-align:center; color:#909399; padding:30px;">目前尚無對帳資料</td></tr>';
        notifyHeight();
        return;
      }

      list.sort((a, b) => new Date(b.createdAt || 0).getTime() - new Date(a.createdAt || 0).getTime());

      list.forEach(item => {
        const docId = item.id;
        const uName = item.user || item.buyerName || '-';
        const expectedAmt = Number(item.amount || item.finalPay) || 0;
        const expectedLast5 = item.last5 || item.bankLast5 || '-';
        const buyerBank = item.bankName || item.bank || '-';
        const payDate = item.payDate || (item.createdAt ? item.createdAt.slice(0,10) : '-');
        const isApproved = (item.status === '已對帳' || item.paymentStatus === '已對帳');

        // 預設如果沒有對帳紀錄，帶入買家申報的銀行（若買家也沒填，則維持為空選單）
        let inputs = item.bankInputs || [{ amt: expectedAmt || '', last5: expectedLast5 !== '-' ? expectedLast5 : '', bank: buyerBank !== '-' ? buyerBank : '', date: payDate !== '-' ? payDate : new Date().toISOString().slice(0,10) }];

        let totalInputAmt = 0;
        let hasAnyInput = false;
        inputs.forEach(inp => {
          if (inp.amt !== '' && !isNaN(parseFloat(inp.amt))) {
            totalInputAmt += parseFloat(inp.amt);
            hasAnyInput = true;
          }
        });

        let isMatch = false;
        let diffMsg = '';
        if (!hasAnyInput) {
          diffMsg = '⚠️ 請選擇銀行與核對實際對帳資料';
        } else if (totalInputAmt === expectedAmt) {
          isMatch = true;
          diffMsg = '🟢 對帳完全吻合 (實收 $' + totalInputAmt + ')';
        } else {
          diffMsg = '❌ 金額不符 (實收 $' + totalInputAmt + ' / 應收 $' + expectedAmt + ')';
        }

        let bankInputsHtml = '<div class="bank-check-card"><div style="font-weight:bold; font-size:11px; color:#409eff; margin-bottom:4px;">🏦 銀行實際對帳比對：</div>';
        inputs.forEach((inp, idx) => {
          let opts = '<option value="">請選擇銀行</option>' + bankOptions.map(b => `<option value="${b}" ${inp.bank === b ? 'selected' : ''}>${b}</option>`).join('');
          bankInputsHtml += `<div class="bank-input-row">
            <span style="font-weight:bold; color:#909399; font-size:11px;">#${idx+1}</span>
            金額: <input type="number" style="width:65px; padding:2px 4px;" value="${inp.amt}" onchange="updateBankInput('${docId}', ${idx}, 'amt', this.value === '' ? '' : parseFloat(this.value))">
            後五碼: <input type="text" style="width:60px; padding:2px 4px;" value="${inp.last5}" onchange="updateBankInput('${docId}', ${idx}, 'last5', this.value.trim())">
            銀行: <select style="padding:2px 4px;" onchange="updateBankInput('${docId}', ${idx}, 'bank', this.value)">${opts}</select>
            日期: <input type="date" style="padding:1px 3px;" value="${inp.date || ''}" onchange="updateBankInput('${docId}', ${idx}, 'date', this.value)">
            ${inputs.length > 1 ? `<button class="btn-del-bank" onclick="removeBankInput('${docId}', ${idx})">🗑️</button>` : ''}
          </div>`;
        });

        bankInputsHtml += `<button class="btn-add-bank" onclick="addBankInput('${docId}')">➕ 新增對帳筆數</button>
          <span class="${isMatch ? 'status-ok-msg' : 'status-warning'}">${diffMsg}</span>
        </div>`;

        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>
            <b>${uName}</b>
            ${item.socialAccount ? `<div style="font-size:11px; color:#909399;">IG/Threads: ${item.socialAccount}</div>` : ''}
          </td>
          <td>
            <div style="font-size:12px; color:#606266;">
              ⏱️ 匯款日期：<b>${payDate}</b> ｜ 申報銀行：<b>${buyerBank}</b> ｜ 後五碼：<b>${expectedLast5}</b>
            </div>
            ${item.note ? `<div style="font-size:11px; color:#e6a23c; margin-top:2px;">📝 備註：${item.note}</div>` : ''}
            ${bankInputsHtml}
          </td>
          <td><b style="color:#f56c6c; font-size:15px;">$${expectedAmt}</b></td>
          <td>
            <span style="font-size:12px; font-weight:bold; color:${isApproved ? '#67c23a' : '#e6a23c'};">
              ${isApproved ? '🟢 已審核通過' : '⏳ 待對帳'}
            </span>
          </td>
          <td>
            ${!isApproved ? `<button class="btn-pass" onclick="approvePayment('${docId}')">通過</button>` : '<span style="font-size:11px; color:#909399;">已完成</span>'}
            <button class="btn-danger" onclick="deletePayment('${docId}')" style="margin-top:4px;">刪除</button>
          </td>
        `;
        tb.appendChild(tr);
      });

      notifyHeight();
    }

    window.updateBankInput = async (docId, idx, key, val) => {
      const item = paymentsMap[docId];
      if (!item) return;
      let inputs = item.bankInputs || [{ amt: '', last5: '', bank: '', date: new Date().toISOString().slice(0,10) }];
      inputs[idx][key] = val;
      try { await updateDoc(doc(db, "payments", docId), { bankInputs: inputs }); } catch (err) { alert('更新失敗: ' + err.message); }
    };

    window.addBankInput = async (docId) => {
      const item = paymentsMap[docId];
      if (!item) return;
      let inputs = item.bankInputs || [{ amt: '', last5: '', bank: '', date: new Date().toISOString().slice(0,10) }];
      inputs.push({ amt: '', last5: '', bank: '', date: new Date().toISOString().slice(0,10) });
      try { await updateDoc(doc(db, "payments", docId), { bankInputs: inputs }); } catch (err) { alert('新增失敗: ' + err.message); }
    };

    window.removeBankInput = async (docId, idx) => {
      const item = paymentsMap[docId];
      if (!item) return;
      let inputs = item.bankInputs || [];
      inputs.splice(idx, 1);
      try { await updateDoc(doc(db, "payments", docId), { bankInputs: inputs }); } catch (err) { alert('刪除失敗: ' + err.message); }
    };

    window.approvePayment = async (docId) => {
      const item = paymentsMap[docId];
      if (!item) return;

      if (confirm(`確定要通過買家「${item.user || item.buyerName}」這筆對帳嗎？`)) {
        try {
          await updateDoc(doc(db, "payments", docId), { status: '已對帳', paymentStatus: '已對帳' });

          if (item.relatedOrderIds && Array.isArray(item.relatedOrderIds)) {
            const updatePromises = item.relatedOrderIds.map(orderId => {
              return updateDoc(doc(db, "orders", orderId), { status: '已付清', paymentStatus: '已付清' });
            });
            await Promise.all(updatePromises);
          }

          alert('✅ 對帳已審核通過！相關訂單狀態已自動轉為「已付清」。');
        } catch (err) {
          alert('審核失敗: ' + err.message);
        }
      }
    };

    window.deletePayment = async (docId) => {
      if (confirm('確定要刪除這筆對帳紀錄嗎？')) {
        await deleteDoc(doc(db, "payments", docId));
        alert('已刪除');
      }
    };

    function notifyHeight() {
      setTimeout(() => {
        window.parent.postMessage({ frameHeight: document.body.scrollHeight }, '*');
      }, 100);
    }
  </script>
</body>
</html>
