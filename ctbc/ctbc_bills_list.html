<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>買家結算單紀錄一覽表</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 15px; margin: 0; background: #f8fafc; color: #334155; }
    .header-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; flex-wrap: wrap; gap: 10px; }
    h2 { margin: 0; font-size: 18px; color: #0f172a; }
    
    .btn-danger { background: #fee2e2; color: #dc2626; border: 1px solid #fca5a5; padding: 6px 14px; border-radius: 6px; font-size: 13px; font-weight: bold; cursor: pointer; transition: 0.2s; }
    .btn-danger:hover { background: #fecaca; color: #b91c1c; }

    .card { background: #ffffff; padding: 16px; border-radius: 10px; box-shadow: 0 2px 6px rgba(0,0,0,0.04); border: 1px solid #e2e8f0; }
    
    .search-bar { display: flex; gap: 8px; margin-bottom: 12px; align-items: center; }
    .search-bar input { flex: 1; max-width: 300px; padding: 8px 12px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 13px; outline: none; }
    .search-bar input:focus { border-color: #3b82f6; }

    .stats-info { font-size: 12px; font-weight: bold; color: #64748b; margin-bottom: 10px; }

    table { width: 100%; border-collapse: collapse; font-size: 13px; background: #fff; border-radius: 8px; overflow: hidden; border: 1px solid #e2e8f0; }
    th { background: #f1f5f9; color: #334155; text-align: left; padding: 10px; border-bottom: 2px solid #e2e8f0; white-space: nowrap; }
    td { padding: 10px; border-bottom: 1px solid #e2e8f0; }
    tr:hover { background-color: #f8fafc; }

    .amt-text { color: #dc2626; font-weight: bold; }
    .pay-text { color: #16a34a; font-weight: bold; }
    .badge { background: #f1f5f9; color: #475569; padding: 2px 6px; border-radius: 4px; font-size: 11px; }

    .btn-delete { background: #fee2e2; color: #dc2626; border: 1px solid #fca5a5; border-radius: 4px; padding: 4px 8px; font-size: 12px; cursor: pointer; font-weight: bold; transition: 0.2s; width: 100%; text-align: center; }
    .btn-delete:hover { background: #fecaca; }
    
    .btn-settle { background: #dcfce3; color: #16a34a; border: 1px solid #bbf7d0; border-radius: 4px; padding: 4px 8px; font-size: 12px; cursor: pointer; font-weight: bold; transition: 0.2s; width: 100%; text-align: center; }
    .btn-settle:hover { background: #bbf7d0; }
  </style>
</head>
<body>

  <div class="header-row">
    <h2>📋 買家結算單 (填單紀錄) 一覽表</h2>
    <button class="btn-danger" onclick="wipeAllData()">🚨 一鍵清空所有紀錄</button>
  </div>

  <div class="card">
    <div class="search-bar">
      <input type="text" id="searchInput" placeholder="🔍 搜尋暱稱、場次、狀態或備註..." onkeyup="renderTable()">
    </div>
    
    <div class="stats-info" id="statsInfo">資料載入中...</div>

    <div style="overflow-x:auto;">
      <table>
        <thead>
          <tr>
            <th>建立時間</th>
            <th>買家暱稱</th>
            <th>匯款狀態</th>
            <th>團體 / 場次</th>
            <th>成員 / 張數</th>
            <th>應匯金額</th>
            <th>實匯 / 後5碼</th>
            <th>備註</th>
            <th style="width: 80px;">操作</th>
          </tr>
        </thead>
        <tbody id="billsTable"></tbody>
      </table>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, onSnapshot, doc, deleteDoc, getDocs, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDF7QySG1Jj4gdZvXwMRaKjRmI-lFKpj7k",
      authDomain: "forsure0922.firebaseapp.com",
      databaseURL: "https://forsure0922-default-rtdb.firebaseio.com",
      projectId: "forsure0922"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let billsData = [];

    document.addEventListener('DOMContentLoaded', () => {
      onSnapshot(collection(db, "ctbc_bills"), snap => {
        billsData = snap.docs.map(d => ({id: d.id, ...d.data()}));
        billsData.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
        window.renderTable();
      });
    });

    window.renderTable = () => {
      const tbody = document.getElementById('billsTable');
      tbody.innerHTML = '';
      const searchVal = document.getElementById('searchInput').value.toLowerCase();

      let filtered = billsData.filter(b => {
        if (!searchVal) return true;
        const combined = `${b.name} ${b.event} ${b.member} ${b.status} ${b.note} ${b.last5}`.toLowerCase();
        return combined.includes(searchVal);
      });

      filtered.forEach(b => {
        const dateStr = b.createdAt ? new Date(b.createdAt).toLocaleString('zh-TW', {month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit'}) : '-';
        
        let actionHtml = '';
        if(b.status === '已外部結算') {
          actionHtml = `
            <div style="display:flex; flex-direction:column; gap:6px;">
              <span style="font-size:11px; color:#16a34a; font-weight:bold; text-align:center;">✔ 已外結</span>
              <button class="btn-delete" onclick="deleteBill('${b.id}', '${b.name}')">❌ 刪除</button>
            </div>
          `;
        } else {
          actionHtml = `
            <div style="display:flex; flex-direction:column; gap:6px;">
              <button class="btn-settle" onclick="markExternalSettled('${b.id}', '${b.name}')">✅ 外部結帳</button>
              <button class="btn-delete" onclick="deleteBill('${b.id}', '${b.name}')">❌ 刪除</button>
            </div>
          `;
        }

        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td style="font-size: 11px; color: #64748b;">${dateStr}</td>
          <td style="font-weight: bold; color: #1d4ed8;">${b.name || '-'}</td>
          <td><span class="badge" style="${b.status==='已外部結算'?'background:#dcfce3;color:#16a34a;':''}">${b.status || '-'}</span></td>
          <td>${b.group || '-'} <br> <span style="font-size:11px; color:#64748b;">${b.event || '-'}</span></td>
          <td>${b.member || '-'} <br> <span style="font-size:11px; color:#64748b;">${b.qty ? b.qty+'張' : '-'}</span></td>
          <td class="amt-text">${b.expectedAmt ? '$'+b.expectedAmt : '-'}</td>
          <td>
            <span class="pay-text">${b.payAmt ? '$'+b.payAmt : '-'}</span> <br> 
            <span style="font-size:11px; color:#64748b;">${b.last5 ? '末5: '+b.last5 : ''}</span>
          </td>
          <td style="max-width: 150px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;" title="${b.note || ''}">${b.note || '-'}</td>
          <td>${actionHtml}</td>
        `;
        tbody.appendChild(tr);
      });

      document.getElementById('statsInfo').innerText = `共計 ${filtered.length} 筆結算單紀錄`;
      setTimeout(() => {
        window.parent.postMessage({ type: 'BILLS_HEIGHT', height: document.body.scrollHeight }, '*');
      }, 100);
    };

    window.markExternalSettled = async (id, name) => {
      if(confirm(`確定要將買家【${name}】的這筆帳單標記為「已外部結算」嗎？\n(標記後，這筆金額將不會出現在中信系統的應收欠款中)`)) {
        await updateDoc(doc(db, "ctbc_bills", id), { status: '已外部結算' });
      }
    };

    window.deleteBill = async (id, name) => {
      if(confirm(`確定要刪除買家【${name}】的這筆結算單紀錄嗎？`)) {
        await deleteDoc(doc(db, "ctbc_bills", id));
      }
    };

    window.wipeAllData = async () => {
      const pwd = prompt("⚠️ 警告：這將會刪除所有「結算單」與「對帳紀錄」！\n請輸入密碼「0922」確認執行：");
      if (pwd !== "0922") return alert(pwd !== null ? "密碼錯誤，取消操作。" : "");
      
      document.getElementById('statsInfo').innerText = "資料清空中，請稍候...";
      try {
        const delPromises = [];
        const snapBills = await getDocs(collection(db, "ctbc_bills"));
        snapBills.forEach(d => delPromises.push(deleteDoc(doc(db, "ctbc_bills", d.id))));
        const snapSettles = await getDocs(collection(db, "ctbc_settlements"));
        snapSettles.forEach(d => delPromises.push(deleteDoc(doc(db, "ctbc_settlements", d.id))));
        
        await Promise.all(delPromises);
        alert("✅ 全部結算單與對帳紀錄皆已清空！");
        window.renderTable();
      } catch (e) {
        alert("清空過程中發生錯誤：" + e.message);
      }
    };
  </script>
</body>
</html>
