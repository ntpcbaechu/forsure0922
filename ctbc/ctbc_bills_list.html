<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>買家結算單紀錄一覽表</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 15px; margin: 0; background: #f8fafc; color: #334155; }
    .header-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; flex-wrap: wrap; gap: 10px; }
    h2 { margin: 0; font-size: 18px; color: #0f172a; }
    
    .btn-action-top { padding: 6px 14px; border-radius: 6px; font-size: 13px; font-weight: bold; cursor: pointer; transition: 0.2s; border: none; }
    .btn-danger { background: #fee2e2; color: #dc2626; border: 1px solid #fca5a5; }
    .btn-danger:hover { background: #fecaca; }
    .btn-export { background: #e0f2fe; color: #2563eb; border: 1px solid #bfdbfe; }
    .btn-export:hover { background: #dbeafe; }

    /* 膠囊過濾卡片 */
    .filter-card { background: #fff; border: 1px solid #e4e7ed; border-radius: 12px; padding: 14px; margin-bottom: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.02); display: flex; flex-direction: column; gap: 8px; }
    .filter-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .filter-label { font-size: 12px; font-weight: bold; color: #606266; min-width: 80px; }
    .capsule-group { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
    .capsule-filter-btn { background: #f4f4f5; color: #606266; border: 1px solid #dcdfe6; padding: 4px 12px; border-radius: 16px; font-size: 12px; font-weight: bold; cursor: pointer; transition: all 0.2s; outline: none; }
    .capsule-filter-btn:hover { background: #ecf5ff; color: #409eff; border-color: #c6e2ff; }
    .capsule-filter-btn.active { background: #409eff; color: #fff; border-color: #409eff; box-shadow: 0 2px 6px rgba(64,158,255,0.25); }
    .capsule-filter-btn.sub-active { background: #67c23a; color: #fff; border-color: #67c23a; box-shadow: 0 2px 6px rgba(103,194,58,0.25); }
    .capsule-filter-btn.user-active { background: #e6a23c; color: #fff; border-color: #e6a23c; box-shadow: 0 2px 6px rgba(230,162,60,0.25); }

    .search-bar { display: flex; gap: 8px; align-items: center; width: 100%; max-width: 400px; }
    .search-bar input { flex: 1; padding: 6px 12px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 12px; outline: none; }
    .search-bar input:focus { border-color: #3b82f6; }

    .section-divider { display: flex; align-items: center; justify-content: center; margin: 24px 0 16px 0; font-size: 14px; font-weight: bold; }
    .section-divider::before, .section-divider::after { content: ''; flex: 1; border-bottom: 2px dashed #cbd5e1; margin: 0 12px; }
    .divider-active { color: #2563eb; }
    .divider-completed { color: #94a3b8; }

    .stats-info { font-size: 12px; font-weight: bold; color: #64748b; margin-bottom: 10px; }

    /* 外層網格佈局 (買家卡片左右並排) */
    .cards-grid-container { display: grid; grid-template-columns: repeat(auto-fit, minmax(500px, 1fr)); gap: 16px; align-items: start; }

    /* 買家群組卡片 */
    .buyer-card { background: #ffffff; border-radius: 10px; box-shadow: 0 3px 8px rgba(0,0,0,0.05); border: 1px solid #e2e8f0; overflow: hidden; transition: 0.3s; }
    .buyer-card.completed-card { opacity: 0.7; filter: grayscale(0.8); background: #f8fafc; }
    .buyer-header { background: #f1f5f9; padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; border-bottom: 2px solid #e2e8f0; }
    .completed-card .buyer-header { background: #e2e8f0; }
    
    .buyer-name-group { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    .buyer-name { font-size: 16px; font-weight: bold; color: #1e293b; }
    .global-memo-input { padding: 4px 8px; border: 1px solid #cbd5e1; border-radius: 4px; font-size: 11px; width: 180px; outline: none; background: #fff; }
    .global-memo-input:focus { border-color: #f59e0b; box-shadow: 0 0 0 2px #fef3c7; }
    
    .buyer-summary { display: flex; gap: 16px; font-size: 13px; align-items: center; background: #fff; padding: 6px 12px; border-radius: 6px; border: 1px solid #cbd5e1; }
    .summary-item { display: flex; flex-direction: column; align-items: center; }
    .summary-label { font-size: 11px; color: #64748b; }
    .summary-val { font-weight: bold; font-size: 14px; }
    .val-expected { color: #334155; }
    .val-paid { color: #16a34a; }
    .val-unpaid { color: #dc2626; }
    .val-ok { color: #16a34a; }

    /* 狀態標籤 */
    .tag { padding: 4px 10px; border-radius: 12px; font-size: 12px; font-weight: bold; border: 1px solid transparent; }
    .tag-pending { background: #f1f5f9; color: #64748b; border-color: #cbd5e1; }
    .tag-wait-check { background: #e0f2fe; color: #2563eb; border-color: #bfdbfe; }
    .tag-short { background: #fef0f0; color: #dc2626; border-color: #fecaca; }
    .tag-ok { background: #dcfce3; color: #16a34a; border-color: #bbf7d0; }
    .tag-external { background: #f3e8ff; color: #7e22ce; border-color: #e9d5ff; }

    /* 表格樣式 (條列式，依成員分組) */
    .section-title { font-size: 12px; font-weight: bold; color: #64748b; padding: 10px 16px 4px 16px; display: flex; align-items: center; gap: 6px; }
    .member-group-header { background: #eef5fe; border-left: 4px solid #409eff; padding: 6px 12px; font-weight: bold; font-size: 13px; color: #1e293b; border-top: 1px solid #e2e8f0; border-bottom: 1px solid #e2e8f0; }
    table { width: 100%; border-collapse: collapse; font-size: 12px; background: transparent; }
    td { padding: 8px 12px; border-bottom: 1px dashed #e2e8f0; vertical-align: middle; }
    tr:last-child td { border-bottom: none; }
    
    .amt-text { color: #dc2626; font-weight: bold; }
    .badge { background: #f1f5f9; color: #475569; padding: 2px 6px; border-radius: 4px; font-size: 11px; }

    /* 水平操作按鈕 */
    .action-btn-group { display: flex; gap: 6px; flex-wrap: nowrap; justify-content: flex-end; }
    .btn-sm { border-radius: 4px; padding: 4px 8px; font-size: 11px; cursor: pointer; font-weight: bold; transition: 0.2s; border: 1px solid transparent; }
    .btn-edit { background: #f8fafc; color: #3b82f6; border-color: #cbd5e1; } .btn-edit:hover { background: #e0f2fe; }
    .btn-save-inline { background: #2563eb; color: #fff; } .btn-save-inline:hover { background: #1d4ed8; }
    .btn-del { background: #fee2e2; color: #dc2626; border-color: #fca5a5; } .btn-del:hover { background: #fecaca; }
    .btn-ext { background: #dcfce3; color: #16a34a; border-color: #bbf7d0; } .btn-ext:hover { background: #bbf7d0; }
    .btn-refund { background: #fef3c7; color: #d97706; border-color: #fde68a; } .btn-refund:hover { background: #fde68a; }
    
    /* 編輯模式輸入框 */
    .edit-input { padding: 4px; border: 1px solid #3b82f6; border-radius: 4px; font-size: 11px; outline: none; }
    .edit-select { padding: 4px; border: 1px solid #3b82f6; border-radius: 4px; font-size: 11px; }

    /* 中信實際紀錄區 */
    .bank-record-table { margin-top: 0; }
    .bank-record-row { background: #fdfdfd; }
    .bank-record-row td { color: #16a34a; font-weight: bold; border-bottom: 1px dashed #e2e8f0; }
    .bank-record-row .memo-text { font-weight: normal; color: #64748b; font-size: 11px; }
  </style>
</head>
<body>

  <div class="header-row">
    <h2>📋 買家群組化一覽表 (自動結算與管理)</h2>
    <div style="display:flex; gap:10px;">
      <button class="btn-action-top btn-export" onclick="exportToExcel()">📥 匯出 Excel (全明細)</button>
      <button class="btn-action-top btn-danger" onclick="wipeAllData()">🚨 一鍵清空所有紀錄</button>
    </div>
  </div>

  <div class="filter-card">
    <div class="filter-row">
      <span class="filter-label">1. 團體：</span>
      <div id="groupCapsules" class="capsule-group"></div>
    </div>
    <div class="filter-row">
      <span class="filter-label">2. 檢視模式：</span>
      <div id="modeCapsules" class="capsule-group">
        <button class="capsule-filter-btn active" onclick="setModeFilter('member', this)">👥 依成員</button>
        <button class="capsule-filter-btn" onclick="setModeFilter('event', this)">🗓️ 依活動</button>
        <button class="capsule-filter-btn" onclick="setModeFilter('all', this)">📋 全部清單</button>
      </div>
    </div>
    <div class="filter-row">
      <span class="filter-label">3. 細項篩選：</span>
      <div id="detailCapsules" class="capsule-group"></div>
    </div>
    <div class="filter-row" style="border-top:1px dashed #dcdfe6; padding-top:8px;">
      <span class="filter-label">👤 買家清單：</span>
      <div id="userCapsules" class="capsule-group"></div>
    </div>
  </div>
  
  <div class="stats-info" id="statsInfo">資料載入中...</div>

  <!-- 進行中區塊 (外層左右兩欄) -->
  <div class="section-divider divider-active">🔥 待處理 / 交易中</div>
  <div id="activeContainer" class="cards-grid-container"></div>

  <!-- 已結清區塊 (外層左右兩欄) -->
  <div id="completedDivider" style="display:none;">
    <div class="section-divider divider-completed">⚫ 已對帳結清 (封存)</div>
    <div id="completedContainer" class="cards-grid-container"></div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, onSnapshot, doc, deleteDoc, getDocs, updateDoc, setDoc, addDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDF7QySG1Jj4gdZvXwMRaKjRmI-lFKpj7k",
      authDomain: "forsure0922.firebaseapp.com",
      databaseURL: "https://forsure0922-default-rtdb.firebaseio.com",
      projectId: "forsure0922"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let billsData = [];
    let settlementsData = [];
    let buyerMemos = {};
    let groupList = [];
    let memberMap = {};

    let activeGroup = 'ALL';
    let activeMode = 'member';
    let activeDetail = 'ALL';
    let activeUser = 'ALL';
    let editingBillId = null;

    document.addEventListener('DOMContentLoaded', async () => {
      try {
        const gRes = await fetch('../json/group.json');
        groupList = await gRes.json();
        for (const g of groupList) {
          const file = (g === 'Stray Kids') ? 'members_skz.json' : (g === 'ATEEZ' ? 'members_atz.json' : '');
          if (file) memberMap[g] = await (await fetch(`../json/${file}`)).json();
        }
      } catch(e) {}

      renderGroupCapsules();
      updateDetailCapsules();

      onSnapshot(collection(db, "ctbc_bills"), snap => {
        billsData = snap.docs.map(d => ({id: d.id, ...d.data()}));
        updateUserCapsules();
        window.renderTable();
      });
      onSnapshot(collection(db, "ctbc_settlements"), snap => {
        settlementsData = snap.docs.map(d => ({id: d.id, ...d.data()}));
        window.renderTable();
      });
      onSnapshot(collection(db, "ctbc_buyer_memos"), snap => {
        buyerMemos = {};
        snap.forEach(d => { buyerMemos[d.id] = d.data().memo; });
        window.renderTable();
      });
    });

    function renderGroupCapsules() {
      const container = document.getElementById('groupCapsules');
      container.innerHTML = `<button class="capsule-filter-btn active" onclick="window.setGroupFilter('ALL', this)">全部</button>`;
      groupList.forEach(g => {
        container.innerHTML += `<button class="capsule-filter-btn" onclick="window.setGroupFilter('${g}', this)">${g}</button>`;
      });
    }

    window.setGroupFilter = (grp, btn) => {
      activeGroup = grp;
      document.querySelectorAll('#groupCapsules .capsule-filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      activeDetail = 'ALL';
      updateDetailCapsules();
      window.renderTable();
    };

    window.setModeFilter = (mode, btn) => {
      activeMode = mode;
      document.querySelectorAll('#modeCapsules .capsule-filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      activeDetail = 'ALL';
      updateDetailCapsules();
      window.renderTable();
    };

    function updateDetailCapsules() {
      const container = document.getElementById('detailCapsules');
      container.innerHTML = `<button class="capsule-filter-btn sub-active" onclick="window.setDetailFilter('ALL', this)">全部顯示</button>`;
      let itemsToCheck = billsData;
      if (activeGroup !== 'ALL') itemsToCheck = itemsToCheck.filter(b => b.group === activeGroup);

      if (activeMode === 'member') {
        const memSet = new Set(itemsToCheck.map(b => b.member).filter(Boolean));
        Array.from(memSet).sort().forEach(m => {
          container.innerHTML += `<button class="capsule-filter-btn" onclick="window.setDetailFilter('${m}', this)">${m}</button>`;
        });
      } else if (activeMode === 'event') {
        const evSet = new Set(itemsToCheck.map(b => b.event).filter(Boolean));
        Array.from(evSet).sort().forEach(ev => {
          container.innerHTML += `<button class="capsule-filter-btn" onclick="window.setDetailFilter('${ev}', this)">${ev}</button>`;
        });
      }
    }

    window.setDetailFilter = (detail, btn) => {
      activeDetail = detail;
      document.querySelectorAll('#detailCapsules .capsule-filter-btn').forEach(b => b.classList.remove('sub-active'));
      btn.classList.add('sub-active');
      window.renderTable();
    };

    function updateUserCapsules() {
      const container = document.getElementById('userCapsules');
      container.innerHTML = `<button class="capsule-filter-btn user-active" onclick="window.setUserFilter('ALL', this)">全部買家</button>`;
      const users = new Set(billsData.map(b => b.name).filter(Boolean));
      Array.from(users).sort((a,b)=>a.localeCompare(b,'zh-TW')).forEach(u => {
        container.innerHTML += `<button class="capsule-filter-btn" onclick="window.setUserFilter('${u}', this)">${u}</button>`;
      });
    }

    window.setUserFilter = (user, btn) => {
      activeUser = user;
      document.querySelectorAll('#userCapsules .capsule-filter-btn').forEach(b => b.classList.remove('user-active'));
      btn.classList.add('user-active');
      window.renderTable();
    };

    window.renderTable = () => {
      const activeContainer = document.getElementById('activeContainer');
      const completedContainer = document.getElementById('completedContainer');
      activeContainer.innerHTML = '';
      completedContainer.innerHTML = '';

      let filteredBills = billsData.filter(b => {
        if (activeGroup !== 'ALL' && b.group !== activeGroup) return false;
        if (activeDetail !== 'ALL') {
          if (activeMode === 'member' && b.member !== activeDetail) return false;
          if (activeMode === 'event' && b.event !== activeDetail) return false;
        }
        if (activeUser !== 'ALL' && b.name !== activeUser) return false;
        return true;
      });

      const grouped = {};
      filteredBills.forEach(b => {
        if(!grouped[b.name]) grouped[b.name] = [];
        grouped[b.name].push(b);
      });

      let totalBillsCount = 0;
      let completedCount = 0;
      const sortedBuyerNames = Object.keys(grouped).sort((a,b) => a.localeCompare(b, 'zh-TW'));

      sortedBuyerNames.forEach(buyerName => {
        const buyerBills = grouped[buyerName];
        totalBillsCount += buyerBills.length;

        const totalExpected = buyerBills.filter(b => b.status !== '已外部結算').reduce((sum, b) => sum + Number(b.expectedAmt || 0), 0);
        const buyerSettlements = settlementsData.filter(s => s.buyerName === buyerName);
        const totalPaid = buyerSettlements.reduce((sum, s) => sum + Number(s.amount || 0), 0);
        const unpaid = totalExpected - totalPaid;

        let mainStatusTag = '';
        let isAllExternal = buyerBills.length > 0 && buyerBills.every(b => b.status === '已外部結算');
        let isCompleted = false;

        if (isAllExternal) {
          mainStatusTag = `<span class="tag tag-external">✔ 全外部結帳</span>`;
          isCompleted = true;
        } else if (unpaid <= 0) {
          mainStatusTag = `<span class="tag tag-ok">✅ 已對帳結清</span>`;
          isCompleted = true;
        } else if (totalPaid > 0 && unpaid > 0) {
          mainStatusTag = `<span class="tag tag-short">⚠️ 待補款</span>`;
        } else if (buyerBills.some(b => b.status === '已匯款' || b.last5)) {
          mainStatusTag = `<span class="tag tag-wait-check">🔍 待對帳</span>`;
        } else {
          mainStatusTag = `<span class="tag tag-pending">📌 待匯款</span>`;
        }

        if(isCompleted) completedCount++;

        const card = document.createElement('div');
        card.className = `buyer-card ${isCompleted ? 'completed-card' : ''}`;
        const memoVal = buyerMemos[buyerName] || '';

        let headerHtml = `
          <div class="buyer-header">
            <div class="buyer-name-group">
              <div class="buyer-name">👤 ${buyerName}</div>
              ${mainStatusTag}
              <input type="text" class="global-memo-input" placeholder="📝 買家專屬備註 (防雷/習慣)..." value="${memoVal}" onblur="saveBuyerMemo('${buyerName}', this.value)">
            </div>
            <div class="buyer-summary">
              <div class="summary-item"><span class="summary-label">總應匯</span><span class="summary-val val-expected">$${totalExpected}</span></div>
              <div class="summary-item"><span class="summary-label">實收已對帳</span><span class="summary-val val-paid">$${totalPaid}</span></div>
              <div class="summary-item">
                <span class="summary-label">${unpaid < 0 ? '溢繳金額' : '尚欠金額'}</span>
                <span class="summary-val ${unpaid > 0 ? 'val-unpaid' : 'val-ok'}">${unpaid <= 0 ? (unpaid<0 ? '+$'+Math.abs(unpaid) : '$0') : '$'+unpaid}</span>
              </div>
              ${unpaid < 0 ? `<button class="btn-sm btn-refund" onclick="refundOverpaid('${buyerName}', ${Math.abs(unpaid)})">💸 登記退款</button>` : ''}
            </div>
          </div>
        `;

        // 內部依成員分組，活動排序
        let listHtml = `<div class="section-title" style="padding-bottom:6px;">📝 手動 Memo 登記區</div>`;
        
        const memberGroupMap = {};
        buyerBills.forEach(b => {
          const m = b.member || '其他';
          if(!memberGroupMap[m]) memberGroupMap[m] = [];
          memberGroupMap[m].push(b);
        });

        // 嚴格依官方陣列順序排序成員
        const getMemberIndex = (mem) => {
          let idx = memberMap['Stray Kids']?.indexOf(mem);
          if (idx !== undefined && idx !== -1) return idx;
          idx = memberMap['ATEEZ']?.indexOf(mem);
          if (idx !== undefined && idx !== -1) return 100 + idx; // ATEEZ 排在 SKZ 後面
          return 999;
        };

        const sortedMembers = Object.keys(memberGroupMap).sort((a, b) => getMemberIndex(a) - getMemberIndex(b));

        sortedMembers.forEach(mem => {
          listHtml += `<div class="member-group-header">👤 ${mem}</div>`;
          listHtml += `<table><tbody>`;
          
          memberGroupMap[mem].sort((a,b) => (a.event||'').localeCompare(b.event||'', 'zh-TW')).forEach(b => {
            if (editingBillId === b.id) {
              listHtml += `
                <tr style="background: #eef2ff;">
                  <td colspan="5" style="padding:10px;">
                    <div style="display:flex; gap:6px; flex-wrap:wrap;">
                      <select id="edit_status" class="edit-select" style="width:80px;">
                        <option value="已匯款" ${b.status==='已匯款'?'selected':''}>已匯款</option>
                        <option value="未匯款" ${b.status==='未匯款'?'selected':''}>未匯款</option>
                        <option value="不確定" ${b.status==='不確定'?'selected':''}>不確定</option>
                      </select>
                      <input type="date" id="edit_date" class="edit-input" value="${b.date||''}" style="width:110px;">
                      <input type="text" id="edit_group" class="edit-input" value="${b.group||''}" placeholder="團體" style="width:100px;">
                      <input type="text" id="edit_event" class="edit-input" value="${b.event||''}" placeholder="場次" style="width:100px;">
                      <input type="text" id="edit_member" class="edit-input" value="${b.member||''}" placeholder="成員" style="width:80px;">
                      <input type="number" id="edit_qty" class="edit-input" value="${b.qty||''}" placeholder="張數" style="width:60px;">
                      <input type="number" id="edit_expectedAmt" class="edit-input" value="${b.expectedAmt||0}" placeholder="應匯" style="width:70px;">
                      <input type="text" id="edit_last5" class="edit-input" value="${b.last5||''}" placeholder="末5" style="width:70px;">
                      <input type="text" id="edit_note" class="edit-input" value="${b.note||''}" placeholder="備註" style="flex:1; min-width:120px;">
                    </div>
                    <div style="margin-top:8px; display:flex; gap:8px; justify-content:flex-end;">
                      <button class="btn-sm btn-edit" style="padding:4px 12px;" onclick="cancelEdit()">取消</button>
                      <button class="btn-sm btn-save-inline" style="padding:4px 12px;" onclick="saveInlineEdit('${b.id}')">💾 儲存</button>
                    </div>
                  </td>
                </tr>
              `;
            } else {
              let actionHtml = '';
              if(b.status === '已外部結算') {
                actionHtml = `<button class="btn-sm btn-del" onclick="deleteBill('${b.id}', '${buyerName}')">❌</button>`;
              } else {
                actionHtml = `
                  <button class="btn-sm btn-edit" onclick="startEdit('${b.id}')">✏️</button>
                  <button class="btn-sm btn-ext" onclick="markExternalSettled('${b.id}', '${buyerName}')">✅ 外結</button>
                  <button class="btn-sm btn-del" onclick="deleteBill('${b.id}', '${buyerName}')">❌</button>
                `;
              }
              
              listHtml += `
                <tr>
                  <td style="width:65px;"><span class="badge" style="${b.status==='已外部結算'?'background:#dcfce3;color:#16a34a;':''}">${b.status || '-'}</span></td>
                  <td>
                    <div style="color:#1e293b; font-weight:bold;">${b.group || '-'} / ${b.event || '-'}</div>
                    <div style="font-size:11px; color:#64748b; margin-top:4px;">📅 ${b.date || '未填日期'} | 末5: ${b.last5 || '-'}</div>
                    <div style="font-size:11px; color:#64748b; margin-top:2px;">📝 備註: ${b.note || '-'}</div>
                  </td>
                  <td style="width:50px; text-align:center;">${b.qty ? b.qty+'張' : '-'}</td>
                  <td style="width:60px; text-align:right;" class="amt-text">$${b.expectedAmt || 0}</td>
                  <td style="width:110px; text-align:right;">
                    <div class="action-btn-group">${actionHtml}</div>
                  </td>
                </tr>
              `;
            }
          });
          listHtml += `</tbody></table>`;
        });

        // 🏦 中信綁定區
        if(buyerSettlements.length > 0) {
          listHtml += `<div class="section-title" style="margin-top:6px; border-top:2px dashed #cbd5e1; padding-top:12px;">🏦 中信實體對帳紀錄 (系統自動帶入)</div><table class="bank-record-table"><tbody>`;
          buyerSettlements.forEach(s => {
            const dateObj = new Date(s.updatedAt || Date.now());
            const dStr = `${dateObj.getMonth()+1}/${dateObj.getDate()} ${dateObj.getHours()}:${String(dateObj.getMinutes()).padStart(2,'0')}`;
            listHtml += `
              <tr class="bank-record-row">
                <td style="width: 130px; font-size:11px;">✔️ ${dStr}</td>
                <td style="width: 100px;">存入 <b style="font-size:13px;">$${s.amount}</b></td>
                <td><span class="memo-text">${s.memo || '無'} (ID:${s.txId})</span></td>
                <td style="width: 70px; text-align:right;"><button class="btn-sm btn-del" onclick="unbindSettlement('${s.id}', '${buyerName}')">🔓 撤銷</button></td>
              </tr>
            `;
          });
          listHtml += `</tbody></table>`;
        }

        card.innerHTML = headerHtml + listHtml;
        if(isCompleted) completedContainer.appendChild(card);
        else activeContainer.appendChild(card);
      });

      document.getElementById('completedDivider').style.display = completedCount > 0 ? 'block' : 'none';
      document.getElementById('statsInfo').innerText = `共顯示 ${sortedBuyerNames.length} 位買家，合計 ${totalBillsCount} 筆結算單明細`;

      setTimeout(() => { window.parent.postMessage({ type: 'BILLS_HEIGHT', height: document.body.scrollHeight }, '*'); }, 100);
    };

    // === 操作邏輯 ===
    window.saveBuyerMemo = async (buyerName, memoVal) => {
      await setDoc(doc(db, "ctbc_buyer_memos", buyerName), { memo: memoVal });
    };

    window.startEdit = (id) => { editingBillId = id; window.renderTable(); };
    window.cancelEdit = () => { editingBillId = null; window.renderTable(); };

    window.saveInlineEdit = async (id) => {
      const status = document.getElementById('edit_status').value;
      const date = document.getElementById('edit_date').value;
      const group = document.getElementById('edit_group').value;
      const event = document.getElementById('edit_event').value;
      const member = document.getElementById('edit_member').value;
      const qty = document.getElementById('edit_qty').value;
      const expectedAmt = document.getElementById('edit_expectedAmt').value;
      const note = document.getElementById('edit_note').value;
      const last5 = document.getElementById('edit_last5').value;

      await updateDoc(doc(db, "ctbc_bills", id), {
        status, date, group, event, member, qty, expectedAmt: Number(expectedAmt||0), note, last5
      });
      editingBillId = null;
      window.renderTable();
    };

    window.markExternalSettled = async (id, name) => {
      if(confirm(`確定標記為「已外部結算」嗎？(將不列入中信應收)`)) {
        await updateDoc(doc(db, "ctbc_bills", id), { status: '已外部結算' });
      }
    };

    window.deleteBill = async (id, name) => {
      if(confirm(`確定刪除這筆 Memo 紀錄嗎？`)) await deleteDoc(doc(db, "ctbc_bills", id));
    };

    window.unbindSettlement = async (settleId, name) => {
      if(confirm(`確定要【解除綁定】這筆中信實體紀錄嗎？`)) {
        await deleteDoc(doc(db, "ctbc_settlements", settleId));
      }
    };

    window.refundOverpaid = async (buyerName, overpaidAmt) => {
      const amtStr = prompt(`請輸入退款金額:`, overpaidAmt);
      if(!amtStr) return;
      const amount = Number(amtStr);
      if(isNaN(amount) || amount <= 0) return alert("無效的金額！");

      await addDoc(collection(db, "ctbc_settlements"), {
        txId: 'REFUND_' + Date.now(), buyerName, amount: -amount, status: 'completed', memo: '系統退款登記', updatedAt: Date.now()
      });
      alert(`✅ 登記退款 -$${amount} 成功！`);
    };

    window.wipeAllData = async () => {
      const pwd = prompt("⚠️ 刪除所有紀錄！密碼「0922」確認：");
      if (pwd !== "0922") return alert(pwd !== null ? "密碼錯誤。" : "");
      
      document.getElementById('statsInfo').innerText = "清空中...";
      try {
        const delPromises = [];
        const [snapBills, snapSettles] = await Promise.all([getDocs(collection(db, "ctbc_bills")), getDocs(collection(db, "ctbc_settlements"))]);
        snapBills.forEach(d => delPromises.push(deleteDoc(doc(db, "ctbc_bills", d.id))));
        snapSettles.forEach(d => delPromises.push(deleteDoc(doc(db, "ctbc_settlements", d.id))));
        await Promise.all(delPromises);
        alert("✅ 已全數清空！");
      } catch (e) { alert("錯誤：" + e.message); }
    };

    window.exportToExcel = () => {
      let csvContent = "\uFEFF買家暱稱,備註(防雷),狀態,匯款日期,團體,場次,成員,張數,單筆應匯,後5碼,手動Memo\n";
      billsData.forEach(b => {
        const memo = (buyerMemos[b.name] || '').replace(/,/g, '，');
        const note = (b.note || '').replace(/,/g, '，');
        const row = [b.name, memo, b.status, b.date||'', b.group, b.event, b.member, b.qty||'', b.expectedAmt||0, b.last5||'', note];
        csvContent += row.join(",") + "\n";
      });
      const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
      const link = document.createElement("a");
      link.setAttribute("href", URL.createObjectURL(blob));
      link.setAttribute("download", `結帳報表_${new Date().toISOString().slice(0,10)}.csv`);
      link.style.visibility = 'hidden';
      document.body.appendChild(link); link.click(); document.body.removeChild(link);
    };
  </script>
</body>
</html>
