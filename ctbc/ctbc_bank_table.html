<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 0 5px; margin: 0; background: transparent; color: #334155; }
    
    .card { background: #ffffff; padding: 16px; border-radius: 10px; box-shadow: 0 2px 6px rgba(0,0,0,0.04); margin-bottom: 12px; border: 1px solid #e2e8f0; }
    .card h3 { margin-top: 0; margin-bottom: 12px; font-size: 15px; color: #1e293b; border-bottom: 1px solid #f1f5f9; padding-bottom: 8px; }

    .compact-form { display: flex; flex-wrap: wrap; gap: 10px 12px; align-items: flex-end; }
    .form-group { display: flex; flex-direction: column; }
    .form-group label { font-size: 11px; font-weight: bold; margin-bottom: 4px; color: #475569; white-space: nowrap; }
    .form-group label.required::after { content: " *"; color: #ef4444; }
    .form-group label.optional::after { content: " (選填)"; color: #94a3b8; font-weight: normal; }
    .form-group input, .form-group select { padding: 6px 8px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 12px; outline: none; box-sizing: border-box; }
    .form-group input:focus, .form-group select:focus { border-color: #3b82f6; }

    .batch-header { padding-bottom: 12px; border-bottom: 2px dashed #cbd5e1; margin-bottom: 12px; }
    .dynamic-row { background: #f8fafc; padding: 16px 12px 12px 12px; border-radius: 8px; position: relative; margin-bottom: 10px; border: 1px solid #e2e8f0; }
    .btn-remove-row { position: absolute; right: 12px; top: 12px; background: #fee2e2; color: #ef4444; border: 1px solid #fca5a5; border-radius: 4px; padding: 3px 8px; font-size: 11px; cursor: pointer; font-weight: bold; transition: 0.2s; }
    .btn-remove-row:hover { background: #fecaca; }

    .filter-card { background: #fff; border: 1px solid #e4e7ed; border-radius: 10px; padding: 14px; margin-bottom: 12px; box-shadow: 0 2px 6px rgba(0,0,0,0.02); display: flex; flex-direction: column; gap: 10px; }
    .filter-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .filter-label { font-size: 13px; font-weight: bold; color: #606266; min-width: 80px; }
    .capsule-group { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
    .capsule-filter-btn { background: #f4f4f5; color: #606266; border: 1px solid #dcdfe6; padding: 6px 16px; border-radius: 16px; font-size: 12px; font-weight: bold; cursor: pointer; transition: all 0.2s; outline: none; }
    .capsule-filter-btn:hover { background: #ecf5ff; color: #409eff; border-color: #c6e2ff; }
    .capsule-filter-btn.active { background: #409eff; color: #fff; border-color: #409eff; box-shadow: 0 2px 6px rgba(64,158,255,0.25); }

    .search-bar { display: flex; gap: 8px; margin-bottom: 10px; align-items: center; }
    .search-bar input { flex: 1; max-width: 350px; padding: 8px 12px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 13px; }

    .stats-info { font-size: 12px; font-weight: bold; color: #0f172a; margin-bottom: 10px; }

    table { width: 100%; border-collapse: collapse; font-size: 13px; background: #fff; border-radius: 8px; overflow: hidden; border: 1px solid #e2e8f0; }
    th { background: #f1f5f9; color: #334155; text-align: left; padding: 10px 12px; border-bottom: 2px solid #e2e8f0; white-space: nowrap; }
    td { padding: 10px 12px; border-bottom: 1px solid #e2e8f0; }

    .income { color: #16a34a; font-weight: bold; }
    .expense { color: #dc2626; font-weight: bold; }
    .badge { background: #e2e8f0; color: #475569; padding: 3px 8px; border-radius: 6px; font-size: 11px; font-weight: bold; }
    .account-code { font-family: monospace; color: #1d4ed8; }

    .status-tag { display: inline-block; padding: 4px 10px; border-radius: 12px; font-size: 11px; font-weight: bold; }
    .status-pending { background: #f1f5f9; color: #64748b; border: 1px solid #cbd5e1; }
    .status-inprogress { background: #fdf6ec; color: #e6a23c; border: 1px solid #faebd7; }
    .status-completed { background: #e8f5e9; color: #2e7d32; border: 1px solid #c8e6c9; }

    .btn-toggle { padding: 5px 10px; background: #fff; border: 1px solid #cbd5e1; border-radius: 4px; font-size: 12px; cursor: pointer; color: #334155; font-weight: bold; }
    .btn-toggle.active { background: #f8fafc; border-color: #94a3b8; }
    .sub-row { background: #f8fafc; border-bottom: 2px solid #cbd5e1; }
    .sub-container { padding: 14px 18px; display: flex; flex-direction: column; gap: 12px; }
    .edit-box { background: #fff; border: 1px dashed #94a3b8; padding: 14px; border-radius: 8px; display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end; }
    
    .btn-action { padding: 8px 14px; border-radius: 6px; font-size: 12px; font-weight: bold; cursor: pointer; border: none; color: #fff; transition: 0.2s; }
    .btn-add { background: #10b981; } .btn-add:hover { background: #059669; }
    .btn-save { background: #2563eb; } .btn-save:hover { background: #1d4ed8; }
    .btn-clear { background: #f56c6c; } .btn-clear:hover { background: #dd6161; }

    .pagination { display: flex; justify-content: center; gap: 6px; margin-top: 16px; flex-wrap: wrap; padding-bottom: 20px; }
    .page-btn { padding: 6px 10px; border: 1px solid #cbd5e1; background: #fff; border-radius: 4px; font-size: 13px; cursor: pointer; transition: 0.2s; }
    .page-btn.active { background: #2563eb; color: #fff; border-color: #2563eb; }
    .page-btn:hover:not(.active) { background: #f1f5f9; }

    .bill-checkbox-label { font-size:12px; display:flex; align-items:center; justify-content:space-between; gap:8px; background:#fff; padding:8px 12px; border:1px solid #cbd5e1; border-radius:6px; cursor:pointer; transition:0.2s; }
    .bill-checkbox-label:hover { background:#f8fafc; border-color:#94a3b8; }
  </style>
  <script src="ctbc_data.js"></script>
</head>
<body>

  <div class="card">
    <h3>📝 1. 建立買家結算單 (支援同買家批次新增)</h3>
    <div class="compact-form batch-header">
      <div class="form-group">
        <label class="required">1. 團體</label>
        <select id="f_group" onchange="updateAllMemberSelects()">
          <option value="">請選擇團體</option>
          <option value="Stray Kids">Stray Kids</option>
          <option value="ATEEZ">ATEEZ</option>
        </select>
      </div>
      <div class="form-group">
        <label class="required">2. 買家暱稱</label>
        <input type="text" id="f_name" placeholder="填寫該買家暱稱" style="width:160px;">
      </div>
    </div>
    <div id="dynamicRowsContainer"></div>
    <div style="display:flex; gap:10px; margin-top:14px;">
      <button type="button" class="btn-action btn-add" onclick="addDynamicRow()">➕ 新增一筆填單紀錄</button>
      <button type="button" class="btn-action btn-save" onclick="batchSubmitOrders()">💾 批次送出結算單</button>
    </div>
  </div>

  <div class="filter-card">
    <div class="filter-row" id="statusFilterGroup">
      <span class="filter-label">明細檢視：</span>
      <div class="capsule-group">
        <button class="capsule-filter-btn active" onclick="setSmartFilter('pending_in', this)">🟢 待核對入帳</button>
        <button class="capsule-filter-btn" onclick="setSmartFilter('completed_in', this)">✅ 已核對入帳</button>
        <button class="capsule-filter-btn" onclick="setSmartFilter('expense', this)">🔴 銀行支出單</button>
        <button class="capsule-filter-btn" onclick="setSmartFilter('all', this)">📋 全部明細</button>
      </div>
    </div>
  </div>

  <div class="search-bar">
    <input type="text" id="searchInput" placeholder="🔍 輸入後五碼、金額、日期等篩選關聯明細..." onkeyup="renderTable()">
  </div>

  <div class="stats-info" id="statsInfo">載入中...</div>

  <div style="overflow-x:auto;">
    <table>
      <thead>
        <tr>
          <th style="width:70px;">操作</th>
          <th>交易日期時間</th>
          <th>支出</th>
          <th>存入</th>
          <th>結餘</th>
          <th>備註</th>
          <th>對方帳號 / 說明</th>
          <th>狀態</th>
        </tr>
      </thead>
      <tbody id="bankTable"></tbody>
    </table>
  </div>

  <div class="pagination" id="pagination"></div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, onSnapshot, doc, setDoc, deleteDoc, addDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDF7QySG1Jj4gdZvXwMRaKjRmI-lFKpj7k",
      authDomain: "forsure0922.firebaseapp.com",
      databaseURL: "https://forsure0922-default-rtdb.firebaseio.com",
      projectId: "forsure0922"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let transactions = window.rawTransactions || [];
    let ctbcBills = [];
    let ctbcSettlements = [];
    
    let expandedRows = {};
    let currentSmartFilter = 'pending_in'; 
    let currentPage = 1;
    const pageSize = 50;
    let memberMap = {};
    let rowCounter = 0;

    const notifyHeight = () => {
      setTimeout(() => { window.parent.postMessage({ type: 'BANK_HEIGHT', height: document.body.scrollHeight }, '*'); }, 100);
    };

    document.addEventListener('DOMContentLoaded', async () => {
      try {
        const skzRes = await fetch('../json/members_skz.json');
        memberMap['Stray Kids'] = await skzRes.json();
        const atzRes = await fetch('../json/members_atz.json');
        memberMap['ATEEZ'] = await atzRes.json();
      } catch(e) {}

      addDynamicRow();

      onSnapshot(collection(db, "ctbc_bills"), snap => {
        ctbcBills = snap.docs.map(d => ({id: d.id, ...d.data()}));
        if(Object.keys(expandedRows).length > 0 && window.renderTable) renderTable();
      });

      onSnapshot(collection(db, "ctbc_settlements"), snap => {
        ctbcSettlements = snap.docs.map(d => ({id: d.id, ...d.data()}));
        if(window.renderTable) renderTable();
      });
    });

    window.addDynamicRow = () => {
      rowCounter++;
      const container = document.getElementById('dynamicRowsContainer');
      const rowId = `row_${rowCounter}`;
      
      const currentGroup = document.getElementById('f_group').value;
      const memArr = memberMap[currentGroup] || [];
      let memOptions = '<option value="">請選擇</option>';
      memArr.forEach(m => memOptions += `<option value="${m}">${m}</option>`);

      const rowDiv = document.createElement('div');
      rowDiv.className = 'compact-form dynamic-row';
      rowDiv.id = rowId;
      rowDiv.innerHTML = `
        <button type="button" class="btn-remove-row" onclick="removeRow('${rowId}')">✕ 移除此列</button>
        <div class="form-group"><label>匯款狀態</label><select class="input-status"><option value="">請選擇</option><option value="已匯款">已匯款</option><option value="未匯款">未匯款</option><option value="不確定">不確定</option></select></div>
        <div class="form-group"><label class="required">場次</label><select class="input-event" onchange="toggleRowCustomEvent(this, '${rowId}')"><option value="">請選擇</option><option value="260328 D1">260328 D1</option><option value="260329 D2">260329 D2</option><option value="260404 D3">260404 D3</option><option value="260405 D4">260405 D4</option><option value="other">自訂場次...</option></select></div>
        <div class="form-group input-custom-wrapper" style="display:none;"><label class="required">自訂場次</label><input type="text" class="input-custom-event" placeholder="輸入場次" style="width:90px;"></div>
        <div class="form-group"><label class="required">成員</label><select class="input-member">${memOptions}</select></div>
        <div class="form-group"><label class="optional">張數</label><input type="number" class="input-qty" placeholder="選填" style="width:60px;"></div>
        <div class="form-group"><label class="optional">應匯金額</label><input type="number" class="input-amt" placeholder="選填" style="width:80px;"></div>
        <div class="form-group"><label class="optional">匯款日期</label><input type="date" class="input-date"></div>
        <div class="form-group"><label class="optional">實際匯款</label><input type="number" class="input-payamt" placeholder="選填" style="width:80px;"></div>
        <div class="form-group"><label class="optional">後5碼</label><input type="text" class="input-last5" placeholder="" maxlength="5" style="width:70px;"></div>
        <div class="form-group" style="flex:1;"><label class="optional">備註</label><input type="text" class="input-note" style="width:100%;"></div>
      `;
      container.appendChild(rowDiv);
      notifyHeight();
    };

    window.removeRow = (rowId) => {
      const row = document.getElementById(rowId);
      if(row) row.remove();
      if(document.getElementById('dynamicRowsContainer').children.length === 0) addDynamicRow(); 
      notifyHeight();
    };

    window.toggleRowCustomEvent = (sel, rowId) => {
      const row = document.getElementById(rowId);
      row.querySelector('.input-custom-wrapper').style.display = sel.value === 'other' ? 'flex' : 'none';
      notifyHeight();
    };

    window.updateAllMemberSelects = () => {
      const currentGroup = document.getElementById('f_group').value;
      const memArr = memberMap[currentGroup] || [];
      let memOptions = '<option value="">請選擇</option>';
      memArr.forEach(m => memOptions += `<option value="${m}">${m}</option>`);
      document.querySelectorAll('.input-member').forEach(select => {
        const currentVal = select.value;
        select.innerHTML = memOptions;
        if(memArr.includes(currentVal)) select.value = currentVal;
      });
    };

    window.batchSubmitOrders = async () => {
      const group = document.getElementById('f_group').value;
      const name = document.getElementById('f_name').value.trim();
      if(!group || !name) { alert("請務必填寫「團體」與「買家暱稱」！"); return; }

      const rows = document.querySelectorAll('.dynamic-row');
      const ordersToSubmit = [];

      for(let row of rows) {
        let event = row.querySelector('.input-event').value;
        if(event === 'other') event = row.querySelector('.input-custom-event').value.trim();
        const member = row.querySelector('.input-member').value;
        const status = row.querySelector('.input-status').value;
        const qty = row.querySelector('.input-qty').value;
        const expectedAmt = row.querySelector('.input-amt').value;
        const date = row.querySelector('.input-date').value;
        const payAmt = row.querySelector('.input-payamt').value;
        const last5 = row.querySelector('.input-last5').value.trim();
        const note = row.querySelector('.input-note').value.trim();

        if(!event || !member) { alert("每一列的「場次」與「成員」為必填，請檢查後再送出！"); return; }
        ordersToSubmit.push({ name, group, event, member, status, qty, expectedAmt: Number(expectedAmt || 0), date, payAmt, last5, note, createdAt: Date.now() });
      }

      for(let order of ordersToSubmit) await addDoc(collection(db, "ctbc_bills"), order);

      alert(`✅ 成功為【${name}】批次建立了 ${ordersToSubmit.length} 筆結算單！\n(欄位已為您清空復原)`);
      document.getElementById('f_group').value = '';
      document.getElementById('f_name').value = '';
      document.getElementById('dynamicRowsContainer').innerHTML = '';
      addDynamicRow();
    };

    window.setSmartFilter = (filter, btn) => {
      currentSmartFilter = filter;
      document.querySelectorAll('#statusFilterGroup .capsule-filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentPage = 1;
      renderTable();
    };

    function getStatusInfo(txId) {
      const state = ctbcSettlements.find(s => s.txId === txId.toString());
      if(!state) return { text: '📌 未對帳', class: 'status-pending', data: null, isCompleted: false };
      if(state.status === 'in_progress') return { text: '⏳ 對帳中', class: 'status-inprogress', data: state, isCompleted: false };
      return { text: '✅ 已結算', class: 'status-completed', data: state, isCompleted: true };
    }

    window.renderTable = () => {
      const tbody = document.getElementById('bankTable');
      tbody.innerHTML = '';
      const searchVal = document.getElementById('searchInput').value.toLowerCase();

      let filtered = transactions.filter(t => {
        const stateInfo = getStatusInfo(t.id);
        const hasData = !!stateInfo.data;
        
        if (currentSmartFilter === 'pending_in') {
            if (!t.inc || hasData) return false;
        } else if (currentSmartFilter === 'completed_in') {
            if (!t.inc || !hasData) return false;
        } else if (currentSmartFilter === 'expense') {
            if (!t.exp) return false;
        }

        if (searchVal) {
          const combinedStr = `${t.date} ${t.exp} ${t.inc} ${t.balance} ${t.note} ${t.acc}`.toLowerCase();
          if (!combinedStr.includes(searchVal)) return false;
        }
        return true;
      });

      const totalPages = Math.ceil(filtered.length / pageSize) || 1;
      if (currentPage > totalPages) currentPage = totalPages;
      const pageData = filtered.slice((currentPage - 1) * pageSize, currentPage * pageSize);

      pageData.forEach(t => {
        const isExp = expandedRows[t.id];
        const stateInfo = getStatusInfo(t.id);
        const data = stateInfo.data || {};
        const txAmt = Number(t.inc || t.exp || 0);

        const actionHtml = t.inc 
          ? `<button class="btn-toggle ${isExp ? 'active' : ''}" onclick="toggleRow(${t.id})">${isExp ? '收起▲' : '核對▼'}</button>`
          : `<span style="color:#94a3b8; font-size:11px;">無需對帳</span>`;

        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>${actionHtml}</td>
          <td>${t.date}</td>
          <td class="expense">${t.exp ? '-' + t.exp : ''}</td>
          <td class="income">${t.inc ? '+' + t.inc : ''}</td>
          <td style="font-weight:bold;">${t.balance}</td>
          <td>${t.note ? `<span class="badge">${t.note}</span>` : ''}</td>
          <td class="account-code">${t.acc}</td>
          <td>${t.inc ? `<span class="status-tag ${stateInfo.class}">${stateInfo.text}</span>` : ''}</td>
        `;
        tbody.appendChild(tr);

        if (isExp && t.inc) {
          // ====== ✨ 智能推薦配對邏輯 ======
          let smartMatchHtml = '';
          if (!data.buyerName) {
            const accClean = (t.acc || '').replace(/\*/g, '');
            const noteClean = (t.note || '').replace(/\*/g, '');
            
            const otherSettlements = ctbcSettlements.filter(s => s.txId !== t.id.toString());
            const settledIds = new Set();
            otherSettlements.forEach(s => { if(s.billIds) s.billIds.forEach(id => settledIds.add(id)); });
            
            const allUnsettled = ctbcBills.filter(b => b.status !== '已外部結算' && !settledIds.has(b.id));
            const matchedBills = allUnsettled.filter(b => {
                if (!b.last5 || b.last5.length < 4) return false;
                return accClean.includes(b.last5) || noteClean.includes(b.last5);
            });

            if (matchedBills.length > 0) {
                const mBuyer = matchedBills[0].name;
                smartMatchHtml = `
                  <div style="background:#f0f9eb; border:1px solid #c2e7b0; padding:10px; border-radius:8px; margin-bottom:12px; display:flex; justify-content:space-between; align-items:center;">
                    <span style="color:#67c23a; font-size:13px; font-weight:bold;">✨ 系統智能偵測：此筆極可能是【${mBuyer}】的匯款 (末5碼吻合)</span>
                    <button class="btn-action btn-add" style="padding:6px 12px; font-size:12px;" onclick="applySmartMatch(${t.id}, '${mBuyer}', ${txAmt})">💡 一鍵帶入核銷</button>
                  </div>
                `;
            }
          }

          const subTr = document.createElement('tr');
          subTr.className = 'sub-row';
          
          let uniqueBuyers = [...new Set(ctbcBills.map(b => b.name))].filter(Boolean).sort((a,b)=>a.localeCompare(b,'zh-TW'));
          let optionsHtml = '<option value="">請選擇要扣款配對的買家...</option>';
          uniqueBuyers.forEach(name => {
            const sel = (data.buyerName === name) ? 'selected' : '';
            optionsHtml += `<option value="${name}" ${sel}>${name}</option>`;
          });

          const savedBillIds = data.billIds || [];

          subTr.innerHTML = `
            <td colspan="8">
              <div class="sub-container">
                ${smartMatchHtml}
                <div style="font-size:13px; font-weight:bold; color:#1e293b;">🔍 將此筆 $${txAmt} 明細核銷買家帳單</div>
                <select id="buyer_select_${t.id}" style="padding:6px; font-size:12px; border-radius:4px; border:1px solid #cbd5e1; max-width:250px;" 
                        onchange="renderCheckboxes(${t.id}, this.value, ${txAmt})">
                  ${optionsHtml}
                </select>
                
                <div id="bill_checkboxes_${t.id}" style="margin-top:10px; display:flex; flex-direction:column; gap:6px;"></div>
                
                <div class="edit-box" style="margin-top:4px;">
                  <div class="form-group"><label>紀錄狀態</label><select id="e_status_${t.id}" style="width:140px;"><option value="in_progress" ${data.status === 'in_progress' ? 'selected' : ''}>⏳ 對帳中 (暫存)</option><option value="completed" ${data.status === 'completed' ? 'selected' : ''}>✅ 寫入並結算</option></select></div>
                  <div class="form-group" style="flex:1;"><label>結算備註</label><input type="text" id="e_memo_${t.id}" value="${data.memo || ''}" placeholder="例: 溢繳轉為購物金 / 第一筆分期..."></div>
                </div>

                <div style="display:flex; gap:10px;">
                  <button class="btn-action btn-save" onclick="saveSettlement(${t.id}, ${txAmt})">💾 寫入資料庫</button>
                  ${data.txId ? `<button class="btn-action btn-clear" onclick="deleteSettlement(${t.id})">❌ 取消關聯 (還原此筆)</button>` : ''}
                </div>
              </div>
            </td>
          `;
          tbody.appendChild(subTr);
          
          if(data.buyerName) {
            setTimeout(() => {
               window.renderCheckboxes(t.id, data.buyerName, txAmt);
               savedBillIds.forEach(bid => {
                 const chk = document.querySelector(`.bill-chk-${t.id}[value="${bid}"]`);
                 if(chk) chk.checked = true;
               });
               window.calcWallet(t.id, txAmt);
            }, 50);
          }
        }
      });

      document.getElementById('statsInfo').innerText = `顯示中: ${filtered.length} 筆 (第 ${currentPage}/${totalPages} 頁)`;
      renderPagination(totalPages);
      notifyHeight();
    };

    window.toggleRow = (id) => { expandedRows[id] = !expandedRows[id]; window.renderTable(); };

    // 一鍵帶入智能配對
    window.applySmartMatch = (txId, buyerName, txAmt) => {
        const sel = document.getElementById(`buyer_select_${txId}`);
        if(sel) {
            sel.value = buyerName;
            window.renderCheckboxes(txId, buyerName, txAmt);
            
            const tx = transactions.find(x => x.id === txId);
            const accClean = (tx.acc || '').replace(/\*/g, '');
            const noteClean = (tx.note || '').replace(/\*/g, '');
            
            setTimeout(() => {
                const checkboxes = document.querySelectorAll(`.bill-chk-${txId}`);
                checkboxes.forEach(chk => {
                    const b = ctbcBills.find(x => x.id === chk.value);
                    if (b && b.last5 && b.last5.length >= 4 && (accClean.includes(b.last5) || noteClean.includes(b.last5))) {
                        chk.checked = true;
                    }
                });
                window.calcWallet(txId, txAmt);
            }, 80);
        }
    };

    // 渲染帶有日期與末5碼的勾選清單 (加入已核銷過濾機制)
    window.renderCheckboxes = (txId, buyerName, currentAmt) => {
        const container = document.getElementById(`bill_checkboxes_${txId}`);
        if(!buyerName) { container.innerHTML = ''; return; }
        
        const otherSettlements = ctbcSettlements.filter(s => s.txId !== txId.toString());
        const settledBillIds = new Set();
        otherSettlements.forEach(s => {
            if (s.billIds) s.billIds.forEach(id => settledBillIds.add(id));
        });

        let allBuyerBills = ctbcBills.filter(b => b.name === buyerName && b.status !== '已外部結算');
        let buyerBills = [];
        let hiddenCount = 0;
        
        allBuyerBills.forEach(b => {
            if (settledBillIds.has(b.id)) hiddenCount++;
            else buyerBills.push(b);
        });

        let html = '<div style="font-size:12px; font-weight:bold; margin-bottom:4px; color:#475569;">👉 請勾選本次入帳要核銷的帳單：</div>';
        
        if(buyerBills.length === 0) {
            html += '<div style="font-size:12px; color:#ef4444;">此買家目前沒有待對帳的結算單。</div>';
        } else {
            buyerBills.forEach(b => {
               let noteHtml = b.note ? `<span style="margin-left:6px; color:#94a3b8;">📝 ${b.note}</span>` : '';
               html += `
                 <label class="bill-checkbox-label">
                    <div style="display:flex; align-items:center; gap:8px;">
                      <input type="checkbox" class="bill-chk-${txId}" value="${b.id}" data-amt="${b.expectedAmt||0}" onchange="calcWallet(${txId}, ${currentAmt})">
                      <span class="badge">${b.status}</span> 
                      <span style="font-weight:bold; color:#1e293b;">${b.group} - ${b.member} (${b.qty||0}張)</span>
                      <span style="color:#64748b; font-size:11px; margin-left:6px; border-left:1px solid #cbd5e1; padding-left:8px;">
                        📅 ${b.date || '未填'} │ 末5: ${b.last5 || '-'} ${noteHtml}
                      </span>
                    </div>
                    <div style="color:#dc2626; font-weight:bold;">應匯: $${b.expectedAmt||0}</div>
                 </label>
               `;
            });
        }
        
        if (hiddenCount > 0) {
            html += `<div style="font-size:11px; color:#94a3b8; margin-top:6px;">(💡 系統已自動隱藏 ${hiddenCount} 筆已被其他匯款核銷的帳單)</div>`;
        }
        
        html += `<div id="wallet_info_${txId}" style="background:#e8f4ff; border:1px solid #c6e2ff; padding:10px; border-radius:6px; margin-top:8px; display:none;"></div>`;
        container.innerHTML = html;
        window.calcWallet(txId, currentAmt);
    };

    window.calcWallet = (txId, currentAmt) => {
        const checkboxes = document.querySelectorAll(`.bill-chk-${txId}:checked`);
        let totalSelected = 0;
        checkboxes.forEach(chk => totalSelected += Number(chk.dataset.amt));
        
        const remaining = currentAmt - totalSelected;
        const walletDiv = document.getElementById(`wallet_info_${txId}`);
        
        if(walletDiv) {
            walletDiv.innerHTML = `
              <div style="display:flex; justify-content:space-between; max-width: 450px; font-size:12px; color:#303133;">
                  <div>勾選核銷帳單總額：<b>$${totalSelected}</b></div>
                  <div>本次中信存入：<b style="color:#2563eb;">+$${currentAmt}</b></div>
              </div>
              <div style="margin-top:6px; font-weight:bold; font-size:13px; color:${remaining >= 0 ? '#16a34a' : '#dc2626'}">
                  試算結果：${remaining >= 0 ? `溢繳 $${remaining} (轉為購物金 / 溢繳紀錄)` : `少匯 -$${Math.abs(remaining)} (金額不足)`}
              </div>
            `;
            walletDiv.style.display = 'block';
        }
        notifyHeight();
    };

    window.saveSettlement = async (txId, txAmt) => {
      const buyerName = document.getElementById(`buyer_select_${txId}`).value;
      if(!buyerName) return alert('請先選擇配對的買家！');
      
      const checkboxes = document.querySelectorAll(`.bill-chk-${txId}:checked`);
      const billIds = Array.from(checkboxes).map(c => c.value);
      let settledBillsAmt = 0;
      checkboxes.forEach(chk => settledBillsAmt += Number(chk.dataset.amt));
      
      const status = document.getElementById(`e_status_${txId}`).value;
      const memo = document.getElementById(`e_memo_${txId}`).value;
      
      await setDoc(doc(db, "ctbc_settlements", txId.toString()), {
        txId: txId.toString(), buyerName, amount: txAmt, billIds, settledBillsAmt, status, memo, updatedAt: Date.now()
      });
      expandedRows[txId] = false; 
    };

    window.deleteSettlement = async (txId) => {
      if(confirm('確定要取消關聯並將此筆明細還原為未對帳嗎？')) {
        await deleteDoc(doc(db, "ctbc_settlements", txId.toString()));
        expandedRows[txId] = false;
      }
    };

    function renderPagination(totalPages) {
      const pContainer = document.getElementById('pagination');
      pContainer.innerHTML = '';
      if (totalPages <= 1) return;
      const prevBtn = document.createElement('button');
      prevBtn.className = 'page-btn';
      prevBtn.innerText = '上一頁';
      prevBtn.disabled = currentPage === 1;
      prevBtn.onclick = () => { currentPage--; window.renderTable(); };
      pContainer.appendChild(prevBtn);
      for(let i = 1; i <= totalPages; i++) {
        if (totalPages > 10 && Math.abs(i - currentPage) > 3 && i !== 1 && i !== totalPages) continue;
        const btn = document.createElement('button');
        btn.className = `page-btn ${i === currentPage ? 'active' : ''}`;
        btn.innerText = i;
        btn.onclick = () => { currentPage = i; window.renderTable(); };
        pContainer.appendChild(btn);
      }
      const nextBtn = document.createElement('button');
      nextBtn.className = 'page-btn';
      nextBtn.innerText = '下一頁';
      nextBtn.disabled = currentPage === totalPages;
      nextBtn.onclick = () => { currentPage++; window.renderTable(); };
      pContainer.appendChild(nextBtn);
      notifyHeight();
    }
  </script>
</body>
</html>
