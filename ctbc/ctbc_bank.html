<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>中國信託 內部結算與對帳系統</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 12px; margin: 0; background: #f8fafc; color: #334155; }
    h2 { margin: 0 0 4px 0; font-size: 18px; color: #0f172a; }
    .meta-info { font-size: 11px; color: #64748b; margin-bottom: 15px; }

    .card { background: #ffffff; padding: 12px 16px; border-radius: 10px; box-shadow: 0 2px 6px rgba(0,0,0,0.04); margin-bottom: 12px; border: 1px solid #e2e8f0; }
    .card h3 { margin-top: 0; margin-bottom: 10px; font-size: 14px; color: #1e293b; border-bottom: 1px solid #f1f5f9; padding-bottom: 4px; }

    .compact-form { display: flex; flex-wrap: wrap; gap: 8px 10px; align-items: flex-end; }
    .form-group { display: flex; flex-direction: column; }
    .form-group label { font-size: 11px; font-weight: bold; margin-bottom: 3px; color: #475569; white-space: nowrap; }
    .form-group label.required::after { content: " *"; color: #ef4444; }
    .form-group label.optional::after { content: " (選填)"; color: #94a3b8; font-weight: normal; }
    .form-group input, .form-group select { padding: 6px 8px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 12px; outline: none; box-sizing: border-box; }
    .form-group input:focus, .form-group select:focus { border-color: #3b82f6; }

    .filter-card { background: #fff; border: 1px solid #e4e7ed; border-radius: 12px; padding: 14px; margin-bottom: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.02); display: flex; flex-direction: column; gap: 10px; }
    .filter-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .filter-label { font-size: 12px; font-weight: bold; color: #606266; min-width: 80px; }
    .capsule-group { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
    .capsule-filter-btn { background: #f4f4f5; color: #606266; border: 1px solid #dcdfe6; padding: 6px 14px; border-radius: 16px; font-size: 12px; font-weight: bold; cursor: pointer; transition: all 0.2s; outline: none; }
    .capsule-filter-btn:hover { background: #ecf5ff; color: #409eff; border-color: #c6e2ff; }
    .capsule-filter-btn.active { background: #409eff; color: #fff; border-color: #409eff; box-shadow: 0 2px 6px rgba(64,158,255,0.25); }

    .search-bar { display: flex; gap: 8px; margin-bottom: 10px; align-items: center; }
    .search-bar input { flex: 1; max-width: 300px; padding: 6px 10px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 12px; }

    .stats-info { font-size: 12px; font-weight: bold; color: #0f172a; margin-bottom: 8px; }

    table { width: 100%; border-collapse: collapse; font-size: 12px; background: #fff; border-radius: 8px; overflow: hidden; border: 1px solid #e2e8f0; }
    th { background: #f1f5f9; color: #334155; text-align: left; padding: 8px 10px; border-bottom: 2px solid #e2e8f0; white-space: nowrap; }
    td { padding: 8px 10px; border-bottom: 1px solid #e2e8f0; }

    .income { color: #16a34a; font-weight: bold; }
    .expense { color: #dc2626; font-weight: bold; }
    .badge { background: #e2e8f0; color: #475569; padding: 2px 6px; border-radius: 4px; font-size: 11px; font-weight: bold; }
    .account-code { font-family: monospace; color: #1d4ed8; }

    .status-tag { display: inline-block; padding: 3px 8px; border-radius: 12px; font-size: 11px; font-weight: bold; }
    .status-pending { background: #f1f5f9; color: #64748b; border: 1px solid #cbd5e1; }
    .status-inprogress { background: #fdf6ec; color: #e6a23c; border: 1px solid #faebd7; }
    .status-completed { background: #e8f5e9; color: #2e7d32; border: 1px solid #c8e6c9; }

    .btn-toggle { padding: 4px 8px; background: #fff; border: 1px solid #cbd5e1; border-radius: 4px; font-size: 11px; cursor: pointer; color: #334155; font-weight: bold; }
    .btn-toggle.active { background: #f8fafc; border-color: #94a3b8; }
    .sub-row { background: #f8fafc; border-bottom: 2px solid #cbd5e1; }
    .sub-container { padding: 12px 16px; display: flex; flex-direction: column; gap: 10px; }
    .edit-box { background: #fff; border: 1px dashed #94a3b8; padding: 12px; border-radius: 8px; display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-end; }
    
    .btn-action { padding: 6px 12px; border-radius: 6px; font-size: 12px; font-weight: bold; cursor: pointer; border: none; color: #fff; }
    .btn-save { background: #409eff; } .btn-save:hover { background: #3385ff; }
    .btn-clear { background: #f56c6c; } .btn-clear:hover { background: #dd6161; }

    .pagination { display: flex; justify-content: center; gap: 5px; margin-top: 12px; flex-wrap: wrap; }
    .page-btn { padding: 4px 8px; border: 1px solid #cbd5e1; background: #fff; border-radius: 4px; font-size: 12px; cursor: pointer; }
    .page-btn.active { background: #2563eb; color: #fff; border-color: #2563eb; }
  </style>
  <script src="ctbc_data.js"></script>
</head>
<body>

  <h2>🏦 中國信託 內部結算與對帳系統</h2>
  <div class="meta-info">帳號: 783540130964 | 幣別: TWD | 資料獨立於前台，專作事後核帳</div>

  <div class="card">
    <h3>📝 1. 建立買家結算單 (建立應付帳款)</h3>
    <form id="orderForm" class="compact-form">
      <div class="form-group">
        <label class="required">1. 團體</label>
        <select id="f_group">
          <option value="">請選擇團體</option>
          <option value="Stray Kids">Stray Kids</option>
          <option value="ATEEZ">ATEEZ</option>
        </select>
      </div>
      <div class="form-group"><label class="required">2. 買家暱稱</label><input type="text" id="f_name" placeholder="填寫暱稱" style="width:120px;"></div>
      <div class="form-group">
        <label class="required">3. 場次/活動</label>
        <select id="f_event" onchange="toggleCustomEvent(this)">
          <option value="">請選擇場次</option>
          <option value="260328 D1">260328 D1</option>
          <option value="260329 D2">260329 D2</option>
          <option value="260404 D3">260404 D3</option>
          <option value="260405 D4">260405 D4</option>
          <option value="other">自訂活動...</option>
        </select>
      </div>
      <div class="form-group" id="custom_event_group" style="display:none;">
        <label class="required">自訂活動</label>
        <input type="text" id="f_custom_event" placeholder="輸入活動" style="width:100px;">
      </div>
      <div class="form-group"><label class="optional">4. 成員 (選填)</label><select id="f_member"><option value="">無</option></select></div>
      <div class="form-group"><label class="optional">5. 總應付金額</label><input type="number" id="f_expectedAmt" placeholder="建立欠款總額" style="width:100px;"></div>
      <div class="form-group"><label class="optional">備註</label><input type="text" id="f_note" style="width:150px;"></div>
      <button type="button" class="btn-action" style="background:#2563eb; height:31px;" onclick="addQuickOrder()">＋ 新增結算單</button>
    </form>
  </div>

  <div class="filter-card">
    <div class="filter-row">
      <span class="filter-label">對帳狀態：</span>
      <div class="capsule-group">
        <button class="capsule-filter-btn active" onclick="setMainFilter('all', this)">📋 全部明細</button>
        <button class="capsule-filter-btn" onclick="setMainFilter('pending', this)">📌 未對帳</button>
        <button class="capsule-filter-btn" onclick="setMainFilter('in_progress', this)">⏳ 對帳中</button>
        <button class="capsule-filter-btn" onclick="setMainFilter('completed', this)">✅ 已結算</button>
      </div>
    </div>
  </div>

  <div class="search-bar">
    <input type="text" id="searchInput" placeholder="🔍 輸入後五碼、金額、日期等篩選關聯明細..." onkeyup="renderTable()">
  </div>

  <div class="stats-info" id="statsInfo">載入中...</div>

  <div style="overflow-x:auto;">
    <table>
      <thead>
        <tr>
          <th style="width:70px;">操作</th>
          <th>交易日期時間</th>
          <th>支出</th>
          <th>存入</th>
          <th>結餘</th>
          <th>備註</th>
          <th>對方帳號 / 說明</th>
          <th>狀態</th>
        </tr>
      </thead>
      <tbody id="bankTable"></tbody>
    </table>
  </div>

  <div class="pagination" id="pagination"></div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, onSnapshot, doc, setDoc, deleteDoc, addDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDF7QySG1Jj4gdZvXwMRaKjRmI-lFKpj7k",
      authDomain: "forsure0922.firebaseapp.com",
      databaseURL: "https://forsure0922-default-rtdb.firebaseio.com",
      projectId: "forsure0922",
      storageBucket: "forsure0922.firebasestorage.app",
      messagingSenderId: "817449290174",
      appId: "1:817449290174:web:6b4ec1d36c171ff97011ef"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let transactions = window.rawTransactions || [];
    let ctbcBills = [];
    let ctbcSettlements = [];
    
    let expandedRows = {};
    let currentMainFilter = 'all';
    let currentPage = 1;
    const pageSize = 50;
    let memberMap = {};

    document.addEventListener('DOMContentLoaded', async () => {
      try {
        const skzRes = await fetch('../json/members_skz.json');
        memberMap['Stray Kids'] = await skzRes.json();
        const atzRes = await fetch('../json/members_atz.json');
        memberMap['ATEEZ'] = await atzRes.json();
      } catch(e) {}

      document.getElementById('f_group').addEventListener('change', function() {
        const memSel = document.getElementById('f_member');
        memSel.innerHTML = '<option value="">無</option>';
        const arr = memberMap[this.value] || [];
        arr.forEach(m => memSel.innerHTML += `<option value="${m}">${m}</option>`);
      });

      // 監聽專屬資料庫
      onSnapshot(collection(db, "ctbc_bills"), snap => {
        ctbcBills = snap.docs.map(d => ({id: d.id, ...d.data()}));
        if(Object.keys(expandedRows).length > 0) renderTable(); // 若有展開列則重新渲染買家選單
      });

      onSnapshot(collection(db, "ctbc_settlements"), snap => {
        ctbcSettlements = snap.docs.map(d => ({id: d.id, ...d.data()}));
        renderTable();
      });
    });

    window.toggleCustomEvent = (sel) => {
      document.getElementById('custom_event_group').style.display = sel.value === 'other' ? 'flex' : 'none';
    };

    window.addQuickOrder = async () => {
      const name = document.getElementById('f_name').value;
      const group = document.getElementById('f_group').value;
      let event = document.getElementById('f_event').value;
      const member = document.getElementById('f_member').value;
      const expectedAmt = document.getElementById('f_expectedAmt').value || 0;
      const note = document.getElementById('f_note').value;

      if(event === 'other') event = document.getElementById('f_custom_event').value;
      if(!group || !name || !event) { alert("請填寫 團體、暱稱、場次！"); return; }
      
      await addDoc(collection(db, "ctbc_bills"), {
        name, group, event, member, expectedAmt: Number(expectedAmt), note, createdAt: Date.now()
      });
      
      alert("結算單建立成功！你現在可以在下方明細中選擇該買家進行扣款對帳。");
      document.getElementById('orderForm').reset();
      document.getElementById('custom_event_group').style.display = 'none';
    };

    window.setMainFilter = (filter, btn) => {
      currentMainFilter = filter;
      document.querySelectorAll('.filter-card .capsule-filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentPage = 1;
      renderTable();
    };

    function getStatusInfo(txId) {
      const state = ctbcSettlements.find(s => s.txId === txId.toString());
      if(!state) return { text: '📌 未對帳', class: 'status-pending', data: null };
      if(state.status === 'in_progress') return { text: '⏳ 對帳中', class: 'status-inprogress', data: state };
      return { text: '✅ 已結算', class: 'status-completed', data: state };
    }

    window.renderTable = () => {
      const tbody = document.getElementById('bankTable');
      tbody.innerHTML = '';
      const searchVal = document.getElementById('searchInput').value.toLowerCase();

      let filtered = transactions.filter(t => {
        const stateInfo = getStatusInfo(t.id);
        const st = stateInfo.data ? stateInfo.data.status : 'pending';
        
        if (currentMainFilter === 'pending' && st !== 'pending') return false;
        if (currentMainFilter === 'in_progress' && st !== 'in_progress') return false;
        if (currentMainFilter === 'completed' && st !== 'completed') return false;
        
        if (searchVal) {
          const combinedStr = `${t.date} ${t.exp} ${t.inc} ${t.balance} ${t.note} ${t.acc}`.toLowerCase();
          if (!combinedStr.includes(searchVal)) return false;
        }
        return true;
      });

      const totalPages = Math.ceil(filtered.length / pageSize) || 1;
      if (currentPage > totalPages) currentPage = totalPages;
      const pageData = filtered.slice((currentPage - 1) * pageSize, currentPage * pageSize);

      pageData.forEach(t => {
        const isExp = expandedRows[t.id];
        const stateInfo = getStatusInfo(t.id);
        const data = stateInfo.data || {};
        
        // 取得該筆的實際操作金額 (通常為存入，有時為支出退款)
        const txAmt = Number(t.inc || t.exp || 0);

        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td><button class="btn-toggle ${isExp ? 'active' : ''}" onclick="toggleRow(${t.id})">${isExp ? '收起▲' : '核對▼'}</button></td>
          <td>${t.date}</td>
          <td class="expense">${t.exp ? '-' + t.exp : ''}</td>
          <td class="income">${t.inc ? '+' + t.inc : ''}</td>
          <td style="font-weight:bold;">${t.balance}</td>
          <td>${t.note ? `<span class="badge">${t.note}</span>` : ''}</td>
          <td class="account-code">${t.acc}</td>
          <td><span class="status-tag ${stateInfo.class}">${stateInfo.text}</span></td>
        `;
        tbody.appendChild(tr);

        if (isExp) {
          const subTr = document.createElement('tr');
          subTr.className = 'sub-row';
          
          let uniqueBuyers = [...new Set(ctbcBills.map(b => b.name))].filter(Boolean).sort((a,b)=>a.localeCompare(b,'zh-TW'));
          let optionsHtml = '<option value="">請選擇要扣款配對的買家...</option>';
          uniqueBuyers.forEach(name => {
            const sel = (data.buyerName === name) ? 'selected' : '';
            optionsHtml += `<option value="${name}" ${sel}>${name}</option>`;
          });

          subTr.innerHTML = `
            <td colspan="8">
              <div class="sub-container">
                <div style="font-size:13px; font-weight:bold; color:#1e293b;">🔍 將此筆 $${txAmt} 明細匯入買家帳戶</div>
                <select id="buyer_select_${t.id}" style="padding:6px; font-size:12px; border-radius:4px; border:1px solid #cbd5e1; max-width:250px;" 
                        onchange="calcWallet(${t.id}, this.value, ${txAmt})">
                  ${optionsHtml}
                </select>
                
                <!-- 買家錢包即時試算區 -->
                <div id="wallet_info_${t.id}" style="background:#e8f4ff; border:1px solid #c6e2ff; padding:10px; border-radius:6px; display:none;"></div>
                
                <div class="edit-box" style="margin-top:2px;">
                  <div class="form-group">
                    <label>紀錄狀態</label>
                    <select id="e_status_${t.id}" style="width:140px;">
                      <option value="in_progress" ${data.status === 'in_progress' ? 'selected' : ''}>⏳ 對帳中 (暫存)</option>
                      <option value="completed" ${data.status === 'completed' ? 'selected' : ''}>✅ 寫入並結算</option>
                    </select>
                  </div>
                  <div class="form-group" style="flex:1;"><label>結算備註</label><input type="text" id="e_memo_${t.id}" value="${data.memo || ''}" placeholder="例: 溢繳轉為購物金 / 第一筆分期..."></div>
                </div>

                <div style="display:flex; gap:10px;">
                  <button class="btn-action btn-save" onclick="saveSettlement(${t.id}, ${txAmt})">💾 寫入資料庫</button>
                  ${data.txId ? `<button class="btn-action btn-clear" onclick="deleteSettlement(${t.id})">❌ 取消關聯 (還原此筆)</button>` : ''}
                </div>
              </div>
            </td>
          `;
          tbody.appendChild(subTr);
          
          // 若之前已經配對過，展開時直接計算顯示
          if(data.buyerName) {
            setTimeout(() => window.calcWallet(t.id, data.buyerName, txAmt), 50);
          }
        }
      });

      document.getElementById('statsInfo').innerText = `顯示中: ${filtered.length} 筆 (第 ${currentPage}/${totalPages} 頁)`;
      renderPagination(totalPages);
    };

    window.toggleRow = (id) => { expandedRows[id] = !expandedRows[id]; window.renderTable(); };

    window.calcWallet = (txId, buyerName, currentAmt) => {
      const walletDiv = document.getElementById(`wallet_info_${txId}`);
      if(!buyerName) { walletDiv.style.display = 'none'; return; }
      
      // 計算該買家的總應付金額 (從 ctbcBills 中加總)
      let totalExpected = ctbcBills.filter(b => b.name === buyerName).reduce((sum, b) => sum + Number(b.expectedAmt||0), 0);
      
      // 計算該買家 "排除當前這筆" 的已付款總和
      let totalPaid = ctbcSettlements
                        .filter(s => s.buyerName === buyerName && s.txId !== txId.toString())
                        .reduce((sum, s) => sum + Number(s.amount||0), 0);
      
      // 結算試算
      let remaining = totalExpected - totalPaid - currentAmt;
      
      walletDiv.innerHTML = `
        <div style="display:flex; justify-content:space-between; max-width: 450px; font-size:12px; color:#303133;">
            <div>該買家總應付：<b>$${totalExpected}</b></div>
            <div>過去已對帳：<b>$${totalPaid}</b></div>
            <div>本次欲認列：<b style="color:#2563eb;">+$${currentAmt}</b></div>
        </div>
        <div style="margin-top:6px; font-weight:bold; font-size:13px; color:${remaining <= 0 ? '#16a34a' : '#dc2626'}">
            試算後尚欠：$${remaining > 0 ? remaining : 0} ${remaining < 0 ? `(溢繳 $${Math.abs(remaining)} 可作購物金)` : ''}
        </div>
      `;
      walletDiv.style.display = 'block';
    };

    window.saveSettlement = async (txId, txAmt) => {
      const buyerName = document.getElementById(`buyer_select_${txId}`).value;
      if(!buyerName) return alert('請先選擇配對的買家！');
      
      const status = document.getElementById(`e_status_${txId}`).value;
      const memo = document.getElementById(`e_memo_${txId}`).value;
      
      await setDoc(doc(db, "ctbc_settlements", txId.toString()), {
        txId: txId.toString(),
        buyerName,
        amount: txAmt,
        status,
        memo,
        updatedAt: Date.now()
      });
      expandedRows[txId] = false; 
    };

    window.deleteSettlement = async (txId) => {
      if(confirm('確定要取消關聯並將此筆明細還原為未對帳嗎？')) {
        await deleteDoc(doc(db, "ctbc_settlements", txId.toString()));
        expandedRows[txId] = false;
      }
    };

    function renderPagination(totalPages) {
      const pContainer = document.getElementById('pagination');
      pContainer.innerHTML = '';
      if (totalPages <= 1) return;
      const prevBtn = document.createElement('button');
      prevBtn.className = 'page-btn';
      prevBtn.innerText = '上一頁';
      prevBtn.disabled = currentPage === 1;
      prevBtn.onclick = () => { currentPage--; window.renderTable(); };
      pContainer.appendChild(prevBtn);
      
      for(let i = 1; i <= totalPages; i++) {
        if (totalPages > 10 && Math.abs(i - currentPage) > 3 && i !== 1 && i !== totalPages) continue;
        const btn = document.createElement('button');
        btn.className = `page-btn ${i === currentPage ? 'active' : ''}`;
        btn.innerText = i;
        btn.onclick = () => { currentPage = i; window.renderTable(); };
        pContainer.appendChild(btn);
      }
      
      const nextBtn = document.createElement('button');
      nextBtn.className = 'page-btn';
      nextBtn.innerText = '下一頁';
      nextBtn.disabled = currentPage === totalPages;
      nextBtn.onclick = () => { currentPage++; window.renderTable(); };
      pContainer.appendChild(nextBtn);
    }
  </script>
</body>
</html>
