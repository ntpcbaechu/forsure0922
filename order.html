<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>表單填寫</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      margin: 0;
      padding: 20px;
      background-color: #f5f5f7;
      color: #333;
    }
    .container {
      max-width: 600px;
      margin: 0 auto;
      background: #fff;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
    }
    h1 {
      text-align: center;
      margin-bottom: 24px;
      color: #1d1d1f;
    }
    .form-group {
      margin-bottom: 20px;
    }
    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
    }
    select, input[type="text"], input[type="number"] {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      box-sizing: border-box;
      font-size: 16px;
    }
    button {
      width: 100%;
      padding: 14px;
      background-color: #0071e3;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover {
      background-color: #0077ed;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>登記表單</h1>
    <form id="orderForm">
      <div class="form-group">
        <label for="user">社群名稱 / 暱稱 *</label>
        <select id="user" required>
          <option value="">載入成員名單中...</option>
        </select>
      </div>

      <button type="submit">提交</button>
    </form>
  </div>

  <script>
    // 自動載入 users.json 的成員名單
    document.addEventListener('DOMContentLoaded', () => {
      fetch('users.json')
        .then(response => {
          if (!response.ok) {
            throw new Error('無法讀取 users.json 檔案');
          }
          return response.json();
        })
        .then(users => {
          const userSelect = document.getElementById('user');
          userSelect.innerHTML = '<option value="">請選擇您的名稱</option>';
          users.forEach(user => {
            const option = document.createElement('option');
            option.value = user;
            option.textContent = user;
            userSelect.appendChild(option);
          });
        })
        .catch(error => {
          console.error('讀取名單失敗:', error);
          const userSelect = document.getElementById('user');
          userSelect.innerHTML = '<option value="">載入名單失敗，請刷洗頁面重試</option>';
        });
    });
  </script>
</body>
</html>
