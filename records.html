<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登記與對帳進度查詢</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 10px; margin: 0; background: #fff; color: #333; }
    .group-card { background: #fff; border: 1px solid #e4e7ed; border-radius: 12px; margin-bottom: 20px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.03); }
    .group-header { background: #f8f9fa; padding: 12px 16px; font-weight: bold; font-size: 15px; color: #303133; border-bottom: 1px solid #e4e7ed; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; }
    .group-badge { font-size: 12px; background: #ecf5ff; color: #409eff; padding: 3px 8px; border-radius: 4px; font-weight: normal; }
    
    /* 預設電腦版表格 */
    .table-wrapper { width: 100%; overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 10px 12px; text-align: left; font-size: 13px; border-bottom: 1px solid #f0f2f5; white-space: nowrap; }
    th { background: #fafafa; color: #909399; font-weight: 600; font-size: 12px; }
    tr:last-child td { border-bottom: none; }

    /* 手機版卡片清單 (預設隱藏) */
    .mobile-list { display: none; padding: 10px; }
    .mobile-item { background: #fff; border: 1px solid #ebeef5; border-radius: 8px; padding: 12px; margin-bottom: 10px; box-shadow: 0 1px 4px rgba(0,0,0,0.02); }
    .mobile-item-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; border-bottom: 1px dashed #f0f2f5; padding-bottom: 6px; }
    .mobile-item-title { font-weight: bold; font-size: 15px; color: #303133; }
    .mobile-item-row { font-size: 13px; color: #606266; margin-bottom: 4px; display: flex; justify-content: space-between; }

    /* 狀態標籤 */
    .status-tag { padding: 3px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; display: inline-block; }
    .status-registered { background: #f4f4f5; color: #909399; }
    .status-unpaid { background: #fef0f0; color: #f56c6c; border: 1px solid #fde2e2; }
    .status-pending { background: #fdf6ec; color: #e6a23c; }
    .status-ok { background: #f0f9eb; color: #67c23a; }
    .status-photo { background: #e8f4ff; color: #1890ff; }
    .status-err { background: #fef0f0; color: #f56c6c; border: 1px solid #f56c6c; }

    /* 手機螢幕響應式切換 (< 600px 自動切換為卡片) */
    @media (max-width: 600px) {
      .table-wrapper { display: none; }
      .mobile-list { display: block; }
    }
  </style>
</head>
<body>

  <h3 style="font-size: 17px; margin-top:0; margin-bottom: 8px;">📌 登記與對帳進度查詢</h3>
  <p style="font-size: 12px; color: #909399; margin-top: 0; margin-bottom: 15px;">💡 已發圖之項目，雲端圖檔預計將於發圖後 7 天自動刪除，請務必及時下載備份。</p>
  
  <div id="recordsContainer">載入紀錄中...</div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDF7QySG1Jj4gdZvXwMRaKjRmI-lFKpj7k",
      authDomain: "forsure0922.firebaseapp.com",
      databaseURL: "https://forsure0922-default-rtdb.firebaseio.com",
      projectId: "forsure0922",
      storageBucket: "forsure0922.firebasestorage.app",
      messagingSenderId: "817449290174",
      appId: "1:817449290174:web:6b4ec1d36c171ff97011ef"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const memberOrder = ["方燦", "Lee Know", "彰彬", "鉉辰", "Han", "Felix", "昇玟", "I.N", "團體/全體"];

    let paymentsMap = {};
    let photoProgressMap = {};

    onSnapshot(collection(db, "payments"), snap => {
      paymentsMap = {};
      snap.forEach(doc => {
        const p = doc.data();
        if (p.orderId) paymentsMap[p.orderId] = p;
      });
      renderOrders();
    });

    onSnapshot(collection(db, "photo_progress"), snap => {
      photoProgressMap = {};
      snap.forEach(doc => {
        const p = doc.data();
        const key = `${p.event}__${p.member}`;
        photoProgressMap[key] = p;
      });
      renderOrders();
    });

    let currentOrdersSnap = null;

    // 嚴格依 createdAt (建立登記時間) 排序
    onSnapshot(query(collection(db, "orders"), orderBy("createdAt", "asc")), (snapshot) => {
      currentOrdersSnap = snapshot;
      renderOrders();
    });

    function renderOrders() {
      if (!currentOrdersSnap) return;

      const container = document.getElementById('recordsContainer');
      container.innerHTML = '';

      if (currentOrdersSnap.empty) {
        container.innerHTML = '<div style="text-align:center; padding:20px; color:#909399;">目前尚無登記紀錄。</div>';
        notifyHeight();
        return;
      }

      const groups = {};

      currentOrdersSnap.forEach(doc => {
        const data = doc.data();
        const orderId = doc.id;
        const eventName = data.event || data.fullEvent || data.eventName || '未分類活動';
        const member = data.member || '未知成員';
        const groupKey = `${eventName}__${member}`;

        if (!groups[groupKey]) {
          groups[groupKey] = { eventName, member, items: [], totalQty: 0 };
        }

        groups[groupKey].items.push({ id: orderId, eventName, member, ...data });
        groups[groupKey].totalQty += (parseInt(data.qty) || 0);
      });

      const sortedKeys = Object.keys(groups).sort((a, b) => {
        const gA = groups[a];
        const gB = groups[b];
        if (gA.eventName !== gB.eventName) return gA.eventName.localeCompare(gB.eventName);
        const idxA = memberOrder.indexOf(gA.member);
        const idxB = memberOrder.indexOf(gB.member);
        return (idxA === -1 ? 99 : idxA) - (idxB === -1 ? 99 : idxB);
      });

      sortedKeys.forEach(key => {
        const group = groups[key];
        const photoProg = photoProgressMap[key];
        
        const card = document.createElement('div');
        card.className = 'group-card';

        let rowsHtml = '';
        let mobileCardsHtml = '';

        group.items.forEach((item, index) => {
          const payData = paymentsMap[item.id];
          
          let updateTimeStr = item.time || (item.createdAt ? new Date(item.createdAt.seconds * 1000).toLocaleString('zh-TW', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit', hour12: false }) : '');
          if (payData && payData.createdAt) {
            updateTimeStr = new Date(payData.createdAt.seconds * 1000).toLocaleString('zh-TW', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit', hour12: false });
          }

          let bankLast5 = '-';
          if (payData && payData.bankLast5) {
            bankLast5 = payData.bankLast5.substring(0, 2) + '***';
          }

          const photoStatus = photoProg ? photoProg.status : '';
          const isPhotoSent = photoStatus === '已發圖';
          const isWaitingForPhoto = photoStatus.includes('等圖') || photoStatus.includes('製作') || photoStatus.includes('催圖');

          let statusHtml = '<span class="status-tag status-registered">📝 已登記</span>';
          let deleteDateStr = '-';

          if (isPhotoSent) {
            statusHtml = '<span class="status-tag status-photo">✅ 已發圖</span>';
            if (photoProg.sentDate) {
              const d = new Date(photoProg.sentDate);
              d.setDate(d.getDate() + 7);
              deleteDateStr = `🗓️ ${d.toISOString().split('T')[0]}`;
            } else {
              deleteDateStr = '🗓️ 發圖後+7天';
            }
          } else if (item.hasPaid) {
            const payStatus = payData ? (payData.status || 'pending') : 'pending';
            if (payStatus === 'ok') {
              statusHtml = '<span class="status-tag status-ok">🟢 已對帳</span>';
            } else if (payStatus === 'error') {
              statusHtml = '<span class="status-tag status-err">🔴 對帳問題</span>';
            } else {
              statusHtml = '<span class="status-tag status-pending">🟡 待對帳</span>';
            }
          } else if (isWaitingForPhoto) {
            statusHtml = '<span class="status-tag status-unpaid">⏳ 待匯款</span>';
          }

          // 電腦版表格行
          rowsHtml += `
            <tr>
              <td style="width:25px; text-align:center; color:#909399;">${index + 1}</td>
              <td style="color:#606266;">${updateTimeStr}</td>
              <td><b>${item.user}</b></td>
              <td><b>${item.qty}</b> 張</td>
              <td style="font-family:monospace; color:#606266;">${bankLast5}</td>
              <td>${statusHtml}</td>
              <td style="color:#f56c6c; font-size:12px;">${deleteDateStr}</td>
            </tr>
          `;

          // 手機版卡片項
          mobileCardsHtml += `
            <div class="mobile-item">
              <div class="mobile-item-header">
                <span class="mobile-item-title">#${index + 1} ${item.user}</span>
                <div>${statusHtml}</div>
              </div>
              <div class="mobile-item-row">
                <span>▫️ 喊單張數：</span><b>${item.qty} 張</b>
              </div>
              <div class="mobile-item-row">
                <span>▫️ 填單 / 更新時間：</span><span style="color:#606266;">${updateTimeStr}</span>
              </div>
              <div class="mobile-item-row">
                <span>▫️ 匯款帳號末 5 碼：</span><span style="font-family:monospace;">${bankLast5}</span>
              </div>
              ${isPhotoSent ? `<div class="mobile-item-row" style="color:#f56c6c;"><span>▫️ 圖檔預計刪除日：</span><b>${deleteDateStr}</b></div>` : ''}
            </div>
          `;
        });

        card.innerHTML = `
          <div class="group-header">
            <div>📌 ${group.eventName} - <span style="color:#409eff;">${group.member}</span></div>
            <div class="group-badge">共 ${group.items.length} 筆 / 總計 ${group.totalQty} 張</div>
          </div>
          
          <!-- 電腦版視圖 -->
          <div class="table-wrapper">
            <table>
              <thead>
                <tr>
                  <th style="width:25px; text-align:center;">#</th>
                  <th>填單 / 更新時間</th>
                  <th>社群名稱</th>
                  <th>張數</th>
                  <th>匯款帳號</th>
                  <th>對帳狀態</th>
                  <th>雲端圖檔預計刪除日</th>
                </tr>
              </thead>
              <tbody>
                ${rowsHtml}
              </tbody>
            </table>
          </div>

          <!-- 手機版視圖 -->
          <div class="mobile-list">
            ${mobileCardsHtml}
          </div>
        `;

        container.appendChild(card);
      });

      notifyHeight();
    }

    function notifyHeight() {
      setTimeout(() => { window.parent.postMessage({ frameHeight: document.body.scrollHeight }, '*'); }, 100);
    }
  </script>

</body>
</html>
