<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FORSURE🐶📸</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 15px; max-width: 680px; margin: 0 auto; background-color: #f4f6f8; color: #333; }
    .card { background: #ffffff; padding: 20px; border-radius: 16px; box-shadow: 0 8px 20px rgba(0,0,0,0.06); }
    h1 { font-size: 22px; margin-top: 0; margin-bottom: 20px; color: #222; text-align: center; }
    
    .nav-tabs { display: flex; border-bottom: 2px solid #e4e7ed; margin-bottom: 15px; gap: 4px; overflow-x: auto; }
    .tab-btn { padding: 10px 12px; cursor: pointer; border: none; background: none; font-weight: 600; color: #909399; font-size: 14px; white-space: nowrap; }
    .tab-btn.active { color: #409eff; border-bottom: 2px solid #409eff; }

    /* 嵌入框架：動態載入各個獨立的 html 頁面 */
    iframe { width: 100%; height: 600px; border: none; border-radius: 8px; }

    /* 底部隱形管理連結 */
    .secret-footer { text-align: center; margin-top: 25px; margin-bottom: 10px; }
    .secret-admin-link { color: #ffffff; font-size: 10px; text-decoration: none; user-select: none; }
    .secret-admin-link:hover { color: #dcdfe6; }
  </style>
</head>
<body>

  <div class="card">
    <h1>FORSURE🐶📸</h1>

    <div class="nav-tabs">
      <button class="tab-btn active" onclick="loadTab('progress.html', 0)">🔥 開團與進度</button>
      <button class="tab-btn" onclick="loadTab('order.html', 1)">📝 登記表單</button>
      <button class="tab-btn" onclick="loadTab('payment.html', 2)">💰 匯款表單</button>
      <button class="tab-btn" onclick="loadTab('records.html', 3)">🔍 查詢登記</button>
      <button class="tab-btn" onclick="loadTab('credit.html', 4)">💳 抵用金查詢</button>
    </div>

    <iframe id="mainFrame" src="progress.html"></iframe>
  </div>

  <div class="secret-footer">
    <a href="admin.html" class="secret-admin-link">管理頁面</a>
  </div>

  <script>
    function loadTab(page, idx) {
      document.getElementById('mainFrame').src = page;
      document.querySelectorAll('.tab-btn').forEach((btn, i) => {
        btn.classList.toggle('active', i === idx);
      });
    }
  </script>

</body>
</html>
