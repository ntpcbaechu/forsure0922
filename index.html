<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FORSURE🐶📸</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 15px; max-width: 800px; margin: 0 auto; background-color: #f4f6f8; color: #333; }
    .card { background: #ffffff; padding: 20px; border-radius: 16px; box-shadow: 0 8px 20px rgba(0,0,0,0.06); }
    h1 { font-size: 22px; margin-top: 0; margin-bottom: 20px; color: #222; text-align: center; }
    
    .nav-tabs { display: flex; border-bottom: 2px solid #e4e7ed; margin-bottom: 15px; gap: 4px; overflow-x: auto; -webkit-overflow-scrolling: touch; }
    .nav-tabs::-webkit-scrollbar { display: none; }
    .tab-btn { padding: 10px 14px; cursor: pointer; border: none; background: none; font-weight: 600; color: #909399; font-size: 14px; white-space: nowrap; flex-shrink: 0; }
    .tab-btn.active { color: #409eff; border-bottom: 2px solid #409eff; }

    /* 內嵌框架：高度自動自適應無雙重滾動條 */
    iframe { width: 100%; height: 600px; border: none; border-radius: 8px; transition: height 0.2s ease; }

    /* 底部置中白色隱形管理頁面連結 */
    .secret-footer { text-align: center; margin-top: 25px; margin-bottom: 10px; }
    .secret-admin-link { color: #ffffff; font-size: 10px; text-decoration: none; user-select: none; }
    .secret-admin-link:hover { color: #dcdfe6; }

    @media (max-width: 600px) {
      body { padding: 10px; }
      .card { padding: 15px; border-radius: 12px; }
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>FORSURE🐶📸</h1>

    <div class="nav-tabs">
      <button class="tab-btn active" onclick="loadTab('progress.html', 0)">🔥 開團與進度</button>
      <button class="tab-btn" onclick="loadTab('order.html', 1)">📝 登記表單</button>
      <button class="tab-btn" onclick="loadTab('payment.html', 2)">💰 匯款表單</button>
      <button class="tab-btn" onclick="loadTab('records.html', 3)">🔍 查詢登記</button>
      <button class="tab-btn" onclick="loadTab('credit.html', 4)">💳 抵用金查詢</button>
    </div>

    <iframe id="mainFrame" src="progress.html" onload="adjustFrameHeight()"></iframe>
  </div>

  <div class="secret-footer">
    <a href="admin.html" class="secret-admin-link">管理頁面</a>
  </div>

  <script>
    function loadTab(page, idx) {
      const frame = document.getElementById('mainFrame');
      frame.src = page;
      document.querySelectorAll('.tab-btn').forEach((btn, i) => {
        btn.classList.toggle('active', i === idx);
      });
    }

    function adjustFrameHeight() {
      const frame = document.getElementById('mainFrame');
      try {
        if (frame.contentWindow.document.body) {
          const h = frame.contentWindow.document.body.scrollHeight;
          frame.style.height = (h + 30) + 'px';
        }
      } catch (e) {
        frame.style.height = '650px';
      }
    }

    // 當子頁面內容動態變動時自動重測高度
    window.addEventListener('message', function(e) {
      if (e.data && e.data.frameHeight) {
        document.getElementById('mainFrame').style.height = (e.data.frameHeight + 30) + 'px';
      }
    });
  </script>

</body>
</html>
