<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FORSURE🐶📸</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 20px; max-width: 480px; margin: 0 auto; background-color: #f4f6f8; color: #333; }
    .card { background: #ffffff; padding: 28px 24px; border-radius: 16px; box-shadow: 0 8px 20px rgba(0,0,0,0.06); text-align: center; }
    h1 { font-size: 26px; margin-top: 0; margin-bottom: 8px; color: #222; }
    p.subtitle { color: #909399; font-size: 14px; margin-bottom: 24px; }
    
    .menu-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 20px; }
    .menu-btn { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 18px 10px; background-color: #ffffff; border: 1px solid #e4e7ed; border-radius: 12px; text-decoration: none; color: #333; font-weight: bold; font-size: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.02); transition: all 0.2s; }
    .menu-btn:hover { border-color: #409eff; color: #409eff; transform: translateY(-2px); box-shadow: 0 6px 14px rgba(64,158,255,0.12); }
    .menu-btn .icon { font-size: 24px; margin-bottom: 8px; }

    .progress-box { margin-top: 24px; text-align: left; background: #f8f9fa; border-radius: 12px; padding: 16px; border: 1px solid #ebeef5; }
    .progress-box h3 { font-size: 15px; margin-top: 0; margin-bottom: 12px; color: #444; display: flex; justify-content: space-between; align-items: center; }
    .progress-item { background: #fff; border-radius: 8px; padding: 12px; margin-bottom: 10px; border: 1px solid #e4e7ed; }
    .progress-bar-bg { background-color: #ebeef5; border-radius: 10px; height: 8px; overflow: hidden; margin-top: 6px; }
    .progress-bar-fill { background-color: #67c23a; height: 100%; }
    .badge { padding: 2px 6px; border-radius: 4px; font-size: 11px; }
    .badge-done { background: #f0f9eb; color: #67c23a; }
    .badge-working { background: #fdf6ec; color: #e6a23c; }
  </style>
</head>
<body>

  <div class="card">
    <h1>FORSURE🐶📸</h1>
    <p class="subtitle">歡迎來到 FORSURE 服務門戶</p>

    <div class="menu-grid">
      <a href="order.html" class="menu-btn">
        <span class="icon">📝</span>
        <span>填寫登記</span>
      </a>
      <a href="payment.html" class="menu-btn">
        <span class="icon">💰</span>
        <span>填寫匯款</span>
      </a>
      <a href="records.html" class="menu-btn">
        <span class="icon">🔍</span>
        <span>查詢登記</span>
      </a>
      <a href="progress.html" class="menu-btn">
        <span class="icon">📸</span>
        <span>發圖進度</span>
      </a>
    </div>

    <div class="progress-box">
      <h3>🔥 最新開團與發圖進度 <a href="progress.html" style="font-size:12px; color:#409eff; text-decoration:none;">查看全部 →</a></h3>
      <div id="homeProgressList">載入中...</div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, onSnapshot, query, orderBy, limit } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDF7QySG1Jj4gdZvXwMRaKjRmI-lFKpj7k",
      authDomain: "forsure0922.firebaseapp.com",
      databaseURL: "https://forsure0922-default-rtdb.firebaseio.com",
      projectId: "forsure0922",
      storageBucket: "forsure0922.firebasestorage.app",
      messagingSenderId: "817449290174",
      appId: "1:817449290174:web:6b4ec1d36c171ff97011ef"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const q = query(collection(db, "photo_progress"), orderBy("createdAt", "desc"), limit(3));
    onSnapshot(q, (snapshot) => {
      const container = document.getElementById('homeProgressList');
      container.innerHTML = '';
      if (snapshot.empty) { container.innerHTML = '<div style="text-align:center; color:#909399; font-size:13px;">目前尚無開團資訊</div>'; return; }
      snapshot.forEach(doc => {
        const item = doc.data();
        const percent = Math.min(100, Math.round((item.doneQty / item.totalQty) * 100)) || 0;
        const isFinished = percent === 100;
        const div = document.createElement('div');
        div.className = 'progress-item';
        div.innerHTML = `
          <div style="font-size:13px; font-weight:bold; display:flex; justify-space-between;">
            <span>${item.eventName} - ${item.member}</span>
            <span class="badge ${isFinished ? 'badge-done' : 'badge-working'}">${isFinished ? '已發完' : '整理中'}</span>
          </div>
          <div style="font-size:11px; color:#909399; margin-top:3px;">${item.doneQty}/${item.totalQty} 張 (${percent}%)</div>
          <div class="progress-bar-bg"><div class="progress-bar-fill" style="width:${percent}%;"></div></div>
        `;
        container.appendChild(div);
      });
    });
  </script>

</body>
</html>
