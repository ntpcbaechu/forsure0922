<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FORSURE🐶📸</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 20px;
      max-width: 900px;
      margin: 0 auto;
      background-color: #f4f6f8;
      color: #333;
    }
    .main-card {
      background: #ffffff;
      padding: 24px;
      border-radius: 20px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.06);
    }
    .header-title {
      text-align: center;
      font-size: 26px;
      font-weight: 800;
      margin-bottom: 20px;
      color: #1a1a1a;
      letter-spacing: 0.5px;
    }
    
    /* 手機端按鈕 3 - 2 網格佈局 */
    .nav-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 20px;
    }
    .nav-grid-row2 {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      margin-bottom: 20px;
    }

    .nav-btn {
      padding: 10px 6px;
      font-size: 13px;
      font-weight: bold;
      border: 1px solid #e4e7ed;
      background: #ffffff;
      color: #606266;
      border-radius: 12px;
      cursor: pointer;
      text-align: center;
      transition: all 0.2s ease;
      white-space: nowrap;
      box-shadow: 0 2px 6px rgba(0,0,0,0.02);
    }
    .nav-btn:hover {
      background: #f0f7ff;
      color: #409eff;
      border-color: #c6e2ff;
    }
    .nav-btn.active {
      background: #409eff;
      color: #ffffff;
      border-color: #409eff;
      box-shadow: 0 4px 12px rgba(64,158,255,0.3);
    }

    iframe {
      width: 100%;
      border: none;
      min-height: 500px;
      transition: height 0.2s ease;
    }

    @media (max-width: 600px) {
      body {
        padding: 8px 4px;
      }
      .main-card {
        padding: 14px 10px;
        border-radius: 16px;
      }
      .header-title {
        font-size: 22px;
        margin-bottom: 15px;
      }
      .nav-btn {
        font-size: 12px;
        padding: 9px 4px;
      }
    }
  </style>
</head>
<body>

  <div class="main-card">
    <div class="header-title">FORSURE🐶📸</div>

    <!-- 第一排：3 個常用按鈕 -->
    <div class="nav-grid">
      <button class="nav-btn active" onclick="switchTab(0, 'index/index_progress.html')">🔥 開團與進度</button>
      <button class="nav-btn" onclick="switchTab(1, 'index/index_order.html')">📝 登記表單</button>
      <button class="nav-btn" onclick="switchTab(2, 'index/index_payment.html')">💰 匯款表單</button>
    </div>

    <!-- 第二排：2 個查詢按鈕 -->
    <div class="nav-grid-row2">
      <button class="nav-btn" onclick="switchTab(3, 'index/index_records.html')">🔍 查詢登記與對帳</button>
      <button class="nav-btn" onclick="switchTab(4, 'index/index_credit.html')">💳 抵用金查詢</button>
    </div>

    <iframe id="contentFrame" src="index/index_progress.html"></iframe>
  </div>

  <script>
    function switchTab(idx, pageUrl) {
      document.querySelectorAll('.nav-btn').forEach((btn, index) => {
        btn.classList.toggle('active', index === idx);
      });
      document.getElementById('contentFrame').src = pageUrl;
    }

    window.addEventListener('message', (e) => {
      if (e.data && e.data.frameHeight) {
        document.getElementById('contentFrame').style.height = (e.data.frameHeight + 20) + 'px';
      }
    });
  </script>

</body>
</html>
