<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FORSURE🐶📸</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 0; background: #f5f7fa; color: #333; }
    .container { max-width: 800px; margin: 20px auto; padding: 20px; background: #fff; border-radius: 16px; box-shadow: 0 4px 16px rgba(0,0,0,0.06); }
    .header { text-align: center; margin-bottom: 20px; }
    .header h1 { font-size: 24px; margin: 0 0 10px 0; color: #303133; }
    
    /* 頁籤選單：自動換行 + 膠囊風格 */
    .nav-tabs { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; border-bottom: 1px solid #e4e7ed; padding-bottom: 12px; margin-bottom: 20px; }
    .nav-tab { padding: 8px 14px; font-size: 14px; font-weight: bold; color: #606266; background: #f4f4f5; border-radius: 20px; cursor: pointer; border: 1px solid transparent; transition: all 0.2s ease; text-align: center; }
    .nav-tab:hover { color: #409eff; background: #ecf5ff; }
    .nav-tab.active { color: #fff; background: #409eff; border-color: #409eff; box-shadow: 0 2px 6px rgba(64,158,255,0.3); }

    iframe { width: 100%; border: none; min-height: 500px; }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <h1>FORSURE🐶📸</h1>
    </div>

    <!-- 5 個頁籤按鈕自動換行 -->
    <div class="nav-tabs">
      <div class="nav-tab" onclick="switchTab('progress.html', this)">🔥 開團與進度</div>
      <div class="nav-tab" onclick="switchTab('order.html', this)">📝 登記表單</div>
      <div class="nav-tab" onclick="switchTab('payment.html', this)">💰 匯款表單</div>
      <div class="nav-tab active" onclick="switchTab('records.html', this)">🔍 查詢登記與對帳</div>
      <div class="nav-tab" onclick="switchTab('credit.html', this)">💳 抵用金查詢</div>
    </div>

    <iframe id="mainFrame" src="records.html"></iframe>
  </div>

  <script>
    function switchTab(page, el) {
      document.getElementById('mainFrame').src = page;
      document.querySelectorAll('.nav-tab').forEach(tab => tab.classList.remove('active'));
      el.classList.add('active');
    }

    // 監聽來自 iframe 的動態高度調整
    window.addEventListener('message', function(e) {
      if (e.data && e.data.frameHeight) {
        document.getElementById('mainFrame').style.height = (e.data.frameHeight + 20) + 'px';
      }
    });
  </script>

</body>
</html>
