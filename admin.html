<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FORSURE🐶📸 - 管理者控制台</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 20px; max-width: 1100px; margin: 0 auto; background-color: #f4f6f8; color: #333; }
    .card { background: #ffffff; padding: 24px; border-radius: 16px; box-shadow: 0 8px 20px rgba(0,0,0,0.06); }
    
    .top-nav { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
    .btn-home-nav { color: #409eff; text-decoration: none; font-size: 13px; font-weight: bold; background: #ecf5ff; padding: 6px 12px; border-radius: 6px; }

    .tabs { display: flex; border-bottom: 2px solid #e4e7ed; margin-bottom: 20px; gap: 10px; overflow-x: auto; }
    .tab-btn { padding: 10px 16px; cursor: pointer; border: none; background: none; font-weight: bold; color: #909399; font-size: 15px; white-space: nowrap; }
    .tab-btn.active { color: #409eff; border-bottom: 2px solid #409eff; }
    .tab-content { display: none; }
    .tab-content.active { display: block; }
    input, select, button { padding: 8px 10px; border: 1px solid #dcdfe6; border-radius: 6px; font-size: 14px; margin-bottom: 10px; box-sizing: border-box; }
    button { background-color: #409eff; color: white; border: none; font-weight: bold; cursor: pointer; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    th, td { padding: 10px; border-bottom: 1px solid #e4e7ed; text-align: left; font-size: 13px; }
    th { background: #f8f9fa; }
    
    .status-err { color: #f56c6c; font-weight: bold; cursor: pointer; text-decoration: underline; margin-top: 4px; }
    .btn-toggle { padding: 4px 8px; border-radius: 4px; font-size: 12px; cursor: pointer; border: 1px solid #dcdfe6; background: #fff; }
    .btn-toggle.ok-active { background: #e1f3d8; color: #67c23a; border-color: #67c23a; font-weight: bold; }
    .btn-toggle.err-active { background: #fef0f0; color: #f56c6c; border-color: #f56c6c; font-weight: bold; }
    
    .input-group { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .btn-danger { background-color: #f56c6c; color: white; padding: 4px 8px; font-size: 12px; border-radius: 4px; border: none; cursor: pointer; }
    .btn-edit { background-color: #e6a23c; color: white; padding: 4px 8px; font-size: 12px; border-radius: 4px; border: none; cursor: pointer; margin-right: 4px; }
  </style>
</head>
<body>

  <div class="card" id="mainAdmin" style="display:none;">
    <div class="top-nav">
      <a href="index.html" class="btn-home-nav">← 返回前台首頁</a>
      <span style="font-size:12px; color:#909399;">FORSURE 後台管理系統</span>
    </div>

    <h2>FORSURE🐶📸 管理者控制台</h2>

    <div class="tabs">
      <button class="tab-btn active" onclick="switchTab(0)">1. 匯款對帳審核</button>
      <button class="tab-btn" onclick="switchTab(1)">2. 成員抵用金管理</button>
      <button class="tab-btn" onclick="switchTab(2)">3. 活動單價與成本設定</button>
      <button class="tab-btn" onclick="switchTab(3)">4. 發圖進度更新</button>
    </div>

    <!-- 1. 匯款對帳審核 -->
    <div class="tab-content active">
      <h3>匯款登記與對帳管理</h3>
      <table>
        <thead>
          <tr>
            <th>社群名稱</th>
            <th>活動/張數</th>
            <th>應匯金額</th>
            <th>後五碼</th>
            <th>對帳金額</th>
            <th>對帳日期</th>
            <th>對帳狀態</th>
            <th>操作</th>
          </tr>
        </thead>
        <tbody id="payTable"></tbody>
      </table>
    </div>

    <!-- 2. 抵用金管理 -->
    <div class="tab-content">
      <h3>新增/修改成員抵用金紀錄</h3>
      <form id="creditForm" style="background:#f8f9fa; padding:15px; border-radius:8px; margin-bottom:15px;">
        <input type="hidden" id="editCreditId">
        <div style="display:grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap:10px;">
          <div><label style="font-size:12px;">社群名稱</label><input type="text" id="cUser" placeholder="社群暱稱" required style="width:100%;"></div>
          <div><label style="font-size:12px;">日期 (例: 260725)</label><input type="text" id="cDate" placeholder="YYMMDD" style="width:100%;"></div>
          <div><label style="font-size:12px;">活動名稱</label><input type="text" id="cEvent" placeholder="活動名稱" style="width:100%;"></div>
          <div><label style="font-size:12px;">轉抵用金金額 ($)</label><input type="number" id="cAmt" placeholder="轉抵金額" required style="width:100%;"></div>
          <div><label style="font-size:12px;">已使用金額 ($)</label><input type="number" id="cUsed" placeholder="預設 0" value="0" style="width:100%;"></div>
        </div>
        <button type="submit" style="margin-top:10px;">儲存/更新抵用金</button>
        <button type="button" id="cancelCreditEdit" style="background:#909399; display:none; margin-top:10px;" onclick="resetCreditForm()">取消編輯</button>
      </form>

      <table>
        <thead>
          <tr>
            <th>社群暱稱</th>
            <th>日期活動</th>
            <th>轉抵金額</th>
            <th>已使用</th>
            <th>剩餘金額</th>
            <th>操作</th>
          </tr>
        </thead>
        <tbody id="creditTable"></tbody>
      </table>
    </div>

    <!-- 3. 活動單價與成本設定 (新增欄位: 代拍) -->
    <div class="tab-content">
      <h3>設定活動單價與利潤分析</h3>
      <form id="eventForm" style="background:#f8f9fa; padding:15px; border-radius:8px; margin-bottom:15px;">
        <input type="hidden" id="editEventId">
        <div style="display:grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap:10px;">
          <div><label style="font-size:12px;">日期 (例: 260725)</label><input type="text" id="evDate" placeholder="YYMMDD" style="width:100%;"></div>
          <div><label style="font-size:12px;">活動名稱 (例: RUN IT)</label><input type="text" id="evName" placeholder="活動名稱" required style="width:100%;"></div>
          <div><label style="font-size:12px;">代拍 (例: 站姐A)</label><input type="text" id="evSeller" placeholder="代拍名稱/帳號" style="width:100%;"></div>
          <div><label style="font-size:12px;">售出單價 ($)</label><input type="number" id="evPrice" placeholder="販售單價" required style="width:100%;"></div>
          <div><label style="font-size:12px;">總購入價 ($)</label><input type="number" id="evCost" placeholder="總購入成本" required style="width:100%;"></div>
          <div><label style="font-size:12px;">預計張數</label><input type="number" id="evEstQty" placeholder="預計張數" required style="width:100%;"></div>
          <div><label style="font-size:12px;">實際收到張數</label><input type="number" id="evActQty" placeholder="實際收到張數" required style="width:100%;"></div>
        </div>
        <button type="submit" id="saveEventBtn" style="margin-top:10px;">儲存活動設定</button>
        <button type="button" id="cancelEditBtn" style="background:#909399; display:none; margin-top:10px;" onclick="resetEventForm()">取消編輯</button>
      </form>

      <table>
        <thead>
          <tr>
            <th>活動全名 (日期+名稱)</th>
            <th>代拍</th>
            <th>售價/實際單價</th>
            <th>購入價</th>
            <th>預計/實際張數</th>
            <th>預估利潤</th>
            <th>操作</th>
          </tr>
        </thead>
        <tbody id="eventTable"></tbody>
      </table>
    </div>

    <!-- 4. 發圖進度更新 (新增編輯與刪除) -->
    <div class="tab-content">
      <h3>發佈與更新發圖進度</h3>
      <div class="input-group">
        <select id="progEventSelect" style="min-width: 220px;">
          <option value="" disabled selected>載入活動中...</option>
        </select>
        
        <select id="progMember" style="width: 120px;">
          <option value="" disabled selected>選擇成員</option>
          <option value="方燦">方燦</option>
          <option value="Lee Know">Lee Know</option>
          <option value="彰彬">彰彬</option>
          <option value="鉉辰">鉉辰</option>
          <option value="Han">Han</option>
          <option value="Felix">Felix</option>
          <option value="昇玟">昇玟</option>
          <option value="I.N">I.N</option>
          <option value="團體/全體">團體/全體</option>
        </select>

        <select id="progStatus" style="width: 120px;">
          <option value="等圖中">⏳ 等圖中</option>
          <option value="分圖中">📂 分圖中</option>
          <option value="上傳中">☁️ 上傳中</option>
          <option value="已發圖">✅ 已發圖</option>
        </select>
        
        <button id="saveProgBtn">發佈/更新進度</button>
      </div>

      <table>
        <thead>
          <tr>
            <th>活動全名</th>
            <th>成員</th>
            <th>目前狀態</th>
            <th>操作</th>
          </tr>
        </thead>
        <tbody id="progTable"></tbody>
      </table>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, doc, setDoc, deleteDoc, updateDoc, onSnapshot, getDocs, query, where, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    if (prompt("請輸入管理者密碼：") === "marcon") {
      document.getElementById('mainAdmin').style.display = 'block';
    } else {
      alert("密碼錯誤！");
      window.location.href = "index.html";
    }

    const firebaseConfig = {
      apiKey: "AIzaSyDF7QySG1Jj4gdZvXwMRaKjRmI-lFKpj7k",
      authDomain: "forsure0922.firebaseapp.com",
      databaseURL: "https://forsure0922-default-rtdb.firebaseio.com",
      projectId: "forsure0922",
      storageBucket: "forsure0922.firebasestorage.app",
      messagingSenderId: "817449290174",
      appId: "1:817449290174:web:6b4ec1d36c171ff97011ef"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    window.switchTab = (idx) => {
      document.querySelectorAll('.tab-btn').forEach((b, i) => b.classList.toggle('active', i === idx));
      document.querySelectorAll('.tab-content').forEach((c, i) => c.classList.toggle('active', i === idx));
    };

    // --- 1. 匯款對帳審核 (含刪除按鈕) ---
    onSnapshot(collection(db, "payments"), snap => {
      const tb = document.getElementById('payTable');
      tb.innerHTML = '';
      snap.forEach(d => {
        const p = d.data();
        const docId = d.id;
        const status = p.status || 'pending';
        const noteErr = p.errorNote || '';
        const checkDate = p.checkDate || '';
        const actualAmt = p.actualAmt !== undefined ? p.actualAmt : p.finalPay;

        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td><b>${p.user}</b><br><small style="color:#909399;">${p.social}</small></td>
          <td>${p.eventName}<br>${p.qty} 張</td>
          <td>$${p.finalPay} ${p.creditUsed > 0 ? `<small style="color:#67c23a;">(折抵$${p.creditUsed})</small>` : ''}</td>
          <td><b>${p.bankLast5}</b></td>
          <td><input type="number" style="width:70px;" value="${actualAmt}" onchange="updatePayField('${docId}', 'actualAmt', parseInt(this.value))"></td>
          <td><input type="date" value="${checkDate}" onchange="updatePayField('${docId}', 'checkDate', this.value)"></td>
          <td>
            <button class="btn-toggle ${status === 'ok' ? 'ok-active' : ''}" onclick="setPayStatus('${docId}', 'ok')">🟢 已對帳</button>
            <button class="btn-toggle ${status === 'error' ? 'err-active' : ''}" onclick="setPayStatus('${docId}', 'error')">🔴 有問題</button>
            ${status === 'error' ? `<div class="status-err" onclick="editErrorNote('${docId}', '${noteErr}')">原因: ${noteErr || '點擊填寫'}</div>` : ''}
          </td>
          <td><button class="btn-danger" onclick="deletePayment('${docId}')">刪除</button></td>
        `;
        tb.appendChild(tr);
      });
    });

    window.updatePayField = async (docId, field, val) => {
      await updateDoc(doc(db, "payments", docId), { [field]: val });
    };

    window.setPayStatus = async (docId, newStatus) => {
      const today = new Date().toISOString().slice(0,10);
      if (newStatus === 'error') {
        const reason = prompt("請輸入對帳問題原因：");
        if (reason !== null) {
          await updateDoc(doc(db, "payments", docId), { status: 'error', errorNote: reason, checkDate: today });
        }
      } else {
        await updateDoc(doc(db, "payments", docId), { status: 'ok', errorNote: '', checkDate: today });
      }
    };

    window.editErrorNote = async (docId, oldNote) => {
      const reason = prompt("修改問題原因：", oldNote);
      if (reason !== null) { await updateDoc(doc(db, "payments", docId), { errorNote: reason }); }
    };

    window.deletePayment = async (docId) => {
      if (confirm('確定要刪除這筆匯款審核紀錄嗎？')) {
        await deleteDoc(doc(db, "payments", docId));
      }
    };

    // --- 2. 抵用金管理 ---
    document.getElementById('creditForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const user = document.getElementById('cUser').value.trim();
      const cDate = document.getElementById('cDate').value.trim();
      const cEvent = document.getElementById('cEvent').value.trim();
      const credit = parseInt(document.getElementById('cAmt').value) || 0;
      const used = parseInt(document.getElementById('cUsed').value) || 0;
      
      const fullEvent = cDate ? `${cDate} ${cEvent}` : cEvent;
      const remaining = credit - used;
      const docId = document.getElementById('editCreditId').value || `${user}_${fullEvent || '通用'}_${Date.now()}`;

      await setDoc(doc(db, "user_credits", docId), {
        user, rawDate: cDate, rawEvent: cEvent, fullEvent, credit, used, remaining
      });

      alert('抵用金紀錄已儲存！');
      resetCreditForm();
    });

    window.resetCreditForm = () => {
      document.getElementById('creditForm').reset();
      document.getElementById('editCreditId').value = '';
      document.getElementById('cancelCreditEdit').style.display = 'none';
      document.getElementById('cUser').disabled = false;
    };

    window.editCredit = (id, user, rawDate, rawEvent, credit, used) => {
      document.getElementById('editCreditId').value = id;
      document.getElementById('cUser').value = user;
      document.getElementById('cUser').disabled = true;
      document.getElementById('cDate').value = rawDate || '';
      document.getElementById('cEvent').value = rawEvent || '';
      document.getElementById('cAmt').value = credit;
      document.getElementById('cUsed').value = used;
      document.getElementById('cancelCreditEdit').style.display = 'inline-block';
    };

    window.deleteCredit = async (id) => {
      if (confirm('確定要刪除這筆抵用金紀錄嗎？')) {
        await deleteDoc(doc(db, "user_credits", id));
      }
    };

    onSnapshot(collection(db, "user_credits"), snap => {
      const tb = document.getElementById('creditTable');
      tb.innerHTML = '';
      snap.forEach(d => {
        const item = d.data();
        const id = d.id;
        const rem = item.remaining !== undefined ? item.remaining : (item.credit - (item.used || 0));
        tb.innerHTML += `
          <tr>
            <td><b>${item.user}</b></td>
            <td>${item.fullEvent || '通用'}</td>
            <td>$${item.credit}</td>
            <td>$${item.used || 0}</td>
            <td><b style="color:#67c23a;">$${rem}</b></td>
            <td>
              <button class="btn-edit" onclick="editCredit('${id}', '${item.user}', '${item.rawDate||''}', '${item.rawEvent||''}', ${item.credit}, ${item.used||0})">編輯</button>
              <button class="btn-danger" onclick="deleteCredit('${id}')">刪除</button>
            </td>
          </tr>
        `;
      });
    });

    // --- 3. 活動單價與成本設定 (含「代拍」欄位) ---
    document.getElementById('eventForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const evDate = document.getElementById('evDate').value.trim();
      const evNameRaw = document.getElementById('evName').value.trim();
      const seller = document.getElementById('evSeller').value.trim();
      const price = parseFloat(document.getElementById('evPrice').value) || 0;
      const cost = parseFloat(document.getElementById('evCost').value) || 0;
      const estQty = parseInt(document.getElementById('evEstQty').value) || 0;
      const actQty = parseInt(document.getElementById('evActQty').value) || 0;

      const fullName = evDate ? `${evDate} ${evNameRaw}` : evNameRaw;
      const docId = document.getElementById('editEventId').value || `${fullName}_${seller || 'default'}`;

      const actualUnitCost = actQty > 0 ? (cost / actQty) : 0;
      const profit = (price * actQty) - cost;

      await setDoc(doc(db, "event_settings", docId), {
        name: fullName, rawDate: evDate, rawName: evNameRaw, seller, price, cost, estQty, actQty, actualUnitCost, profit
      });

      alert('活動設定已儲存！');
      resetEventForm();
    });

    window.resetEventForm = () => {
      document.getElementById('eventForm').reset();
      document.getElementById('editEventId').value = '';
      document.getElementById('cancelEditBtn').style.display = 'none';
      document.getElementById('evDate').disabled = false;
      document.getElementById('evName').disabled = false;
    };

    window.editEvent = (docId, fullName, rawDate, rawName, seller, price, cost, estQty, actQty) => {
      document.getElementById('editEventId').value = docId;
      document.getElementById('evDate').value = rawDate || '';
      document.getElementById('evName').value = rawName || fullName;
      document.getElementById('evSeller').value = seller || '';
      document.getElementById('evPrice').value = price;
      document.getElementById('evCost').value = cost;
      document.getElementById('evEstQty').value = estQty;
      document.getElementById('evActQty').value = actQty;
      document.getElementById('cancelEditBtn').style.display = 'inline-block';
    };

    window.deleteEvent = async (docId) => {
      if (confirm(`確定要刪除這筆活動設定嗎？`)) {
        await deleteDoc(doc(db, "event_settings", docId));
        alert('已刪除');
      }
    };

    onSnapshot(collection(db, "event_settings"), snap => {
      const tb = document.getElementById('eventTable');
      const progSelect = document.getElementById('progEventSelect');
      
      tb.innerHTML = '';
      progSelect.innerHTML = '<option value="" disabled selected>請選擇活動</option>';
      const uniqueEvents = new Set();

      snap.forEach(d => {
        const ev = d.data();
        const docId = d.id;
        const actUPrice = ev.actQty > 0 ? (ev.cost / ev.actQty).toFixed(1) : 0;
        
        tb.innerHTML += `
          <tr>
            <td><b>${ev.name}</b></td>
            <td>${ev.seller || '未填寫'}</td>
            <td>售價: $${ev.price}<br><small style="color:#909399;">實際成本: $${actUPrice}/張</small></td>
            <td>$${ev.cost}</td>
            <td>預計: ${ev.estQty}張<br>實際: ${ev.actQty}張</td>
            <td><b style="color:${ev.profit >= 0 ? '#67c23a' : '#f56c6c'};">$${ev.profit}</b></td>
            <td>
              <button class="btn-edit" onclick="editEvent('${docId}', '${ev.name}', '${ev.rawDate||''}', '${ev.rawName||''}', '${ev.seller||''}', ${ev.price}, ${ev.cost}, ${ev.estQty}, ${ev.actQty})">編輯</button>
              <button class="btn-danger" onclick="deleteEvent('${docId}')">刪除</button>
            </td>
          </tr>
        `;

        if (!uniqueEvents.has(ev.name)) {
          uniqueEvents.add(ev.name);
          const opt = document.createElement('option');
          opt.value = ev.name;
          opt.textContent = ev.name;
          progSelect.appendChild(opt);
        }
      });
    });

    // --- 4. 發圖進度更新 (含編輯與刪除) ---
    document.getElementById('saveProgBtn').onclick = async () => {
      const fullEventName = document.getElementById('progEventSelect').value;
      const member = document.getElementById('progMember').value;
      const status = document.getElementById('progStatus').value;

      if (!fullEventName) return alert('請選擇活動！');
      if (!member) return alert('請選擇成員！');

      const docId = `${fullEventName}_${member}`;

      await setDoc(doc(db, "photo_progress", docId), {
        eventName: fullEventName, member, status, createdAt: serverTimestamp()
      });
      alert('發圖進度已更新');
    };

    window.editProg = (docId, eventName, member, status) => {
      document.getElementById('progEventSelect').value = eventName;
      document.getElementById('progMember').value = member;
      document.getElementById('progStatus').value = status;
    };

    window.deleteProg = async (docId) => {
      if (confirm('確定要刪除這筆發圖進度嗎？')) {
        await deleteDoc(doc(db, "photo_progress", docId));
      }
    };

    onSnapshot(collection(db, "photo_progress"), snap => {
      const tb = document.getElementById('progTable');
      tb.innerHTML = '';
      snap.forEach(d => {
        const item = d.data();
        const docId = d.id;
        tb.innerHTML += `
          <tr>
            <td><b>${item.eventName}</b></td>
            <td>${item.member}</td>
            <td><b>${item.status || '等圖中'}</b></td>
            <td>
              <button class="btn-edit" onclick="editProg('${docId}', '${item.eventName}', '${item.member}', '${item.status}')">編輯</button>
              <button class="btn-danger" onclick="deleteProg('${docId}')">刪除</button>
            </td>
          </tr>
        `;
      });
    });
  </script>

</body>
</html>
