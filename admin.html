<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FORSURE🐶📸 - 登記紀錄查看</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 20px;
      max-width: 800px;
      margin: 0 auto;
      background-color: #f4f6f8;
      color: #333;
    }
    .card {
      background: #ffffff;
      padding: 24px;
      border-radius: 16px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.06);
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      flex-wrap: wrap;
      gap: 10px;
    }
    h1 { font-size: 20px; margin: 0; color: #222; }
    .btn-group { display: flex; gap: 10px; }
    button {
      padding: 8px 14px;
      border-radius: 6px;
      border: none;
      font-weight: 600;
      cursor: pointer;
      font-size: 14px;
    }
    .btn-back { background-color: #e4e7ed; color: #333; text-decoration: none; padding: 8px 14px; border-radius: 6px; font-weight: 600; font-size: 14px; }
    .btn-clear { background-color: #f56c6c; color: white; }
    .btn-export { background-color: #67c23a; color: white; }
    
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
    }
    th, td {
      padding: 12px;
      text-align: left;
      border-bottom: 1px solid #e4e7ed;
      font-size: 14px;
    }
    th {
      background-color: #f8f9fa;
      font-weight: 600;
      color: #555;
    }
    tr:hover { background-color: #f9fafc; }
    .empty-msg {
      text-align: center;
      padding: 40px;
      color: #909399;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="header">
      <h1>FORSURE🐶📸 登記紀錄後台</h1>
      <div class="btn-group">
        <a href="index.html" class="btn-back">返回表單</a>
        <button class="btn-export" onclick="exportCSV()">匯出 CSV</button>
        <button class="btn-clear" onclick="clearData()">清空紀錄</button>
      </div>
    </div>

    <table id="recordTable">
      <thead>
        <tr>
          <th>#</th>
          <th>填單時間</th>
          <th>社群名稱</th>
          <th>活動名稱</th>
          <th>成員</th>
          <th>張數</th>
        </tr>
      </thead>
      <tbody id="tableBody">
        <!-- JS 動態渲染內容 -->
      </tbody>
    </table>
    <div id="emptyMsg" class="empty-msg" style="display: none;">目前尚無任何登記紀錄！</div>
  </div>

  <script>
    function loadData() {
      const records = JSON.parse(localStorage.getItem('forsure_orders') || '[]');
      const tbody = document.getElementById('tableBody');
      const emptyMsg = document.getElementById('emptyMsg');
      tbody.innerHTML = '';

      if (records.length === 0) {
        emptyMsg.style.display = 'block';
        return;
      } else {
        emptyMsg.style.display = 'none';
      }

      records.forEach((item, index) => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>${index + 1}</td>
          <td>${item.time}</td>
          <td><b>${escapeHtml(item.user)}</b></td>
          <td>${escapeHtml(item.event)}</td>
          <td>${escapeHtml(item.member)}</td>
          <td>${item.qty}</td>
        `;
        tbody.appendChild(tr);
      });
    }

    function escapeHtml(text) {
      return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    function clearData() {
      if (confirm('確定要清空所有已登記的紀錄嗎？此動作無法復原！')) {
        localStorage.removeItem('forsure_orders');
        loadData();
      }
    }

    function exportCSV() {
      const records = JSON.parse(localStorage.getItem('forsure_orders') || '[]');
      if (records.length === 0) {
        alert('沒有資料可匯出！');
        return;
      }
      
      let csvContent = "\uFEFF填單時間,社群名稱,活動名稱,成員,張數\n";
      records.forEach(r => {
        csvContent += `"${r.time}","${r.user}","${r.event}","${r.member}","${r.qty}"\n`;
      });

      const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.setAttribute("href", url);
      link.setAttribute("download", `FORSURE_登記紀錄_${new Date().toISOString().slice(0,10)}.csv`);
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }

    // 頁面載入時讀取資料
    loadData();
  </script>

</body>
</html>
