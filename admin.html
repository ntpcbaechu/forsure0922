<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>管理者控制台 - FORSURE</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 20px; background: #f5f7fa; color: #333; }
    .container { max-width: 1000px; margin: 0 auto; background: #fff; padding: 20px; border-radius: 16px; box-shadow: 0 4px 16px rgba(0,0,0,0.06); }
    
    .nav-tabs { display: flex; gap: 10px; border-bottom: 1px solid #e4e7ed; margin-bottom: 20px; padding-bottom: 10px; }
    .nav-tab { padding: 8px 16px; font-weight: bold; color: #606266; background: #f4f4f5; border-radius: 8px; cursor: pointer; border: none; }
    .nav-tab.active { background: #409eff; color: #fff; }

    table { width: 100%; border-collapse: collapse; margin-top: 15px; }
    th, td { padding: 12px; text-align: left; border-bottom: 1px solid #f0f2f5; font-size: 14px; }
    th { background: #fafafa; color: #909399; }

    /* 按鈕樣式修復：未點擊時使用高對比深灰色，絕不白字白底 */
    .status-btn-group { display: flex; gap: 6px; }
    .btn-status { padding: 6px 12px; font-size: 12px; font-weight: bold; border-radius: 6px; cursor: pointer; border: 1px solid #dcdfe6; background: #f4f4f5; color: #606266; transition: all 0.2s; }
    .btn-status:hover { background: #e6e8eb; color: #303133; }

    /* 已對帳 (選取時) */
    .btn-status.active-ok { background: #e1f3d8; color: #67c23a; border-color: #b3e19d; }
    /* 對帳問題 (選取時) */
    .btn-status.active-err { background: #fde2e2; color: #f56c6c; border-color: #fbc4c4; }

    .btn-del { background: #fef0f0; color: #f56c6c; border: 1px solid #fde2e2; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 12px; }
    .btn-del:hover { background: #f56c6c; color: #fff; }
  </style>
</head>
<body>

  <div class="container">
    <h2>FORSURE🐶📸 管理者控制台</h2>

    <div class="nav-tabs">
      <button class="nav-tab active">1. 匯款對帳審核</button>
    </div>

    <h3>匯款登記與對帳管理</h3>

    <table>
      <thead>
        <tr>
          <th>社群名稱</th>
          <th>活動 / 成員</th>
          <th>後五碼</th>
          <th>填單時間</th>
          <th>對帳狀態審核</th>
          <th>操作</th>
        </tr>
      </thead>
      <tbody id="paymentAdminTable">
        <tr><td colspan="6" style="text-align:center; color:#909399;">載入資料中...</td></tr>
      </tbody>
    </table>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, onSnapshot, doc, updateDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDF7QySG1Jj4gdZvXwMRaKjRmI-lFKpj7k",
      authDomain: "forsure0922.firebaseapp.com",
      databaseURL: "https://forsure0922-default-rtdb.firebaseio.com",
      projectId: "forsure0922",
      storageBucket: "forsure0922.firebasestorage.app",
      messagingSenderId: "817449290174",
      appId: "1:817449290174:web:6b4ec1d36c171ff97011ef"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    onSnapshot(collection(db, "payments"), snap => {
      const tbody = document.getElementById('paymentAdminTable');
      tbody.innerHTML = '';

      if (snap.empty) {
        tbody.innerHTML = '<tr><td colspan="6" style="text-align:center; color:#909399;">目前沒有待審核的匯款紀錄。</td></tr>';
        return;
      }

      snap.forEach(documentSnap => {
        const p = documentSnap.data();
        const id = documentSnap.id;
        const status = p.status || 'pending';

        const isOk = status === 'ok';
        const isErr = status === 'error';

        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td><b>${p.user || '-'}</b></td>
          <td>${p.eventName || '-'} (${p.qty || 0}張)</td>
          <td><b style="font-family:monospace; font-size:15px; color:#409eff;">${p.bankLast5 || '-'}</b></td>
          <td style="color:#909399; font-size:12px;">${p.time || '-'}</td>
          <td>
            <div class="status-btn-group">
              <button class="btn-status ${isOk ? 'active-ok' : ''}" onclick="updateStatus('${id}', 'ok')">🟢 已對帳</button>
              <button class="btn-status ${isErr ? 'active-err' : ''}" onclick="updateStatus('${id}', 'error')">🔴 對帳問題</button>
            </div>
          </td>
          <td>
            <button class="btn-del" onclick="deletePayment('${id}')">刪除</button>
          </td>
        `;
        tbody.appendChild(tr);
      });
    });

    window.updateStatus = async function(id, status) {
      try {
        await updateDoc(doc(db, "payments", id), { status: status });
      } catch (err) {
        alert('更新失敗：' + err.message);
      }
    };

    window.deletePayment = async function(id) {
      if (confirm('確定要刪除這筆對帳紀錄嗎？')) {
        try {
          await deleteDoc(doc(db, "payments", id));
        } catch (err) {
          alert('刪除失敗：' + err.message);
        }
      }
    };
  </script>

</body>
</html>
