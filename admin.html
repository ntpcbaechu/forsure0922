<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FORSURE🐶📸 - 管理者控制台</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 20px; max-width: 900px; margin: 0 auto; background-color: #f4f6f8; color: #333; }
    .card { background: #ffffff; padding: 24px; border-radius: 16px; box-shadow: 0 8px 20px rgba(0,0,0,0.06); }
    .tabs { display: flex; border-bottom: 2px solid #e4e7ed; margin-bottom: 20px; gap: 10px; }
    .tab-btn { padding: 10px 16px; cursor: pointer; border: none; background: none; font-weight: bold; color: #909399; font-size: 15px; }
    .tab-btn.active { color: #409eff; border-bottom: 2px solid #409eff; }
    .tab-content { display: none; }
    .tab-content.active { display: block; }
    input, select, button { padding: 10px; border: 1px solid #dcdfe6; border-radius: 6px; font-size: 14px; margin-bottom: 10px; }
    button { background-color: #409eff; color: white; border: none; font-weight: bold; cursor: pointer; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    th, td { padding: 10px; border-bottom: 1px solid #e4e7ed; text-align: left; font-size: 13px; }
    th { background: #f8f9fa; }
  </style>
</head>
<body>

  <div class="card" id="mainAdmin" style="display:none;">
    <h2>FORSURE🐶📸 管理者控制台</h2>

    <div class="tabs">
      <button class="tab-btn active" onclick="switchTab(0)">1. 成員抵用金管理</button>
      <button class="tab-btn" onclick="switchTab(1)">2. 活動單價設定</button>
      <button class="tab-btn" onclick="switchTab(2)">3. 發圖進度更新</button>
      <button class="tab-btn" onclick="switchTab(3)">4. 匯款紀錄審核</button>
    </div>

    <!-- 頁籤一：抵用金管理 -->
    <div class="tab-content active">
      <h3>新增/修改成員抵用金</h3>
      <input type="text" id="creditUser" placeholder="社群暱稱">
      <input type="number" id="creditAmount" placeholder="抵用金額 ($)">
      <button id="saveCreditBtn">儲存/更新抵用金</button>
      <table>
        <thead><tr><th>社群暱稱</th><th>目前抵用金</th></tr></thead>
        <tbody id="creditTable"></tbody>
      </table>
    </div>

    <!-- 頁籤二：活動單價設定 -->
    <div class="tab-content">
      <h3>設定活動單張金額</h3>
      <input type="text" id="eventNameInput" placeholder="活動名稱 (例: 260725 RUN IT Day1)">
      <input type="number" id="eventPriceInput" placeholder="單張單價 ($)">
      <button id="saveEventBtn">新增/更新活動單價</button>
      <table>
        <thead><tr><th>活動名稱</th><th>單價</th></tr></thead>
        <tbody id="eventTable"></tbody>
      </table>
    </div>

    <!-- 頁籤三：發圖進度與 Drive 連結 -->
    <div class="tab-content">
      <h3>發佈與更新發圖進度</h3>
      <input type="text" id="progEvent" placeholder="活動名稱">
      <input type="text" id="progMember" placeholder="成員 (例: 鉉辰)">
      <input type="number" id="progTotal" placeholder="總照片張數">
      <input type="number" id="progDone" placeholder="已發放張數">
      <input type="text" id="progDrive" placeholder="Google Drive 雲端網址">
      <button id="saveProgBtn">發佈/更新進度</button>
      <table>
        <thead><tr><th>活動/成員</th><th>進度</th><th>Drive 連結</th></tr></thead>
        <tbody id="progTable"></tbody>
      </table>
    </div>

    <!-- 頁籤四：匯款審核 -->
    <div class="tab-content">
      <h3>匯款登記紀錄</h3>
      <table>
        <thead><tr><th>時間</th><th>社群名稱</th><th>活動</th><th>張數</th><th>扣抵</th><th>應匯金額</th><th>後五碼</th></tr></thead>
        <tbody id="payTable"></tbody>
      </table>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, addDoc, getDocs, doc, setDoc, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    if (prompt("請輸入管理者密碼：") === "emmanuel") {
      document.getElementById('mainAdmin').style.display = 'block';
    } else {
      alert("密碼錯誤！");
      window.location.href = "index.html";
    }

    const firebaseConfig = {
      apiKey: "AIzaSyDF7QySG1Jj4gdZvXwMRaKjRmI-lFKpj7k",
      authDomain: "forsure0922.firebaseapp.com",
      databaseURL: "https://forsure0922-default-rtdb.firebaseio.com",
      projectId: "forsure0922",
      storageBucket: "forsure0922.firebasestorage.app",
      messagingSenderId: "817449290174",
      appId: "1:817449290174:web:6b4ec1d36c171ff97011ef"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    window.switchTab = (idx) => {
      document.querySelectorAll('.tab-btn').forEach((b, i) => b.classList.toggle('active', i === idx));
      document.querySelectorAll('.tab-content').forEach((c, i) => c.classList.toggle('active', i === idx));
    };

    // 1. 抵用金更新
    document.getElementById('saveCreditBtn').onclick = async () => {
      const user = document.getElementById('creditUser').value.trim();
      const credit = parseInt(document.getElementById('creditAmount').value) || 0;
      if (!user) return alert('請填寫暱稱');
      await setDoc(doc(db, "user_credits", user), { user, credit });
      alert('抵用金已更新');
    };

    onSnapshot(collection(db, "user_credits"), snap => {
      const tb = document.getElementById('creditTable');
      tb.innerHTML = '';
      snap.forEach(d => {
        tb.innerHTML += `<tr><td>${d.data().user}</td><td>$${d.data().credit}</td></tr>`;
      });
    });

    // 2. 活動單價設定
    document.getElementById('saveEventBtn').onclick = async () => {
      const name = document.getElementById('eventNameInput').value.trim();
      const price = parseInt(document.getElementById('eventPriceInput').value) || 0;
      if (!name) return alert('請填寫活動名稱');
      await setDoc(doc(db, "event_settings", name), { name, price });
      alert('活動單價已更新');
    };

    onSnapshot(collection(db, "event_settings"), snap => {
      const tb = document.getElementById('eventTable');
      tb.innerHTML = '';
      snap.forEach(d => {
        tb.innerHTML += `<tr><td>${d.data().name}</td><td>$${d.data().price} / 張</td></tr>`;
      });
    });

    // 3. 發圖進度
    document.getElementById('saveProgBtn').onclick = async () => {
      const eventName = document.getElementById('progEvent').value.trim();
      const member = document.getElementById('progMember').value.trim();
      const totalQty = parseInt(document.getElementById('progTotal').value) || 0;
      const doneQty = parseInt(document.getElementById('progDone').value) || 0;
      const driveUrl = document.getElementById('progDrive').value.trim();

      const docId = `${eventName}_${member}`;
      await setDoc(doc(db, "photo_progress", docId), {
        eventName, member, totalQty, doneQty, driveUrl, createdAt: serverTimestamp()
      });
      alert('發圖進度已更新');
    };

    onSnapshot(collection(db, "photo_progress"), snap => {
      const tb = document.getElementById('progTable');
      tb.innerHTML = '';
      snap.forEach(d => {
        const item = d.data();
        tb.innerHTML += `<tr><td>${item.eventName} - ${item.member}</td><td>${item.doneQty}/${item.totalQty}</td><td>${item.driveUrl ? '有' : '無'}</td></tr>`;
      });
    });

    // 4. 匯款紀錄
    onSnapshot(collection(db, "payments"), snap => {
      const tb = document.getElementById('payTable');
      tb.innerHTML = '';
      snap.forEach(d => {
        const p = d.data();
        tb.innerHTML += `<tr><td>${p.user}</td><td>${p.eventName}</td><td>${p.qty}</td><td>-$${p.creditUsed}</td><td><b>$${p.finalPay}</b></td><td>${p.bankLast5}</td></tr>`;
      });
    });
  </script>

</body>
</html>
