<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FORSURE🐶📸 - 管理者控制台</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 20px; max-width: 1150px; margin: 0 auto; background-color: #f4f6f8; color: #333; }
    .card { background: #ffffff; padding: 24px; border-radius: 16px; box-shadow: 0 8px 20px rgba(0,0,0,0.06); }
    
    .top-nav { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
    .btn-home-nav { color: #409eff; text-decoration: none; font-size: 13px; font-weight: bold; background: #ecf5ff; padding: 6px 12px; border-radius: 6px; }

    .login-box { max-width: 380px; margin: 60px auto; padding: 30px; background: #fff; border-radius: 16px; box-shadow: 0 8px 24px rgba(0,0,0,0.08); text-align: center; }
    .login-box h3 { margin-bottom: 20px; color: #303133; }
    .login-box input { width: 100%; margin-bottom: 15px; padding: 12px; border: 1px solid #dcdfe6; border-radius: 8px; box-sizing: border-box; font-size: 14px; }
    .login-box button { width: 100%; padding: 12px; background: #409eff; color: white; border: none; border-radius: 8px; font-weight: bold; font-size: 15px; cursor: pointer; }

    /* 2 排 3 列網格佈局，解決按鈕溢出右側問題 */
    .tabs-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 20px; }
    .tab-btn { padding: 12px 10px; cursor: pointer; border: 1px solid #dcdfe6; background: #fff; font-weight: bold; color: #606266; font-size: 14px; border-radius: 10px; text-align: center; transition: all 0.2s; }
    .tab-btn:hover { border-color: #c6e2ff; background: #ecf5ff; color: #409eff; }
    .tab-btn.active { background: #409eff; color: #fff; border-color: #409eff; box-shadow: 0 4px 12px rgba(64,158,255,0.3); }

    @media (max-width: 600px) {
      .tabs-grid { grid-template-columns: repeat(2, 1fr); }
    }
    
    iframe { width: 100%; border: none; min-height: 600px; transition: height 0.2s ease; }
  </style>
</head>
<body>

  <!-- 登入卡片 -->
  <div id="loginSection" class="login-box">
    <h3>FORSURE🐶📸 管理者登入</h3>
    <form id="loginForm">
      <input type="email" id="loginEmail" placeholder="管理者 Email" required>
      <input type="password" id="loginPassword" placeholder="密碼" required>
      <button type="submit">安全登入</button>
    </form>
  </div>

  <!-- 控制台主區塊 -->
  <div class="card" id="mainAdmin" style="display:none;">
    <div class="top-nav">
      <a href="index.html" class="btn-home-nav">← 返回前台首頁</a>
      <div>
        <span id="currentUserEmail" style="font-size:12px; color:#909399; margin-right:10px;"></span>
        <button id="logoutBtn" style="padding:4px 8px; font-size:12px; background:#909399; border:none; border-radius:4px; color:#fff; cursor:pointer;">登出</button>
      </div>
    </div>

    <h2 style="margin-bottom: 15px;">FORSURE🐶📸 管理者控制台</h2>

    <!-- 導覽按鈕網格 (無數字) -->
    <div class="tabs-grid">
      <button class="tab-btn active" onclick="switchAdminTab(0, 'admin/admin_orders.html')">團員登記管理</button>
      <button class="tab-btn" onclick="switchAdminTab(1, 'admin/admin_payments.html')">匯款對帳審核</button>
      <button class="tab-btn" onclick="switchAdminTab(2, 'admin/admin_credits.html')">成員抵用金管理</button>
      <button class="tab-btn" onclick="switchAdminTab(3, 'admin/admin_events.html')">活動單價與成本設定</button>
      <button class="tab-btn" onclick="switchAdminTab(4, 'admin/admin_progress.html')">發圖進度更新</button>
      <button class="tab-btn" onclick="switchAdminTab(5, 'admin/admin_lottery.html')">抽獎活動管理</button>
    </div>

    <!-- iFrame 預設載入 admin/admin_orders.html -->
    <iframe id="adminFrame" src="admin/admin_orders.html"></iframe>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDF7QySG1Jj4gdZvXwMRaKjRmI-lFKpj7k",
      authDomain: "forsure0922.firebaseapp.com",
      databaseURL: "https://forsure0922-default-rtdb.firebaseio.com",
      projectId: "forsure0922",
      storageBucket: "forsure0922.firebasestorage.app",
      messagingSenderId: "817449290174",
      appId: "1:817449290174:web:6b4ec1d36c171ff97011ef"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    onAuthStateChanged(auth, (user) => {
      if (user) {
        document.getElementById('loginSection').style.display = 'none';
        document.getElementById('mainAdmin').style.display = 'block';
        document.getElementById('currentUserEmail').textContent = user.email;
      } else {
        document.getElementById('loginSection').style.display = 'block';
        document.getElementById('mainAdmin').style.display = 'none';
      }
    });

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('loginEmail').value.trim();
      const password = document.getElementById('loginPassword').value;

      try {
        await signInWithEmailAndPassword(auth, email, password);
      } catch (err) {
        alert("登入失敗：請檢查帳號密碼是否正確！\n" + err.message);
      }
    });

    document.getElementById('logoutBtn').onclick = () => { signOut(auth); };

    window.switchAdminTab = (idx, pageUrl) => {
      document.querySelectorAll('.tab-btn').forEach((b, i) => b.classList.toggle('active', i === idx));
      document.getElementById('adminFrame').src = pageUrl;
    };

    window.addEventListener('message', (e) => {
      if (e.data && e.data.frameHeight) {
        document.getElementById('adminFrame').style.height = (e.data.frameHeight + 30) + 'px';
      }
    });
  </script>

</body>
</html>
