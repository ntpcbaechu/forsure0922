<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FORSURE🐶📸 - 登記紀錄查看</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 20px; max-width: 800px; margin: 0 auto; background-color: #f4f6f8; color: #333; }
    .card { background: #ffffff; padding: 24px; border-radius: 16px; box-shadow: 0 8px 20px rgba(0,0,0,0.06); }
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 10px; }
    h1 { font-size: 20px; margin: 0; color: #222; }
    .btn-group { display: flex; gap: 10px; }
    .btn-back { background-color: #e4e7ed; color: #333; text-decoration: none; padding: 8px 14px; border-radius: 6px; font-weight: 600; font-size: 14px; }
    button { padding: 8px 14px; border-radius: 6px; border: none; font-weight: 600; cursor: pointer; font-size: 14px; }
    .btn-export { background-color: #67c23a; color: white; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    th, td { padding: 12px; text-align: left; border-bottom: 1px solid #e4e7ed; font-size: 14px; }
    th { background-color: #f8f9fa; font-weight: 600; color: #555; }
    tr:hover { background-color: #f9fafc; }
    .empty-msg { text-align: center; padding: 40px; color: #909399; }
  </style>
</head>
<body>

  <div class="card">
    <div class="header">
      <h1>FORSURE🐶📸 全員登記紀錄</h1>
      <div class="btn-group">
        <a href="index.html" class="btn-back">返回表單</a>
        <button class="btn-export" id="exportBtn">匯出 CSV</button>
      </div>
    </div>

    <table id="recordTable">
      <thead>
        <tr>
          <th>#</th>
          <th>填單時間</th>
          <th>社群名稱</th>
          <th>活動名稱</th>
          <th>成員</th>
          <th>張數</th>
        </tr>
      </thead>
      <tbody id="tableBody"></tbody>
    </table>
    <div id="emptyMsg" class="empty-msg" style="display: none;">載入中或尚無登記紀錄...</div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, query, orderBy, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDF7QySG1Jj4gdZvXwMRaKjRmI-lFKpj7k",
      authDomain: "forsure0922.firebaseapp.com",
      databaseURL: "https://forsure0922-default-rtdb.firebaseio.com",
      projectId: "forsure0922",
      storageBucket: "forsure0922.firebasestorage.app",
      messagingSenderId: "817449290174",
      appId: "1:817449290174:web:6b4ec1d36c171ff97011ef"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let currentRecords = [];

    const q = query(collection(db, "orders"), orderBy("createdAt", "desc"));
    onSnapshot(q, (snapshot) => {
      const tbody = document.getElementById('tableBody');
      const emptyMsg = document.getElementById('emptyMsg');
      tbody.innerHTML = '';
      currentRecords = [];

      if (snapshot.empty) {
        emptyMsg.style.display = 'block';
        emptyMsg.textContent = '目前尚無任何登記紀錄！';
        return;
      }

      emptyMsg.style.display = 'none';
      let index = 1;

      snapshot.forEach((doc) => {
        const data = doc.data();
        const date = data.createdAt ? new Date(data.createdAt.seconds * 1000) : new Date();
        const timeStr = `${date.getMonth()+1}/${date.getDate()} ${String(date.getHours()).padStart(2,'0')}:${String(date.getMinutes()).padStart(2,'0')}`;

        currentRecords.push({ time: timeStr, ...data });

        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>${index++}</td>
          <td>${timeStr}</td>
          <td><b>${escapeHtml(data.user || '')}</b></td>
          <td>${escapeHtml(data.event || '')}</td>
          <td>${escapeHtml(data.member || '')}</td>
          <td>${data.qty || 0}</td>
        `;
        tbody.appendChild(tr);
      });
    }, (error) => {
      console.error("Firestore 監聽失敗:", error);
      document.getElementById('emptyMsg').style.display = 'block';
      document.getElementById('emptyMsg').textContent = '資料載入失敗，請確認 Firebase 規則已設定為公開。';
    });

    function escapeHtml(text) {
      return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    document.getElementById('exportBtn').addEventListener('click', () => {
      if (currentRecords.length === 0) { alert('無資料可匯出'); return; }
      let csv = "\uFEFF填單時間,社群名稱,活動名稱,成員,張數\n";
      currentRecords.forEach(r => {
        csv += `"${r.time}","${r.user}","${r.event}","${r.member}","${r.qty}"\n`;
      });
      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `FORSURE_全員登記紀錄_${new Date().toISOString().slice(0,10)}.csv`;
      a.click();
    });
  </script>

</body>
</html>
